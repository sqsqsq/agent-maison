# Instance extension manifest schema (doc/extensions/manifest.yaml)
# schema_version is independent from workflow-schema and lifecycle-hooks-schema.
schema_version: "1.1"
description: >
  Schema describing doc/extensions/manifest.yaml. Manifest versions 1.0 and 1.1 are
  accepted; validation is implemented in framework/harness/extension-loader.ts and
  check-extensions.ts. Version 1.0 keeps the legacy six-domain behavior.

root_object:
  type: object
  additionalProperties: false
  required:
    - schema_version
    - name
  properties:
    schema_version:
      type: string
      enum: ["1.0", "1.1"]
    name:
      type: string
      description: Extension package id (slug, no spaces).
    version:
      type: string
      description: Optional package version for agentskills.io-style frontmatter parity.
    description:
      type: string
    framework_compat:
      type: string
      description: Optional semver range string (informative until a resolver exists).

    provides:
      type: object
      additionalProperties: false
      properties:
        skills:
          type: array
          items: { type: string }
          description: Logical skill ids (directories under doc/extensions/skills/<id>/).
        knowledge:
          type: array
          items:
            oneOf:
              - { type: string }
              - type: object
                additionalProperties: false
                required: [path, summary, audience]
                properties:
                  path: { type: string }
                  summary: { type: string }
                  audience:
                    oneOf:
                      - { const: global }
                      - type: array
                        minItems: 1
                        items: { type: string }
          description: >
            1.0 accepts strings only. In 1.1, strings target every Feature phase and never
            AGENTS.md; object entries route to global AGENTS.md or named Feature phases.
        hooks:
          type: object
          description: Map phase id -> map event -> list of paths relative to doc/extensions/.
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items: { type: string }
        capabilities:
          type: object
          description: >
            Arbitrary capability keys (string) -> { provider: relative path, severity: BLOCKER|MAJOR|... }.
          additionalProperties:
            type: object
            required: [provider, severity]
            properties:
              provider: { type: string }
              severity:
                type: string
                enum: [BLOCKER, SKIP, WARN, MAJOR, MINOR]
        phase_rules_overlays:
          type: object
          description: Map phase string -> relative path to overlay yaml under doc/extensions/.
          additionalProperties: { type: string }
        skill_assets:
          type: object
          description: >
            Map skill id -> map asset key -> relative path under doc/extensions/.
            Merged over profile skill-assets.yaml (extension wins on key collision).
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        mcp_actions:
          type: object
          description: Host-executed tool declarations; no server, URL, token, command, or login fields.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [tool, required, produces, usage]
            properties:
              tool: { type: string }
              required: { type: boolean }
              severity: { type: string, enum: [MAJOR, BLOCKER] }
              produces:
                type: array
                minItems: 1
                items: { type: string }
              usage: { type: string }

    phase_bindings:
      type: object
      description: >
        1.1 only. Feature phase bindings; exactly before_phase_work,
        before_phase_verify, and after_phase_verify_before_close are supported.
      additionalProperties:
        type: object
        additionalProperties: false
        properties:
          before_phase_work: { $ref: "#/$defs/bindings" }
          before_phase_verify: { $ref: "#/$defs/bindings" }
          after_phase_verify_before_close: { $ref: "#/$defs/bindings" }

$defs:
  bindings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: { type: string, enum: [knowledge, skill, mcp] }
        ref: { type: string }
