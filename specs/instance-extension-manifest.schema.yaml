# Host and plugin manifest schema. Version is independent of the workflow and timing protocols.
schema_version: "2.0"
description: >
  The host owns registration and selection at <extension root>/manifest.yaml.
  A provider owns the declaration at <extension root>/<plugin id>/manifest.yaml.
  Runtime validation and path resolution are implemented in harness/extension-loader.ts.

root_object:
  oneOf:
    - { $ref: "#/$defs/host" }
    - { $ref: "#/$defs/plugin" }

$defs:
  host:
    type: object
    additionalProperties: false
    required: [schema_version, kind, plugins]
    properties:
      schema_version: { const: "2.0", description: 宿主清单协议版本。 }
      kind: { const: host, description: 标记顶层安装登记。 }
      plugins:
        type: object
        x-key: <插件ID>
        description: 每个键对应同名插件目录。仅登记的包参与运行。
        propertyNames: { $ref: "#/$defs/id" }
        additionalProperties:
          type: object
          additionalProperties: false
          required: [source, enabled, bindings, files]
          properties:
            source: { type: string, minLength: 1, description: 用于核对重装与升级的本地来源身份。 }
            enabled: { type: boolean, description: 宿主的整包开关。 }
            bindings:
              type: object
              propertyNames: { $ref: "#/$defs/id" }
              additionalProperties: { type: boolean }
              description: 宿主对各绑定的开关。重装保留已有选择。
            files:
              type: object
              additionalProperties: { type: string, pattern: "^[0-9a-f]{64}$" }
              description: 受管导入文件的插件相对路径与 SHA-256。退出时用于核对所有权。
            in_place: { const: true, description: 就地登记自有包。卸载时保留来源文件。 }
            binding_overrides:
              type: object
              x-key: <绑定ID>
              propertyNames: { $ref: "#/$defs/id" }
              description: 宿主保存的按绑定时点覆盖，取代提供方的 at 和 phase。
              additionalProperties: { $ref: "#/$defs/timing" }

  plugin:
    type: object
    additionalProperties: false
    required: [schema_version, kind, name, version]
    properties:
      schema_version: { const: "2.0", description: 提供方清单协议版本。 }
      kind: { const: plugin, description: 标记插件目录内的提供方声明。 }
      name: { $ref: "#/$defs/id", description: 稳定的插件 ID。安装后与目录名及宿主登记键一致。 }
      version: { type: string, minLength: 1, description: 由提供方维护的包版本，用于核对升级与本地产物就绪。 }
      description: { type: string, description: 面向读者的能力简介。 }
      framework_compat: { type: string, description: 向读者描述适用的框架版本范围。 }
      provides:
        type: object
        additionalProperties: false
        description: 手动 Skill 及既有消费者可用的资源。
        properties:
          skills:
            type: array
            items: { type: string, pattern: "^[a-zA-Z0-9_-]+$" }
            description: 手动 Skill ID 列表。每项指向本包的 skills/<Skill ID>/SKILL.md。
          mcp_actions:
            type: object
            x-key: <动作ID>
            description: 声明宿主角色调用的 MCP 工具及产物。连接与凭据由宿主管理。
            additionalProperties:
              type: object
              additionalProperties: false
              required: [tool, required, produces, usage]
              properties:
                tool: { type: string, description: 宿主 agent 可见的工具 ID。 }
                required: { type: boolean, description: 影响既有消费者是否要求产物。 }
                severity: { type: string, enum: [MAJOR, BLOCKER], default: MAJOR, description: 所需产物缺失时由既有消费者使用的严重级别。 }
                produces:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: 要核对的宿主工程根相对产物路径。
                usage: { type: string, description: 面向作者的工具使用说明。 }
          capabilities:
            type: object
            x-key: <能力键>
            description: 将键映射到原 harness capability registry 的本地 provider 和严重级别。
            additionalProperties:
              type: object
              required: [provider, severity]
              properties:
                provider: { type: string, description: 插件根相对的 capability provider 路径。 }
                severity: { type: string, enum: [BLOCKER, SKIP, WARN, MAJOR, MINOR], description: 原 capability 检查使用的严重级别。 }
          phase_rules_overlays:
            type: object
            description: 为指定阶段追加本包规则 YAML。值为插件根相对路径。
            additionalProperties: { type: string }
          skill_assets:
            type: object
            description: 按 Skill 与资源键指定插件根相对路径，覆盖 profile 同键资源。
            additionalProperties:
              type: object
              additionalProperties: { type: string }

      bindings:
        type: object
        x-key: <绑定ID>
        propertyNames: { $ref: "#/$defs/id" }
        description: 稳定的绑定 ID 与其自动投递声明。
        additionalProperties:
          type: object
          additionalProperties: false
          required: [at, kind, ref]
          properties:
            at: { type: string, description: 使用时点表中已发布且带版本的 ID。 }
            phase: { type: string, x-required: Feature 和 harness 时点必填，项目时点省略, description: 使用当前 workflow 中的有效阶段。 }
            kind: { type: string, enum: [knowledge, action], description: 按时点选择知识或动作。 }
            ref:
              type: string
              minLength: 1
              description: 知识和 lifecycle hook 填插件根相对路径。作者 Skill 或 checker MCP 贡献填对应 ID。
            summary: { type: string, description: 显示在知识索引中的摘要。 }
            enabled_by_default: { type: boolean, default: false, description: 插件首装并启用时采用的绑定开关。 }
            required: { type: boolean, default: false, description: 选中后资源不可用时，在实际消费者处报告依赖缺口。 }

      activation:
        type: object
        additionalProperties: false
        required: [steps]
        description: 由提供方定义准备、显式启用和退出的步骤。
        properties:
          steps:
            type: array
            minItems: 1
            description: 启用按声明顺序运行，退出按逆序撤回。
            items:
              type: object
              additionalProperties: false
              required: [id, cwd, run, scope, outputs, ready]
              properties:
                id: { $ref: "#/$defs/id", description: 插件内唯一的稳定步骤 ID。 }
                cwd: { type: string, description: 插件相对工作目录。用 “.” 表示插件根。 }
                run: { $ref: "#/$defs/command", description: 可执行程序及参数数组。 }
                scope:
                  type: string
                  enum: [local, repo]
                  description: local 是可重复生成的本机包内文件。repo 由维护者显式执行与退出，适用于共享文件或非文件效果。
                outputs:
                  type: array
                  items: { type: string }
                  description: 本步独占的插件相对输出。local 必须声明输出，非文件效果填空数组。
                ready:
                  type: object
                  description: 声明如何判断本工作区产物或效果已就绪。两种写法选一。
                  oneOf:
                    - additionalProperties: false
                      required: [version_file]
                      properties:
                        version_file: { type: string, x-required: 与 check 二选一, description: 插件相对 JSON 产物路径。指定版本字段的值须等于插件 version。 }
                        version_field: { type: string, pattern: "\\S", default: plugin_version, description: 使用 version_file 时可选的顶层 JSON 键。 }
                    - additionalProperties: false
                      required: [check]
                      properties:
                        check: { $ref: "#/$defs/command", x-required: 与 version_file 二选一, description: 只读检查程序及参数。退出码 0 表示当前版本所需效果已就绪。 }
                project_outputs:
                  type: array
                  items: { type: string }
                  x-required: 仅 repo 可选
                  description: 显式 repo 步骤管理的宿主工程相对输出，须位于扩展根以外。
                undo: { $ref: "#/$defs/command", x-required: repo 步骤必填, description: 显式退出时运行的可重复命令，只撤销当前实例效果。 }
              allOf:
                - if: { properties: { scope: { const: local } } }
                  then:
                    properties:
                      outputs: { minItems: 1 }
                      project_outputs: false
                      undo: false
                  else: { required: [undo] }

  id: { type: string, pattern: "^[a-z][a-z0-9_-]*$" }
  command:
    type: array
    minItems: 1
    items: { type: string }
  timing:
    type: object
    additionalProperties: false
    required: [at]
    properties:
      at: { type: string, description: 校验通过的版本化时点 ID。 }
      phase: { type: string, x-required: Feature 和 harness 时点必填，项目时点省略, description: 当前 workflow 中选定的阶段。 }
