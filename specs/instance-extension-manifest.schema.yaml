# Instance extension manifest schema (doc/extensions/manifest.yaml)
# schema_version is independent from workflow-schema and lifecycle-hooks-schema.
schema_version: "2.0"
description: >
  Schema describing a local extension source or the host doc/extensions/manifest.yaml.
  Validation and normalization are implemented in harness/extension-loader.ts. Versions 1.0
  and 1.1 remain readable, and 2.0 adds named bindings and host installation selections.

root_object:
  type: object
  additionalProperties: false
  required:
    - schema_version
    - name
  properties:
    schema_version:
      type: string
      enum: ["1.0", "1.1", "2.0"]
    name:
      type: string
      description: Extension source identity. In 1.1 it must be a lowercase slug.
    version:
      type: string
      description: Optional package version for agentskills.io-style frontmatter parity.
    description:
      type: string
    framework_compat:
      type: string
      description: Optional semver range string (informative until a resolver exists).

    provides:
      type: object
      additionalProperties: false
      properties:
        skills:
          type: array
          items: { type: string }
          description: Logical skill ids (directories under doc/extensions/skills/<id>/).
        knowledge:
          type: array
          items:
            oneOf:
              - { type: string }
              - type: object
                additionalProperties: false
                required: [path, audience]
                allOf:
                  - if: { properties: { audience: { not: { const: none } } } }
                    then: { required: [summary] }
                properties:
                  path: { type: string }
                  summary: { type: string }
                  audience:
                    oneOf:
                      - { enum: [global, none] }
                      - type: array
                        minItems: 1
                        items: { type: string }
          description: >
            1.0 accepts strings only. In 1.1, strings target every Feature phase and never
            AGENTS.md; object entries route to global AGENTS.md or named Feature phases.
            Version 2.0 keeps 1.1 routing and additionally accepts audience none to preserve
            1.0 entries during migration without introducing an automatic consumer.
        hooks:
          type: object
          description: Map phase id -> map event -> list of paths relative to doc/extensions/.
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items: { type: string }
        capabilities:
          type: object
          description: >
            Arbitrary capability keys (string) -> { provider: relative path, severity: BLOCKER|MAJOR|... }.
          additionalProperties:
            type: object
            required: [provider, severity]
            properties:
              provider: { type: string }
              severity:
                type: string
                enum: [BLOCKER, SKIP, WARN, MAJOR, MINOR]
        phase_rules_overlays:
          type: object
          description: Map phase string -> relative path to overlay yaml under doc/extensions/.
          additionalProperties: { type: string }
        skill_assets:
          type: object
          description: >
            Map skill id -> map asset key -> relative path under doc/extensions/.
            Merged over profile skill-assets.yaml (extension wins on key collision).
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        mcp_actions:
          type: object
          description: Host-executed tool declarations; no server, URL, token, command, or login fields.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [tool, required, produces, usage]
            properties:
              tool: { type: string }
              required: { type: boolean }
              severity: { type: string, enum: [MAJOR, BLOCKER] }
              produces:
                type: array
                minItems: 1
                items: { type: string }
              usage: { type: string }

    phase_bindings:
      type: object
      description: >
        Compatibility input in 1.1 and 2.0. Feature phase bindings; exactly before_phase_work,
        before_phase_verify, and after_phase_verify_before_close are supported.
      additionalProperties:
        type: object
        additionalProperties: false
        properties:
          before_phase_work: { $ref: "#/$defs/legacy_slots" }
          before_phase_verify: { $ref: "#/$defs/legacy_slots" }
          after_phase_verify_before_close: { $ref: "#/$defs/legacy_slots" }

    bindings:
      type: object
      description: Manifest 2.0 only. Ability ID → stable binding ID → declaration.
      propertyNames: { pattern: "^[A-Za-z0-9_-]+$" }
      additionalProperties:
        type: object
        propertyNames: { pattern: "^[a-z][a-z0-9_-]*$" }
        additionalProperties:
          type: object
          additionalProperties: false
          required: [at, kind, ref]
          properties:
            at:
              type: string
              description: Exact versioned ID from lifecycle-hooks-schema.yaml.
            kind: { type: string, enum: [knowledge, action] }
            ref:
              type: string
              minLength: 1
              description: >
                Local path for knowledge and lifecycle .mjs hooks. For an action consumed by
                an author or produces checker, use an applicable provides.skills or
                provides.mcp_actions ID.
            phase:
              type: string
              description: Required for Feature and harness timings. Use a phase in the active workflow.
            enabled_by_default: { type: boolean, default: false }
            required:
              type: boolean
              default: false
              description: Report an unavailable selected binding as a dependency at its consumer.

    installations:
      type: object
      description: Host selections for 2.0, keyed by ability ID. Ignored when reading source defaults.
      propertyNames: { pattern: "^[A-Za-z0-9_-]+$" }
      additionalProperties:
        type: object
        additionalProperties: false
        required: [source, enabled, bindings, files]
        properties:
          source: { type: string, minLength: 1 }
          enabled: { type: boolean }
          bindings:
            type: object
            propertyNames: { pattern: "^[a-z][a-z0-9_-]*$" }
            additionalProperties: { type: boolean }
          files:
            type: object
            description: Host-relative file path → SHA-256 of imported bytes.
            additionalProperties: { type: string, pattern: "^[0-9a-f]{64}$" }
          in_place:
            const: true
            description: Original files are managed in place and are retained on uninstall.

  allOf:
    - if: { properties: { schema_version: { enum: ["1.0", "1.1"] } } }
      then:
        properties:
          bindings: false
          installations: false

$defs:
  legacy_slots:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: { type: string, enum: [knowledge, skill, mcp] }
        ref: { type: string }
