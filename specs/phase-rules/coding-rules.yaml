# ============================================================================
# Coding 阶段规约 — profile 中立骨架（无 toolchain 细则）
# ============================================================================
# 宿主源码形态、资源系统、模块清单与构建描述等细则在 profile 叠加层：
#   framework/profiles/hmos-app/phase-rules-overlays/coding-rules.overlay.yaml
#
# 消费者：
#   - framework/harness/scripts/check-coding.ts
#   - framework/harness/prompts/verify-coding.md
# ============================================================================

phase: coding
version: "1.0"
applies_to: "**"

structure_checks:

  host_entry_reachability:
    description: >
      宿主入口可达性（visual-capability-truth S6/P1-G）：以 integration_points 为真源静态
      走查宿主入口→路由→feature 页面——入口未消费/路由缺失 → BLOCKER（页面孤岛在
      review 前暴露，不等真机 TC-001 才发现）。

  media_reference_integrity:
    description: >
      资源引用完整性（plan d8c5f3a7 v23 F4）：源码 `$r('app.media.X')` 必须解析到实际素材
      文件。悬空引用编译期不报错、运行期渲染空白（2026-07-24 事故：删素材后残留 7 处引用致
      大面积空白）——coding 是素材被删的实际现场，在此确定性拦截，档位无关。
      （v23 收敛：asset_non_destructive 证据分级体系与 required_anchors 通道已删；本条是
      素材完整性唯一保留的静态硬门禁——"文件存在但页面没渲染"交 visual-diff。）
    severity: BLOCKER
    rule:
      expect: "media_reference_integrity"

  upstream_verdict_gate:
    description: >
      跨阶段负面裁决传播门禁（blind-visual-hardening d1）：coding 启动时消费上游
      spec/plan summary.json 机器裁决——上游 verdict 非 PASS / blocker 未清 /
      证据 stale|tampered → BLOCKER FAIL。

  resource_string_interpolation:
    description: >
      ArkTS 模板字符串内 `${$r(...)}` Resource 插值 lint（goal-fakepass-hardening t9）：
      Resource 对象进模板串渲染为 [object Object]（bc-openCard 卡包实锤）→ BLOCKER。
      仅 hmos 系 profile 生效。

  product_behavior_switch_scan:
    description: >
      产品源码测试性行为开关扫描（coding 期早警，与 testing 同门禁语义，见
      testing-rules.yaml 同 id）：命名命中且默认 true → BLOCKER；坐标级 waiver+receipt
      仅降级 WARN 且封顶。goal-fakepass-hardening t3。

  # ---- 视觉保真硬门禁声明面（f2d8c4a6 P1-A/P0-B；checker 按 id 硬编码实现，本表为声明性
  # description SSOT + gate-fingerprint 指纹分量：门禁语义变化须同步本表，使存量回执正确失效）----
  visible_text_whitelist:
    description: >
      P1-A（plan f2d8c4a6）：可见文案白名单——源码 Text()/Button() CJK 字面量与被 $r('app.string.*')
      引用的 string.json value 必须 ⊆ ui-spec/ref-elements 文本集 ∪ 豁免表
      （coding/visible-text-exemptions.yaml，须非空 rationale，review 视觉维度逐条人审）。
      原图没有的文案不得无中生有（round6：zone 名脑补成「金融信息/设置与帮助」可见标题）。
      pixel_1to1 → BLOCKER。非对称覆盖匹配（impl⊃spec 须占比 ≥80%，防短合法词漏放长脑补标题）。
    severity: BLOCKER

  visual_parity_unverified_crop:
    description: >
      P0-B 物化前置（plan f2d8c4a6）：crop 资产须 spec 阶段 asset_crop_validation 判 verified 且
      裁决绑定齐全（sha256/resolved_path/source_bbox 快照与当前一致，模块 media 副本 hash 一致）
      才可物化进 resources/base/media；报告缺失/旧格式/绑定漂移一律拦。pixel_1to1 → BLOCKER。
    severity: BLOCKER

  visual_parity_invisible_presence:
    description: >
      透明节点假 presence 拦截（2026-07-03，codex 发现的对抗模式）：spec 文本/资产/符号引用
      （$r app.string/app.media/sys.symbol 或 CJK 字面量）挂在字面硬不可见节点
      （opacity(0)/visibility None|Hidden/width(0)+height(0)/fontSize(0)）＝骗静态 presence/asset-render
      扫描的作弊（round6 宿主实锤：bottomTabPresence 透明文本、三连零 Image、透明 SymbolGlyph）。
      pixel_1to1 → BLOCKER。仅判字面值（变量/动画绑定不判防误伤），漏报归 device OCR 存在性观测兜。
    severity: BLOCKER

  visual_parity_render:
    description: >
      P1-A 升级（plan f2d8c4a6）：spec 声明的源码静态可判几何/填充须按声明渲染——width_ratio≤0.6/
      align=end 不得 .width('100%')/layoutWeight(1)；variant=tonal 不得高饱和实心。
      pixel_1to1 P0 从"低置信 WARN 以 device 为准"升 BLOCKER（round6 按钮全宽信号被降级丢失的通道关闭）；
      收集器对定位不到的场景保守跳过，产出的命中均为确定性违规。
    severity: BLOCKER

  structure_declaration_ledger:
    description: >
      P1-4（c9e2a7f4 子批B）：结构声明台账——spec 每条结构声明（subtitle_position/layout_group/
      bg_color/global_element）须在 coding/structure-conformance.yaml 逐条登记
      {node_id, declaration, implemented_by, how}；缺条目=声明被静默无视的显式证据（round6 实锤：
      card_pack trailing/add_card 分组/tab 容器声明全被无视到真机才暴露）、implemented_by 的
      struct 须真实存在于源码（防糊名）、how 非空。pixel_1to1 → BLOCKER。
      诚实边界：台账自报不验真（ArkUI 结构静态判定不可行——组合爆炸必产 FP），只消灭静默；
      内容真实性=独立 review 逐条核验 + device P1-C 文本类确定性信号 + 当前视觉 provider 证据；
      非文本类结构静态验真列 round7。登记≠实现完成。
    severity: BLOCKER

semantic_checks: {}

traceability_checks:
  change_unit_feature_projection:
    description: CU-bound Feature 的 predicate/provide/design-ref 映射须落到真实施工文件与测试，运行时只读 state_management 真源
    severity: BLOCKER
  ui_diff_within_declared_files:
    description: >
      UI 文件级 scope 门（plan c4e8b1d3 G1）：越界 UI 文件 = 本次 changed UI files −
      冻结 contracts.files。白名单只来自**同 run plan PASS snapshot** 冻结的 contracts.yaml
      files（缺失/失效/损坏 fail-closed BLOCKER，禁止退回 live contracts——coding 期 agent
      可写）；goal diff 基线 = createGoalRun 出生时冻结的 manifest.run_base_sha
      （chain 含 coding/ut 时必需；覆盖 committed/staged/unstaged/untracked 四态，agent 自行
      commit 也检出；goal 内不读取 HARNESS_DIFF_BASE_REF，legacy reader 只认无 run_created 的旧 run）；
      删除/重命名从 base 侧读旧内容做 UI 分类。UI 判据三类：pages/components/presentation
      路径 .ets、ArkUI 结构标志（@Entry/@Component/build()/NavDestination/Tabs/bindSheet）、
      resources media。未声明 UI 文件默认即受保护范围，任何 strictness 均 BLOCKER；
      expansion 唯一路径 = 更新 contracts.files 并重新通过 plan（重取 PASS snapshot）。
    severity: BLOCKER

exploration_thresholds:
  min_files_inspected: 6
  min_source_code_paths: 3
  min_searches: 4
  min_code_facts: 3
  require_subagent_when_contract_files_gt: 5
  exploration_mode_allowed:
    - subagent
    - sequential

# --------------------------------------------------------------------------
# Context Exploration 触发策略（v2.10 — coding default-on subagent）
# --------------------------------------------------------------------------
exploration_strategy:
  default_mode: subagent
  trivial_exemption:
    enabled: true
    conditions_any:
      - intent: [rename, extract_function, move_file, typo_fix]
      - prd_loc_delta_lt: 30
      - single_function_scope: true
  scoring:
    threshold: 60
    dimensions:
      - id: module_loc
        weight: 25
        tiers:
          - { gte: 50000, score: 25 }
          - { gte: 20000, score: 15 }
          - { gte: 5000, score: 8 }
      - id: scope_breadth
        weight: 20
        tiers:
          - { gte: 3, score: 20 }
          - { gte: 2, score: 12 }
          - { gte: 1, score: 5 }
      - id: cross_layer
        weight: 20
        signal: touches_multiple_outer_layers
        score_if_true: 20
      - id: new_api_surface
        weight: 15
        signal: adds_exports_or_public_api
        score_if_true: 15
      - id: dependency_fan_out
        weight: 20
        tiers:
          - { gte: 10, score: 20 }
          - { gte: 5, score: 12 }
          - { gte: 2, score: 5 }
  sequential_multiplier: 2.0
  sequential_min_files_inspected_add: 5
