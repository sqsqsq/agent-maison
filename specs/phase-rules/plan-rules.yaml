# P3: 显式 1.1 调用按 required_outputs 检查叙述格式；typed 内容、来源、授权和实际义务仍须校验。
# ============================================================================
# Plan 阶段规约 — profile 中立骨架（无 toolchain 细则）
# ============================================================================
# 设计文档中与宿主 UI / 导航模型相关的措辞细则在叠加层：
#   framework/profiles/hmos-app/phase-rules-overlays/plan-rules.overlay.yaml
#
# 消费者：
#   - framework/harness/scripts/check-plan.ts
#   - framework/harness/prompts/verify-plan.md
# ============================================================================

phase: plan
version: "1.0"
applies_to: "doc/features/{module}/plan/plan.md"

structure_checks:
  acceptance_content_complete:
    severity: BLOCKER
    description: 显式 typed 验收须含可执行步骤、精确预期、合法 ID 与分层关注点。
  design_scope_facts:
    severity: BLOCKER
    description: 新设计事实只经既有 P2 报告提议重签，不删除冻结 required 义务。
  acceptance_use_cases_resolvable:
    severity: BLOCKER
    description: typed 验收的 linked_flow/linked_branch 必须指向真实用例。
  construction_content_complete:
    severity: BLOCKER
    description: 施工文件、类型和接口签名须完整，不能用叙述省略减弱内容检查。
  usecase_spec_schema:
    severity: BLOCKER
    description: 复用 UT 的 UseCasesSpec schema 检查，必要用例不能使用占位条目。


semantic_checks: {}

traceability_checks:
  component_asset_selection:
    severity: BLOCKER
    description: 组件资产检查；语义见 docs/concepts/component-assets.md。
  component_asset_projection:
    severity: BLOCKER
    description: 组件资产检查；语义见 docs/concepts/component-assets.md。
  component_export_registered:
    severity: BLOCKER
    description: 组件资产检查；语义见 docs/concepts/component-assets.md。
  component_new_static_checks:
    severity: BLOCKER
    description: 组件资产检查；语义见 docs/concepts/component-assets.md。
  component_uncurated:
    severity: MAJOR
    description: 组件资产检查；语义见 docs/concepts/component-assets.md。

  change_unit_feature_projection:
    description: CU-bound Feature 必须以 canonical change_unit_ref 和完整 ID-only mappings 施工，且机械派生 use-case/DAG 义务
    severity: BLOCKER
  contract_file_reference_closure:
    description: >
      contracts.yaml 中所有 schema 声明的文件引用必须属于规范化 contracts.files；
      files 是唯一授权集合，现有文件或内容相同不能豁免
    severity: BLOCKER
  spec_constraint_traceability:
    description: >
      acceptance.yaml 中结构化 NFR/安全/性能/DFX 约束须在 plan.md 或 contracts.yaml 有实现引用
    severity: BLOCKER

# --------------------------------------------------------------------------
# Context Exploration Gate 量化阈值（schema 1.1.0）
# --------------------------------------------------------------------------
exploration_thresholds:
  min_files_inspected: 8
  min_source_code_paths: 5
  min_searches: 5
  min_code_facts: 5
  require_subagent_when_scope_gte: 2
  exploration_mode_allowed:
    - subagent
    - sequential

# --------------------------------------------------------------------------
# Context Exploration 触发策略（v2.10 — plan default-on subagent）
# --------------------------------------------------------------------------
exploration_strategy:
  default_mode: subagent
  trivial_exemption:
    enabled: true
    conditions_any:
      - intent: [rename, extract_function, move_file, typo_fix]
      - prd_loc_delta_lt: 30
      - single_function_scope: true
  scoring:
    threshold: 60
    dimensions:
      - id: module_loc
        weight: 25
        tiers:
          - { gte: 50000, score: 25 }
          - { gte: 20000, score: 15 }
          - { gte: 5000, score: 8 }
      - id: scope_breadth
        weight: 20
        tiers:
          - { gte: 3, score: 20 }
          - { gte: 2, score: 12 }
          - { gte: 1, score: 5 }
      - id: cross_layer
        weight: 20
        signal: touches_multiple_outer_layers
        score_if_true: 20
      - id: new_api_surface
        weight: 15
        signal: adds_exports_or_public_api
        score_if_true: 15
      - id: dependency_fan_out
        weight: 20
        tiers:
          - { gte: 10, score: 20 }
          - { gte: 5, score: 12 }
          - { gte: 2, score: 5 }
  sequential_multiplier: 2.0
  sequential_min_files_inspected_add: 5
