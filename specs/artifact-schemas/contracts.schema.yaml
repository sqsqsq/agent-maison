$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "agentmaison://artifact/contracts@1"
title: Feature implementation contracts
x-artifact-id: contracts@1
x-version: 1
x-authority: "Compatibility identity; field-level checks remain in spec-loader and phase checkers."
x-file-authorization: >
  contracts.files is the sole authorization set. Every file-bearing field below is resolved in
  memory at plan closure and MUST be a member of normalized contracts.files.
x-file-reference-fields:
  - modules[].har_index
  - modules[].builder
  - modules[].export_file
  - modules[].export_files[]
  - data_models[].file
  - interfaces[].file
  - components[].file
  - resource_keys.<module>.<category>[].path
  - resource_keys.<module>.<category>[].media
  - navigation.config_files[]
  - prd_to_code_traceability[].key_files[]
type: object
additionalProperties: true
properties:
  components:
    type: array
    description: Existing component tree; asset_selection is the blueprint decision construction projection. Format SSOT is docs/concepts/component-assets.md.
    items:
      type: object
      additionalProperties: true
      properties:
        asset_selection:
          type: object
          additionalProperties: false
          required: [resolution]
          properties:
            resolution: { enum: [reuse, configure, adapt, evolve, custom] }
            component_ref: { type: string, minLength: 1 }
            rationale: { type: string, minLength: 1 }
            bindings: { type: object }
          description: Conditional required fields and ID validity are enforced by SpecLoader; absence is allowed until the index is enabled.
  change_unit:
    type: object
    description: ID-only construction projection bound to one canonical change-unit@1 ref; semantic completeness is enforced by phase checkers.
  state_management:
    type: array
    description: Sole Feature runtime-construction authority, including CU-bound runtime details when applicable.
  files:
    type: array
    items: { type: string, minLength: 1 }
  conventions_applied:
    type: array
    description: Applicable project-convention ids and the files/directories where this Feature plans to honor them.
    items:
      type: object
      additionalProperties: false
      required: [id, planned_locations]
      properties:
        id: { type: string, minLength: 1 }
        planned_locations:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
