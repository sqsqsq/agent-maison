schema_version: "1.0"

# ---------------------------------------------------------------------------
# Framework Agent Adapter Schema
# ---------------------------------------------------------------------------
# 每个 adapter 都是 framework/agents/<adapter_name>/ 目录下的一个插件，
# 必须提供 adapter.yaml 文件（符合本 schema），并按需在 templates/ 下放置
# 将被初始化 Skill 消费的模板文件。
#
# 核心设计约束：
# 1. adapter 不承担任何 skill 逻辑——skill 本身是纯 Markdown，adapter 只负责
#    "按该 agent 的约定把 skill 入口暴露出来"（slash 命令 / 跳板文件 / rules）。
# 2. adapter 不写任何阶段规则——规则统一在 framework/specs/phase-rules/*.yaml。
# 3. adapter 不修改 framework/ 自身——它只产出**实例工程根**的文件。
# 4. 所有 target_path / target_dir 都是**相对于实例工程根**的路径；
#    所有 template_path / template_dir 都是**相对于仓库根（即 framework/ 的父目录）**
#    或**相对于 adapter 目录**的路径，见字段注释。
# ---------------------------------------------------------------------------

required_fields:

  adapter_name:
    type: string
    description: adapter 的唯一标识；必须与其所在目录名一致，例如 "generic" / "claude" / "cursor"

  description:
    type: string
    description: 面向用户（在初始化 Skill 里选 adapter 时）展示的一句话说明

  agent_entry_file:
    type: object
    description: agent 的入口说明文件（相当于当前仓库里的 CLAUDE.md / AGENTS.md）
    fields:
      template_path:
        type: string
        description: |
          模板文件位置，相对于 **framework/** 根。通常指向 framework/templates/ 下的
          共享模板（例如 "templates/AGENTS.md.template"），也允许 adapter 自带变体
          （指向 "agents/<name>/templates/<xxx>.template"）。
      target_path:
        type: string
        description: |
          生成到实例工程根的相对路径，例如 "AGENTS.md" / "CLAUDE.md"。
          **同一个工程一次只能激活一个 adapter**，因此 target_path 不能和其它 adapter
          的已落地产物冲突——若切换 adapter，初始化 Skill 必须先清理旧产物。
      update_policy:
        type: string | optional
        description: >
          UPDATE 模式下若将入口文件也纳入模板扫描策略时使用（少见）。
          缺省或未写等价于 prompt_if_changed（与其它段一致）。
        enum: ["auto_overwrite", "prompt_if_changed"]

optional_fields:

  image_input:
    type: string
    description: |
      adapter 图片输入能力分级（M3）。`none`=纯文本降级；`tool_read`=agent 可用读图工具读取
      sidecar 文件（Cursor Read / Claude Read）；`native_attach`=通过 CLI/SDK 原生附件喂图（预留，
      goal headless 未来路径）。与 `goal_capability` 对齐：交互态与 headless 态能力可能不同。
    enum: ["none", "tool_read", "native_attach"]

  multimodal:
    type: boolean
    description: |
      [已弃用，请改用 image_input] adapter / 模型是否支持图片输入。true 映射 tool_read / false 映射 none。
      运行时仍接受并 stderr 一次性弃用提示。

  commands:
    type: object | null
    description: |
      slash 命令路由文件（Claude Code 的 .claude/commands/*.md 是此字段的典型用例）。
      若 adapter 所依附的 agent 不支持 slash（例如 Cursor），置为 null。
    fields:
      target_dir:
        type: string
        description: 生成到实例工程根的目录，例如 ".claude/commands"
      template_dir:
        type: string
        description: |
          模板目录，相对于 **adapter 目录**（即 framework/agents/<name>/）。
          目录下每个 *.md 文件对应一个 slash 命令；文件名（去掉 .md）即 slash 名。
      subagents:
        type: object | null
        description: |
          可选。agent 支持子 agent 配置时使用（Claude Code 的 .claude/agents/*.md）。
        fields:
          target_dir:
            type: string
          template_dir:
            type: string
            description: 相对于 adapter 目录
          update_policy:
            type: string | optional
            description: >
              UPDATE 体检第 3 项：POPULATED 时是否免 y/n 自动对齐模板。
              auto_overwrite=机制代码（hooks/settings 等）；缺省或未写=prompt_if_changed（与用户入口一致，需 diff + y）。
            enum: ["auto_overwrite", "prompt_if_changed"]
      update_policy:
        type: string | optional
        description: >
          同上，作用于 slash commands 整块（不含 subagents）。
        enum: ["auto_overwrite", "prompt_if_changed"]

  skill_bridge:
    type: object | null
    description: |
      Skill 跳板目录（Cursor 的 .cursor/skills/<skill>/SKILL.md 是典型用例）。
      跳板本身不复述 skill 内容：只做 frontmatter 与**一条**跳转到
      framework/skills/<n>/SKILL.md 的链接。不得在跳板内追加业务条款、选型表或次级
      文档链接（会形成双源分叉，agent 易只读跳板漏掉正文中的 harness/verifier）。
      扩写必须在 framework/skills 正文及其 prompts/templates/reference；或修改
      framework/agents/shared/agent-bundle/templates/skills-bridge 后经 init/render 下发。
      若 agent 不需要跳板（例如 Claude Code 直接用 slash 加载），置为 null。
      **generic adapter**：`target_dir` 由 `framework.config.json` → `paths.agent_bundle_root`
      + `/skills` 在 harness 运行时解析；恒为 `bridge` 模式拷贝 skills-bridge 薄跳板。
      `inline` 全量物化模式已彻底废弃（config 中残留 inline 一律归一为 bridge）。
    fields:
      target_dir:
        type: string
        description: 生成到实例工程根的目录，例如 ".cursor/skills"
      template_dir:
        type: string
        description: |
          模板目录，相对于 adapter 目录。目录下每个子目录对应一个 skill
          （目录名 = 实例工程里跳板目录名；其下放一个 SKILL.md）。
      update_policy:
        type: string | optional
        enum: ["auto_overwrite", "prompt_if_changed"]
        description: UPDATE 模式下 POPULATED 时对 Cursor 跳板是否自动覆盖模板（默认 prompt_if_changed）。

  rules:
    type: object | null
    description: |
      规则文件（Cursor 的 .cursor/rules/*.mdc 是典型用例）。
      若 agent 没有 rules 机制，置为 null。
    fields:
      target_dir:
        type: string
        description: 生成到实例工程根的目录，例如 ".cursor/rules"
      template_dir:
        type: string
        description: 相对于 adapter 目录
      update_policy:
        type: string | optional
        enum: ["auto_overwrite", "prompt_if_changed"]
        description: UPDATE 模式下 POPULATED 时对 rules 是否自动覆盖（默认 prompt_if_changed）。

  settings_file:
    type: object | null
    description: |
      Adapter 自身的客户端配置文件（Claude Code 的 .claude/settings.json 是典型用例，
      用于注册 Stop / SubagentStop / PreToolUse 等 hooks）。
      若 agent 不需要此类配置文件，置为 null。
      落地方式与 agent_entry_file 相同：原样复制，不做占位符替换
      （因此模板内必须使用 `${CLAUDE_PROJECT_DIR}` 这类客户端原生变量，不用 `{{...}}`）。
    fields:
      template_path:
        type: string
        description: 模板文件位置，相对于 adapter 目录，例如 "templates/settings.json"
      target_path:
        type: string
        description: 生成到实例工程根的相对路径，例如 ".claude/settings.json"
      update_policy:
        type: string | optional
        enum: ["auto_overwrite", "prompt_if_changed"]
        description: UPDATE 模式下 POPULATED 时是否备份后对齐 settings 模板（默认 prompt_if_changed）。

  hooks:
    type: object | null
    description: |
      Adapter 客户端 hook 脚本目录（Claude Code 的 .claude/hooks/*.mjs 是典型用例）。
      hook 脚本由 settings_file 注册并由客户端进程触发；framework 自身不直接调用。
      若 agent 没有 hooks 机制，置为 null。
      落地方式：将目录下所有文件原样复制（不做占位符替换；hook 脚本应通过 stdin
      或 `${CLAUDE_PROJECT_DIR}` 等运行时变量获取上下文）。
    fields:
      target_dir:
        type: string
        description: 生成到实例工程根的目录，例如 ".claude/hooks"
      template_dir:
        type: string
        description: 模板目录，相对于 adapter 目录，例如 "templates/hooks"
      update_policy:
        type: string | optional
        enum: ["auto_overwrite", "prompt_if_changed"]
        description: >
          UPDATE 模式下 POPULATED 时 hooks 是否与 framework 模板自动对齐；
          Claude Code 等对 hook 协议敏感时应声明 auto_overwrite。

  hooks_config:
    type: object | null
    description: |
      结构化 hook 注册配置（Cursor 的 .cursor/hooks.json 是典型用例；plan e8f5a2c7 G1b）。
      与 settings_file 的本质区别：**目标文件是宿主原生共享配置**（团队可能已有自己的
      hooks），落地方式为**结构化 upsert 而非 verbatim 整文件覆盖**——仅增改 framework
      自有条目（ownership key = 条目的 command 路径；matcher 等为受管可变字段原位更新；
      同 command 去重保一；command 变更走 LEGACY_OWNED_COMMANDS 迁移），保留一切第三方
      条目/顶层/未知字段；目标 JSON 非法时阻断提示、**绝不整文件覆盖**；卸载只删自有条目。
      模板文件（template_path）只声明 framework 自有条目的 hooks.json 形状。
      注意：本字段**不参与** resolveEnforcementTier 的 hard_hook 判定（那需要
      settings_file+hooks 双字段 = Stop/correction 链路语义）。
    fields:
      template_path:
        type: string
        description: 相对 adapter 目录的模板路径（仅含 framework 自有条目的 hooks.json）
      target_path:
        type: string
        description: 相对实例工程根的目标路径（宿主共享文件，结构化合并）
      update_policy:
        type: string | optional
        enum: ["auto_overwrite", "prompt_if_changed"]
        description: >
          auto_overwrite 语义 = 每次 UPDATE 自动 reconcile framework 自有条目
          （结构化合并，非整文件覆盖）。

  instance_skill_bridge:
    type: object | null
    description: |
      可选。声明 render-agents-md 渲染入口 Markdown 后，如何把实例扩展 Skill 暴露到 IDE
      （manifest 1.1 按 provides.skills[]；1.0 按目录；Cursor 跳板 / Claude slash）。generic adapter 的
      `skill_stub_target_dir` 由 `paths.agent_bundle_root` + `/skills` 在运行时解析。
      与内置 Skill 跳板或 slash 同名时自动加 ext- 前缀并 stderr 告警。
    fields:
      skill_stub_target_dir:
        type: string
        description: |
          Cursor：生成 .cursor/skills/<bridgeId>/SKILL.md 的根目录（实例相对路径），例如 ".cursor/skills"。
      commands_target_dir:
        type: string
        description: |
          Claude Code：生成 .claude/commands/<bridgeId>.md 的目录（实例相对路径），例如 ".claude/commands"。

  post_install_hooks:
    type: list
    default: []
    description: |
      可选。adapter 产物落地后需要执行的脚本列表（路径相对于 adapter 目录）。
      第一版保持为空，保留字段以便未来扩展（例如 adapter 切换时的清理、版本迁移等）。

  goal_capability:
    type: object | null
    description: |
      可选。声明 adapter 对 goal-runner 全链路无人值守的支持能力。
      check-init 缺失/非法仅 WARN（不 BLOCKER）；goal-runner preflight 为 BLOCKER。
      generic / chrys / codemate 典型为 external_runner；claude / codex 可声明 native_goal。
    fields:
      mode:
        type: string
        enum: ["native_goal", "external_runner", "hook_loop"]
      usage_capture:
        type: string
        enum: ["none", "stdout_json", "stderr_regex", "sidecar", "api"]
        description: |
          可选（缺省 none）。C-ab-eval：headless invoke 的用量采集方式声明。
          agent-invoke 按此解析 AgentInvokeResult.usage 并由 goal-runner 落盘进
          trace.usage；none / 采集失败 → confidence: proxy（token 字段 null，代理
          指标复用 trace 顶层 tool_calls + wall-time）。model identity 同路径机器
          固化（响应元数据 / 调用配置，非 agent 文本自报）。
      output_delivery:
        type: string
        enum: ["streaming", "buffered", "unknown"]
        description: |
          可选（缺省 unknown）。P1-7（plan d9b4f7e2）：headless invoke 的输出交付方式
          **静态能力声明**（宿主侧 `<cli> run --help` 核实后填写，勿凭单次现象猜）。
          buffered/unknown 的含义：被 kill 的 attempt agent-output.log 可能恒为 0 字节，
          API 断流哨兵（扫 output log）对该 adapter 可能失效——断流表现为整 attempt
          超时。goal-runner 把该值透传进 agent_invoke_end 事件供事后排障。
          注意与 adapter_version 的分工：版本是**运行时信息**（每 run 一次 --version
          动态探测进 events），不在本 schema 硬编码。
      in_session_reconcile:
        type: boolean
        default: false
        description: 声明宿主可在当前会话内运行 assess/authorize/execute/reassess 薄 driver。
      phase_context_isolation:
        type: boolean
        default: false
        description: 声明每个 feature phase 可在新鲜隔离上下文中执行并只返回结构化 outcome。
      supports_resume:
        type: boolean
        default: false
        description: 声明 adapter 可恢复同一 goal run_id 与权威事件序列。
      handoff:
        type: string
        default: "none"
        enum: ["none", "to_detached", "bidirectional"]
        description: |
          声明会话 driver 与 detached runner 的交接能力。任何非 none 值都要求
          supports_resume=true；bidirectional 同时允许 detached→session。
      survival:
        type: object | null
        description: |
          可选。plan a4f7e2b1 t3：无人值守**生存能力**的声明式三段
          （launch / liveness / wakeup），供 supervisor 决定能否自动拉起。
          **铁律「先探针后声明」**：每段除 supported 外必须给 verified_by
          （宿主实跑产生的实证样本引用）；只声明不实证的一律**降级为不支持**
          （a7f2e5d1 教训：tier 虚标要么实证要么降级——虚标会让 supervisor
          一直往一个起不来的东西上撞）。探针法参照 c7a9e2f4 T0。
        fields:
          launch:
            type: object | null
            description: 能否由外部（OS 计划任务等）重新拉起本 adapter 的 run
            fields:
              supported: { type: boolean }
              verified_by: { type: string }
              mechanism: { type: string }
          liveness:
            type: object | null
            description: 能否给出可对账的进程存活证据（四元组 beacon 之外的 adapter 侧补充）
            fields:
              supported: { type: boolean }
              verified_by: { type: string }
              mechanism: { type: string }
          wakeup:
            type: object | null
            description: 跨回合唤醒——agent 回合结束后 run 仍在跑时，能否把结论带回下一回合
            fields:
              supported: { type: boolean }
              verified_by: { type: string }
              mechanism: { type: string }
      native_goal:
        type: object | null
        fields:
          goal_condition_template:
            type: string
            description: 相对于 adapter 目录的 /goal 条件模板路径（占位，第一版文档+metadata）
          supports_resume:
            type: boolean
      external_runner:
        type: object | null
        fields:
          headless_invoke:
            type: string
            description: |
              命令模板（goal-runner 结构化 spawn，不经 shell）；占位符 {{PROMPT}}（内联 prompt 正文）、
              {{PROMPT_FILE}} {{SKILL_PATH}} {{PROJECT_ROOT}} {{FRAMEWORK_ROOT}} {{FEATURE}} {{PHASE}}。
              勿使用 $(cat …) 等 shell 语法。
              **权限契约（plan a8e5c3f9）**：本命令即 adapter 提供方断言的
              non-interactive full-permission 启动命令——无审批提示、完整文件系统/工具执行
              权限（用户主动启动 Goal/headless 即为该授权）。Maison 不猜第三方 CLI 旗标、
              不加命令白名单；无法满足者不得声明支持 Goal/headless。内建已知 CLI
              （claude/codeagent/codex/cursor/opencode）运行时以 agent-invoke.ts 硬化 argv
              为 SSOT，本字段仅声明面（两者须一致，防双口径）。
              注意：全权限=执行能力，不是业务裁决权——phase 权责、integrity、runner-owned
              gate、receipt/人签、设备与凭据规则不受影响。
          unattended:
            type: object
            description: |
              unattended 契约声明。plan a8e5c3f9 起 Goal/headless 运行时统一归一化为
              effective 值（write_mode: full-access + approval_mode: never，见
              goal-manifest.ts effectiveHeadlessUnattended）；旧 manifest 的其他枚举仍被
              接受（历史 run 可 resume）但不再降低实际执行权限；allowed_tools 为审批清单
              遗留字段（deprecated/ignored）。

  visual_provider:
    type: object | null
    description: |
      可选（plan ab072691）。声明本 adapter 可作为**只读视觉 provider**（delegated 视觉委托的
      第二 endpoint：primary 盲写工程，provider 只看图产结构化评审）。

      **本字段的完整声明就是 provider 的支持资格**——运行时由 adapter catalog 扫描本字段派生
      唯一支持列表（harness/scripts/utils/adapter-catalog.ts listVisualProviderAdapters）。
      禁止在 TypeScript 里另建 adapter 白名单、禁止按 adapter 内核家族推断（Claude 内核 fork
      不自带资格）、禁止在文档里另写一份支持名单——三者会与本字段形成平行真源。

      `goal_capability` **不参与** provider 资格判定：那是「能不能当 goal 主执行体」的声明，
      与「能不能只读看图」正交；本字段自身承载 invoke / model / image / stdout 全契约。

      四个字段**缺一即不完整**，不完整=无资格（交互态提示重选、无人值守 WARN+blind、
      显式 CLI fail-fast）。取值为**机制 id 而非厂商名**：机制 adapter 通用，多个 adapter 可
      共用同一机制。声明与运行时的分工同 `external_runner.headless_invoke`——本字段是声明面
      与资格面，argv 构造 SSOT 在 harness/scripts/utils/visual-provider-invoke.ts，两者须一致。

      **入册纪律（BLOCKER）**：每份声明须经锁定版本 CLI 的真实 invocation smoke 证明「只读
      隔离成立 + model 真实回放 + 图片真实进模型 + stdout 正确投影」后方可写入。锁定版本实测
      不支持所声明的隔离时，**不得**写入声明、更不得退回该 adapter 的工程默认配置启动。
    fields:
      readonly_invoke:
        type: string
        enum: ["safe_mode_read_only_tools", "read_only_sandbox", "ask_mode", "permission_deny_non_read"]
        description: |
          只读启动机制 id。语义：
          - safe_mode_read_only_tools：CLI 提供「隔离工程定制（settings/hooks/入口文件/skills/
            plugins/MCP 等）」的安全模式，并可把模型可见工具集合收敛到只读读取工具；
          - read_only_sandbox：CLI 提供进程级只读沙箱档位（文件系统写入在沙箱层被拒）；
          - ask_mode：CLI 提供只问不改的会话模式（无写入/无 shell 权限）；
          - permission_deny_non_read：CLI 提供结构化权限声明，可把 edit/bash 等非只读工具置 deny。
          **禁止**声明任何依赖普通 headless 全权限旗标的机制——那条 argv 是无条件全权限契约。
      image_transport:
        type: string
        enum: ["prompt_path", "native_image_flag"]
        description: |
          图片入模路径。prompt_path=prompt 内明列工程内真实图片路径、由只读读图工具读取；
          native_image_flag=CLI 原生附图旗标。两者都**直接使用工程内原路径**，不做暂存复制
          （物理只读由 readonly_invoke 承担，receipt 图片路径因此天然与工程一致）。
      stdout_envelope:
        type: string
        enum: ["stream_json_result", "turn_jsonl", "result_json", "events_json"]
        description: |
          stdout 信封方言——决定「用哪个既有投影函数把 stdout 还原成模型正文」以及是否需要
          既有 terminal 事件解析器。**只选择既有能力，不新建第二套 parser**：投影后统一走
          同一份载荷校验。turn_jsonl 额外契约：只有 invoke 结果 completion 观测成立且无
          terminal failure 时才投影正文，投影为 null 亦判 invalid。
      model_replay:
        type: string
        description: |
          模型回放旗标 token（如 `--model` / `-m`）——provider 的 model 必须真实进入该旗标。
          无回放旗标的 adapter 不具 provider 资格（否则「声称已钉、实际未钉」）。

  verifier_capability:
    type: object | null
    description: |
      可选（plan a9d4e7c2）。声明本 adapter **能不能执行 verifier 闭环**。

      背景：verifier 曾被做成「每阶段必跑的仪式」——policy 说 off、runner 仍无条件装配
      产物、文档仍无条件要求四件套，适用性只在最末端的 check-receipt 才判。收口后
      verifier 降为按 workflow/track/policy/adapter 能力**动态启用的能力**，本字段回答
      其中第三问「当前 adapter 能不能执行」。

      **本字段的完整声明就是能力资格**——运行时由 `resolveVerifierPlan`
      （harness/scripts/utils/verifier-plan.ts）消费，经
      `resolveVerifierCapability`（adapter-catalog.ts）扫描本字段派生。禁止在
      TypeScript 里另建 adapter 白名单、禁止按内核家族推断、禁止以「有 hooks 目录」
      推断——三者都会与本字段形成平行真源。

      未声明 / 声明不完整 = 无能力（不是「降级可用」）。此时：
        · policy 判 verifier=required 且 mode=interactive → `blocked`：**脚本检查照常
          完整执行**，脚本 FAIL 如实报真因；脚本 PASS 才报
          `INCOMPLETE / verifier_provider_unavailable`（provider 缺失不禁基本诊断）；
        · policy 判 off / not_applicable → 与本字段无关，恒 disabled、零产物。

      **入册纪律（BLOCKER）**：`modes` 只登记**真实实测过**的运行模式。claude / codeagent
      的 interactive 已由宿主 SubagentStop 实抓验收；headless / goal 目前仍走 bedside
      旁路，未验收前不得预填——虚标会让 runner 生成一份永远没人发布的 request。
    fields:
      transport:
        type: string
        enum: ["repo_file_request"]
        description: |
          调用凭证的投递机制 id（机制名非厂商名）。
          repo_file_request：runner 在阶段 reports 目录写
          `verifier.request.<64位subject>.json`，调用方把**该 JSON 整段**作为 Task prompt
          投给 verifier；verifier 按其中的 `prompt_path` 自行 Read 磁盘 ai-prompt.md。
          大文件不过传输面，抄错任何字段 → subject 重算失配 → 明确失败。
      publisher:
        type: string
        enum: ["subagent_stop"]
        description: |
          结论的发布机制 id。subagent_stop：由 SubagentStop hook
          （agents/claude/templates/hooks/record-verifier-report.mjs，claude-kernel 家族共享）
          做四方对账（request 自述 subject == 重算 subject == summary 现值 == 终态块回显，
          且 prompt_path/prompt_sha256 与磁盘相符）后发布
          `verifier.report.<subject>.json`。
      modes:
        type: list
        description: |
          已实测支持的运行模式，非空；取值 interactive | headless | goal。
          未列入的模式 = 该模式下无能力。

  user_confirmation:
    type: object | null
    description: |
      可选。声明宿主 agent 的用户确认交互能力。
      Skill 正文 SSOT：framework/skills/reference/user-confirmation-ux.md。
      选项文案 SSOT：framework/skills/reference/confirmation-registry.yaml。
      generic / 内部 agent（chrys、codemate）应声明 structured_widget: unsupported。
    fields:
      structured_widget:
        type: string
        enum: ["supported", "unsupported"]
      interaction_renderer_rule:
        type: string
        description: |
          必填（当 user_confirmation 非 null）。adapter 专属交互渲染规则模板，
          路径相对于 adapter 目录（如 templates/rules/interaction-renderer.md）。
          check-init 在 rules.template_dir 拷贝之外单独收集；按 targetRel 去重。
      portable_required:
        type: boolean
        default: true
        description: |
          为 true 时：即使 structured_widget=supported，同轮消息仍须附 portable 编号菜单脚注。

  deprecated_artifacts:
    type: list
    default: []
    description: |
      已废弃的 adapter 产物路径（相对于 adapter target 根，如 .claude/）。
      check-init UPDATE 模式下发现时 action: backup_delete，
      自动备份到 .framework-backup/<timestamp>/ 后删除，结果写入 check-init.json。
    items:
      path:
        type: string
        description: 相对路径，如 rules/confirmation-ux.md 或 rules/widget-options/（末尾 / 表目录）
      action:
        type: string
        enum: ["backup_delete"]
      reason:
        type: string
        description: 废弃原因，写入 check-init.json 供诊断

  notes:
    type: string
    description: 给 adapter 维护者的备注

# ---------------------------------------------------------------------------
# 占位符约定（模板文件里使用的变量）
# ---------------------------------------------------------------------------
# 以下占位符由初始化 Skill（framework/skills/project/framework-init/）根据
# framework.config.json + 用户交互答复填充。adapter 模板里只可使用这组变量，
# 不允许内嵌业务硬编码。
# ---------------------------------------------------------------------------
placeholders:
  PROJECT_NAME:
    source: framework.config.json → project_name
  PROJECT_TYPE:
    source: framework.config.json → project_type  # "app" | "atomic_service"
  PROJECT_TYPE_LABEL:
    source: |
      由初始化 Skill 根据 framework.config.json → project_type 映射成展示文案：
        - "app"             → "应用工程"
        - "atomic_service"  → "元服务工程"
      新增 project_type 取值时在 framework/skills/project/framework-init/SKILL.md
      同步追加映射，保持与模板占位符一致。
  PROJECT_PROFILE_NAME:
    source: framework.config.json → project_profile.name；缺省或未配置时视同 hmos-app
  PROJECT_PROFILE_SUB_VARIANT:
    source: framework.config.json → project_profile.sub_variant（无则用「标准应用」；见 harness/config.ts DEFAULT_PROJECT_PROFILE_SUB_VARIANT_DISPLAY）
  PROFILE_AGENT_SSOT_ROWS:
    source: |
      渲染时从 framework/profiles/<project_profile.name>/templates/agents-md/agent-ssot-rows.partial.md 读入；
      文件不存在则回落 profiles/generic/agent-ssot-rows.partial.md。（由 render-agents-md.mjs 与 check-init 共用逻辑。）
  PROFILE_AGENT_GUARDRAILS:
    source: |
      同上目录 agent-guardrails.partial.md。
  AGENT_ADAPTER:
    source: framework.config.json → agent_adapter # 当前激活的 adapter 名
  AGENT_ENTRY_FILE:
    source: 当前 adapter.agent_entry_file.target_path
  ARCHITECTURE_SUMMARY:
    source: 由初始化 Skill 根据 architecture DSL 渲染的摘要
  FEATURES_DIR:
    source: framework.config.json → paths.features_dir
    # 阶段 9 合并：原 FEATURE_DOCS_DIR / FEATURE_SPECS_DIR 已收敛到本占位符。
    # 功能需求的所有产物（spec.md / plan.md / contracts.yaml / acceptance.yaml /
    # boundaries.yaml / review-report.md / test-plan.md / test-report.md）均扁平
    # 归档在 <FEATURES_DIR>/<feature>/ 下。
  MODULE_CATALOG_PATH:
    source: framework.config.json → paths.module_catalog
  GLOSSARY_PATH:
    source: framework.config.json → paths.glossary
  EXTENSION_SKILL_SECTION:
    source: |
      由 render-agents-md.ts 读取 paths.extension_dir（默认 doc/extensions）：manifest 1.1 按
      provides.skills[] 渲染，1.0 保持 skills/*/SKILL.md 目录驱动；同时投影 global knowledge
      与每 phase 至多一行 before_phase_work 提示。无扩展时为空白。
  ARCHITECTURE_MD_PATH:
    source: framework.config.json → paths.architecture_md
