adapter_name: claude
description: |
  Claude Code adapter——入口文件命名为 CLAUDE.md（与 AGENTS.md 同源），
  并为每个 Skill 生成 .claude/commands/<slash>.md 路由文件，另外生成一份
  独立语义审查员 .claude/agents/verifier.md。slash 命令只做路由（跳到对应
  SKILL.md），不复述规则。

agent_entry_file:
  template_path: templates/AGENTS.md.template   # 共享模板；Claude Code 只是文件名用 CLAUDE.md
  target_path: CLAUDE.md

commands:
  target_dir: .claude/commands                  # 相对于实例工程根
  template_dir: templates/commands              # 相对于 adapter 目录
  subagents:
    target_dir: .claude/agents
    template_dir: templates/agents
    update_policy: auto_overwrite               # verifier 等为协议级子 agent 配置

skill_bridge: null

rules:
  target_dir: .claude/rules
  template_dir: templates/rules
  update_policy: prompt_if_changed


# Claude Code 的 .claude/settings.json：注册 Stop / SubagentStop / PreToolUse 等 hook，
# 是「弱模型工作流强制门」Layer 3 物理拦截的入口。原样拷贝，不做占位符替换。
settings_file:
  template_path: templates/settings.json        # 相对于 adapter 目录
  target_path: .claude/settings.json            # 相对于实例工程根
  update_policy: auto_overwrite                 # hooks 注册表，协议级

# Claude Code 的 .claude/hooks/*.mjs：由 settings_file 注册并由 Claude Code 进程触发，
# 通过 stdin 接收 JSON payload，通过 stderr + exit code 与客户端协议通信。
# 关键脚本：
#   - check-phase-completion.mjs（Stop hook，按 CLAUDE.md §5.1 四条件物理拦截"假完成"）
#   - record-verifier-report.mjs（SubagentStop hook，落地 verifier 子 agent 报告）
#   - guard-framework-write.mjs（PreToolUse hook，拦编辑类工具写只读 vendored framework/；
#     判定核心在发布件 framework/agents/shared/，plan e8f5a2c7 G1a）
hooks:
  target_dir: .claude/hooks                     # 相对于实例工程根
  template_dir: templates/hooks                 # 相对于 adapter 目录
  update_policy: auto_overwrite                 # Stop hook 等与 harness 契约绑定

# verifier 能力声明（plan a9d4e7c2）：verifier 是**按能力启用**的，不是每阶段仪式。
# transport=repo_file_request：runner 写 verifier.request.<subject>.json，主 agent 把该
# JSON 整段作为 Task prompt 投递，verifier 自行 Read 其中的 prompt_path。
# publisher=subagent_stop：结论由 SubagentStop hook（templates/hooks/record-verifier-report.mjs）
# 四方对账后发布为 verifier.report.<subject>.json。
# modes 只登记**真实实测过**的运行模式：interactive 已由宿主实抓验收（plan e5b8c3f7 附录 A）；
# headless / goal 目前仍走 bedside 旁路，未验收前不得预填——虚标只会让 runner 生成一份
# 永远没人发布的 request。
verifier_capability:
  transport: repo_file_request
  publisher: subagent_stop
  modes: ["interactive"]

instance_skill_bridge:
  commands_target_dir: .claude/commands

user_confirmation:
  structured_widget: supported
  portable_required: true
  interaction_renderer_rule: templates/rules/interaction-renderer.md

# 多模态：Claude Read 工具可读 sidecar；交互 composer 与 claude -p headless 两态均 tool_read
image_input: tool_read

deprecated_artifacts:
  - path: rules/confirmation-ux.md
    action: backup_delete
    reason: "v4.0 起合并到 interaction-renderer.md"
  - path: rules/widget-options/
    action: backup_delete
    reason: "v4.0 起选项文案合入 confirmation-registry.yaml"

# 视觉委托（plan ab072691）：本 adapter 可作**只读视觉 provider**。
# 只读手段=只读工具集合（`--tools Read`）叠加锁定版 safe mode 的定制隔离；
# **绝不复用** goal headless 的全权限 argv。
# 运行时 argv SSOT：harness/scripts/utils/visual-provider-invoke.ts（本字段是声明面与资格面）。
#
# 入册凭据（plan ab072691 tasks 7.7，宿主 claude 2.1.228 真实 invocation 实证）：
#   argv `-p --safe-mode --tools Read --allowedTools Read --disallowedTools mcp__* --model <m>
#   --output-format stream-json --verbose`；一次调用 8.8s outcome=success，16/16 断言全过；
#   随机金丝雀四象限 4/4 + 随机 token 逐字精确命中；`stream_json_result` 投影成立；
#   invoke 前后 `git status --porcelain` 逐字节一致。
#   本 adapter 是首批唯一 `input_provenance=verified` 者——有结构化验读事件解析器，事件流实证
#   本轮图片确实被读取（codex/opencode 只能记 unverified，见 design.md §7 受理与披露分立）。
#
# 只读手段的**实测边界**（同轮取得，措辞据此订正，勿改回）：
#  · **safe mode 不含权限隔离**——其 --help 原文即 "Auth, model selection, built-in tools, and
#    permissions work normally."。天然 A/B：同一份 argv，用户级 ~/.claude/settings.json 的
#    permissions.defaultMode 从 bypassPermissions 改为 auto，子进程 init 的 permissionMode
#    随之从 bypassPermissions 变为 auto ⇒ 该档位**穿透** `--safe-mode`。safe mode 只压定制面
#    （实测 skills 23→17、slash 64→45）。
#  · ⇒ 物理只读**由 `--tools Read` 单独承担**，且该单点已在**最坏组合下实证成立**：显式
#    `--permission-mode bypassPermissions` + 无诱导措辞命令其写文件，模型真实尝试后回报
#    "I only have the `Read` tool available in this session—there's no Write, Edit, or shell
#    tool provided"；目标文件未创建、porcelain 前后一致、事件流零写类工具调用。
#    即：无写工具即无写路径，与 permissionMode 档位无关。
#  · **裁决：首期不补 `--permission-mode`**（2026-08-26）。权限档位只决定「已有工具是否免确认」，
#    无法凭空增加写工具；物理只读由工具可见性保证，纵深防御非当前正确性所需，按裁剪原则不加。
#    **复检触发**：升级 claude CLI 锁定版本时重跑 tasks 7.7 smoke——若 `--tools` 语义或 init 的
#    `tools` 回报发生变化，本裁决须重审。
visual_provider:
  readonly_invoke: safe_mode_read_only_tools
  image_transport: prompt_path
  stdout_envelope: stream_json_result
  model_replay: '--model'

goal_capability:
  mode: native_goal
  in_session_reconcile: true
  phase_context_isolation: true
  supports_resume: false
  handoff: none
  # t3a（f7a3d9c2，2026-07-11 宿主实采回填）：claude -p 走 stream-json 事件流——
  # tool_use/Read 验读记录进 agent-events.jsonl（三文件分流），t3b runner attestation
  # 据此签发 verified 回执。运行时 SSOT：agent-invoke.ts claudeArgv 按本声明加
  # --output-format stream-json --verbose；断流哨兵已适配结构化信封。
  tool_event_provenance: structured_events
  native_goal:
    goal_condition_template: templates/goal-condition.md
    supports_resume: false
  external_runner:
    # Declarative only for capability validation. Runtime SSOT: agent-invoke.ts defaultHeadlessInvokePlan
    # (claude -p …, prompt via STDIN — NOT the {{PROMPT}} argv below; a multi-line prompt as an argv
    # element is truncated at the first newline by cmd.exe on the Windows claude.cmd shim).
    # plan a8e5c3f9：headless 全权限契约——--dangerously-skip-permissions（bypass）；
    # 不再声明 --permission-mode dontAsk/acceptEdits（非 bypass，宿主实锤 npx permission_denied），
    # 不再声明 --allowedTools（审批清单，bypass 下无意义，deprecated/ignored）。
    headless_invoke: 'claude -p --dangerously-skip-permissions "{{PROMPT}}"'
    unattended:
      write_mode: full-access
      approval_mode: never

post_install_hooks: []

notes: |
  - 提供 slash 路由模板：catalog-bootstrap / glossary-bootstrap、conventions-bootstrap / component-catalog-bootstrap、extension、goal-mode、code-graph、
    component-design 统一设计入口、change-unit-progression / component-closure 施工与闭环入口、
    change-lite、spec/plan/coding/code-review/business-ut/device-testing 六篇 feature skill、
    framework-init（framework-init.md）。个人 setup 无 slash，由阶段入口 `--ensure` 内联完成。
  - **claude-kernel 家族模板 SSOT**（plan c7a9e2f4）：本目录 templates/ 的 agents/（verifier）、
    hooks/、rules/、goal-condition.md 同时被 codeagent adapter 跨目录引用（agents/codeagent/
    adapter.yaml 以 `../claude/templates/...` 声明）——改动这些模板对两个 adapter 同时生效；
    commands/ 与 settings.json 例外（codeagent 自有副本/分叉，等值由
    codeagent-adapter.unit.test.ts 归一化测试守护）。
  - 模板里的 `../../framework/skills/<n>/SKILL.md` 相对路径假设 .claude/commands/
    在实例工程根下（与 `commands.target_dir` 一致），且仓库内含 `framework/` 子目录布局；移植时以本 adapter.yaml 的
    `target_*` 为准，不因具体业务仓名而异。
  - settings.json 里的 `${CLAUDE_PROJECT_DIR}` 是 Claude Code CLI 注入的运行时变量，
    指向实例工程根；不要把它误当成 framework 的 `{{PROJECT_NAME}}` 占位符——本
    adapter 的 settings_file / hooks 落地时**不做占位符替换**，原样拷贝。
  - hooks 脚本依赖 `framework/harness/state/.current-phase.json` 与
    `framework/harness/scripts/check-receipt.ts`，两者都是 framework 共通资产，
    与 adapter 解耦；因此 hook 脚本不需要在不同 adapter 间复制逻辑。
  - `.claude/rules/interaction-renderer.md`：Claude 交互渲染 **BLOCKER**；与 CLAUDE.md 同优先级。
