adapter_name: chrys
description: |
  Chrys agent adapter——shared `.agents` bridge bundle（AGENTS.md + .agents/skills/.agents/rules 跳板），
  headless = `chrys run`（`--agent Code --json`）。
  **plan a8e5c3f9：当前不支持 Maison Goal/headless**——headless 契约=non-interactive + no
  approval prompt + full execution，chrys 的等价 bypass 旗标至今未经宿主核实，preflight 以
  `adapter_headless_permission_unsupported` 明确拒绝（不静默以未知/残权限启动）。宿主侧
  `chrys run --help` 核实旗标后在 agent-invoke.ts（assertAdapterHeadlessFullPermission +
  chrysArgv）与本文件接入即可解锁。

agent_entry_file:
  template_path: templates/AGENTS.md.template
  target_path: AGENTS.md

commands: null

skill_bridge:
  target_dir: .agents/skills
  template_dir: ../shared/agent-bundle/templates/skills-bridge

rules:
  target_dir: .agents/rules
  template_dir: ../shared/agent-bundle/templates/rules

user_confirmation:
  structured_widget: unsupported
  portable_required: true
  interaction_renderer_rule: templates/rules/interaction-renderer.md

# goal 宿主之一；chrys run headless 无确认读图能力（按实测定档 none）
image_input: none

goal_capability:
  mode: external_runner
  # P1-7（plan d9b4f7e2）spike 待核实：07-13 现场表现为"被杀 attempt agent-output.log
  # 恒 0 字节、成功 attempt 结束时一次性写结果 JSON"——与 --json 缓冲输出**一致但未经**
  # 宿主端 `chrys run --help` 核实，故按 unknown 声明（不把单次现象固化成所有版本的事实）。
  # unknown/buffered 的运维含义：API 断流哨兵对本 adapter 可能失效，断流表现为整 attempt 超时。
  output_delivery: unknown
  external_runner:
    # plan a8e5c3f9：本声明为「bypass 旗标核实后」的接入形态预留；核实前 preflight 拒绝
    # （见 description）。unattended 对齐 effective 契约值（headless 即全权限）。
    headless_invoke: 'chrys run --task {{PROMPT_FILE}} -C {{PROJECT_ROOT}} --agent Code --json'
    unattended:
      write_mode: full-access
      approval_mode: never

post_install_hooks: []

notes: |
  - 独立 adapter；generic 恒 bridge（inline 已废弃），默认 `.agents` 根下 bundle 为 adapter 中性跳板，generic 与 chrys 可幂等共存。
    （opencode 已改用自有 `.opencode/skill`，不再与 `.agents` 共享；见 agents/opencode/adapter.yaml。）
  - 仅 generic 配非默认 `agent_bundle_root`（如 `.codex`）时落不同目录，是独立产物（不共享、不互为幂等）。
  - rules 对 chrys 为「引用可达」非自动加载；运行时 headless 以 agent-invoke.ts 硬化为准。
  - 口径 SSOT：agents/adapter-schema.yaml（bridge-only）。
