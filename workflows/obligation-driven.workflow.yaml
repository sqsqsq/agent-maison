schema_version: "1.2"
name: obligation-driven
description: New requests resolve their phase chain from obligations and bound
  inputs; order is a preference, not a mandatory pipeline.
transition_policy: manual
auto_chain:
  - spec
  - plan
  - coding
  - review
  - ut
  - testing
artifacts:
  - id: extensions
    scope: global
    check: check-extensions.ts
    rule: phase-rules/extensions-rules.yaml
    requires: []
    obligation_provider_id: obligations.project
  - id: init
    scope: global
    check: check-init.ts
    rule: phase-rules/init-rules.yaml
    requires: []
    skill_doc: ../skills/project/framework-init/SKILL.md
    obligation_provider_id: obligations.project
  - id: catalog
    scope: global
    check: check-catalog.ts
    rule: phase-rules/catalog-rules.yaml
    requires: []
    skill_doc: ../skills/project/catalog-bootstrap/SKILL.md
    obligation_provider_id: obligations.project
  - id: glossary
    scope: global
    check: check-glossary.ts
    rule: phase-rules/glossary-rules.yaml
    requires: []
    skill_doc: ../skills/project/catalog-bootstrap/SKILL.md
    obligation_provider_id: obligations.project
  - id: module-graph
    scope: global
    check: check-module-graph.ts
    rule: phase-rules/module-graph-rules.yaml
    requires: []
    skill_doc: ../skills/project/code-graph/SKILL.md
    obligation_provider_id: obligations.project
  - id: docs
    scope: global
    check: check-docs.ts
    rule: phase-rules/docs-rules.yaml
    requires: []
    obligation_provider_id: obligations.project
  - id: spec
    scope: feature
    check: check-spec.ts
    rule: phase-rules/spec-rules.yaml
    requires:
      - catalog
      - glossary
    verifier_prompt: prompts/verify-spec.md
    skill_doc: ../skills/feature/spec/SKILL.md
    obligation_provider_id: obligations.spec
  - id: plan
    scope: feature
    check: check-plan.ts
    rule: phase-rules/plan-rules.yaml
    requires:
      - spec
    verifier_prompt: prompts/verify-plan.md
    skill_doc: ../skills/feature/plan/SKILL.md
    obligation_provider_id: obligations.plan
  - id: coding
    scope: feature
    check: check-coding.ts
    rule: phase-rules/coding-rules.yaml
    requires:
      - plan
    verifier_prompt: prompts/verify-coding.md
    skill_doc: ../skills/feature/coding/SKILL.md
    obligation_provider_id: obligations.coding
  - id: review
    scope: feature
    check: check-review.ts
    rule: phase-rules/review-rules.yaml
    requires:
      - coding
    verifier_prompt: prompts/verify-review.md
    skill_doc: ../skills/feature/code-review/SKILL.md
    obligation_provider_id: obligations.review
  - id: ut
    scope: feature
    check: check-ut.ts
    rule: phase-rules/ut-rules.yaml
    requires:
      - coding
    verifier_prompt: prompts/verify-ut.md
    skill_doc: ../skills/feature/business-ut/SKILL.md
    obligation_provider_id: obligations.ut
  - id: testing
    scope: feature
    check: check-testing.ts
    rule: phase-rules/testing-rules.yaml
    requires:
      - ut
      - review
    verifier_prompt: prompts/verify-testing.md
    skill_doc: ../skills/feature/device-testing/SKILL.md
    obligation_provider_id: obligations.testing
