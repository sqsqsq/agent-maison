      - question_id: DRQ-02
        question: 状态变更、保存、发布与返回的完整顺序及异常边界是否明确？
        frontier_fingerprint: sha256:b203380308e14f43f1bf2d9d1208bf8f97a08c033127162048300f96e43bd050
        owner: Inbox
        scope_kind: view
        scope_ref: view:runtime
        disposition: answered_with_evidence
        answer: 是。ordered_steps先完成全部状态变更，零改变直接返回；正数save同步返回后逐listener发布独立最终副本，正常回调结束才返回计数。异常沿既有同步链传播，保存后listener抛错可能中断后续投递；蓝图明确保留此既有边界，没有承诺异常完整投递。
        evidence_refs:
          - doc/requirement.md
          - 02-Feature/Inbox/src/main/ets/InboxStore.ts
          - 02-Feature/Inbox/src/main/ets/MemoryStorage.ts
