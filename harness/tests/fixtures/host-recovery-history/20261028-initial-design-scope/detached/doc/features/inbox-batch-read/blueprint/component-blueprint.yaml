generated_graphs:
  - graph_id: sequence:batch-read
    label: 一次批量变更和最终通知
    format: mermaid
    source_view_id: runtime
    node_refs:
      - view:runtime/flow:batch-read
      - view:runtime/node:store
      - view:runtime/node:projection
      - contract:inbox-storage
    relation_refs: []
    content: |
      sequenceDiagram
          participant Caller as 内部调用方
          participant Store as 状态拥有者（InboxStore）
          participant Storage as 内存存储（MemoryStorage）
          participant Consumer as 当前订阅者及未读计数消费者
          Caller->>Store: 一次标记全部已读（markAllRead）
          Store->>Store: 修改全部未读项并累计数量
          alt 改变数为零
              Store-->>Caller: 返回0，不保存也不通知
          else 改变数大于零
              Store->>Storage: 保存完整最终列表（save）
              Storage-->>Store: 同步确认复制完成（void）
              Note over Store,Consumer: 对每个当前listener一次回调，各自独立副本
              Store->>Consumer: 发送全部已读最终快照
              Consumer-->>Store: 正常回调返回，Projection未读数为0
              Store-->>Caller: 返回实际改变数
          end
