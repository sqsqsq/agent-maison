        - acceptance:AC-2
        - acceptance:AC-3
        - acceptance:AC-4
      conclusion: InboxStore统计并修改全部未读，正数save一次后每个listener一次最终副本；0直接返回。
      rationale: 消息和listener原本同属InboxStore；一次完整写回满足原需求并避免中间状态。
