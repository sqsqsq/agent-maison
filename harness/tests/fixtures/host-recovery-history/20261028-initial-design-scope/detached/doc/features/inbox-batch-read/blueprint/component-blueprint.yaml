  title: 通知收件箱：一次标记全部已读
  authored_by: initial-design-author
  background: 调用方已有读取、单条已读、内存写回和订阅。
  problem: 只能逐条标记；循环单条方法会多次写入并推送中间快照。
  summary: 新增markAllRead()，同步改变当前全部未读并返回实际数量；正数保存一次，再向每个现有订阅者一次最终快照；0不写不发。
  positioning: Inbox模块内部同步能力，沿已有入口、MemoryStorage及InboxProjection。
  goals:
    - goal_id: batch-read
      statement: 闭合批量状态、存储和订阅，保持原行为。
      success_measures:
        - 精确计数、保留字段和顺序、正数一次写回。
        - 空、全已读、重复调用为0且无副作用。
        - 最终快照、同对象重载及原操作/取消行为通过真实测试。
  in_scope:
    - 公开实例markAllRead
    - InboxStore与现有存储和消费者
    - host-only TypeScript/Node真实验证
  non_goals:
    - UI、图片、设备、HarmonyOS构建验收
    - 网络、数据库、账号或跨进程耐久
    - 跨store实例自动同步
    - 提交、打包、发布、版本或验收能力修改
  must_review:
    - 持久化重载仅指同一MemoryStorage对象，进程退出会丢失数据。
    - listener抛错保持既有同步传播及迭代中止，不保证异常回调场景完整投递。
  admission:
    current_slice:
      slice_id: batch-read
      contracts_ready: true
      design_refs_ready: true
    status: pass
    root_questions_complete: true
    blocker_refs: []
  reader_guide:
    sections:
      - section: summary
        title: 一次操作清除当前未读
        prose: 通知收件箱目前只能逐条标记已读。本次让使用公开入口的调用方执行一次markAllRead()并取得实际改变数。有未读时，所有未读项一起改为已读，保存一次，然后每个现有订阅者只收到一次最终列表；空、全部已读及重复调用返回0，不写存储、不通知。读取、单条已读、重载和取消订阅保持原行为。
        source_refs:
          - /review_summary/summary
          - /review_summary/in_scope
          - /review_summary/non_goals
        graph_ids: []
      - section: background
        title: 问题、目标与边界
        prose: 循环现有markRead会多次保存并推送中间快照，无法满足批量契约。本次只扩展Inbox模块已有的同步内部能力，使用真实TypeScript/Node测试；不含UI、图片、设备、网络、数据库、版本改动、提交或发布。
        source_refs:
          - /review_summary/problem
          - /review_summary/goals
          - /review_summary/non_goals
        graph_ids: []
      - section: terms
        title: 通知收件箱和未读
        prose: 通知收件箱由Inbox模块负责，保存消息与已读状态，公开读取、写回及订阅。消息仍只有id、text、read；只有read=false的行计入本次实际改变数，不按id去重，也不修改正文或顺序。
        source_refs:
          - /discovery/facts/0
          - /design_views/2/nodes/0/contracts/data_models
        graph_ids: []
      - section: journey
        title: 内部调用方的操作
        prose: 调用方提供MemoryStorage，通过createInbox取得store；调用markAllRead同步取得改变数量，然后继续读取、单条已读、重建store或取消订阅。此旅程只有一次业务动作和原有后续使用，因此省略旅程总览；没有界面或导航。
        source_refs:
          - /design_views/4/nodes/0
        graph_ids: []
      - section: solution
        title: 入口、状态、存储和消费者各负其责
        prose: 既有index.ts已导出InboxStore，createInbox直接返回该实例，因此新增实例方法即可公开能力。状态拥有者InboxStore负责修改、计数、保存和发布；MemoryStorage保存完整副本；InboxProjection只根据快照计算未读数，普通listener沿原subscribe消费。它们继续使用同一条数据链路，不增加第二状态源或订阅通道。
        source_refs:
          - /discovery/facts/1
          - /design_views/2/nodes/0/contracts/components
          - /decisions_and_gaps/decisions/1
        graph_ids: []
      - section: flows
        title: 一次批量变更与最终通知
        prose: 图中描述一次批量操作：状态拥有者先完成所有修改并计数。0直接返回；正数先等待同步save返回，再按原Set迭代向每个当前listener回调一次，各自取得独立的最终列表副本。正常回调结束后才返回改变数。不能循环调用单条markRead。订阅前由list提供初值，取消函数从原Set移除listener，Projection.dispose复用该取消函数。
        source_refs:
          - /design_views/1/runtime_data_flows/0/contracts/state_management/0/ordered_steps
          - /design_views/1/runtime_data_flows/0/subscriptions
        graph_ids:
          - sequence:batch-read
      - section: data
        title: 内存副本与重载范围
        prose: 批量操作仅把未读项的read改为true，保留id、text、数量和顺序。MemoryStorage的load/save继续逐条浅复制。持久化重载在此工程中指复用同一MemoryStorage对象重新createInbox；真实进程退出会丢失对象，不承诺磁盘或跨进程耐久。没有账号、库表、唯一索引、加密级别或迁移机制，本次不引入这些能力。
        source_refs:
          - /data_domains/0
          - /discovery/facts/3
          - /design_views/1/runtime_data_flows/0/initial_load
        graph_ids: []
      - section: decisions
        title: 为何直接扩展原状态拥有者
        prose: 选定方案保留原状态、存储和消费者接缝。下列决策记录逐条操作及新增平行服务的被否原因。方案沿用同步回调和逐订阅者复制的成本，不增加错误隔离或重发机制。
        source_refs:
          - /decisions_and_gaps/decisions
        graph_ids: []
      - section: recovery
        title: 静默、取消与恢复
        prose: |-
          | 情形 | 数据与返回 | 后续行为 |
          | --- | --- | --- |
          | 空或全部已读（AC-2） | 返回0，不保存 | 不通知 |
          | 重复调用（AC-3） | 第二次为0 | 不重复写回或发送 |
          | 同对象重建（AC-5） | load已保存结果 | 不写不发 |
          | 取消订阅（AC-6） | 消息照常处理 | 取消者不再更新 |

          MemoryStorage没有外部I/O失败分支。同步依赖异常沿原链传播，不吞错、重试或回滚；listener抛错时存储已更新，后续listener可能未执行，这是既有边界，不能宣称异常回调也获得完整投递。没有页面或异步用户中断。
        source_refs:
          - /design_views/1/runtime_data_flows/0/failure_recovery
          - /design_views/0/nodes/0/acceptance
        graph_ids: []
      - section: quality
        title: 兼容性、安全与成本
        prose: 保留现有公开签名、列表副本与同步订阅行为。遍历消息完成修改和计数，正数save一次；每个listener仍取得独立副本，成本随消息数和订阅者数增长。不新增日志或外部数据流。主题、无障碍和设备指标不适用于无UI内部能力。
        source_refs:
          - /quality_attributes
        graph_ids: []
      - section: delivery
        title: 实现落点和交接
        prose: 产品实现预计只修改02-Feature/Inbox/src/main/ets/InboxStore.ts，新增markAllRead。既有index.ts、Message、MemoryStorage、InboxProjection继续承担入口、模型、存储和消费，预计不需修改。测试由后续plan/UT在Inbox现有测试根内选择真实文件和注册名，关联稳定验收及运行局部对象。本次尚未创建canonical
          CU；runtime将先做独立质询和准入，再由正式consumer接受施工单元。无需迁移、发布或开关；交付后原有操作均可继续使用。
        source_refs:
          - /design_views/2/nodes/0/contracts
          - /design_views/3
        graph_ids: []
      - section: acceptance
        title: 逐项验收
        prose: AC-1验证实际计数、数据保留及一次写回；AC-2验证空和全部已读；AC-3验证重复调用；AC-4验证多消费者、先保存后通知、一次最终快照与隔离；AC-5验证同存储对象重载；AC-6验证list、单条markRead、取消函数及Projection.dispose。使用真实node:test和Expect执行；设计意图不是执行证据，最终须由UT和机器核对当前文件及逐例身份。
        source_refs:
          - /design_views/0/nodes/0/acceptance
        graph_ids: []
      - section: questions
        title: 限制与待复核事项
        prose: 当前业务契约没有需要用户补充的决定。独立质询、机器准入、canonical
          CU及施工验证仍待runtime实际产生，本蓝图没有自签。需核实同一MemoryStorage对象重载和异常listener保留原行为的边界。当前仅审查Mermaid图源，未用图像预览核字号与布局。
        source_refs:
          - /review_summary/must_review
          - /review_summary/admission
          - /decisions_and_gaps/gaps
        graph_ids: []
    source_digest: sha256:5a976461adb9d49d61c881d9699f73d4f8cee89120b51d3ab62472fe8ed14593
