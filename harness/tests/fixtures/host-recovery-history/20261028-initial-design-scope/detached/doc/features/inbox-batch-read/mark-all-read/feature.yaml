    impact:
      user_visible_behavior_change: true
      reason: "CU的batch-behavior、state-owner-and-storage、final-consumers与reload-and-c\
        ompatibility谓词及蓝图logical/batch-read
        AC-1..AC-6和runtime/batch-read要求新增公开同步markAllRead():
        number。当前源码只有list、单条markRead和subscribe；循环markRead会多次save和推送中间快照。新增能力使全部\
        未读一次变为已读，返回精确改变数；正数save一次再向现有listener各发一次最终副本，零改变或重复调用静默。这改变部件可观察状态及存储和\
        消费者副作用，因此为true。保留原操作、副本、同MemoryStorage重载、cancel和Projection.dispose；影响限于\
        现有Inbox，无UI、设备、网络或拓扑变化。"
