  direction: internal
  version: existing
  signature: "save(messages: Message[]): void"
  semantics: 同步增加writes一次并复制完整最终数组；调用方只在实际改变时调用。
  source_ref: doc/features/inbox-batch-read/blueprint/internal-storage-contract.yaml#/operation
  verification_refs:
