      type: Message[]
      semantics: 完整消息数组，保持id、text、read和顺序；save逐条浅复制。
      source_ref: doc/features/inbox-batch-read/blueprint/internal-storage-contract.yaml#/request_dto/fields/0
      provenance:
        source_kind: code
