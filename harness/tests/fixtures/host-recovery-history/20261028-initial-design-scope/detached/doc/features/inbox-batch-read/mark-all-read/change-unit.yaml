safe_intermediate_state:
  description: 只有一个完整垂直切片，无后继CU依赖。完成时公开入口、状态、真实内存写回及现有消费者共同通过host-only类型检查和真实Node测试，原接口继续可用；未完成时不宣称部分能力交付。plan登记具体测试写集与实际注册名，UT产生执行证据；无UI、设备、网络、提交或发布。
  build_validation_refs:
