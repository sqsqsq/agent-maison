provides:
  - provide_id: batch-read-complete
    description: 公开实例markAllRead()同步完成当前全部未读项修改并返回实际改变数；正数保存一次并向每个现有正常返回的listener发送一次独立最终快照，零改变无写入或通知，保留原读取、单条已读、同存储对象重载和取消订阅行为。
