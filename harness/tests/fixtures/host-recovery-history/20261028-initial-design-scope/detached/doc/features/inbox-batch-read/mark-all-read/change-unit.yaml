preserved_invariants:
  - invariant_id: message-data-and-isolation
    description: 只把read=false改为true，保留id、text、数量和顺序；list、storage和各listener保持独立副本，不引入平行状态或跨store同步。
    evidence_refs:
      - acceptance:AC-1
      - acceptance:AC-4
      - acceptance:AC-5
      - acceptance:AC-6
  - invariant_id: existing-operations
    description: 保留list、markRead返回与副作用、subscribe不重放和cancel/dispose清理；重载仅限同一MemoryStorage对象，沿用既有同步异常传播。
    evidence_refs:
      - acceptance:AC-5
      - acceptance:AC-6
  - invariant_id: quiet-repeat
    description: 空、全部已读和成功后重复调用返回0，写入及全部订阅者通知次数保持不变。
    evidence_refs:
      - acceptance:AC-2
      - acceptance:AC-3
target_predicates:
  - predicate_id: batch-behavior
    role: behavior
    description: "经已有公开入口调用无参同步markAllRead(): number，混合与全未读输入返回精确改变数；空、全已读及重复调用返回0且静默。"
    provide_ids:
      - batch-read-complete
    verification_refs:
      - acceptance:AC-1
      - acceptance:AC-2
      - acceptance:AC-3
  - predicate_id: state-owner-and-storage
    role: owner
    description: InboxStore保持唯一实例状态拥有者，全部修改完成后只调用一次真实MemoryStorage.save；保留原字段和顺序及list副本，零改变不保存。
    provide_ids:
      - batch-read-complete
    verification_refs:
      - acceptance:AC-1
      - acceptance:AC-2
      - acceptance:AC-3
      - acceptance:AC-6
  - predicate_id: final-consumers
    role: consumer
    description: save同步返回后每个当前listener仅收到一次全量最终独立副本，InboxProjection重算为0；取消listener和dispose后的Projection不再更新，原单条订阅语义保留。
    provide_ids:
      - batch-read-complete
    verification_refs:
      - acceptance:AC-4
      - acceptance:AC-6
  - predicate_id: reload-and-compatibility
    role: recovery
    description: 同一MemoryStorage对象重建store时load恢复最终结果且不增加写入；原单条无效或重复操作静默，批量重复幂等，不引入吞错、回滚、补发或跨进程耐久承诺。
    provide_ids:
      - batch-read-complete
    verification_refs:
      - acceptance:AC-3
      - acceptance:AC-5
      - acceptance:AC-6
