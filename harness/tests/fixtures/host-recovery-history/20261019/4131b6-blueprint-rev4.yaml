        question: 选择、倒计时、结果和首页有卡态如何刷新？
        answer: ArkUI 状态驱动选择、OTP 与结果；HomeTab 回调在 clear 前收到完整卡号并启动按号读取，RDB 记录驱动持久有卡态。
