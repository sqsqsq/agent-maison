        frontier_fingerprint: scope-lens-state-owners-r1
        owner: independent-design-questioning
        evidence_refs: [view:runtime/node:opening_flow_state, view:runtime/flow:open_card_flow, view:logical/node:card_record]
        verification_refs: [AC-5, AC-6, BD-3, BD-4, BD-5]
