          implementation_notes:
            - id: open_card_flow_state
              owner_ref: view:runtime/node:opening_flow_state
              contract_refs: [contract:bank-card-enrollment]
              lifecycle_triggers: [bank_tap, type_continue, card_next, otp_submit, result_complete, page_disappear]
              ordered_steps:
                - AddBankCardPage 或 AllBanksPage 的银行行调用页面命名方法 handleBankTap(bank)，在本页显示 CardTypeSheet；关闭只清理 sheet 局部选择，失败停留原页。
                - CardTypeSheet.handleContinue(type) 构造不可变 OpenCardSessionParams(bankCode,bankName,type,failureTargetName=AddBankCardPage)，调用 NavPathContext.stack().pushPath BankCardSelectionPage 并等待页面入栈。
                - BankCardSelectionPage 从 NavDestination 参数校验 OpenCardSessionParams，创建本页唯一 OpenCardFlow，并通过 BankRepository.getCards(bankCode,type) 获得完整卡对象；UI 只渲染 maskCardNumber(fullCardNumber)。
                - 用户选择卡片后 BankCardSelectionPage.handleOpenOtp() 在本页打开 OtpVerificationSheet；AccountService.getUserProfile() 提供 phoneNumber，MaskUtil.maskPhone 只用于提示文本。
                - OtpVerificationSheet.aboutToAppear 触发 sendMockSms() 并启动 60 秒计时；输入变化经 flow.normalizeOtp 只保留数字和最多 6 位；关闭 OTP 调用 flow.closeOtp() 回到 CardSelected 并停留选卡页。
                - submitOtp 在 phase=Saving 后禁用再次提交，以 single-flight await BankCardRepository.saveCard(context,selectedCard)；离页 dispose 释放计时器。
                - BankCardRepository 在事务内打开 wallet_cards RDB，完整映射必填字段并按完整卡号唯一约束 insert；返回 OpenCardResult，异常返回失败结果。
                - submit 收到结果后关闭 OTP 半模态并 push AddCardResultPage，参数包含 success、fullCardNumber、failureReason、failureTargetName；此时才允许展示结果。
                - HomeTabPage 首次创建时 OpenCardCompletionBridge.subscribe(stableCallback)，回调收到完整卡号即调用 BankCardRepository.findByFullCardNumber(context,number) 并刷新有卡态；组件销毁时 unsubscribe 同一引用。
                - AddCardResultPage 拦截 onBackPressed（含返回键/左滑）；失败完成调用 stack.popToName(AddBankCardPage)，可同时移除 AllBanks、选卡和结果页；成功完成先 OpenCardCompletionBridge.publish(fullCardNumber) 同步触发已注册首页回调，再 stack.clear() 显示根首页。
              mutations:
                - { id: save_card, owner: BankCardRepository, persistence: wallet_cards }
              publications:
