      verification_refs: [AC-3, AC-4, AC-8]
      privacy: UI 仅显示卡号前四后四，验证码不持久化。
      performance: OTP 每秒更新，RDB 写入在 UI await 后只发布一次结果。
      accessibility: 可操作行和按钮提供稳定 id、禁用态和足够触控区域。
    table_schema:
      database: wallet.db
      version: 1
      security: 本地应用沙箱，当前演示版本不额外加密；不得在日志输出完整卡号或验证码。
      tables:
        - name: wallet_cards
          primary_key: id
          unique: [full_card_number]
          columns:
            - { name: id, type: INTEGER, constraints: [PRIMARY_KEY, AUTOINCREMENT] }
            - { name: full_card_number, type: TEXT, constraints: [NOT_NULL, UNIQUE] }
            - { name: generic_card_type, type: TEXT, constraints: [NOT_NULL] }
            - { name: bank_name, type: TEXT, constraints: [NOT_NULL] }
            - { name: bank_code, type: TEXT, constraints: [NOT_NULL] }
            - { name: bank_card_type, type: TEXT, constraints: [NOT_NULL] }
            - { name: added_at, type: INTEGER, constraints: [NOT_NULL] }
            - { name: huawei_pay_enabled, type: INTEGER, constraints: [NOT_NULL] }
            - { name: unionpay_quickpass_enabled, type: INTEGER, constraints: [NOT_NULL] }
            - { name: transaction_records, type: TEXT, constraints: [NOT_NULL], default: "[]" }

providers:
  - provider_id: current-facts-discovery
    definition: 读取需求、代码、配置、测试和架构事实。
    consumer: component-design
    provider: codex-primary
    requirement: required
    authority_rule: Code, schema, interface, config, and tests are current-state authority.
    source_rule: Every assertion carries source_ref and source revision when available.
    missing_behavior: 缺事实时形成 blocker，不以推断代替。
    replacement_behavior: 新权威事实经 revision 调和。
    exit_behavior: 事实输入冻结后退出，不写 Goal 状态。
    conflict_behavior: 保留双方来源并交 owner 裁决。
    available: true
    writes: [blueprint]
  - provider_id: se-manual-contracts
    definition: 消费直接人工需求对操作、数据和 NFR 的授权。
    consumer: component-design
    provider: user-local-requirement
    requirement: required
    authority_rule: Authorized SE or contract owner is external-contract authority.
    source_rule: Every contract segment carries source_ref, verification ref, and provenance.
    missing_behavior: 未授权字段保持 unknown 或 blocker。
    replacement_behavior: 新的人类裁决经 blueprint revision 接入。
    exit_behavior: 契约落到 canonical 蓝图后退出。
    conflict_behavior: 需求冲突不做 last-write-wins。
    available: true
    writes: [blueprint]
  - provider_id: app-design-lens
    definition: 按 App 4+1 与十个根问题检查设计完整性。
    consumer: component-design
    provider: hmos-app-profile
    requirement: required
    authority_rule: Lens is not fact authority and cannot override inputs.
    source_rule: Projection cites inputs, viewpoint contract, and lens rule version.
    missing_behavior: profile 不支持时停止。
    replacement_behavior: lens 版本变化触发重审。
    exit_behavior: 只写蓝图设计表达。
    conflict_behavior: 不覆盖事实源。
    available: true
    writes: [blueprint]
  - provider_id: independent-design-questioning
    definition: 在隔离上下文阅读评审文档并覆盖全部质询 scope。
    consumer: component-design
    provider: codex-independent-design-questioning
    requirement: required
    authority_rule: Questioning is not fact or decision authority.
    source_rule: Answers cite isolated blueprint, evidence package, and registered external inputs.
    missing_behavior: 未完成前蓝图保持 blocker。
    replacement_behavior: 作者修订后由同一质询方复核当前文档。
    exit_behavior: 只回传问题和处置，不直接写 SSOT。
    conflict_behavior: 建议与权威需求冲突时保留需求并披露。
    available: true
    writes: []
  - provider_id: conventions-knowledge
    definition: 读取项目横切工程惯例。
    consumer: component-design
    provider: project-conventions
    requirement: optional
    authority_rule: Project conventions are stable knowledge input, not current-code authority.
    source_rule: Applicable facts cite the configured conventions file and exact heading id.
    missing_behavior: 默认路径不存在且未显式配置时记 not_applicable。
    replacement_behavior: 文件出现后按原事实链消费。
    exit_behavior: 不创建平行惯例真源。
    conflict_behavior: 当前代码事实优先并登记冲突。
    available: false
    missing_disposition: not_applicable
    writes: []
  - provider_id: component-assets
    definition: 从组件索引读取可复用 UI 资产并作选型。
    consumer: component-design
    provider: component-index
    requirement: optional
    authority_rule: Source is component fact authority; curation is human selection guidance.
    source_rule: Selection evidence cites the configured component index or catalog; component_ref identifies the asset.
    missing_behavior: UI 需求缺索引时降级并登记缺口。
    replacement_behavior: 索引刷新后重新核对选型。
    exit_behavior: 选型写入 decision，不写组件 registry。
    conflict_behavior: 源码事实覆盖过期索引并披露漂移。
    available: true
    writes: [blueprint]

