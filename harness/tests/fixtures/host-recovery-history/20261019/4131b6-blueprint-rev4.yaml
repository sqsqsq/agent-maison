          addedAt、huaweiPayEnabled、unionPayQuickPassEnabled、transactionRecords。
        delta: 新增 RDB 表 wallet_cards，并以完整卡号唯一约束避免重复写入。
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md

  - view_id: runtime
    viewpoint_contract: app-runtime@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [钱包用户, WalletMain运行时]
    purpose: 描述从银行点击到持久化、结果页及清栈返回的完整运行时调用。
    current_state: 点击银行仅 Toast，运行时没有开卡状态和持久化调用。
    target_state: 流程状态跨半模态和全屏页传递，OTP 提交等待 RDB 返回后再进入结果页。
    delta: 新增 OpenCardFlow、OTP 计时器、CardRepository RDB 调用和结果导航。
    decisions_and_gaps: [decision:navigation-stack, decision:rdb-schema]
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 05-SystemBase/CommFunc/src/main/ets/shared/navigation/NavPathContext.ets
    nodes:
      - node_id: opening_flow_state
        owner: WalletMain.BankCardSelectionPage.OpenCardFlow
        current_state: 不存在。
        target_state: >-
          卡类型页到选卡页只传不可变 OpenCardSessionParams(bankCode,bankName,bankCardType,failureTargetName)；
          BankCardSelectionPage 据此创建唯一 OpenCardFlow，状态为 Idle→CardSelected→OtpWaiting→Saving→Result。
        delta: 新增显式跨页参数和选卡页局部会话所有者；关闭 OTP 回 CardSelected，离开选卡页 dispose。
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        design_basis_refs: [contract:bank-card-enrollment]
      - node_id: wallet_card_projection
        owner: WalletMain.BankCardRepository
        current_state: WalletMain 当前没有银行卡 RDB Repository。
        target_state: RDB 写入完成后可按卡号读取；首页/后续详情以此为数据源。
        delta: 新增 wallet_cards RDB 和保存结果。
        provenance: *requirement_provenance
        verification_refs:
          - 02-Feature/WalletMain/src/main/ets/data/repository/CardRepository.ets
        design_basis_refs: [contract:bank-card-enrollment]
    runtime_data_flows:
      - flow_id: open_card_flow
        provenance: *requirement_provenance
        data_domain_refs: [wallet_bank_cards]
        external_contract_refs: [contract:bank-card-enrollment]
        source_of_truth:
          authority: view:logical/node:card_record
          persistence: WalletMain.BankCardRepository.wallet_cards
          projections_and_caches: [view:runtime/node:wallet_card_projection]
          reconciliation: RDB insert 返回成功才把结果标为成功；异常映射为失败结果且不伪造已保存记录。
        triggers:
          - kind: user_action
            timing: 用户在验证码半模态点击下一步
            idempotency: 同一完整卡号使用唯一约束；重复提交返回确定性失败结果且不写第二条。
        initial_load:
          initial_load_id: load_bank_candidates
          strategy: BankRepository 按 bankCode 和 bankCardType 返回内存 mock 候选卡。
          owner: WalletMain.BankRepository
          data_scope: 当前选择银行和卡类型
          freshness: 单次页面进入时读取，流程结束清理。
        state_owner:
          ref: view:runtime/node:opening_flow_state
          states: [Idle, CardSelected, OtpWaiting, Saving, Result]
        mutations:
          - mutation_id: save_selected_card
            kind: foreground
            persistence_ref: WalletMain.BankCardRepository.wallet_cards
            publication_ref: publication:card_saved
            recovery_ref: recovery:save_result
        publications:
          - publication_id: card_saved
            payload: OpenCardResult(success, fullCardNumber, failureReason)
            timing: RDB insert resolve 或 reject 后发布一次
          - publication_id: open_card_completed
            payload: 成功分支的完整卡号一次性载荷
            timing: 结果页点击完成且 success=true 时发布，首页消费后清除
        subscriptions:
          - subscription_id: result_page_subscription
            consumer_ref: consumer:add_card_result_page
            attach: push AddCardResultPage 时绑定不可变结果参数
            detach: 完成按钮处理后页面随开卡栈一起移除
            cleanup: 释放计时器和 OpenCardFlow 会话引用
            replay_or_snapshot: 结果页使用入栈快照，不依赖后续广播
            ordering: 先完成 RDB await，再 push 结果页
          - subscription_id: wallet_home_completion
            consumer_ref: consumer:wallet_home
            attach: HomeTabPage.aboutToAppear 首次创建时 subscribe 稳定回调；根组件被二级 NavDestination 覆盖时保持实例和订阅
            detach: HomeTabPage.aboutToDisappear 仅在组件销毁时 unsubscribe 同一函数引用
            cleanup: publish 向当前 listener 同步投递一次后清除 pending；无 listener 时保留一份 pending 并在下次 subscribe 投递
            replay_or_snapshot: 单 listener + 单 pending 快照保证每个完整卡号至多消费一次
            ordering: 结果页 publish 同步触发首页 handler 开始按号读 RDB，再 clear 导航栈显示更新后的根页
        consumers:
          - consumer_id: add_card_result_page
            initial_load_ref: initial-load:load_bank_candidates
            update_ref: publication:card_saved
            responsibility: 显示成功或失败，并在完成时执行受控清栈与最终去向。
          - consumer_id: wallet_home
            initial_load_ref: initial-load:load_bank_candidates
            update_ref: publication:open_card_completed
            responsibility: 成功完成时通过已注册回调同步接收一次性完整卡号，按号从 RDB 读取并刷新首页有卡态；bridge 投递后立即清除内存载荷。
        failure_recovery:
          recovery_id: save_result
          handling: 捕获 RDB 异常，构造 success=false 的结果并仍携带完整卡号进入结果页。
          retry: 本轮不自动重试；用户退出失败结果后可重新发起开卡。
        decisions_and_gaps: [decision:rdb-schema, decision:result-destination]
        evidence_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        verification_refs:
          - AC-5
          - BD-2
        logical_contract_refs: [contract:bank-card-enrollment]
        development_owner_ref: view:development/node:walletmain_open_card
        contracts:
          state_management:
            - data: openCardFlow
              scope: BankCardSelectionPage 实例
              decorator: private readonly
              holder: BankCardSelectionPage
              module: WalletMain
              owner_ref: view:runtime/node:opening_flow_state
              contract_refs: [contract:bank-card-enrollment]
              ordered_steps:
                - 银行页本地打开 CardTypeSheet，继续时 push 不可变 OpenCardSessionParams。
                - BankCardSelectionPage 创建局部 OpenCardFlow，选择卡片并打开 OTP。
                - submitOtp 以 single-flight await BankCardRepository.saveCard。
                - 保存结果以 OpenCardResult 快照进入结果页。
                - 成功完成 publish 完整卡号后 clear，失败 popToName(AddBankCardPage)。
              lifecycle_triggers: [page_attach, page_detach, warm_resume, process_recreation]
              failure_recovery:
                recovery_id: save_result
                handling: 保存异常进入失败结果页；未提交会话可安全丢弃并重新开始。
              mutations:
                - mutation_id: save_selected_card
                  kind: foreground
                  publication_ref: publication:card_saved
                  recovery_ref: recovery:save_result
              publications:
                - publication_id: card_saved
                - publication_id: open_card_completed
              subscriptions:
                - subscription_id: result_page_subscription
                  consumer_ref: consumer:add_card_result_page
                  publication_ref: publication:card_saved
                  replay_or_snapshot: 不可变 OpenCardResult 入栈快照
                  cleanup: 结果页完成后随开卡栈移除
                - subscription_id: wallet_home_completion
                  consumer_ref: consumer:wallet_home
                  publication_ref: publication:open_card_completed
                  replay_or_snapshot: 单 listener 与单 pending 的一次性完整卡号快照
                  cleanup: 同步投递或下次 subscribe 投递后立即清除 pending
              consumers:
                - consumer_id: add_card_result_page
                  initial_load_ref: initial-load:load_bank_candidates
                  update_ref: publication:card_saved
                - consumer_id: wallet_home
                  initial_load_ref: initial-load:load_bank_candidates
                  update_ref: publication:open_card_completed
        lifecycle_coverage:
          cold_start: { status: covered, evidence_refs: [BD-4] }
          warm_resume: { status: covered, evidence_refs: [BD-4] }
          page_attach: { status: covered, evidence_refs: [AC-1] }
          page_detach: { status: covered, evidence_refs: [BD-3] }
          account_switch: { status: not_applicable, evidence_refs: [decision:scope-modules] }
          process_recreation: { status: covered, evidence_refs: [BD-4] }
          background_write: { status: not_applicable, evidence_refs: [decision:rdb-schema] }

  - view_id: development
    viewpoint_contract: app-development@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [WalletMain维护者, Phone维护者, 测试工程师]
    purpose: 定义文件写集、模块依赖、类型、接口、页面和测试接缝。
