        scope_kind: view
        scope_ref: view:runtime
        question: 跨页会话、OTP、保存、结果和完成运行链是否明确？
        answer: 页面间传不可变 OpenCardSessionParams，选卡页创建并持有局部 OpenCardFlow；保存完成后进入结果页，成功与失败采用不同完成链。
