      - question_id: Q-lens-publication
        scope_kind: app_lens
        scope_ref: app_lens:publication_subscription
        question: 保存结果和成功完成卡号如何发布与消费？
        answer: 保存结果以不可变 OpenCardResult 交给结果页；成功完成同步 publish 给已注册 HomeTab 回调，无 listener 时保留一个 pending 快照供下次 subscribe。
        disposition: answered_with_evidence
