              ut_focus: OTP 输入归一化、可提交谓词和计时状态转换。
              device_focus: 手机号脱敏提示、数字键盘、倒计时与按钮状态。
            - id: AC-5
              priority: P0
              description: 点击验证码下一步先 await RDB 保存，再把完整卡号和真实保存结果带到结果页。
