        question: 银行能力、候选卡和持久记录的逻辑设计是否闭合？
        answer: BankCardType、BankInfo.supportedCardTypes、完整 BankCardInfo 与 CardRecord 已形成一致模型，完整卡号仅在业务对象和持久化链中使用。
        disposition: answered_with_evidence
        frontier_fingerprint: scope-view-logical-r1
        owner: independent-design-questioning
        evidence_refs: [view:logical/node:bank_catalog, view:logical/node:card_record, contract:bank-card-enrollment]
        verification_refs: [AC-1, AC-2, AC-3, AC-5, BD-1]
        provenance: &questioning_provenance
          source_kind: independent_review
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.review.md
          source_revision: revision:1
          observed_at: "2026-10-18"
