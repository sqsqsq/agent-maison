        target_state: UserProfile 增加完整 phoneNumber，AccountService 的 mock profile 返回固定手机号并经 index.ets 继续导出既有类型。
        delta: 仅扩展账号 mock/profile 数据；不承载银行卡状态、OTP 计时或开卡流程。
        provenance: *requirement_provenance
        verification_refs:
          - 04-BusinessBase/AccountManager/src/main/ets/data/model/UserProfile.ets
          - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
        design_basis_refs: [decision:scope-modules]

  - view_id: deployment
    viewpoint_contract: app-deployment@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [应用发布者, 数据迁移维护者]
    purpose: 说明同一 Phone HAP 内的 HAR 变化、RDB 首次建库和兼容顺序。
    current_state: Phone HAP 打包 WalletMain，但没有银行卡 RDB schema。
    target_state: 同一 HAP 首次按版本 1 创建 wallet_cards，旧安装升级时保留既有页面和其它数据。
    delta: 新增 WalletMain 代码与资源，无新系统权限和独立进程。
    decisions_and_gaps: [decision:rdb-schema]
    verification_refs:
      - 01-Product/Phone/src/main/module.json5
      - 02-Feature/WalletMain/oh-package.json5
    rollout:
      - order: 1
        unit: WalletMain 数据模型、RDB 与页面
        depends_on: []
        note: 编译期同包交付。
      - order: 2
        unit: Phone navDestination 注册
        depends_on: [WalletMain builder exports]
        note: 同一构建内完成，不允许壳先引用未导出的符号。
    coordination:
      - counterpart: HarmonyOS relationalStore
        relation: 本地系统 API；无外部服务发布配套。
    nodes:
      - node_id: phone_hap
        owner: Phone
        current_state: 现有单 HAP。
        target_state: 仍为单 HAP，打入 WalletMain 新页面、资源和 RDB 调用。
        delta: 同包升级，无模块集合变化。
        responsibilities: [装配 WalletMain HAR, 注册导航 builder]
        inputs: [WalletMain/index.ets exports]
        outputs: [可安装 HAP]
        not_responsible_for: [银行卡业务状态, RDB schema 实现]
        failure_impact: builder 导出或注册缺失会导致页面不可达，由编译和路由回归阻断。
        provenance:
          source_kind: config
          source_ref: 01-Product/Phone/oh-package.json5
          source_revision: git:d3f48b2c38521d049b1ec7fb670cc0c9cf6e8416
          observed_at: "2026-10-18"
          evidence_strength: authoritative
          extraction_method: direct_source_read
        verification_refs: [01-Product/Phone/oh-package.json5]

  - view_id: scenarios
    viewpoint_contract: app-scenarios@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [钱包用户, 验收人员]
    purpose: 以用户旅程串联四个参考界面、保存结果和最终去向。
    current_state: 用户在银行行结束于暂不支持提示。
    target_state: 用户可完成开卡或收到可解释失败，并通过完成按钮离开清理后的流程。
    delta: 新增完整开卡旅程及失败分支。
    decisions_and_gaps: [decision:result-destination]
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
    nodes:
      - node_id: opening_journey
        owner: WalletMain
        current_state: 银行点击后无后继旅程。
        target_state: 银行→卡类型→具体卡→验证码→结果→完成。
        delta: 新增主路径、写库失败和用户取消分支。
        journey_steps:
          - step_id: J1
            stage: 卡类型
            user_action: 在添加银行卡页或全部银行页点击银行。
            system_behavior: 打开卡类型半模态，展示实际支持类型。
            preconditions: [银行数据已加载]
          - step_id: J2
            stage: 具体卡片
            user_action: 选类型并点击同意并继续。
            system_behavior: 打开银行命名的全屏候选卡页，卡号只显示前四后四。
            preconditions: [卡类型已选择]
          - step_id: J3
            stage: 短信验证
            user_action: 选择卡片、同意协议并点击下一步。
            system_behavior: 从 AccountService 的 UserProfile.phoneNumber 取账号 mock 手机号、脱敏展示，打开验证码半模态并自动开始 60 秒倒计时。
            preconditions: [具体卡已选择, 协议已同意]
          - step_id: J4
            stage: 保存结果
            user_action: 输入任意 6 位数字并点击下一步。
            system_behavior: await RDB 保存后打开成功或失败结果页。
            preconditions: [验证码格式有效]
          - step_id: J5
            stage: 完成
            user_action: 点击完成。
            system_behavior: 成功 publish 完整卡号后 clear 全部二级路径并由首页按号读 RDB；失败 popToName(AddBankCardPage)，同时移除 AllBanks 和后续中间页。
            preconditions: [结果页已展示]
        path_variants:
          - user_type: 银行只支持一种卡类型
            difference: J1 只显示一个可选项，其余旅程不变。
          - user_type: RDB 写入失败
            difference: J4 展示失败结果，J5 回添加银行卡页且无新增记录。
          - user_type: 从全部银行页发起
            difference: 失败完成会连同 AllBanks 一起移除并回其下的 AddBankCardPage；成功完成清空所有二级路径。
        reference_images:
          - source_ref: doc/features/原始需求/1-2-银行卡/3-点击任意银行拉起添卡选卡半模态.jpg
            step_ref: J1
          - source_ref: doc/features/原始需求/1-2-银行卡/4-点击信用卡或储蓄卡后拉起选卡页面.jpg
            step_ref: J2
          - source_ref: doc/features/原始需求/1-2-银行卡/5-选中某张卡片后拉起短信验证.jpg
            step_ref: J3
          - source_ref: doc/features/原始需求/1-2-银行卡/6-短信验证完成后结果页.jpg
            step_ref: J4
        logical_refs: [view:logical/node:bank_catalog, view:logical/node:card_record, contract:bank-card-enrollment]
        runtime_refs: [view:runtime/flow:open_card_flow]
        development_owner_ref: view:development/node:walletmain_open_card
        deployment_refs: [view:deployment/node:phone_hap]
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md

decisions_and_gaps:
  decisions:
    - decision_id: scope-modules
      label: 模块范围
      status: answered_with_evidence
      owner: component-design
      conclusion: WalletMain 承担银行卡业务，Phone 只改根导航注册，AccountManager 仅为既有 UserProfile 增加权威 mock phoneNumber；不修改 CommUI、CommFunc。
      rationale: catalog 明确 WalletMain 负责添卡、Phone 负责 navDestination、AccountManager 负责账号 mock/profile 数据，正好覆盖原需求的三个责任点。
      provenance:
        source_kind: catalog
        source_ref: doc/module-catalog.yaml#WalletMain
        observed_at: "2026-10-18"
        evidence_strength: authoritative
        extraction_method: full_catalog_read
      verification_refs: [doc/module-catalog.yaml#WalletMain, doc/module-catalog.yaml#Phone, doc/module-catalog.yaml#AccountManager]
    - decision_id: navigation-stack
      label: 导航与清栈
      status: answered_with_evidence
      owner: component-design
      conclusion: 复用 NavPathContext 的唯一 NavPathStack；失败统一 popToName(AddBankCardPage)，成功 publish 完整卡号后 clear 全部二级路径。
      rationale: 现有二级页面均消费同一根栈，另建 Router 会破坏既有路由契约。
      provenance:
        source_kind: code
        source_ref: 05-SystemBase/CommFunc/src/main/ets/shared/navigation/NavPathContext.ets
        observed_at: "2026-10-18"
        evidence_strength: authoritative
        extraction_method: direct_source_read
      verification_refs: [01-Product/Phone/src/main/ets/pages/index.ets, 05-SystemBase/CommFunc/src/main/ets/shared/navigation/NavPathContext.ets]
    - decision_id: full-card-number
      label: 完整卡号边界
      status: decided_with_authority
      owner: product-requirement
      conclusion: 完整卡号仅在 mock 数据、流程对象和 RDB 中传递；所有用户可见卡号都使用前四后四掩码。
      rationale: 原始需求同时要求后台完整处理和界面掩码展示。
      provenance: *requirement_provenance
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    - decision_id: rdb-schema
      label: RDB 真源与幂等
      status: answered_with_evidence
      owner: component-design
      conclusion: WalletMain 创建 wallet.db v1 的 wallet_cards 表，full_card_number UNIQUE；写入失败映射失败结果，不自动重试。
      rationale: 单表覆盖当前必需字段，唯一约束以最少状态阻止重复卡记录。
      provenance: *requirement_provenance
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md, contract:bank-card-enrollment]
    - decision_id: result-destination
      label: 结果页完成去向
      status: decided_with_authority
      owner: product-requirement
      conclusion: 成功完成回钱包首页，失败完成回最初添加银行卡页；卡详情页留待后续需求。
      rationale: 需求规格明确说明银行卡详情页开发完成后才替换成功去向。
      provenance: *requirement_provenance
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    - decision_id: component-card-type-sheet
      label: 卡类型半模态组件选型
      kind: component_selection
      target_ref: view:development/node:walletmain_open_card
      asset_resolution: custom
      status: answered_with_evidence
      owner: component-design
      conclusion: WalletMain 内自建 CardTypeSheet 业务组件。
      rationale: component-index 没有带银行业务语义和半模态状态的现成组件，在 WalletMain 内新建业务组件。
      provenance:
        source_kind: code
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-18"
        evidence_strength: authoritative
        extraction_method: full_component_index_read
      verification_refs: [doc/component-index.yaml]
    - decision_id: component-otp-sheet
      label: 验证码半模态组件选型
      kind: component_selection
      target_ref: view:development/node:walletmain_open_card
      asset_resolution: custom
      status: answered_with_evidence
      owner: component-design
      conclusion: WalletMain 内自建 OtpVerificationSheet 业务组件。
      rationale: 现有组件不包含 OTP 输入、倒计时和重发状态，新增 WalletMain 业务组件。
      provenance:
        source_kind: code
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-18"
        evidence_strength: authoritative
        extraction_method: full_component_index_read
      verification_refs: [doc/component-index.yaml]
  gaps: []

