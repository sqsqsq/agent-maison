generated_graphs:
  - graph_id: open-card-select-type
    label: 打开卡类型半模态
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant P as 银行列表页
        participant S as CardTypeSheet
        participant N as NavPathStack
        participant C as BankCardSelectionPage
        participant F as OpenCardFlow
        U->>P: 点击银行
        P->>S: 显示半模态
        S-->>U: 银行和支持卡类型
        U->>S: 选择类型并继续
        S-->>P: 返回所选类型
        P->>N: push不可变OpenCardSessionParams
        N->>C: 创建选卡页
        C->>F: 从session创建页面局部flow
    node_refs: [view:runtime/node:opening_flow_state, view:development/node:walletmain_open_card]
    relation_refs: [relation:runtime-to-development]
  - graph_id: open-card-save-result
    label: 提交验证码并保存
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant O as OtpVerificationSheet
        participant F as OpenCardFlow
        participant R as BankCardRepository
        participant D as wallet_cards
        participant P as AddCardResultPage
        U->>O: 输入6位验证码并提交
        O->>F: submitOtp(context, otp)
        F->>R: saveCard(context, selectedCard)
        R->>D: insert full card record
        D-->>R: insert result or error
        R-->>F: OpenCardResult
        F-->>O: result snapshot
        O->>P: 关闭半模态并打开结果页
    node_refs: [view:runtime/node:opening_flow_state, view:runtime/node:wallet_card_projection, view:logical/node:card_record]
    relation_refs: [relation:logical-to-runtime]
  - graph_id: open-card-complete
    label: 结果页完成并清栈
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant P as AddCardResultPage
        participant B as OpenCardCompletionBridge
        participant H as HomeTabPage
        participant R as BankCardRepository
        participant N as NavPathStack
        U->>P: 点击完成
        alt 保存成功
          P->>B: publish完整卡号
          B->>H: 同步调用已注册回调
          H->>R: findByFullCardNumber
          R-->>H: 持久卡记录
          P->>N: clear全部二级路径
          N-->>H: 显示钱包首页
        else 保存失败
          P->>N: popToName AddBankCardPage
          N-->>P: 移除AllBanks选卡结果页
        end
    node_refs: [view:scenarios/node:opening_journey, view:runtime/node:opening_flow_state]
    relation_refs: [relation:scenario-to-logical]
