      - question_id: Q-lens-initialization
        scope_kind: app_lens
        scope_ref: app_lens:initialization
        question: 银行数据、Flow、账号手机号、RDB 和首页订阅如何初始化？
        answer: 入口加载银行数据；选卡页校验 session 后创建 Flow；AccountService 在 OTP 前提供手机号；RDB 懒打开；HomeTab 首次创建时注册稳定回调。
        disposition: answered_with_evidence
        frontier_fingerprint: scope-lens-initialization-r1
        owner: independent-design-questioning
        evidence_refs: [view:runtime/flow:open_card_flow, view:development/node:walletmain_open_card]
        verification_refs: [AC-1, AC-4, AC-5, AC-6]
