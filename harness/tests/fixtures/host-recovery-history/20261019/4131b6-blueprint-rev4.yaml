    purpose: 定义开卡实体、能力边界、敏感数据与结果语义。
    current_state: 银行仅有展示信息，点击不产生开卡业务对象。
    target_state: 银行支持卡类型和候选卡；CardRecord 成为本地持久化真源，展示与完整卡号分离。
    delta: 新增银行卡开卡领域模型、mock 候选卡和结果语义。
