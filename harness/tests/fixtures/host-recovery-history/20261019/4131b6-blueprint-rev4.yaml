review_summary:
  title: bc-openCard-2 银行卡开卡闭环
  authored_by: codex-primary
  background: >-
    bc-openCard-1 已具备添加银行卡、全部银行列表及统一导航栈。本次把两个银行入口从
    “暂不支持”升级为可完成的银行卡开卡流程，并把成功卡片持久化到本地 RDB。
  problem: >-
    当前银行行点击只显示提示，既没有卡类型、具体卡片、短信验证码和结果界面，也没有可供
    后续卡详情读取的银行卡持久化模型。
  goals:
    - goal_id: G1
      statement: 用户从任一银行入口完成卡类型选择、具体卡片选择、短信验证和结果确认。
      success_measures:
        - 两个入口行为一致且既有路由不回归
        - 仅 6 位数字验证码可提交，60 秒倒计时可重发
        - 写库成功或失败都进入对应结果页
    - goal_id: G2
      statement: 新增可持续演进的银行卡 RDB 数据真源。
      success_measures:
        - 完整卡号只在业务数据与 RDB 中处理，界面只展示前四后四
        - 表至少承载银行、银行卡种类、通用卡类型、支付能力、添加时间和交易记录
  positioning: >-
    WalletMain 负责开卡页面、业务状态、mock 数据和 RDB；Phone 仅继续履行根
    navDestination 注册职责。AccountManager 扩展既有 UserProfile mock 数据，提供验证码文案所需的完整手机号。
  in_scope:
    - WalletMain 的银行 mock 数据、开卡 UI、流程编排、RDB Repository、资源和业务级测试
    - Phone 根导航对新全屏页面的注册
    - AccountManager 的 UserProfile mock 手机号字段与既有出口
    - 参考图对应的四个目标界面及既有路径回归
  non_goals:
    - 生产银行、短信、银联、华为支付和 NFC 接口
    - 银行卡详情页；成功后本轮落到钱包首页
    - 协议富文本点击、交易流水业务和数据库加密
  must_review:
    - 术语“银行卡”不在 glossary 中，按无人值守授权映射到 WalletMain，需后续人工策展时复核
    - 需求同时写了“成功后钱包首页”和“结果页完成跳卡详情”，以后者被明确说明为后续能力，本轮采用钱包首页
  reader_guide:
    source_digest: sha256:d41041038506d1c05729c75f1f1a91fa889959d17e834850954c32e73587f094
    sections:
      - section: summary
        title: 一页结论
        prose: >-
          本次把两个银行列表入口接成一条完整开卡链：选择卡类型和具体卡片，完成 6 位短信验证，
          等待本地 RDB 写入，再进入只能点击“完成”退出的结果页。成功把完整卡号一次性交给钱包首页后清栈，失败回最初添加银行卡页。
        source_refs: [/review_summary/background, /review_summary/goals, /decisions_and_gaps/decisions/4]
        graph_ids: []
      - section: background
        title: 现状、问题与范围
        prose: >-
          bc-openCard-1 已提供银行列表和既有路由，但银行点击仍只提示暂不支持。本轮业务实现集中在 WalletMain，
          Phone 只增加新目的页注册；AccountManager 仅在既有 UserProfile 增加 mock 手机号，不承载银行卡状态。
        source_refs: [/review_summary/problem, /review_summary/in_scope, /review_summary/non_goals, /decisions_and_gaps/decisions/0]
        graph_ids: []
      - section: terms
        title: 术语与责任归属
        prose: >-
          “添卡”“卡包”来自 glossary 并归 WalletMain；“银行卡”尚未策展，按现有模块画像和无人值守授权暂映射到 WalletMain，
          作为 must-review 明示而不冒充人工确认。
        source_refs: [/discovery/facts/3, /discovery/facts/4, /discovery/facts/5, /review_summary/must_review]
        graph_ids: []
      - section: journey
        title: 用户旅程与四张参考图
        prose: >-
          J1 卡类型半模态、J2 具体卡片全屏页、J3 验证码半模态、J4 结果页依次对应四张参考图；
          J5 点击完成负责清栈和最终去向。写库失败只改变 J4/J5 的状态与去向，不跳过前序选择和验证。
        source_refs: [/design_views/4/nodes/0/journey_steps, /design_views/4/nodes/0/path_variants, /design_views/4/nodes/0/reference_images]
        graph_ids: []
      - section: solution
        title: 整体方案
        prose: >-
          页面间只传不可变 OpenCardSessionParams；BankCardSelectionPage 持有当前 OpenCardFlow，HomeTabPage 首次创建时向一次性完成桥接注册回调。
          BankRepository 提供银行与 1-2 张 mock 卡，BankCardRepository 是 wallet_cards 的唯一写入口。UI 只显示掩码卡号，完整卡号沿业务对象进入 RDB、结果参数与同步首页回调。
        source_refs: [/design_views/0, /design_views/1/nodes, /decisions_and_gaps/decisions/2, /decisions_and_gaps/decisions/3]
        graph_ids: []
      - section: flows
        title: 三段关键调用
        prose: >-
          第一段从银行点击打开卡类型半模态；第二段从验证码提交跨 OpenCardFlow、Repository 和 RDB 得到真实保存结果；
          第三段只允许结果页“完成”按钮裁剪开卡栈。每段都保留调用、等待和返回次序。
        source_refs: [/design_views/1/runtime_data_flows/0/contracts/state_management/0/ordered_steps, /design_views/1/runtime_data_flows/0]
        graph_ids: [open-card-select-type, open-card-save-result, open-card-complete]
      - section: data
        title: 数据与存储
        prose: >-
          wallet.db v1 的 wallet_cards 表以 id 为主键、完整卡号为唯一键，保存通用卡类型、银行、银行卡类型、添加时间、
          华为支付/银联闪付状态和 JSON 交易记录。当前演示版依赖应用沙箱，不记录完整卡号和验证码日志。
        source_refs: [/contracts/0/table_schema, /design_views/2/nodes/0/contracts/data_models]
        graph_ids: []
      - section: decisions
        title: 关键取舍
        prose: >-
          复用唯一 NavPathStack，不再造 Router；RDB 使用单表和唯一约束，不增加缓存或第二真源；
          结果页成功去首页，因为卡详情明确属于后续需求。两种半模态均在 WalletMain 内做业务组件。
        source_refs: [/decisions_and_gaps/decisions]
        graph_ids: []
      - section: recovery
        title: 失败与恢复
        prose: >-
          无效验证码不触发保存；关闭 OTP 半模态回到当前选卡页并释放计时器；RDB 异常进入失败结果页；进程重建只保留已完整提交的 RDB 记录，
          未保存会话从安全入口重新开始。Saving 为 single-flight，重复卡号不会覆盖旧记录。
        source_refs: [/design_views/2/nodes/0/acceptance/boundaries, /design_views/1/runtime_data_flows/0/failure_recovery, /contracts/0/idempotency]
        graph_ids: []
      - section: quality
        title: 质量、安全与体验
        prose: >-
          核心隐私边界是屏幕掩码、验证码不落盘、不打敏感日志；UI 由参考图和真机证据验收，倒计时每秒刷新，
          新按钮和交互行需有稳定 element id、禁用态和可触控区域。
        source_refs: [/contracts/0/nfr, /design_views/2/nodes/0/acceptance/performance, /design_views/2/nodes/0/acceptance/criteria/7]
        graph_ids: []
      - section: delivery
        title: 施工与上线
        prose: >-
          一个 Change Unit 足以原子交付：先完成 WalletMain 的模型、Repository、流程、页面、资源和测试，再同步更新 index/route_map 与 Phone 注册。
          构建、业务 UT 和真机路由/视觉验证均通过后才算完成。
        source_refs: [/design_views/2/nodes/0/contracts/files, /design_views/3/rollout]
        graph_ids: []
      - section: acceptance
        title: 验收口径
        prose: >-
          AC-1 至 AC-8 覆盖双入口、单选、掩码、OTP、真实写库结果、结果页清栈、既有路由回归和四屏视觉；
          BD-1 至 BD-5 覆盖单类型银行、RDB 故障、取消清理、进程重建和 Saving single-flight。
        source_refs: [/design_views/2/nodes/0/acceptance]
        graph_ids: []
      - section: questions
        title: 当前待复核事项
        prose: >-
          需人工知道的两点是“银行卡”术语尚未写入 glossary，以及成功去向按需求正文的“详情页后续再做”解释为钱包首页；
          首轮独立质询提出的跨页会话、手机号、RDB 映射、首页交接和清栈问题已在当前修订中闭合，并由同一质询方复核通过。
        source_refs: [/review_summary/must_review, /review_summary/admission, /decisions_and_gaps/gaps]
        graph_ids: []
