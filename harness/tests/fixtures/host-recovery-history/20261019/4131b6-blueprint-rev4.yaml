        target_state: >-
          新增 BankCardType.DEBIT/CREDIT；BankInfo.supportedCardTypes 是唯一支持类型字段，默认 20 家 mock 银行都含两种类型；
          BankRepository.getCards(bankCode,type) 为每家每类型返回 1-2 张完整 mock 卡。
        delta: 扩展银行 mock 数据但保留现有 20 家银行顺序和 logo；单类型边界由 Repository 测试夹具覆盖。
        provenance: *requirement_provenance
