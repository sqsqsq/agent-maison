# SSOT: 模块画像目录 (Module Catalog)
# 由 Skill 0 · Phase A (`/catalog-bootstrap <ModuleName>`) 逐模块追加
schema_version: "1.0"
modules:
  - name: "CommFunc"
    layer: "05-SystemBase"
    sub_layer: "CommFunc"
    format: "HAR"
    one_liner: "系统侧通用能力（**HAR**，**`shared/log` · `shared/utils` · `shared/navigation`**）：**`Logger`**（**`hilog`**，`DOMAIN = 0xD001000`，静态 **`info` / `error`**）；**`MaskUtil`**（**`maskPhone`** 前三后四、**`maskAccount`** 通用账号脱敏，**过短输入原样返回**）；**`NavPathContext`**（**`attach`** 单例全局栈、**`stack()`** 未挂载抛 **`Error('NavPathStack not attached')`**）；源码注释说明 **`NavDestination`** 子树不宜 **`@Prop`** 传栈、宜 **`@Link` / 本上下文**。**零 UI、零业务状态**；**`oh-package.dependencies` 为空**。"
    responsibilities:
      - "导出 **`Logger`**：封装 **`@kit.PerformanceAnalysisKit`** 的 **`hilog`**，统一 **`DOMAIN = 0xD001000`**，提供 **`Logger.info` / `Logger.error`**（**`(tag, format, ...args)`** 形态）。"
      - "导出 **`MaskUtil`**：**`maskPhone`**——长度 **`<= 7`** 时原样返回，否则 **`前三 + **** + 后四`**；**`maskAccount`**——长度 **`<= 4`** 时原样返回，否则 **`前二 + **** + 后二`**；算法演进归本模块；**何时写入存储**归 **`AccountManager`** 等业务侧。"
      - "导出 **`NavPathContext`**：**`attach(stack)`** 写入静态 **`pathStack`**（注释：**全局单栈**，由 **`01-Product`** 入口 **`aboutToAppear` 等时机**调用）；**`stack()`** 若 **`null`** 抛 **`Error`**（消息 **`NavPathStack not attached`**）；供 **`NavDestination`** 等无法 **`@Link`** 的子树取栈（注释指向真机 **`pushPath`/`@Prop` 风险**）。"
      - "维持 **CommFunc 子层**：**`oh-package.json5` `dependencies: {}`**；**禁止**依赖 **`CommUI`** 与业务 HAR；可被 **`CommUI` / Feature / Product** 按 DSL 引用。"
    NOT_responsible_for:
      - "不负责 **`PhoneAbility`**、**`loadContent`**、根 **`Navigation`/`Tabs`、`navDestination`**；宿主壳归 **`Phone`**，本模块仅提供 **`attach`/`stack` API**。"
      - "不负责路由策略、页面名字符串常量或 **`WalletMain`** 内 **`pushPath` 业务语义**；本模块**只持有栈引用**。"
      - "不负责 **`promptAction.showToast`、主题、`@Component`**；UI 反馈归 **`CommUI`**。"
      - "不负责 **`AccountService`/`LoginState`/账号 AppStorage**；**`AccountManager`** 可调用 **`MaskUtil`**，本模块**不**持久化会话。"
      - "不负责 Feature/BusinessBase 的 **DTO/Repository**；归 **`WalletMain`** / **`AccountManager`** 等。"
    typical_business_terms:
      - "系统功能封装"
      - "通用日志"
      - "脱敏"
      - "工具类"
      - "导航栈上下文"
    easily_confused_with:
      - module: "CommUI"
        disambiguation: |
          **`Logger` / `MaskUtil` / `NavPathContext`（无 ArkUI 组件）** → **CommFunc**（本模块）。
          **`ActionListItem`、`SectionCard`、`CommColors`、`showToast`** → **CommUI**。
          **`CommUI` → `CommFunc`** ✅；反向 ❌。
      - module: "AccountManager"
        disambiguation: |
          **纯日志/脱敏/导航上下文**，与「何时 **`login`、写哪个 **`AppStorage`** 键」无关 → **CommFunc**。
          **`AccountService`、`UserProfile`、`LoginState`** → **AccountManager**；可依赖本模块 **`MaskUtil`**。
      - module: "WalletMain"
        disambiguation: |
          **工具与上下文实现**，与卡包/首页产品编排无关 → **CommFunc**。
          **`HomeTabPage`/`CardPackPage` 内 `pushPath`、`HomeRepository`、业务 UX** → **WalletMain**；可在宿主已完成 **`NavPathContext.attach`** 后调用 **`NavPathContext.stack()`**；**`attach` 调用点仍归宿主 `Phone`**。
      - module: "Phone"
        disambiguation: |
          **`Logger`/`MaskUtil`/`NavPathContext` 类实现** → **CommFunc**。
          **`PhoneAbility`、根壳、`NavPathContext.attach` 调用点** → **Phone**（宿主消费 API）。
    key_exports:
      - "Logger"
      - "MaskUtil"
      - "NavPathContext"
    entry_file: "05-SystemBase/CommFunc/src/main/ets/index.ets"

  - name: "CommUI"
    layer: "05-SystemBase"
    sub_layer: "CommUI"
    format: "HAR"
    one_liner: "公共可复用 ArkUI 积木（**HAR**，**`presentation/components` + `shared/theme`**）：导出 **`ActionListItem`**、**`SectionCard`**、**`showToast`**（**`promptAction.showToast`**，**`duration: 2000`**）与 **`CommColors`**（hex 说明常量）；组件样式主要绑定 **`$r('app.color.comm_*')` / `$r('app.float.comm_*')`**；**无业务专名**；**`oh-package` 声明依赖 **`CommFunc`**（满足 **CommUI → CommFunc** 子层边；当前采样源码未见对 **`CommFunc`** 符号 import，属架构占位/未来扩展）。"
    responsibilities:
      - "导出 **`ActionListItem`**：`@Prop icon/title`，左右 **`SymbolGlyph`**（列表默认 **`chevron_right`**），整行 **`onClick` → `onTap`**；尺寸/色取自 **`app.float.comm_*` / `app.color.comm_*`**。"
      - "导出 **`SectionCard`**：`@BuilderParam content` 插槽；容器 **`comm_bg_card`** 背景、圆角 **12**、内边距 **4**。"
      - "导出 **`showToast(message)`**：**`promptAction.showToast`**，`duration` **2000**；**`catch` 空块**：非 UI 上下文静默失败，**不**替代 **`CommFunc.Logger`**。"
      - "导出 **`CommColors`**：`PRIMARY_BLUE` / `TEXT_PRIMARY` 等 **hex 常量**（注释指向与 **`color.json`** 对齐说明）；复杂主题仍以工程 **`$r`** 资源为准。"
      - "维护 **`oh-package.json5` → `file:../CommFunc`**，工程上与 **「CommUI 子层可依赖 CommFunc；CommFunc 不依赖 CommUI」** 一致。"
    NOT_responsible_for:
      - "不负责 **`Phone` / `WalletMain`** 的 **`Navigation`/`Tabs`、`pushPath`、`NavPathContext.attach` / `stack()`** 等导航壳；PRD 若描述主导航宿主，归 **`Phone`** / **`WalletMain`**。"
      - "不负责卡列表、卡详情、账号会话等**领域语义 UI**；业务组件与数据绑定在 **`WalletMain`** 等 feature。"
      - "不实现 **`CommFunc`** 的 **`Logger` / `MaskUtil` / `NavPathContext`**；纯工具与非 UI 能力走 **`CommFunc`**。"
    typical_business_terms:
      - "公共 UI 组件"
      - "主题色"
      - "通用列表项"
      - "区段卡片"
      - "Toast"
    easily_confused_with:
      - module: "CommFunc"
        disambiguation: |
          **ArkUI 组件 / `CommColors` / `showToast` 界面反馈** → **CommUI**（本模块）。
          **`Logger`、`MaskUtil`、`NavPathContext`（无 `@Component`）** → **CommFunc**。
          依赖：**`CommUI` → `CommFunc`** ✅；反向 ❌。
      - module: "AccountManager"
        disambiguation: |
          **无账号语义的 UI 积木 / 主题 / Toast** → **CommUI**。
          **`AccountService`、`UserProfile`、`LoginState`、AppStorage 账号键** → **AccountManager**。禁止在本模块 **`@Component`** 内持有 **`AccountService`** 或写入账号存储。
      - module: "WalletMain"
        disambiguation: |
          **通用 ListItem、Section 容器、Toast、`CommColors`** → **CommUI**（本模块）。
          **卡包/添卡/首页/我的路径、`HomeTabPage`、`buildCardPackPage`、`NavPathContext.stack` 触发的业务导航语义** → **WalletMain**；可 import 本模块拼装，**钱包 feature 专页**归属 **`02-Feature/WalletMain`**。
      - module: "Phone"
        disambiguation: |
          **`ActionListItem` / `SectionCard` / `showToast` / `CommColors`** → **CommUI**（本模块）。
          **`PhoneAbility`、`loadContent`、根 `Navigation`/`Tabs`、`NavPathContext`、`navDestination`、HAP 装配** → **Phone**。
    key_exports:
      - "CommColors"
      - "showToast"
      - "ActionListItem"
      - "SectionCard"
    entry_file: "05-SystemBase/CommUI/src/main/ets/index.ets"

  - name: "AccountManager"
    layer: "04-BusinessBase"
    sub_layer: null
    format: "HAR"
    one_liner: "跨 Feature 的账号域能力（**HAR**，仅依赖 **`CommFunc`**）：基于 **`AppStorage`** 的登录布尔、展示账号串与 **`LoginState` 枚举流水线**（含 **`LOGGING_IN`** 过渡态；枚举另含 **`LOGIN_FAILED`** 占位，当前模拟路径未触发）；**`AccountService`** 单例为唯一入口；**`login()`** 经 **`setTimeout` 模拟异步**后写入脱敏展示串（**`MaskUtil.maskPhone`**）；登录实现为可替换**模拟成功**（注释指向华为账号 Kit）。"
    responsibilities:
      - "以 **`AccountService.getInstance()`** 懒初始化单例；首次实例化执行 **`initStorage()`**，对 **`AccountConstants`** 声明的 **`wallet_*`** 键在缺失时 **`setOrCreate`** 默认值（未登录 / 空串 / **`LoginState.NOT_LOGGED_IN`**）。"
      - "**`notify(state)`** 同步 **`STORAGE_LOGIN_STATE`** 并遍历内存 **`listeners`** 广播；**`onLoginStateChanged` / `offLoginStateChanged`** 以回调引用增删（调用方须 **`off` 同一函数引用**，典型见 **`WalletMain` · `MineTabPage`**）。"
      - "**`login()`**：先 **`notify(LOGGING_IN)`**，**`await` 固定间隔 `setTimeout`**（模拟网络），再以硬编码演示手机号调用 **`MaskUtil.maskPhone`**，写入 **`STORAGE_IS_LOGGED_IN` / `STORAGE_DISPLAY_ACCOUNT`**，最后 **`notify(LOGGED_IN)`** 并返回 **`UserProfile`**。"
      - "**`logout()`**：清零登录与展示串并 **`notify(NOT_LOGGED_IN)`**。"
      - "**`getUserProfile()`**：从 **`AppStorage`** 读取布尔与展示串组装 **`UserProfile`**（**`avatar`** 当前为 **`null`**）；**`UserProfile.accountText`** 未登录时返回展示文案「未登录」。"
    NOT_responsible_for:
      - "不负责 **`Phone` / `WalletMain`** 的页面编排、**`pushPath`**、**`NavPathContext.attach` / `stack()`** 等导航壳；本模块只提供 **`AccountService` + AppStorage 真理** 供 UI 调用。"
      - "不负责华为账号 Kit、OAuth 页面与合规弹窗；当前为 **setTimeout + 写死成功** 的演示实现，**禁止**在 PRD 中默认等同生产级 Huawei ID。"
      - "不负责通用 ArkUI 组件、主题、纯 Toast；归 **`CommUI`**。"
      - "不承担卡发行、支付清算等线下钱包业务；演示账号流 **≠** 生产中台。"
    typical_business_terms:
      - "账号管理"
      - "登录"
      - "登出"
      - "我的账号"
      - "未登录"
    easily_confused_with:
      - module: "CommFunc"
        disambiguation: |
          若只讨论 **`MaskUtil.maskPhone` 等纯工具**、与「是否已登录、`LoginState`、监听回调」无关 → **CommFunc**。
          若讨论 **AppStorage 账号键、`AccountService`、登录/登出生命周期与 `UserProfile`** → **AccountManager**（本模块）。本模块可依赖 **`CommFunc`**，禁止反向依赖。
      - module: "CommUI"
        disambiguation: |
          **列表项/主题色/Toast 等可复用 UI 积木** → **CommUI**。
          **登录态写入、展示账号串、`LoginState` 订阅** → **AccountManager**（本模块）。不要在 **`CommUI`** 通用组件内嵌 **`AccountService`** 单例逻辑。
      - module: "WalletMain"
        disambiguation: |
          **`AccountService` / `UserProfile` / AppStorage 账号键 / 登录监听** → **AccountManager**（权威域）。
          **「我的」页布局与编排、金融列表占位跳转等 feature UX** → **WalletMain**；页面调用本模块 API，**真理仍在** **`AccountManager`**。
      - module: "Phone"
        disambiguation: |
          **账号模型、存储键、`login`/`logout`、`LoginState`、监听** → **AccountManager**（本模块）。
          **`PhoneAbility`、`loadContent`、根 `Navigation`/`Tabs`、`NavPathContext`、`navDestination`** → **Phone**；入口 HAP **不**复制账号域实现。
    key_exports:
      - "AccountConstants"
      - "LoginState"
      - "UserProfile"
      - "AccountService"
    entry_file: "04-BusinessBase/AccountManager/src/main/ets/index.ets"

  - name: "WalletMain"
    layer: "02-Feature"
    sub_layer: null
    format: "HAR"
    one_liner: "钱包**主 feature**（HAR）：经 **`index.ets`** 导出 `HomeTabPage`（**`@Link navPathStack`**，源码注释禁止 **`@Prop`** 以免 `pushPath` 丢句柄）、`MineTabPage`（壳层可不传入栈）及卡包/添卡 **`@Builder`**；宿主（如 **`Phone`**）以 **`HomeTabPage({ navPathStack: $navPathStack })`** 与 `@Link` 绑定同源栈并 **`pushPath`**；二级 **`NavDestination`** 内亦可 **`NavPathContext.stack().pushPath`**（依赖宿主已 **`NavPathContext.attach`**）；presentation/data 编排卡引导、宫格、轮播与 **`HomeRepository` / `MineRepository` / `CardRepository`** 等读模型，并组合 **`AccountManager` / `CommUI` / `CommFunc`**。"
    responsibilities:
      - "对外导出 `HomeTabPage`、`MineTabPage`、`buildCardPackPage`、`buildAddCardEntryPage`，供 **`Phone`** 等宿主装配；`HomeTabPage` **必须**通过 **`@Link navPathStack`** 接收与宿主根 **`Navigation`** 同源的 `NavPathStack`（宿主侧典型写法 **`HomeTabPage({ navPathStack: $navPathStack })`**）；**禁止**用 **`@Prop`** 传递栈（注释说明用于规避真机句柄问题）。"
      - "在首页路径使用传入的 **`navPathStack.pushPath`** 触发 **`CardPackPage` / `AddCardEntryPage`**（路由名与宿主 **`navDestination`** 一致）；在 **`NavDestination`** 子页（如 **`CardPackPage`**）内可使用 **`NavPathContext.stack().pushPath`** 继续导航（如进入添卡），**前提**为宿主已在根页执行 **`NavPathContext.attach`**。"
      - "在 **`MineTabPage`** 集成 **`AccountService` / `UserProfile` / `LoginState`**（**`AccountManager`**）：`aboutToAppear` 注册 **`onLoginStateChanged`**，`aboutToDisappear` 调用 **`offLoginStateChanged`**；登录与档案真理仍在 **`AccountManager`**，本模块仅编排 UI 与监听。"
      - "维护 **`HomeRepository` / `MineRepository` / `CardRepository`** 及 **`ServiceEntry` / `PromoInfo` / `CardCategory` / `FinanceEntry`** 等模型，支撑首页/我的/卡包/添卡 UX（当前多为本地/Mock）。"
      - "在 feature 组件中组合 **`CommUI`**（如 **`ActionListItem` / `SectionCard` / `showToast`**）与 **`CardGuideSection` / `AccountCard`** 等带钱包语义的 presentation 组件；异常路径通过 **`showToast`** 提示（如首页数据不可用）。"
    NOT_responsible_for:
      - "不负责应用级入口、**`PhoneAbility`**、根 **`Navigation` / `Tabs` / `NavPathContext.attach`**；宿主壳归 **`Phone`**，本模块 Tab 与二级 builder **消费**已挂载的导航上下文。"
      - "不负责 **`AccountService`** 单例实现与 AppStorage 键语义权威定义；真理在 **`AccountManager`**。"
      - "不复制 **`CommUI`** 通用设计系统实现。"
      - "不承担生产级卡发行、清算、NFC/SE 等线下业务；当前偏演示，不可默认等同生产卡系统。"
    typical_business_terms:
      - "钱包主功能"
      - "卡包"
      - "添卡"
      - "首页"
      - "我的"
    easily_confused_with:
      - module: "AccountManager"
        disambiguation: |
          若讨论 **`AccountService` / 登录与登出 / `UserProfile` / `LoginState` / AppStorage 中账号态** 的**领域服务与数据模型** → **AccountManager**（权威域）。
          若讨论**「我的」页怎么摆、和首页如何跳转、卡包/添卡流程 UI** 等**feature 内页面与路由编排** → **WalletMain**（本模块），即使代码里在「我的」调用了 `AccountService`。
      - module: "CommUI"
        disambiguation: |
          可复用、无钱包业务名状的 **ListItem/卡片容器/主题色/Toast** → **CommUI**。
          **卡引导、卡分类列表、与「卡包」强绑定的 feature 专页/区块** → **WalletMain**；可 import `CommUI`，但**业务组件与数据绑定**的归属在仓库路径 `02-Feature/WalletMain`。
      - module: "CommFunc"
        disambiguation: |
          **纯工具与日志/脱敏**、与卡包/首页/我的的**产品语义**无关 → **CommFunc**。
          与**钱包 Tab、卡种入口、服务宫格/活动与导航 `pushPath` / `NavPathContext.stack` 的业务语义**强相关 → **WalletMain**；**`NavPathContext.attach` 与全局栈宿主挂载**仍属 **`Phone` + `CommFunc`**。
      - module: "Phone"
        disambiguation: |
          **卡种/服务宫格/卡包/添卡、`pushPath` 触发点、feature 内 Repository 与用例、`NavPathContext.stack()` 在子页内的继续导航** → **WalletMain**（本模块）。
          **Entry HAP、`PhoneAbility`、`loadContent`、根 `Navigation`+双 Tab 壳、`NavPathContext.attach`、`navDestination` 注册二级 `@Builder`** → **Phone**；`Phone` 的 `pages/index` 从本模块 import 子页并传入 **`$navPathStack`** 绑定，**本模块不实现** Ability 与 HAP 壳。
    key_exports:
      - "HomeTabPage"
      - "MineTabPage"
      - "buildCardPackPage"
      - "buildAddCardEntryPage"
    entry_file: "02-Feature/WalletMain/src/main/ets/index.ets"

  - name: "Phone"
    layer: "01-Product"
    sub_layer: null
    format: "HAP"
    one_liner: "应用**入口 HAP**：`PhoneAbility` 加载 `pages/index`；根 `Index` 装配 `Navigation`+双 `Tabs`，`aboutToAppear` 中 `NavPathContext.attach`；**首页 Tab** 以 **`HomeTabPage({ navPathStack: $navPathStack })`** 传入与宿主同源栈（与 `WalletMain` 内 `@Link navPathStack` 配套），**我的 Tab** 壳层直接装载 **`MineTabPage()`**；`navDestination` 注册卡包/添卡至 `WalletMain` 的 builder；含 **`PhoneBackupAbility`（backup）**；**不实现**业务数据与账号域，仅壳与多 HAR 聚合。"
    responsibilities:
      - "维护 `PhoneAbility`（`UIAbility`）：`onWindowStageCreate` 中 `loadContent('pages/index', …)`，生命周期节点使用 `hilog` 记录；`onCreate` 尝试设置应用级 `ColorMode`。"
      - "在 `pages/index.ets` 声明 `@Entry`：`Navigation(this.navPathStack)` + 底部 `Tabs`（首页/我的）；`aboutToAppear` 调用 `NavPathContext.attach(this.navPathStack)`（`@aspect/CommFunc`）；**首页** `TabContent` 内渲染 **`HomeTabPage({ navPathStack: $navPathStack })`**，向 feature 传入与宿主一致的栈绑定；**我的** `TabContent` 内渲染 **`MineTabPage()`**（当前壳层未向其传入 `navPathStack`）；`navDestination` 将 `CardPackPage` / `AddCardEntryPage` 映射到 `@aspect/WalletMain` 的 `buildCardPackPage` / `buildAddCardEntryPage`。"
      - "通过 HAP `oh-package.json5` 声明对 `WalletMain`、`AccountManager`、`CommUI`、`CommFunc` 的依赖，固定「入口壳 + feature + 基座」装配图。"
      - "声明 `PhoneBackupAbility`（`BackupExtensionAbility`，`type: backup`）及 `backup_config` 元数据挂载点；具体备份策略以配置与系统契约为准。"
    NOT_responsible_for:
      - "**不负责**首页服务宫格、活动轮播、卡包列表、我的页金融入口等**业务数据与用例**；此类归属 **`WalletMain` 的 Repository 与 feature 子页**。"
      - "**不负责** `AccountService` / 登录态 / `UserProfile` 的域模型与存储；`Index` 仅消费 `WalletMain` 中已接好的「我的」页，**不**在 HAP 内复制账号领域逻辑。"
      - "**不定义**可跨应用复用的通用 `ActionListItem` / 主题等；继续由 **`CommUI` / `CommFunc`** 提供，本壳只做页面级装配。"
