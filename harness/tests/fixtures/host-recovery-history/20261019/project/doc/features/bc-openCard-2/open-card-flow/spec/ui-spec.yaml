  - id: add_bank_card
    priority: P1
    root:
      id: col_root
      type: navigation_frame
      order: 0
      semantic_role: neutral
      color_ref: color_text_primary
      children:
        - id: col_row_cmb
          type: list_row
          order: 0
          semantic_role: neutral
          color_ref: color_text_primary
