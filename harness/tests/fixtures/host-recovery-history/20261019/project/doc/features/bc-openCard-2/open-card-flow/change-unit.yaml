preserved_invariants:
  - invariant_id: single-navigation-stack
    description: 继续复用 Phone 根 NavPathStack 和 NavPathContext，不引入平行路由真源。
    evidence_refs:
      - decision:navigation-stack
      - AC-7
  - invariant_id: sensitive-display-boundary
    description: 界面只显示掩码卡号与手机号，完整卡号不写日志，验证码不持久化。
    evidence_refs:
      - decision:full-card-number
      - AC-3
      - AC-4
target_predicates:
  - predicate_id: behavior-open-card
    role: behavior
    description: 双入口到结果完成的主路径和失败路径符合 AC-1 至 AC-8。
    provide_ids:
      - open-card-feature-delivered
    verification_refs:
      - AC-1
      - AC-8
  - predicate_id: owner-state
    role: owner
    description: 选卡页局部 OpenCardFlow 与 wallet_cards 各自保持单一状态所有者。
    provide_ids:
      - open-card-feature-delivered
    verification_refs:
      - BD-3
      - BD-4
  - predicate_id: consumer-home
    role: consumer
    description: 结果页与 HomeTab 分别消费保存结果和一次性完整卡号。
    provide_ids:
      - open-card-feature-delivered
    verification_refs:
      - AC-5
      - AC-6
  - predicate_id: contract-storage
    role: contract
    description: RDB 必填字段、唯一约束、手机号接缝和完整卡号映射全部实现。
    provide_ids:
      - open-card-feature-delivered
    verification_refs:
      - AC-3
      - AC-4
      - AC-5
  - predicate_id: recovery-safe
    role: recovery
    description: OTP 取消、RDB 失败、重复提交和进程重建保持安全中间态。
    provide_ids:
      - open-card-feature-delivered
    verification_refs:
      - BD-2
      - BD-3
      - BD-4
      - BD-5
