blind_review_pending:
  - id: blind-copy-cs
    screens:
      - card_selection
    aspect: 完整协议文案
    status: unverified
    reason: OCR 为“侨同意并阅读《云内付App一键绑卡用户授权协议)》、《招商银行信 / 用卡快捷支付服务协议》，授权云闪付获得您在本行银行卡号等信 /
      息。”；observation
      候选为“同意并阅读《云闪付App一键绑卡用户授权协议》、《招商银行信用卡快捷支付服务协议》，授权云闪付获得您在本行银行卡号等信息。”；冲突保留，不伪造已核文案。
    next_action: 可靠机器文本证据补齐后修订 spec 文案
  - id: blind-input-placeholder
    screens:
      - otp_sheet
    aspect: 输入提示首字
    status: unverified
    reason: OCR 首字“情” conf=0，observation 候选为“请”；可靠部分“输入短信验证码”已读取。
    next_action: 当前机器视觉文本复核
  - id: blind-layout
    screens:
      - card_type_sheet
      - card_selection
      - otp_sheet
      - result_success
    aspect: 非文本 bbox、字号、间距、精确颜色和圆角
    status: unverified
    reason: 文本框由 OCR 并集；结构和按钮变体来自 observation；当前无精确像素采样。中性 bank accent/success token
      必须清偿。
    next_action: 真机机器证据复核；major 记债务且阻止发布直至修复复验
  - id: blind-guide
    screens:
      - result_success
      - result_failure
    aspect: 结果引导插画
    status: unverified
    reason: 有语义观察，无可信原子素材；显式可见占位
    next_action: 下游物化/替换，source binding render 机器复核
