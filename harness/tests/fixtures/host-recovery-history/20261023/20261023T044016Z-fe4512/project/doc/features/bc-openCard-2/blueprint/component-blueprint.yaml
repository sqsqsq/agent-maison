data_domains:
  - data_domain_id: bank-card
    usage: 银行卡候选、开卡结果与已保存银行卡。
    retention: 未完成会话到关闭即释放；成功记录持续保存在应用沙箱，直到未来删除能力实现。
    isolation: 当前本地 mock 账号单租户；不把银行卡记录写入 AccountManager。
    cleanup: 取消清理内存选择和计时器；失败不落库；结果页完成释放 OpeningResult；成功 Context 在 HomeTabPage.consume 时清空，页面离开后释放 lastOpenedCardNumber。
    security: 完整卡号只在后台模型与本地 RDB 使用，UI 掩码，日志禁止记录。

