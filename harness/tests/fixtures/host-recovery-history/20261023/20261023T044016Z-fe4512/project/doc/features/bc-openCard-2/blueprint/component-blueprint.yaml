          evidence_strength: authoritative
          extraction_method: main_agent_design
        verification_refs: [AC-4]
      - mapping_id: persistence-to-opening-result
        kind: derivation
        source_fields: [fullCardNumber, success, errorMessage]
        target_field: OpeningResult
        rule: 将保存结果与完整卡号传给结果页；失败时保留卡号但不产生 StoredCard。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/1
        provenance:
          source_kind: requirement
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          observed_at: "2026-10-23T00:00:00-04:00"
          evidence_strength: authoritative
          extraction_method: main_agent_design
        verification_refs: [AC-4]
    errors:
      values: [DATABASE_INIT_FAILED, DATABASE_WRITE_FAILED]
      semantics: 任一数据库错误转换为失败 OpeningResult，不向 UI 暴露内部异常。
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/errors
      verification_refs: [BD-3]
    idempotency:
      key: fullCardNumber
      scope: wallet_bank_cards.rdb/cards
      duplicate_result: 返回既有记录并视为成功。
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/idempotency
      verification_refs: [AC-4]
    nfr:
      privacy: 完整卡号不得写日志或显示在 UI。
      consistency: 单次保存使用 RDB 事务或单条原子插入，失败不得半写。
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/nfr
      verification_refs: [AC-4, BD-3]
    table_schema:
      database: wallet_bank_cards.rdb
      version: 1
      security: 应用沙箱本地数据库，安全级别沿应用默认沙箱；本轮无额外加密要求，完整卡号不出应用。
      account_scope: 当前模拟应用只有一个本地账号数据域，不写 accountId 列；未来引入多账号前必须先升级 schema 并按账号分区。
      upgrade_strategy: 版本 1 首次创建 cards；未来版本使用 onUpgrade 显式迁移，禁止删除重建含卡数据的表。
      tables:
        - name: cards
          primary_key: card_number
          unique: [card_number]
          columns:
            - { name: card_number, type: TEXT, nullable: false }
            - { name: category, type: TEXT, nullable: false, default: BANK_CARD }
            - { name: bank_name, type: TEXT, nullable: false }
            - { name: bank_card_type, type: TEXT, nullable: false }
            - { name: added_at, type: INTEGER, nullable: false }
            - { name: huawei_pay_enabled, type: INTEGER, nullable: false, default: 0 }
            - { name: unionpay_quickpass_enabled, type: INTEGER, nullable: false, default: 0 }
            - { name: transaction_records, type: TEXT, nullable: false, default: "[]" }
    provenance:
      source_kind: requirement_and_design
      source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
      observed_at: "2026-10-23T00:00:00-04:00"
      evidence_strength: authoritative
      extraction_method: main_agent_design

providers:
  - provider_id: current-facts-discovery
    definition: 当前需求、代码、配置、测试和知识资产事实发现。
    consumer: component-design
    provider: static-current-facts-reader
    requirement: required
    authority_rule: Code, schema, interface, config, and tests are current-state authority.
    source_rule: Every assertion carries source_ref and source revision when available.
    missing_behavior: 缺失事实保持 unknown 并建立受控 gap。
    replacement_behavior: 同源重读并使相关派生结果过期。
    exit_behavior: 丢弃临时检索，保留 canonical provenance。
    conflict_behavior: 保留全部冲突来源并交权威 owner 裁决。
    writes: [canonical_blueprint_input]
    available: true
  - provider_id: se-manual-contracts
    definition: 授权 owner 提供的外部 operation、DTO、错误、幂等与 NFR。
    consumer: component-design
    provider: static-contract-reader
    requirement: optional
    authority_rule: Authorized SE or contract owner is external-contract authority.
    source_rule: Every contract segment carries source_ref, verification ref, and provenance.
    missing_behavior: 本轮无外部远端契约，使用需求内本地持久化契约。
    replacement_behavior: 新增真实外部契约时回设计 owner 调和。
    exit_behavior: 保留已登记来源，不保留临时副本。
    conflict_behavior: 权威来源冲突时 blocker，不采用最后写入。
    writes: [canonical_blueprint_input]
    available: true
  - provider_id: app-design-lens
    definition: 将事实投影到 App 4+1、根问题和运行数据流。
    consumer: component-design
    provider: static-hmos-app-lens
    requirement: required
    authority_rule: Lens is not fact authority and cannot override inputs.
    source_rule: Projection cites inputs, viewpoint contract, and lens rule version.
    missing_behavior: hmos-app lens 缺失时停止设计。
    replacement_behavior: profile lens 更新后重算相关 P1 派生。
    exit_behavior: 只保留 canonical 投影。
    conflict_behavior: 输入事实优先，lens 不覆盖冲突。
    writes: [canonical_blueprint_input]
    available: true
  - provider_id: independent-design-questioning
    definition: 隔离上下文核读人读稿、原需求、视图、关系、flow 与根问题。
    consumer: component-design admission
    provider: independent-questioning-agent
    requirement: required
    authority_rule: Questioning is not fact or decision authority.
    source_rule: Answers cite isolated blueprint, evidence package, and registered external inputs.
    missing_behavior: 未完成独立质询时蓝图不得 admitted。
    replacement_behavior: 设计修订后按原 scope 复核受影响内容。
    exit_behavior: 保留 questioning 记录但不成为新 SSOT。
    conflict_behavior: 质询意见回设计 owner 核权，不能自行改事实。
    writes: [canonical_blueprint_input]
    available: true
  - provider_id: conventions-knowledge
    definition: 项目横切工程惯例的可选知识输入。
    consumer: current-facts-discovery
    provider: static-conventions-reader
    requirement: optional
    authority_rule: Project conventions are stable knowledge input, not current-code authority.
    source_rule: Applicable facts cite the configured conventions file and exact heading id.
    missing_behavior: 默认路径无文件时记 not_applicable。
    replacement_behavior: 文件出现后按授权读取适用条目。
    exit_behavior: 不创建惯例副本。
    conflict_behavior: 当前代码事实优先并保留冲突。
    writes: [canonical_blueprint_input]
    available: false
    missing_disposition: not_applicable
  - provider_id: component-assets
    definition: 共享 UI 资产索引与选型输入。
    consumer: app-design-lens and questioning
    provider: static-component-index-reader
    requirement: optional
    authority_rule: Source is component fact authority; curation is human selection guidance.
    source_rule: Selection evidence cites the configured component index or catalog; component_ref identifies the asset.
    missing_behavior: 有 UI 且索引缺失时保持 unknown 或 degraded。
    replacement_behavior: 同源重扫并使相关 P1 结果过期。
    exit_behavior: 丢弃临时检索，保留 provenance。
    conflict_behavior: 源码优先且保留策展冲突。
    writes: [canonical_blueprint_input]
    available: true

