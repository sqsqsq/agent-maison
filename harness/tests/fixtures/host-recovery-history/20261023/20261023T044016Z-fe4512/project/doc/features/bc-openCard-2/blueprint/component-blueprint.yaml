review_summary:
  title: 银行卡开卡闭环
  authored_by: codex-main
  background: 现有添加银行卡与全部银行页面只能浏览银行列表，点击银行仍提示暂不支持，尚无卡型选择、具体卡片、短信验证、持久化和结果页闭环。
  problem: 用户无法从任一银行入口完成银行卡选择、短信验证、落库并安全返回钱包首页或添加卡片页。
  summary: 在既有银行入口上增加卡型半模态、具体卡片全屏页、验证码半模态、RDB 持久化与不可侧滑退出的结果页；成功完成后清理整个开卡栈并回到钱包首页，失败则回到最初添加卡片页。
  positioning: 这是 WalletMain 内的银行卡添卡业务闭环；Phone 只负责在既有根 Navigation 中注册新增目的页，不承载开卡业务状态。
  goals:
    - goal_id: goal-open-card-flow
      statement: 用户从添加银行卡或全部银行入口完成一张 mock 银行卡的选择、验证、保存和结果处理。
      success_measures:
        - 两个银行入口行为一致且不再显示暂不支持
        - 只有合法的卡型、卡片、协议与六位数字验证码状态才能继续
        - 完整卡号仅在后台模型、页面间内存交接与 RDB 中使用，界面只显示前四后四
        - 结果页禁止返回手势且只能通过完成按钮退出，退出后开卡过程页不可回退
  in_scope:
    - WalletMain 银行 mock 数据扩展、页面状态和业务服务
    - 卡型选择半模态、具体卡片页、短信验证半模态、结果页
    - 银行卡 RDB 数据库与表、保存成功或失败结果传递
    - Phone 根 Navigation 对新增页面的注册
    - 受影响业务 UT、原路由回归和真机视觉/交互验收
  non_goals:
    - 真实银行网络、真实短信服务、真实支付开通与交易明细
    - 银行卡详情页和 NFC 激活流程
    - 协议富文本点击与线上协议内容
    - 改造应用根壳、底部 Tab 或新增跨模块架构职责
  must_review:
    - 参考图只约束本轮四个界面的主要布局和交互层级；结果页 NFC 区块按原始需求明确不实现。
  reader_guide:
    source_digest: sha256:0e2d6b41f2b5746c3cb69b5b0f4355e8872df824955ea0c40a13806343cbef77
    sections:
      - section: background
        title: 现状、目标与边界
        prose: |
          现有添加银行卡页和全部银行页已经能展示同一批 mock 银行，但点击银行只提示“暂不支持”。本次把这两个入口接入一条完整的本地模拟开卡链路：选择卡型、选择具体卡片、短信验证、保存到 RDB、展示结果并安全退出。真实银行、真实短信、真实支付开通、银行卡详情页和 NFC 激活不在本次范围。
        source_refs: [/review_summary/background, /review_summary/goals, /review_summary/non_goals]
      - section: terms
        title: 关键术语和责任归属
        prose: |
          “银行卡开卡”指从点击银行开始，到银行卡记录成功或失败落定并退出结果页为止的完整业务流程。WalletMain 负责业务状态、页面、RDB 和用例；Phone 只在已有根 Navigation 中装配新增目的页；AccountManager 只提供账号 mock 信息。
        source_refs: [/discovery/facts/0, /decisions_and_gaps/decisions/0]
      - section: journey
        title: 选择卡类型
        prose: |
          用户从任一银行入口进入同一半模态。弹层显示银行信息、该银行支持的储蓄卡和信用卡，最多单选一种；只有完成选择并同意协议才可继续。
        source_refs: [/discovery/inputs/current_scope_items/1, /design_views/4/nodes/0/journey_steps/0]
      - section: journey
        title: 选择具体银行卡
        prose: |
          全屏页面以银行名为标题，按已选卡型展示一至两张 mock 卡。界面只显示卡号前四后四，完整卡号继续由后台业务对象持有。
        source_refs: [/discovery/inputs/current_scope_items/2, /design_views/4/nodes/0/journey_steps/1]
      - section: journey
        title: 输入短信验证码
        prose: |
          弹层出现即触发一次 mock 发送并开始 60 秒倒计时。倒计时内不能重发；归零后可再次发送。输入只接受六位数字，合法后才允许保存。
        source_refs: [/discovery/inputs/current_scope_items/3, /design_views/4/nodes/0/journey_steps/2]
      - section: journey
        title: 查看结果并完成
        prose: |
          保存返回后无论成功或失败都进入全屏结果页。结果页没有返回入口并拦截返回动作；用户点击完成后，成功清栈回钱包首页，失败清栈回最初的添加银行卡页。
        source_refs: [/discovery/inputs/current_scope_items/4, /design_views/4/nodes/0/journey_steps/3]
      - section: solution
        title: 整体方案与责任边界
        prose: |
          页面只维护未提交选择和倒计时；AccountService 提供账号 mock 手机号，BankCardOpeningService 负责掩码、输入规则与 StoredCard/OpeningResult 映射，OtpService 负责 mock 发送，BankCardRepository 是已保存银行卡的唯一真源。OpeningNavigationService 成功时写入一次性 BankOpeningCompletionContext 后 clear 回首页，HomeTabPage.aboutToAppear 消费并清空 Context；失败时 popToName 保留最初 AddBankCardPage。完整卡号只在受控内存对象和本地 RDB 中流转，不写入界面与日志。
        source_refs: [/design_views/1/nodes/0/contracts/state_management/0/ordered_steps, /decisions_and_gaps/decisions/1, /decisions_and_gaps/decisions/2]
      - section: flows
        title: 从提交验证码到结果页
        prose: |
          验证码合法后，弹层等待 BankCardRepository 完成幂等保存。成功返回已保存记录，失败返回受控错误；两种情况都生成包含完整卡号和结果的 OpeningResult，再进入结果页。只有保存确认后才发布成功，失败不会留下半写记录。
        source_refs: [/design_views/1/runtime_data_flows/0, /contracts/0]
      - section: data
        title: 数据、存储和隐私
        prose: |
          wallet_bank_cards.rdb 的 cards 表以完整卡号为主键和唯一键，保存总卡类别、银行、银行卡类型、添加时间、支付开通状态与交易记录 JSON。未完成会话只在内存中，关闭即清理；成功记录留在应用沙箱。本轮没有额外加密要求，但完整卡号不得显示或写日志。
        source_refs: [/contracts/0/table_schema, /data_domains/0, /quality_attributes/0]
      - section: decisions
        title: 关键取舍
        prose: |
          设计优先复用现有 Navigation、银行数据和模块边界，不引入新的跨模块状态或未完成会话持久化。四个界面具有银行卡业务状态，组件索引中没有语义等价共享组件，因此在 WalletMain 内实现专用 UI。
        source_refs: [/decisions_and_gaps/decisions]
      - section: recovery
        title: 失败、中断和恢复
        prose: |
          | 情况 | 用户看到什么 | 数据是否保存 | 如何继续 |
          |---|---|---|---|
          | 输入不完整（BD-1） | 按钮保持不可用 | 否 | 补齐选择、协议或六位验证码 |
          | 倒计时内重复发送（BD-2） | 继续显示剩余秒数 | 否 | 等待归零后重发 |
          | RDB 保存失败（BD-3） | 失败结果页 | 否 | 点击完成回添加银行卡页后重试 |
          | 结果页之前取消（BD-4） | 回到上一入口 | 否 | 重新开始，本次临时状态已释放 |
        source_refs: [/design_views/2/nodes/0/acceptance/boundaries, /design_views/1/runtime_data_flows/0/failure_recovery]
      - section: quality
        title: 质量、安全与兼容
        prose: |
          验收同时覆盖业务规则 UT、真实页面和导航设备证据。重点检查完整卡号最小暴露、触控和可读性、RDB 原子性，以及旧添加卡片、添加银行卡、全部银行和首页路由不受损。
        source_refs: [/quality_attributes, /design_views/2/nodes/0/acceptance]
      - section: delivery
        title: 施工落点与安全中间态
        prose: |
          一个 Change Unit 即可闭合本次演进：先扩展 AccountManager 的 UserProfile/AccountService mock 手机号，再在 WalletMain 建立模型、Repository、服务、页面与资源（包含 HomeTabPage 的一次性成功参数消费）；随后通过 WalletMain index.ets、route_map.json 和 Phone navDestinationMap 接线，最后补业务 UT 和设备验收。施工过程中保留现有路由名，新增入口未接线前旧页面仍可运行。
        source_refs: [/design_views/2/nodes, /design_views/3/rollout]
      - section: acceptance
        title: 验收方式
        prose: |
          AC-1 至 AC-4 覆盖两入口、卡片掩码、验证码和 RDB 保存；AC-5 覆盖结果页返回拦截与定向清栈；AC-6 覆盖旧路由回归。BD-1 至 BD-4 分别覆盖输入门禁、重发门禁、保存失败和中途取消。
        source_refs: [/design_views/2/nodes/0/acceptance]
      - section: questions
        title: 待核事项
        prose: |
          “银行卡开卡”术语在无人值守模式下按 WalletMain 归属继续，已标记为 headless_assumed 供最终质询复核。参考图中的 NFC 激活区块按原始需求明确不实现；其余没有阻断当前施工的未决项。
        source_refs: [/discovery/facts/0, /review_summary/must_review]
