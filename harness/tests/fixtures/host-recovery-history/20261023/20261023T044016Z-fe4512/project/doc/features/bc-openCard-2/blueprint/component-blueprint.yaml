app_lens:
  module_boundaries:
    disposition: answered_with_evidence
    answer: WalletMain 拥有开卡业务、页面、Repository 与用例；Phone 只注册目的页；AccountManager 只提供账号 mock 数据。
    evidence_refs: [doc/module-catalog.yaml, doc/architecture.md]
  capability_seams:
    disposition: answered_with_evidence
    answer: 页面经 BankCardOpeningService、OtpService、BankCardRepository 和 OpeningNavigationService 分离校验、计时、持久化与清栈；跨模块只经各模块 index.ets。
    evidence_refs: [doc/architecture.md, 02-Feature/WalletMain/src/main/ets/index.ets, 04-BusinessBase/AccountManager/src/main/ets/index.ets]
  feature_flags:
    disposition: not_applicable
    answer: 本地模拟应用无灰度开关；通过保持原路由名和新增目的页接线确保兼容。
    evidence_refs: [02-Feature/WalletMain/src/main/resources/base/profile/route_map.json]
  data_producers_consumers:
    disposition: answered_with_evidence
    answer: BankRepository 生产银行和候选卡 mock，AccountService 生产包含手机号的账号 mock，BankCardRepository 保存银行卡，结果页消费 OpeningResult；成功完成时 BankOpeningCompletionContext 暂存完整卡号，HomeTabPage.aboutToAppear 消费并立即清空 Context，页面状态只作为后续卡详情入口参数且不展示或记录日志。
    evidence_refs: [02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets, 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets]
  lifecycle_triggers:
    disposition: answered_with_evidence
    answer: 银行点击启动会话；卡型半模态关闭时丢弃卡型选择，验证码半模态关闭或 aboutToDisappear 时取消 Timer 并清空验证码/sending/saving 状态但保留选卡页选择；结果页完成触发定向清栈。
    evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
  state_owners:
    disposition: answered_with_evidence
    answer: 卡型页和选卡页拥有未提交选择，OtpVerificationSheet 拥有倒计时和 saving 状态，BankCardRepository 只拥有持久化保存状态与记录，NavPathStack 是页面栈权威，BankOpeningCompletionContext 只保存成功后的单次完整卡号交接。
    evidence_refs: [view:runtime/flow:persisted-bank-card-flow, 01-Product/Phone/src/main/ets/pages/index.ets]
  initialization:
    disposition: answered_with_evidence
    answer: 候选数据按页面进入从本地 Repository 读取；账号 mock 在 AccountService 初始化；RDB 首次访问创建版本 1 表，未来 onUpgrade 显式迁移而不删除现有卡数据。
    evidence_refs: [contract:bank-card-persistence]
  publication_subscription:
    disposition: answered_with_evidence
    answer: 保存完成同步返回 OpeningResult 给结果页；成功完成时将 fullCardNumber publish 到进程内 BankOpeningCompletionContext 后 clear 栈，HomeTabPage.aboutToAppear 单次 consume 并清空 Context；失败 popToName 返回 AddBankCardPage。
    evidence_refs: [view:runtime/flow:persisted-bank-card-flow]
  ui_refresh:
    disposition: answered_with_evidence
    answer: 选择、协议、验证码、倒计时和保存中状态由对应页面局部响应式状态刷新；保存结束推入结果页，成功完成后 HomeTabPage 只消费一次性完整卡号参数，不读取 RDB、不展示或记录卡号。
    evidence_refs: [view:runtime/node:bank-card-opening-flow]
  process_recovery:
    disposition: answered_with_evidence
    answer: 未完成开卡只在内存中，进程重建后重新开始；已提交银行卡以 RDB 为准，若提交后结果页尚未 push 就终止，用户下次重复添加时按完整卡号回查既有记录并得到成功结果。
    evidence_refs: [contract:bank-card-persistence, decision:single-opening-session]
  runtime_flow_trigger_assessment:
    persistent_or_remote_ui: { applies: true, evidence_refs: [contract:bank-card-persistence] }
    multiple_consumers: { applies: true, evidence_refs: [view:runtime/flow:persisted-bank-card-flow] }
    background_system_external_scheduled_write: { applies: false, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
    cold_start_resume_mount_account_switch: { applies: true, evidence_refs: [view:runtime/flow:persisted-bank-card-flow] }
    user_mutation_refreshes_other_consumers: { applies: true, evidence_refs: [view:runtime/flow:persisted-bank-card-flow] }
    cache_sync_freshness_consistency_process_recreation: { applies: true, evidence_refs: [contract:bank-card-persistence] }

