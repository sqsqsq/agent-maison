decisions_and_gaps:
  decisions:
    - decision_id: walletmain-owns-opening
      label: WalletMain 统一承载开卡业务
      status: decided_with_authority
      owner: WalletMain
      conclusion: 开卡模型、RDB、服务和页面均归 WalletMain；Phone 只做既有 Navigation 装配。
      rationale: module-catalog 已将卡包、添卡、feature 内 Repository 与用例归 WalletMain，将根 Navigation 与 HAP 装配归 Phone。
      knowledge_refs: [doc/module-catalog.yaml#WalletMain, doc/module-catalog.yaml#Phone]
      provenance:
        source_kind: catalog
        source_ref: doc/module-catalog.yaml
        observed_at: "2026-10-23T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: catalog_mapping
      verification_refs: [doc/module-catalog.yaml, doc/architecture.md]
    - decision_id: single-opening-session
      label: 单一内存开卡会话
      status: answered_with_evidence
      owner: WalletMain
      conclusion: 卡型、候选卡、验证码与 OpeningResult 通过页面参数和局部状态传递，保存成功前不持久化中间选择。
      rationale: 本轮无跨进程或恢复未完成开卡的要求，减少敏感数据留存和并行真源。
      alternatives:
        - option: 持久化未完成开卡会话
          rejected_reason: 原始需求没有跨会话恢复要求。
          defect: 增加敏感数据生命周期和清理责任。
      provenance:
        source_kind: requirement
        source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
        observed_at: "2026-10-23T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: main_agent_design
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    - decision_id: card-number-privacy
      label: 完整卡号最小暴露
      status: answered_with_evidence
      owner: WalletMain
      conclusion: UI 始终掩码显示，完整卡号仅存在于候选模型、保存调用、OpeningResult 和 RDB 字段，不写日志或资源文案。
      rationale: 原始需求明确要求界面只显示前四后四而后台按完整卡号处理。
      provenance:
        source_kind: requirement
        source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
        observed_at: "2026-10-23T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: main_agent_design
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    - decision_id: result-stack-policy
      label: 结果页独占完成出口并定向清栈
      status: decided_with_authority
      owner: WalletMain
      conclusion: 结果页拦截返回，完成时按本轮入口栈标识删除 AddBankCardPage 之后的全部开卡页面；成功再回钱包首页，失败停在 AddBankCardPage。
      rationale: 原始需求明确要求结果页只能通过完成退出并清理本轮 1-6 页面，同时规定成功和失败去向。
      provenance:
        source_kind: requirement
        source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
        observed_at: "2026-10-23T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: main_agent_design
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    - decision_id: custom-opening-ui
      label: 在 WalletMain 内实现业务专用界面
      kind: component_asset_selection
      target_ref: view:development/node:bank-card-opening-ui
      asset_resolution: custom
      status: answered_with_evidence
      owner: WalletMain presentation
      conclusion: 现有组件索引只有通用 SectionCard/ActionListItem 和既有页面 builder，没有与四个银行卡开卡界面语义一致的共享组件；本轮复用资源与通用能力但实现业务专用 UI。
      rationale: 卡型、卡片、验证码和结果页均携带银行卡流程状态，不能由无业务状态的通用列表项直接配置得到。
      provenance:
        source_kind: component_index
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-23T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: component_inventory_and_live_search
      verification_refs: [doc/component-index.yaml, 02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets]
  gaps: []

