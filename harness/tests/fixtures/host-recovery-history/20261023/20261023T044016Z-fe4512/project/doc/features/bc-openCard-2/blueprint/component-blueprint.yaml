    applicability: applicable
    evolution_impact: changed
    stakeholders: [钱包用户, 产品验收, 测试人员]
    purpose: 从两个入口描述成功、失败、取消和重发场景及参考图对应界面。
    current_state: 用户在银行列表点击后只看到暂不支持。
    target_state: 用户能完成卡型选择、具体卡片选择、验证码、结果处理，并得到一致的取消与失败恢复。
    delta: 新增端到端开卡旅程与四张参考图对应的界面状态。
    decisions_and_gaps: [decision:result-stack-policy, decision:custom-opening-ui]
    verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    nodes:
      - node_id: open-card-user-journey
        owner: WalletMain
        current_state: 点击银行后终止。
        target_state: 完成从银行入口到结果页完成的端到端旅程。
        logical_refs: [view:logical/node:bank-card-opening-domain, contract:bank-card-persistence]
        runtime_refs: [view:runtime/node:bank-card-opening-flow, view:runtime/flow:persisted-bank-card-flow]
        development_owner_ref: view:development/node:bank-card-opening-ui
        deployment_refs: [view:deployment/node:local-wallet-runtime]
        journey_steps:
          - step_id: J1
            stage: 选择卡型
            user_action: 在添加银行卡页或全部银行页点击银行，选择储蓄卡或信用卡并同意继续。
            system_behavior: 半模态展示该银行信息和支持卡型，最多单选一种。
            preconditions: [银行列表已加载]
          - step_id: J2
            stage: 选择具体卡片
            user_action: 在银行页选择一张掩码卡并同意协议后点击下一步。
            system_behavior: 页面仅显示卡号前四后四，后台保留完整卡号。
            preconditions: [已选择银行和卡型]
          - step_id: J3
            stage: 短信验证
            user_action: 输入六位数字验证码并点击下一步。
            system_behavior: 弹层出现即 mock 发送，显示 60 秒倒计时；合法输入后保存银行卡。
            preconditions: [已选择具体卡片]
          - step_id: J4
            stage: 查看结果并完成
            user_action: 在成功或失败结果页点击完成。
            system_behavior: 成功清栈回钱包首页，失败清栈回最初添加卡片页；结果页禁止返回。
            preconditions: [保存调用已返回结果]
        path_variants:
          - user_type: 从添加银行卡页进入
            difference: 完成失败后回到当前 AddBankCardPage。
          - user_type: 从全部银行页进入
            difference: 完成失败后清除 AllBanksPage 和后续页面，回到最初 AddBankCardPage。
        provenance:
