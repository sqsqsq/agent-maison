    applicability: applicable
    evolution_impact: changed
    stakeholders: [应用打包与运行环境, WalletMain 数据层]
    purpose: 说明本地 HAR、入口 HAP、RDB 文件与账号 mock 的运行落点和失败影响。
    current_state: Phone HAP 装配 WalletMain HAR；WalletMain 无银行卡数据库。
    target_state: 同一应用进程内由 Phone HAP 装配新增页面，WalletMain 在应用沙箱创建 wallet_bank_cards.rdb；不引入远端服务。
    delta: 新增本地持久化与页面注册，不新增模块或跨进程边界。
    decisions_and_gaps: [decision:walletmain-owns-opening]
    verification_refs: [doc/architecture.md, 02-Feature/WalletMain/oh-package.json5]
    rollout:
      - order: 1
        unit: WalletMain HAR
        depends_on: [AccountManager, CommUI, CommFunc]
        note: 先提供模型、RDB、服务、页面和 builder 导出。
      - order: 2
        unit: Phone HAP
        depends_on: [WalletMain]
        note: 再注册新增目的页并完成真机验收。
    coordination: []
    nodes:
      - node_id: local-wallet-runtime
        owner: Phone and WalletMain
        current_state: Phone HAP 与 WalletMain HAR 同进程运行，无银行卡 RDB。
        target_state: 页面仍在同进程，银行卡记录保存于应用沙箱 wallet_bank_cards.rdb。
        responsibilities: [装配 WalletMain 页面, 创建并访问本地银行卡数据库]
        inputs: [用户页面操作, BankRepository mock 数据, AccountService mock 账号]
        outputs: [OpeningResult, StoredCard RDB 记录]
        not_responsible_for: [真实银行网络, 真实短信网关, 真实支付开通]
        failure_impact: RDB 故障只导致本次失败结果，不影响既有银行列表和其它卡种页面。
