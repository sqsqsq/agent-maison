            evidence_strength: inferred
            extraction_method: explicit_failure_mapping
    mappings:
      - mapping_id: request-to-stored-card
        kind: derivation
        source_fields: [cardNumber, bankName, bankCardType]
        target_field: StoredCard
        rule: 复制完整卡号、银行名和卡型，补充 BANK_CARD、当前时间、默认 false 状态与空交易记录。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/0
