design_views:
  - view_id: logical
    viewpoint_contract: app-logical@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [钱包用户, WalletMain 开发与测试]
    purpose: 定义银行卡开卡能力、模型、规则、持久化契约和失败语义。
    current_state: 银行数据只用于列表展示，点击后不进入开卡；CardRepository 是首页静态 mock，工程没有银行卡持久化模型。
    target_state: 形成银行、卡型、可选银行卡、验证码会话、开卡结果与持久化银行卡记录的一致模型，完整卡号只在受控后台链路使用。
    delta: 新增开卡领域模型、选择校验、验证码倒计时与 RDB 保存契约。
    decisions_and_gaps: [decision:single-opening-session, decision:card-number-privacy]
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
    nodes:
      - node_id: bank-card-opening-domain
        owner: WalletMain
        current_state: BankInfo 只有列表展示字段；点击银行显示暂不支持。
        target_state: BankInfo 提供支持卡型与 mock 卡片，BankCardOpeningService 校验选择和验证码并生成持久化记录。
        provenance:
          source_kind: requirement_and_code
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          observed_at: "2026-10-23T00:00:00-04:00"
          evidence_strength: authoritative
          extraction_method: main_agent_design
        verification_refs:
          - 02-Feature/WalletMain/src/main/ets/data/model/BankInfo.ets
          - 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets

  - view_id: runtime
    viewpoint_contract: app-runtime@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [钱包用户, WalletMain 页面与数据层]
    purpose: 描述从银行点击到结果页完成的导航、状态、写库、失败恢复和首页刷新闭环。
    current_state: 两个银行入口只显示暂不支持，没有后续页面、会话状态或持久化。
    target_state: 两入口进入同一开卡会话；卡型和卡片选择后验证六位验证码，保存结果带完整卡号进入结果页并按结果清栈返回。
    delta: 建立四段用户流程和以 BankCardRepository 为权威的持久化数据流。
    decisions_and_gaps: [decision:single-opening-session, decision:result-stack-policy]
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets
      - 02-Feature/WalletMain/src/main/ets/presentation/pages/AllBanksPage.ets
    nodes:
      - node_id: bank-card-opening-flow
        owner: WalletMain
        current_state: 银行点击终止在 Toast。
        target_state: 银行点击、卡型选择、卡片选择、验证码、RDB 保存、结果页与完成清栈按顺序闭合。
        design_basis_refs: [view:logical/node:bank-card-opening-domain]
        provenance:
          source_kind: requirement_and_code
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          observed_at: "2026-10-23T00:00:00-04:00"
          evidence_strength: authoritative
          extraction_method: main_agent_design
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        contracts:
          state_management:
            - state_id: opening-session
              ordered_steps:
                - AddBankCardPage 或 AllBanksPage 调用 CardTypeSheet.open(bank)，传入所选 BankInfo；关闭时丢弃未提交选择。
                - CardTypeSheet 只允许选中一个受支持卡型；同意并继续后调用 NavPathContext.stack().pushPath 进入 BankCardSelectionPage，参数包含 bankCode 与 cardType。
                - BankCardSelectionPage 调用 BankRepository.getCards(bankCode, cardType) 返回 1 至 2 张完整 mock 卡；页面只渲染 maskCardNumber(fullNumber)。
                - 用户选卡并同意协议后，BankCardSelectionPage 打开 OtpVerificationSheet，内存参数包含所选完整 BankCardCandidate。
                - OtpVerificationSheet 出现时调用 AccountService.getUserProfile() 取得 UserProfile.mobile，渲染掩码手机号；随后调用 OtpService.sendMockCode(mobile) 并启动 60 秒倒计时，仅接受六位数字，倒计时结束前禁止重发。
                - OtpVerificationSheet 关闭或 aboutToDisappear 时取消 Timer 并清空 otp/sending/saving；关闭验证码弹层只丢弃验证码状态，保留具体卡片页上的当前卡片选择供用户继续。
                - 用户提交验证码后，OtpVerificationSheet 调用 BankCardOpeningService.toStoredCard(candidate) 生成 StoredCard，再调用 BankCardRepository.save(card) 并等待 RDB 返回；服务将成功或异常统一映射为 OpeningResult(fullCardNumber, success, errorMessage)。
                - 页面将 OpeningResult 通过 NavPathStack 参数推入 BankCardOpeningResultPage；结果页禁用返回手势和系统返回。
                - 用户点击完成后，结果页调用 OpeningNavigationService.finish(stack, result)：成功先把 fullCardNumber 写入进程内 BankOpeningCompletionContext，再调用 stack.clear(false) 回根首页；失败调用 stack.popToName('AddBankCardPage', false)，保留最初 AddBankCardPage 并删除 AllBanksPage、选卡页和结果页。
    runtime_data_flows:
      - flow_id: persisted-bank-card-flow
        data_domain_refs: [data-domain:bank-card]
        external_contract_refs: [contract:bank-card-persistence]
        source_of_truth:
          authority: view:development/node:bank-card-repository
          persistence: wallet_bank_cards.rdb/cards
          projections_and_caches: [view:runtime/node:bank-card-opening-flow]
          reconciliation: 每次保存以完整卡号为唯一业务键执行单事务查询后插入；若并发唯一冲突则回查既有记录并视为成功。
        triggers:
          - kind: user_otp_submit
            timing: 用户输入六位数字并点击下一步
            idempotency: 同一完整卡号只保留一条记录；重复提交返回同一保存结果。
        initial_load:
          initial_load_id: opening-card-candidates
          strategy: 页面按 bankCode 与 cardType 从 BankRepository 读取本地 mock 候选；结果页通过 NavPath 参数接收 OpeningResult。
          owner: WalletMain
          data_scope: 当前银行、卡型和已保存银行卡
          freshness: mock 候选为进程内常量；OpeningResult 只对应刚完成的本次保存调用。
        state_owner:
          ref: view:development/node:bank-card-repository
          states: [saving, saved, save_failed]
        mutations: &flowMutations
          - mutation_id: save-bank-card
            kind: foreground
            persistence_ref: wallet_bank_cards.rdb/cards
            publication_ref: publication:bank-card-saved
            recovery_ref: recovery:save-result
        publications: &flowPublications
          - publication_id: bank-card-saved
            payload: OpeningResult 中的完整卡号、成功标记和错误说明；仅在内存调用链传递，不写日志或界面明文。
          - publication_id: opening-completed
            payload: 成功完成时发布到 BankOpeningCompletionContext 的单次完整卡号；HomeTabPage 消费即清除上下文。
        subscriptions: &flowSubscriptions
          - subscription_id: home-completion-on-appear
            consumer_ref: consumer:wallet-home
            publication_ref: publication:opening-completed
            attach: HomeTabPage.aboutToAppear 调用 BankOpeningCompletionContext.consume()。
            detach: 无常驻监听。
            cleanup: consume() 返回后立即清空 Context 内静态值；页面仅在当前生命周期的 lastOpenedCardNumber 状态中保留，离开页面释放。
            replay_or_snapshot: Context 只保留最近一次尚未消费的成功卡号。
            ordering: 结果页先 publish(fullCardNumber)，再 stack.clear(false) 使 HomeTabPage 出现并消费。
        consumers: &flowConsumers
          - consumer_id: opening-result-page
            initial_load_ref: initial-load:opening-card-candidates
            update_ref: publication:bank-card-saved
          - consumer_id: wallet-home
            initial_load_ref: initial-load:opening-card-candidates
            update_ref: publication:opening-completed
        failure_recovery:
          recovery_id: save-result
          handling: 写库失败仍生成失败 OpeningResult 并进入结果页；数据库不留下半写记录。若写入已提交但进程在结果页 push 前终止，下次重复添加通过完整卡号幂等回查既有记录。
          retry: 本轮结果页不重试，用户点击完成回添加卡片页后可重新开始；进程终止后不恢复未完成页面会话。
        decisions_and_gaps: [decision:card-number-privacy, decision:result-stack-policy]
        evidence_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        logical_contract_refs: [contract:bank-card-persistence]
        development_owner_ref: view:development/node:bank-card-repository
        lifecycle_coverage:
          cold_start: { status: covered, evidence_refs: [view:development/node:bank-card-repository] }
          warm_resume: { status: covered, evidence_refs: [view:runtime/node:bank-card-opening-flow] }
          page_attach: { status: covered, evidence_refs: [view:runtime/node:bank-card-opening-flow] }
          page_detach: { status: covered, evidence_refs: [view:runtime/node:bank-card-opening-flow] }
          account_switch: { status: not_applicable, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
          process_recreation: { status: covered, evidence_refs: [view:development/node:bank-card-repository] }
          background_write: { status: not_applicable, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
        contracts:
          state_management:
            - state_id: persisted-bank-card-flow-mapping
              owner_ref: view:development/node:bank-card-repository
              contract_refs: [contract:bank-card-persistence]
              ordered_steps:
                - 验证码提交后把 BankCardCandidate 转为 StoredCard，并调用 BankCardRepository.save。
                - Repository 在单事务内按完整卡号查询后插入，并发唯一冲突回查既有记录。
                - 保存结果映射为 OpeningResult；结果页消费后，成功参数经 CompletionContext 单次交给 HomeTabPage，失败定向返回 AddBankCardPage。
              lifecycle_triggers: [user_otp_submit, result_page_finish, home_tab_appear]
              mutations: *flowMutations
              publications: *flowPublications
              subscriptions: *flowSubscriptions
              consumers: *flowConsumers
        provenance:
          source_kind: requirement_and_design
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          observed_at: "2026-10-23T00:00:00-04:00"
          evidence_strength: authoritative
          extraction_method: main_agent_design

  - view_id: development
    viewpoint_contract: app-development@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [WalletMain 开发者, Phone 壳集成者, 测试人员]
    purpose: 明确模块、文件、页面、服务、数据模型、资源和测试的施工责任。
    current_state: WalletMain 有银行列表页面和 mock 银行数据，Phone 注册四个既有目的页；没有开卡页面、RDB 或对应服务。
    target_state: WalletMain 提供完整开卡实现与跨模块导出，Phone 仅接线新增目的页；测试覆盖规则、持久化和原路由回归。
    delta: 新增 WalletMain 模型、Repository、Service、页面和资源，修改两个入口、模块导出、路由映射与 Phone 目的页映射。
    decisions_and_gaps: [decision:walletmain-owns-opening, decision:custom-opening-ui]
    verification_refs:
      - doc/module-catalog.yaml#WalletMain
      - doc/architecture.md
    nodes:
      - node_id: bank-card-opening-ui
        owner: WalletMain presentation
        module: WalletMain
        kind: page
        current_state: 只有 AddBankCardPage 与 AllBanksPage，银行点击提示暂不支持。
        target_state: 新增卡型半模态、具体卡片页、验证码半模态和结果页，并把两个入口接到同一流程。
        design_basis_refs: [view:logical/node:bank-card-opening-domain, view:runtime/node:bank-card-opening-flow]
        provenance:
          source_kind: requirement_and_component_index
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          observed_at: "2026-10-23T00:00:00-04:00"
          evidence_strength: authoritative
          extraction_method: main_agent_design
        verification_refs:
          - doc/component-index.yaml#WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
          - doc/features/原始需求/1-2-银行卡/3-点击任意银行拉起添卡选卡半模态.jpg
          - doc/features/原始需求/1-2-银行卡/4-点击信用卡或储蓄卡后拉起选卡页面.jpg
          - doc/features/原始需求/1-2-银行卡/5-选中某张卡片后拉起短信验证.jpg
          - doc/features/原始需求/1-2-银行卡/6-短信验证完成后结果页.jpg
        acceptance:
          criteria:
            - id: AC-1
              priority: P0
              description: 添加银行卡页和全部银行页点击任一银行均打开该银行的卡型选择半模态。
              testable: true
              verification_steps: [分别从两个入口点击同一银行, 核对银行名与 logo, 核对支持卡型与后续流程一致]
              expected_result: 不再提示暂不支持；半模态展示该银行支持卡型且只能单选。
              ut_layer: both
              ut_focus: 两个入口调用同一 opening session 参数构造与卡型单选规则。
              device_focus: 两入口真机点击与半模态视觉、关闭和继续行为。
            - id: AC-2
              priority: P0
              description: 具体卡片页按银行和卡型展示一至两张 mock 卡，界面只显示前四后四，后台保留完整卡号。
              testable: true
              verification_steps: [选择不同银行与卡型, 检查卡片数量和掩码, 检查传入验证码页的模型保留完整卡号]
              expected_result: 展示格式为前四加掩码加后四；业务对象仍持有完整卡号。
              ut_layer: both
              ut_focus: 候选筛选和 maskCardNumber 边界。
              device_focus: 页面布局、单选和协议门禁。
            - id: AC-3
              priority: P0
              description: 验证码半模态出现即触发一次 mock 发送，60 秒内不可重发，仅六位数字使下一步可用。
              testable: true
              verification_steps: [打开验证码弹层, 输入非法和合法字符, 推进倒计时至零并重发]
              expected_result: 手机号掩码来自账号 mock；倒计时、重发和按钮状态符合要求。
              ut_layer: both
              ut_focus: 六位数字校验、倒计时状态机和重发门禁。
              device_focus: 数字键盘、弹层视觉和按钮启停。
            - id: AC-4
              priority: P0
              description: 提交验证码后完整卡数据写入 RDB；无论成功或失败都携带完整卡号和结果进入结果页。
              testable: true
              verification_steps: [分别让 Repository 保存成功和失败, 读取数据库记录, 检查 OpeningResult 的完整卡号和结果]
              expected_result: 成功时数据库字段完整且卡号唯一；失败时无半写记录但结果页收到完整卡号与失败状态。
              ut_layer: both
              ut_focus: RDB 映射、幂等和失败结果。
              device_focus: 成功/失败结果页呈现与跨页参数。
            - id: AC-5
              priority: P0
              description: 结果页无返回入口并拦截侧滑/系统返回，只能点击完成；完成后开卡过程页从栈中移除。
              testable: true
              verification_steps: [在结果页尝试系统返回与侧滑, 点击完成, 连续返回检查历史页已清除]
              expected_result: 返回动作不离开结果页；成功携带完整卡号回钱包首页，失败回最初添加卡片页，均不能再看到本轮过程页。
              ut_layer: device
              ut_focus: 导航清栈计算可用纯函数覆盖。
              device_focus: 返回手势拦截、完成按钮和真实 NavPathStack。
            - id: AC-6
              priority: P1
              description: 原有添加卡片、添加银行卡、全部银行、钱包首页导航链保持可用。
              testable: true
              verification_steps: [运行既有路由用例, 在真机往返添加卡片与全部银行页面]
              expected_result: 既有路由名称和页面返回语义不受新增流程破坏。
              ut_layer: both
              ut_focus: 路由注册和旧入口回归。
              device_focus: 旧页面互相跳转与返回。
          boundaries:
            - id: BD-1
              priority: P0
              description: 未选择卡型、卡片、未同意协议或验证码不是六位数字时不得继续。
              scenario: 用户输入或选择不完整。
              handling: 保持当前页面和输入，继续按钮置灰，不创建数据库记录。
              expected_behavior: 用户补齐合法输入后才可继续。
              ut_layer: both
              ut_focus: 卡型、卡片、协议与六位数字验证码的组合门禁。
              device_focus: 四个界面的按钮启停和中途取消行为。
            - id: BD-2
              priority: P0
              description: 倒计时期间重复点击发送不触发新发送；归零后仅一次点击重启 60 秒。
              scenario: 用户快速重复点击发送验证码。
              handling: 倒计时状态为唯一门禁，忽略不可用期间点击。
              expected_behavior: 同一倒计时窗口只发生一次 mock 发送。
              ut_layer: both
              ut_focus: 60 秒倒计时状态机、重复点击忽略与归零重启。
              device_focus: 倒计时文案和重发按钮实际交互。
            - id: BD-3
              priority: P0
              description: RDB 保存异常仍进入失败结果页且不泄漏完整卡号到日志或界面。
              scenario: 数据库创建、查询或插入失败。
              handling: 回滚/不提交当前写入，生成失败 OpeningResult，日志只记错误类别。
              expected_behavior: 失败结果页可完成退出，数据库无损坏或半写记录。
              ut_layer: both
              ut_focus: RDB 初始化/写入异常映射、事务原子性与敏感数据日志检查。
              device_focus: 失败结果页和完成后返回添加银行卡页。
            - id: BD-4
              priority: P1
              description: 半模态关闭或页面返回在结果页之前只丢弃当前未提交选择，不写数据库。
              scenario: 用户中途取消卡型或验证码流程。
              handling: 释放当前 opening session 的临时选择与计时器。
              expected_behavior: 返回原入口，重新进入时从初始状态开始。
              ut_layer: both
              ut_focus: Sheet 关闭与页面离开时的状态和 Timer 清理。
              device_focus: 中途关闭后重新进入的初始状态。
          performance:
