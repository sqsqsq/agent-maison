provides:
  - provide_id: bank-card-opening-complete
    description: 用户可从添加银行卡页或全部银行页完成一张 mock 银行卡的选择、验证、持久化与结果处理。
  - provide_id: bank-card-rdb
    description: WalletMain 提供以完整卡号为唯一键的银行卡 RDB 保存和查询能力，失败不留下半写记录。
  - provide_id: opening-navigation-cleanup
    description: 结果页拦截返回并在完成时成功回钱包首页、失败回最初添加银行卡页，清除本轮过程页。
