      - AC-2
      - AC-3
      - BD-1
      - BD-2
      - BD-4
  - predicate_id: state-owners
    role: owner
    description: 页面、验证码弹层、BankCardRepository、NavPathStack 与一次性完成上下文各自拥有唯一且可清理的状态。
    provide_ids:
      - bank-card-opening-complete
      - bank-card-rdb
      - opening-navigation-cleanup
    verification_refs:
      - AC-3
      - AC-4
      - AC-5
