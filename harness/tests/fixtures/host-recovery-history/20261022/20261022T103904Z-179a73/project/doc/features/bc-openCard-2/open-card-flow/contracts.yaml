        内创建业务组件并复用既有资源风格。
    module: WalletMain
    state:
      - "code: string"
      - "remainingSeconds: number"
      - "submitting: boolean"
  - name: BankCardSelectionPage
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardSelectionPage.ets
    kind: page
    asset_selection:
      resolution: custom
      rationale: 现有组件索引只有通用卡片和既有页面 builder，没有与银行卡类型、验证码或结果页语义相同的可配置组件；在 WalletMain
        内创建业务组件并复用既有资源风格。
    module: WalletMain
    state:
      - "cards: MockBankCard[]"
      - "selectedCard: MockBankCard | null"
      - "agreementAccepted: boolean"
  - name: BankCardResultPage
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardResultPage.ets
    kind: page
    asset_selection:
      resolution: custom
      rationale: 现有组件索引只有通用卡片和既有页面 builder，没有与银行卡类型、验证码或结果页语义相同的可配置组件；在 WalletMain
        内创建业务组件并复用既有资源风格。
    module: WalletMain
    state:
      - "payload: BankOpeningResultPayload"
