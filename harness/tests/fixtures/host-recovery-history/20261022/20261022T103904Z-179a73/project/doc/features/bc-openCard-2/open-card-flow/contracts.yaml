state_management:
  - name: BankOpeningCoordinator
    ordered_steps:
      - AddBankCardPage 或 AllBanksPage 调用 BankOpeningCoordinator.start(bank) 并返回
        CardTypeSheetState。
      - 用户选择 cardType 并同意后，Coordinator 调用 BankRepository.getMockCards(bank.code,
        cardType)，页面收到候选卡列表。
      - 用户选择卡并同意后，页面打开 OtpVerificationSheet；aboutToAppear 调用
        OtpController.send() 并启动 60 秒倒计时。
      - 六位数字提交时 OtpVerificationSheet 调用
        BankOpeningCoordinator.confirmOtp(code)；Coordinator 校验 code 后调用
        BankCardRepository.save(selectedCard.toRecord()) 并等待 RDB 结果。
      - BankCardRepository 成功或失败都返回 SaveBankCardResult；Coordinator 以
        BankOpeningResultPayload(fullCardNumber, result) 打开 BankCardResultPage。
      - 结果页点击完成后调用 BankOpeningNavigator.finish(payload)：成功先发布一次性完成载荷再 clear
        路径栈回根首页；失败 clear 后 push AddBankCardPage；两条路径都不逐页暴露中间 UI。
      - HomeTabPage 预先订阅 BankOpeningCompletionBridge；收到成功载荷后立即消费并清空一次性全卡号，再从
        BankCardRepository.list() 重读 RDB 作为展示真源。
  - data: bank-card-records
    scope: WalletMain process + bank_card.db
    decorator: plain coordinator and repository
    holder: BankOpeningCoordinator/BankCardRepository/BankOpeningCompletionBridge
    module: WalletMain
    owner_ref: view:development/node:walletmain-open-card
    contract_refs:
      - contract:bank-card-storage
    ordered_steps:
      - 提交六位验证码
      - 等待 RDB 保存或幂等查询
      - 发布成功载荷或返回失败结果
      - 清栈并由首页重读 RDB
    lifecycle_triggers:
      - page_attach
      - page_detach
      - warm_resume
      - process_recreation
    failure_recovery:
      recovery_id: open-card-recovery
      handling: 写入失败不发布；已写入后中断以唯一卡号幂等恢复
    mutations:
      - mutation_id: save-card
        kind: foreground
        publication_ref: publication:cards-changed
        recovery_ref: recovery:open-card-recovery
    publications:
      - publication_id: cards-changed
    subscriptions:
      - subscription_id: home-card-refresh
        consumer_ref: consumer:home-tab
        publication_ref: publication:cards-changed
        replay_or_snapshot: takePending then reload RDB
        cleanup: consume and clear payload
    consumers:
      - consumer_id: home-tab
        initial_load_ref: initial-load:load-cards
        update_ref: publication:cards-changed
    design_ref:
      artifact: component-blueprint@1
      component_id: bank-card-opening
      blueprint_id: bc-openCard-2
      revision: 2
      source_fingerprint: sha256:96ea30c89b36fb15596d576060e6f5317169ed9fc445c6360547e8065835a5c7
      artifact_sha256: sha256:2267a825e892b3187df369459005e1d85ebd375aa1c7053cc43cf7924dcd19b7
      target:
        kind: flow
        id: bank-card-record-flow
        view_id: runtime
module_dependencies:
  WalletMain:
    - AccountManager
  Phone:
    - WalletMain
data_models:
  - name: BankCardType
    file: 02-Feature/WalletMain/src/main/ets/data/model/BankCardType.ets
    kind: enum
    fields:
      - name: DEBIT
        type: string
        required: true
      - name: CREDIT
        type: string
        required: true
  - name: MockBankCard
    file: 02-Feature/WalletMain/src/main/ets/data/model/MockBankCard.ets
    kind: interface
    fields:
      - name: cardNumber
        type: string
        required: true
      - name: bankCode
        type: string
        required: true
      - name: bankName
        type: string
        required: true
      - name: cardType
        type: BankCardType
        required: true
  - name: OtpSession
    file: 02-Feature/WalletMain/src/main/ets/domain/model/OtpSession.ets
    kind: interface
    fields:
      - name: maskedPhone
        type: string
        required: true
      - name: remainingSeconds
        type: number
        required: true
      - name: code
        type: string
        required: true
  - name: SaveBankCardResult
    file: 02-Feature/WalletMain/src/main/ets/data/model/SaveBankCardResult.ets
    kind: interface
    fields:
      - name: success
        type: boolean
        required: true
      - name: cardNumber
        type: string
        required: true
      - name: errorMessage
        type: string
        required: true
  - name: BankOpeningResultPayload
    file: 02-Feature/WalletMain/src/main/ets/domain/model/BankOpeningResultPayload.ets
    kind: interface
    fields:
      - name: fullCardNumber
        type: string
        required: true
      - name: result
        type: SaveBankCardResult
        required: true
  - name: BankCardRecord
    file: 02-Feature/WalletMain/src/main/ets/data/model/BankCardRecord.ets
    kind: interface
    fields:
      - name: cardNumber
        type: string
        required: true
        description: 完整卡号，UI 不得直接展示
      - name: cardKind
        type: string
        required: true
        description: 银行卡大类
      - name: bankName
        type: string
        required: true
        description: 银行名称
      - name: bankCardType
        type: BankCardType
        required: true
        description: 储蓄卡或信用卡
      - name: addedAt
        type: number
        required: true
        description: Unix 毫秒添加时间
      - name: huaweiPayEnabled
        type: boolean
        required: true
        description: 华为支付开通状态
      - name: unionPayQuickPassEnabled
        type: boolean
        required: true
        description: 银联手机闪付状态
      - name: transactionsJson
        type: string
        required: true
        description: 交易记录 JSON，初始为空数组
  - name: UserProfile
    file: 04-BusinessBase/AccountManager/src/main/ets/data/model/UserProfile.ets
    kind: class
    fields:
      - name: mockPhone
        type: string
        required: true
        description: 账号 mock 原始手机号，仅供需要脱敏展示的业务读取
  - name: BankInfo
    file: 02-Feature/WalletMain/src/main/ets/data/model/BankInfo.ets
    kind: interface
    fields:
      - name: supportedCardTypes
        type: BankCardType[]
        required: true
interfaces:
  - class: BankCardRepository
    file: 02-Feature/WalletMain/src/main/ets/data/repository/BankCardRepository.ets
    methods:
      - name: save
        params:
          - name: record
            type: BankCardRecord
        return: Promise<SaveBankCardResult>
        async: true
      - name: list
        params: []
        return: Promise<BankCardRecord[]>
        async: true
    layer: data
  - class: BankOpeningNavigator
    file: 02-Feature/WalletMain/src/main/ets/domain/service/BankOpeningNavigator.ets
    methods:
      - name: finish
        params:
          - name: payload
            type: BankOpeningResultPayload
        return: void
        async: false
    layer: domain
  - class: BankOpeningCoordinator
    file: 02-Feature/WalletMain/src/main/ets/domain/service/BankOpeningCoordinator.ets
    methods:
      - name: start
        params:
          - name: bank
            type: BankInfo
        return: void
        async: false
      - name: selectCardType
        params:
          - name: cardType
            type: BankCardType
        return: Promise<MockBankCard[]>
        async: true
      - name: selectCard
        params:
          - name: card
            type: MockBankCard
        return: void
        async: false
      - name: confirmOtp
        params:
          - name: code
            type: string
        return: Promise<BankOpeningResultPayload>
        async: true
      - name: finish
        params: []
        return: void
        async: false
      - name: resendOtp
        params: []
        return: void
        async: false
        description: 仅归零时重新发送并恢复60秒；关闭后不再更新
    layer: domain
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets
    class: BankRepository
    methods:
      - name: getBanks
        params: []
        return: Promise<BankInfo[]>
        async: true
        description: 保持原银行列表，所有默认 mock 银行支持两类卡
      - name: getMockCards
        params:
          - name: bankCode
            type: string
          - name: cardType
            type: BankCardType
        return: Promise<MockBankCard[]>
        async: true
        description: 按银行与类型返回 1-2 张稳定候选，完整卡号仅在内存使用
components:
  - name: CardTypeSheet
    file: 02-Feature/WalletMain/src/main/ets/presentation/components/CardTypeSheet.ets
    kind: component
    asset_selection:
      resolution: custom
      rationale: 现有组件索引只有通用卡片和既有页面 builder，没有与银行卡类型、验证码或结果页语义相同的可配置组件；在 WalletMain
        内创建业务组件并复用既有资源风格。
    module: WalletMain
    state:
      - "selectedType: BankCardType | null"
      - "agreementAccepted: boolean"
  - name: OtpVerificationSheet
    file: 02-Feature/WalletMain/src/main/ets/presentation/components/OtpVerificationSheet.ets
    kind: component
    asset_selection:
