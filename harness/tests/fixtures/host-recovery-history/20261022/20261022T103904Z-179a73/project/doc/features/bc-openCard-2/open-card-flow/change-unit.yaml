provides:
  - provide_id: open-card-end-to-end
    description: 用户可从任一既有银行入口完成选类型、选卡、验证码、持久化与结果收口。
  - provide_id: bank-card-rdb
    description: bank_card.db v1 以 card_number 唯一保存完整银行卡记录并支持首页重读。
  - provide_id: safe-navigation-finish
    description: 结果页禁止返回；成功回首页并消费一次性完整卡号，失败回添加银行卡页，过程页全部清除。
