preserved_invariants:
  - invariant_id: existing-bank-pages
    description: 添加银行卡收起/展开态、全部银行索引与旧返回链不回归。
    evidence_refs:
      - AC-6
      - 02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets
      - 02-Feature/WalletMain/src/main/ets/presentation/pages/AllBanksPage.ets
  - invariant_id: card-number-privacy
    description: 完整卡号不得出现在 UI、日志和截图，只在 typed 内存载荷与 RDB 数据层流转。
    evidence_refs:
      - AC-2
      - AC-4
      - decision:card-number-privacy
target_predicates:
  - predicate_id: p-runtime-owner
    role: owner
    description: WalletMain 的 BankOpeningCoordinator 与 BankCardRepository
      分别持有瞬时流程状态和持久化银行卡真理，Phone 与 AccountManager 不复制该状态。
    provide_ids:
      - open-card-end-to-end
      - bank-card-rdb
    verification_refs:
      - AC-3
      - AC-4
  - predicate_id: p-entry-type
    role: behavior
    description: 两处入口均打开银行对应的单选卡类型半模态。
    provide_ids:
      - open-card-end-to-end
    verification_refs:
      - AC-1
  - predicate_id: p-card-otp
    role: behavior
    description: 具体卡筛选、前四后四脱敏、六位验证码和 60 秒重发状态符合要求。
    provide_ids:
      - open-card-end-to-end
    verification_refs:
      - AC-2
      - AC-3
  - predicate_id: p-rdb-result
    role: contract
    description: RDB 成败均返回完整卡号和结果，成功记录可重读且重复卡不新增。
    provide_ids:
      - bank-card-rdb
    verification_refs:
      - AC-4
      - BD-1
      - BD-3
  - predicate_id: p-finish-stack
    role: recovery
    description: 结果页禁返回；成功/失败按规定清栈到首页或添加银行卡页。
    provide_ids:
      - safe-navigation-finish
    verification_refs:
      - AC-5
  - predicate_id: p-old-route
    role: consumer
    description: 旧页面互跳、字母索引、逐层返回和根 Navigation 注册保持可用。
    provide_ids:
      - safe-navigation-finish
    verification_refs:
      - AC-6
