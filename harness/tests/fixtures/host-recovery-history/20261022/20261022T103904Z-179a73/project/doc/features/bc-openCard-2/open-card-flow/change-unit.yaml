purpose: 在一个可独立验收的施工单元内完成两处银行入口、卡类型与具体卡选择、六位验证码、RDB
  幂等保存、成败结果页、一次性全卡号交接和全过程清栈，同时保持既有银行卡列表与旧路由可用。
