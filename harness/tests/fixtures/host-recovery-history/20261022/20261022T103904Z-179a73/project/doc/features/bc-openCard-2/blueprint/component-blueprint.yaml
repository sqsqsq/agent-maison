  "review_summary": {
    "title": "银行卡开卡、验证码与持久化闭环",
    "background": "现有添加银行卡页与全部银行页已经可展示银行列表，但点击银行仍只提示暂不支持，也没有卡类型选择、具体银行卡选择、验证码、RDB 保存和结果页。",
    "problem": "用户无法从已有银行入口完成银行卡添加；当前数据模型也不足以保存完整卡号、支付能力状态和交易记录。",
    "summary": "在既有两处银行入口接入统一开卡流程：选择卡类型、选择具体卡、校验六位短信验证码、等待 RDB 写入结果、展示不可侧滑退出的结果页，并在完成时清除整段开卡栈。",
    "positioning": "本轮保持单机 mock 银行、卡片与短信发送，不接真实银行或短信服务；RDB 是已添加卡片的唯一持久化真源。",
    "goals": [
      {"goal_id": "G1", "statement": "两处银行入口都能进入一致的开卡流程", "success_measures": ["任意银行可打开卡类型半模态", "旧的全部银行与返回路径不回归"]},
      {"goal_id": "G2", "statement": "验证码与卡片保存具备确定状态和恢复边界", "success_measures": ["只接受六位数字", "60 秒发送倒计时可重发", "写入完成或失败后才进入结果页"]},
      {"goal_id": "G3", "statement": "完成后导航栈不再暴露开卡过程页", "success_measures": ["结果页屏蔽返回手势", "成功回钱包首页并携带卡号", "失败回最初添加卡片页"]}
    ],
    "in_scope": ["WalletMain 开卡页面、领域服务、RDB Repository 与资源", "AccountManager mock 手机号字段", "Phone 新增 NavDestination 注册与完成后的栈收敛", "UT 与真机视觉/导航验收"],
    "non_goals": ["真实短信网关", "真实银行接口", "NFC 激活", "银行卡详情页", "真实交易流水生成"],
    "reader_guide": {
      "source_digest": "sha256:9ebaa4ab0b116b0181ddacc13af1f5e3388a77af5bd5e92704b9d1b9625ac884",
      "sections": [
        {"section": "journey", "title": "四个界面如何衔接", "prose": "用户可从添加银行卡页或全部银行页点击任意银行。卡类型半模态只允许在银行支持的储蓄卡/信用卡中单选；继续后进入具体卡片页，界面只显示前四后四。选择卡后打开验证码半模态，自动发送一次并开始 60 秒倒计时；六位数字提交后等待 RDB 返回，最终进入禁止返回的结果页。", "source_refs": ["/design_views/4/nodes/0"]},
        {"section": "solution", "title": "三模块责任边界", "prose": "WalletMain 负责开卡页面、状态编排、银行卡 RDB 和首页刷新；AccountManager 只给 UserProfile 增加账号 mock 手机号；Phone 只在根 Navigation 注册新增页面 builder。完整卡号不会放入字符串路由参数，而通过 WalletMain 的一次性 typed 载荷交给已挂载首页，消费后立即清除。", "source_refs": ["/design_views/2/nodes/0", "/design_views/2/nodes/1", "/design_views/2/nodes/2", "/decisions_and_gaps/decisions/3"]},
        {"section": "flows", "title": "选择卡片并打开验证码", "prose": "具体卡片页把完整 MockBankCard 交给协调器。协调器从 AccountService 读取 mockPhone，向验证码组件只传脱敏手机号；组件出现时自动发送并启动计时器，消失时停止计时器。", "source_refs": ["/design_views/1/nodes/0/contracts/state_management/0/ordered_steps"], "graph_ids": ["sequence:open-otp"]},
        {"section": "flows", "title": "提交、保存与结果", "prose": "验证码组件只调用协调器的命名方法。协调器校验六位数字后调用 Repository 并等待事务结束；无论成功或失败，Repository 都把完整卡号和结果返回给协调器，再以 typed payload 打开对应结果页。", "source_refs": ["/design_views/1/nodes/0/contracts/state_management/0/ordered_steps", "/contracts/0"], "graph_ids": ["sequence:save-result"]},
        {"section": "flows", "title": "完成、清栈与首页刷新", "prose": "成功时先发布一次性完成载荷，再清空路径栈回根首页；首页取走本次完整卡号后立即清除载荷，并从 RDB 重读展示数据。失败时清空路径栈后重新压入 AddBankCardPage，因此无论用户从添加银行卡页还是全部银行页开始，都不会保留 AllBanks、选类型、选卡、验证码或结果页。", "source_refs": ["/design_views/1/runtime_data_flows/0", "/decisions_and_gaps/decisions/2", "/decisions_and_gaps/decisions/3"], "graph_ids": ["sequence:finish-refresh"]},
        {"section": "data", "title": "RDB 结构、安全与幂等", "prose": "bank_card.db v1 的 bank_card 表以自增 id 为主键、card_number 为唯一键，保存银行、银行卡类型、添加时间、两种支付状态和交易记录 JSON。当前演示是单账号应用沙箱，不伪造 owner 列；完整卡号不写日志、不直接展示，本轮未取得额外加密要求。重复卡按唯一键读取既有记录并返回成功。", "source_refs": ["/contracts/0/table_schema", "/data_domains/0", "/decisions_and_gaps/decisions/1"]},
        {"section": "recovery", "title": "失败与中断速查", "prose": "| 场景 | 用户看到什么 | 数据状态 | 如何继续 |\n| --- | --- | --- | --- |\n| RDB 写入失败（BD-1） | 失败结果页 | 无新增记录 | 点击完成回添加银行卡页后重试 |\n| 关闭验证码（BD-2） | 回到具体卡片页 | 未写入 | 保留选卡并可重新打开验证码 |\n| 同卡重复提交（BD-3） | 成功结果页 | 复用既有唯一记录 | 正常完成回首页 |\n| 写入成功后进程终止 | 下次启动回普通入口 | RDB 已有记录 | 重加同卡时按幂等成功恢复 |", "source_refs": ["/design_views/0/nodes/0/acceptance/boundaries", "/design_views/1/runtime_data_flows/0/failure_recovery"]},
        {"section": "delivery", "title": "施工拆分与文件责任", "prose": "一个 CU 原子交付三模块协作：WalletMain 完成数据模型、Repository、协调器、页面组件、首页完成载荷消费和资源；AccountManager 只扩展 UserProfile/AccountService；Phone 只追加两条 NavDestination builder。CU 完成前不发布半套导航，因而中间状态保持旧入口仍可编译运行。", "source_refs": ["/design_views/2/nodes", "/design_views/3/rollout"]},
        {"section": "acceptance", "title": "验收分层", "prose": "AC-1/2/3/4 的筛选、脱敏、验证码状态机、RDB 映射和幂等以 UT 验证，并在真机核对四张参考图与交互；AC-5 只以真机验证禁止返回、成功/失败清栈去向；AC-6 同时跑旧页面互跳 UT 和真机回归。", "source_refs": ["/design_views/0/nodes/0/acceptance"]}
      ]
    },
