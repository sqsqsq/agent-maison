state_management:
  - data: openingFlow
    scope: 单次银行卡开卡页面栈
    decorator: BankCardOpeningService
    holder: BankCardOpeningService
    module: WalletMain
    owner_ref: view:runtime/node:runtime-opening-session
    contract_refs:
      - contract:contract-card-persistence
    ordered_steps:
      - start(bank) 打开 CardTypeSheet 并发布 selecting_type
      - selectCardType(type) 导航到 BankCardSelectionPage 并发布 selecting_card
      - selectCard(candidate) 打开 SmsVerificationSheet 并发布 verifying
      - submitVerification(candidate, code) 校验六位数字、单次写库并发布 saving/result
      - finish(result) 按成功或失败清栈到唯一目标
    lifecycle_triggers:
      - page_attach
      - page_detach
      - process_recreation
    failure_recovery:
      recovery_id: open-card-failure
      handling: RDB 异常转换为失败 CardOpenResult；不自动重试；完成后回最初的 AddCardEntryPage。
    mutations:
      - mutation_id: save-card
        publication_ref: publication:card-open-result
        recovery_ref: recovery:open-card-failure
    publications:
      - publication_id: card-open-result
    subscriptions:
      - subscription_id: result-page-consumer
        consumer_ref: consumer:open-card-result-page
        publication_ref: publication:card-open-result
        replay_or_snapshot: NavPath 参数是结果页不可变快照
        cleanup: 结果页销毁时释放本地结果引用且不保留全局监听
    consumers:
      - consumer_id: open-card-result-page
        initial_load_ref: initial-load:load-opening-input
        update_ref: publication:card-open-result
    design_ref:
      artifact: component-blueprint@1
      component_id: wallet-bank-card-opening
      blueprint_id: bc-openCard-2
      revision: 4
      source_fingerprint: sha256:9e9b50f17111ede0cd84f11002811f4a2db0244496dc77a694adf9a4b1265173
      artifact_sha256: sha256:e607b0dcf1ed5b6bad4bd07dd57de4607087108e522b15b19363f0118a854610
      target:
        kind: flow
        view_id: runtime
        id: flow-open-card
