components:
  - name: buildAddBankCardPage
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets
    kind: page
    state:
      - { name: banks, decorator: "@State", type: "BankInfo[]" }
    props: []
    events: [{ name: handleBankTap, params: [BankInfo] }]
    children: [BankListRow, CardTypeSheet]
    asset_selection:
      resolution: evolve
      component_ref: WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
      rationale: 复用既有添加银行卡页并把点击处理升级为统一开卡入口；全部银行页调用同一行为，不复制流程。
  - name: CardTypeSheet
    file: 02-Feature/WalletMain/src/main/ets/presentation/components/CardTypeSheet.ets
    kind: component
    role: 银行信息、单选卡类型、协议文本和继续按钮半模态。
    state:
      - { name: selectedType, decorator: "@State", type: "BankCardType | null" }
    props:
      - { name: bank, decorator: "@Prop", type: BankInfo }
      - { name: supportedTypes, decorator: "@Prop", type: "BankCardType[]" }
    events:
      - { name: onContinue, params: [BankCardType] }
      - { name: onClose, params: [] }
    children: [bank_header, card_type_options, authorization_hint, agreement_text, continue_button]
    asset_selection:
      resolution: custom
      rationale: 库存中没有承担卡类型选择、验证码倒计时和不可返回结果页业务语义的组件；新 UI 仍限制在 WalletMain，不向 CommUI 泛化。
  - name: buildBankCardSelectionPage
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardSelectionPage.ets
    kind: builder
    role: 具体银行卡选择全屏页。
    state:
      - { name: candidates, decorator: "@State", type: "BankCandidate[]" }
      - { name: selectedCandidate, decorator: "@State", type: "BankCandidate | null" }
      - { name: agreementAccepted, decorator: "@State", type: boolean }
    props: [{ name: routeParams, decorator: NavPath参数, type: BankCardSelectionParams }]
    events: [{ name: handleNext, params: [BankCandidate] }]
    children: [navigation_bar, candidate_list, agreement_row, next_button, SmsVerificationSheet]
    asset_selection:
      resolution: custom
      rationale: 库存中没有承担卡类型选择、验证码倒计时和不可返回结果页业务语义的组件；新 UI 仍限制在 WalletMain，不向 CommUI 泛化。
  - name: SmsVerificationSheet
    file: 02-Feature/WalletMain/src/main/ets/presentation/components/SmsVerificationSheet.ets
    kind: component
    role: 手机号提示、六位数字输入、发送倒计时和下一步。
    state:
      - { name: code, decorator: "@State", type: string }
      - { name: remainingSeconds, decorator: "@State", type: number }
      - { name: submitting, decorator: "@State", type: boolean }
    props:
      - { name: candidate, decorator: "@Prop", type: BankCandidate }
      - { name: maskedPhone, decorator: "@Prop", type: string }
    events:
      - { name: handleResend, params: [] }
      - { name: handleSubmit, params: [string] }
      - { name: handleClose, params: [] }
    children: [phone_hint, numeric_code_input, resend_action, submit_button]
    asset_selection:
      resolution: custom
      rationale: 库存中没有承担卡类型选择、验证码倒计时和不可返回结果页业务语义的组件；新 UI 仍限制在 WalletMain，不向 CommUI 泛化。
  - name: buildCardOpenResultPage
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/CardOpenResultPage.ets
    kind: builder
    role: 成功或失败结果、禁止返回和唯一完成按钮。
    state: []
    props: [{ name: result, decorator: NavPath参数, type: CardOpenResult }]
    events: [{ name: handleFinish, params: [] }]
    children: [state_icon, title, description, guide_placeholder, complete_button]
    asset_selection:
      resolution: custom
      rationale: 库存中没有承担卡类型选择、验证码倒计时和不可返回结果页业务语义的组件；新 UI 仍限制在 WalletMain，不向 CommUI 泛化。
