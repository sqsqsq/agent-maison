interfaces:
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets
    class: BankRepository
    methods:
      - { name: getBanks, params: [], return: "Promise<BankInfo[]>", async: true, description: 返回既有 Mock 银行列表。 }
      - name: getSupportedCardTypes
        params: [{ name: bankCode, type: string }]
        return: "Promise<BankCardType[]>"
        async: true
        description: 返回银行支持的类型；当前所有 Mock 银行返回储蓄卡与信用卡。
      - name: getBankCandidates
        params: [{ name: bankCode, type: string }, { name: bankCardType, type: BankCardType }]
        return: "Promise<BankCandidate[]>"
        async: true
        description: 按银行与类型返回 1 到 2 张携带完整卡号的本地候选卡。
  - module: WalletMain
    layer: data
    file: 02-Feature/WalletMain/src/main/ets/data/repository/CardRepository.ets
    class: CardRepository
    methods:
      - name: saveBankCard
        params: [{ name: request, type: SaveBankCardRequest }]
        return: "Promise<boolean>"
        async: true
        description: 按蓝图 mappings 将请求转换为 StoredCard，初始化 schema v1 并原子插入；唯一约束或异常返回 false。
      - name: getBankCardByNumber
        params: [{ name: fullCardNumber, type: string }]
        return: "Promise<StoredCard | null>"
        async: true
        description: 按完整卡号读取成功保存的记录，供业务 UT 验证字段映射。
  - module: WalletMain
    layer: domain
    file: 02-Feature/WalletMain/src/main/ets/domain/service/BankCardOpeningService.ets
    class: BankCardOpeningService
    methods:
      - { name: start, params: [{ name: bank, type: BankInfo }], return: void, async: false, description: 建立单次开卡会话并进入卡类型选择。 }
      - { name: selectCardType, params: [{ name: type, type: BankCardType }], return: void, async: false, description: 保存唯一类型并导航至具体卡片页。 }
      - { name: selectCard, params: [{ name: candidate, type: BankCandidate }], return: void, async: false, description: 保存完整候选卡并进入验证码阶段。 }
      - { name: resendCode, params: [], return: void, async: false, description: 在倒计时归零时重启 60 秒计时。 }
      - name: submitVerification
        params: [{ name: candidate, type: BankCandidate }, { name: code, type: string }]
        return: "Promise<CardOpenResult>"
        async: true
        description: 校验六位数字、单次保存并生成成功或失败结果。
      - { name: finish, params: [{ name: result, type: CardOpenResult }], return: void, async: false, description: 成功清栈回首页，失败清栈后只压入最初的 AddCardEntryPage。 }
  - module: AccountManager
    layer: domain
    file: 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
    class: AccountService
    methods:
      - { name: getUserProfile, params: [], return: "Promise<UserProfile>", async: true, description: 登录和未登录均返回同一非秘密 Mock 完整手机号。 }

