  - invariant_id: invariant-single-nav-stack
    description: 继续使用 Phone 持有并由 NavPathContext.attach 的唯一 NavPathStack，不建立第二套路由状态。
    evidence_refs:
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 05-SystemBase/CommFunc/src/main/ets/shared/navigation/NavPathContext.ets
  - invariant_id: invariant-card-number-privacy
    description: 完整卡号不得进入可见文本或日志，UI 只显示前四后四掩码。
    evidence_refs:
      - AC-2
      - qa-card-number-privacy
