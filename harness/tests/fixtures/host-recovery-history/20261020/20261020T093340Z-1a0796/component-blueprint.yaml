        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
    runtime_data_flows:
      - flow_id: flow-open-card
        label: 开卡写入与结果发布
        provenance: *requirement_provenance
        contracts:
          state_management:
            - data: openingFlow
              scope: 单次银行卡开卡页面栈
              decorator: BankCardOpeningService
              holder: BankCardOpeningService
              module: WalletMain
              owner_ref: view:runtime/node:runtime-opening-session
              contract_refs:
                - contract:contract-card-persistence
              mutations:
                - mutation_id: save-card
                  publication_ref: publication:card-open-result
                  recovery_ref: recovery:open-card-failure
              publications:
                - publication_id: card-open-result
              subscriptions:
                - subscription_id: result-page-consumer
                  consumer_ref: consumer:open-card-result-page
                  publication_ref: publication:card-open-result
                  replay_or_snapshot: NavPath 参数是结果页不可变快照
                  cleanup: 结果页销毁时释放本地结果引用且不保留全局监听
              consumers:
                - consumer_id: open-card-result-page
                  initial_load_ref: initial-load:load-opening-input
                  update_ref: publication:card-open-result
        ordered_steps:
          - order: 1
            call: AddBankCardPage.handleBankTap(bank) 或 AllBanksPage.handleBankTap(bank)
            result: 调用 BankCardOpeningService.start(bank) 并显示 CardTypeSheet；不再 Toast not_supported。
          - order: 2
            call: CardTypeSheet.onContinue(type)
            result: 通过 NavPathContext.stack().pushPath 进入 BankCardSelectionPage，参数含 bankCode 与 BankCardType。
          - order: 3
            call: BankCardSelectionPage.handleNext(candidate)
            result: 保留 BankCandidate.fullCardNumber 作为参数，页面只渲染掩码；打开 SmsVerificationSheet。
          - order: 4
            call: SmsVerificationSheet.aboutToAppear
            result: 调用 AccountService.getUserProfile 读取 phoneNumber，使用 MaskUtil.maskPhone 展示，并自动调用 resendCode 启动 60 秒倒计时。
          - order: 5
            call: BankCardOpeningService.submitVerification(candidate, code)
            result: 六位数字校验通过后构造全部 StoredCard 字段，await CardRepository.saveBankCard 一次并生成 CardOpenResult。
          - order: 6
            call: NavPathContext.stack().pushPath(CardOpenResultPage, result)
            result: 结果页 onBackPressed 返回 true，系统返回与左滑均不改变栈。
          - order: 7
            call: BankCardOpeningService.finish(result)
            result: 成功调用 NavPathContext.stack().clear()，目标栈为空并显示根钱包首页；失败先 clear() 再 pushPath(AddBankCardPage)，目标栈仅含 AddBankCardPage。中间开卡页均不可返回。
        data_domain_refs:
          - view:logical/node:logical-bank-card-opening
        external_contract_refs:
          - contract:contract-card-persistence
        source_of_truth:
          authority: view:logical/node:logical-bank-card-opening
          persistence: rdb:wallet_cards
          projections_and_caches:
            - view:runtime/node:runtime-opening-session
          reconciliation: 单次提交以完整卡号为幂等键；RDB 写入结果转换为唯一 CardOpenResult，结果页不自行重写。
        triggers:
          - kind: user_verification_submit
            timing: 验证码为六位数字且点击下一步时
            idempotency: 提交期间禁用按钮；Repository 以完整卡号避免同一次重复插入。
        initial_load:
          initial_load_id: load-opening-input
          strategy: 从 NavPath 参数读取银行、卡类型和候选卡；RDB 不在流程开始时预读。
          owner: BankCardOpeningService
          data_scope: 单次开卡输入
          freshness: 参数随本次页面栈创建，不跨会话复用。
        state_owner:
          ref: view:runtime/node:runtime-opening-session
          states:
            - selecting_type
            - selecting_card
            - verifying
            - saving
            - result
        mutations:
          - mutation_id: save-card
            kind: foreground
            persistence_ref: rdb:wallet_cards
            publication_ref: publication:card-open-result
            recovery_ref: recovery:open-card-failure
        publications:
          - publication_id: card-open-result
            payload: CardOpenResult{fullCardNumber, success, errorMessage}
            ordering: 写库完成后只发布一次，再跳转结果页。
        subscriptions:
          - subscription_id: result-page-consumer
            consumer_ref: consumer:open-card-result-page
            attach: 结果页从 NavPath 参数在 aboutToAppear 获取结果。
            detach: 结果页销毁时释放本地引用。
            cleanup: 不保留静态监听或计时器。
            replay_or_snapshot: NavPath 参数是该结果页的不可变快照。
            ordering: 先收到结果，再允许渲染成功或失败状态。
        consumers:
          - consumer_id: open-card-result-page
            initial_load_ref: initial-load:load-opening-input
            update_ref: publication:card-open-result
        failure_recovery:
          recovery_id: open-card-failure
          handling: 捕获 RDB 异常并发布 success=false；不自动重试，避免重复卡片。
          retry: 用户完成失败页回到添加卡片页后可重新发起整个流程。
        decisions_and_gaps:
          - decision:decision-result-stack-policy
        evidence_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        verification_refs:
