      - WalletMain-owner
    purpose: 定义从银行点击到 RDB 写入、结果发布和导航收口的运行时顺序与恢复。
    current_state: 银行点击止于 Toast，没有跨页状态、持久化或结果发布。
    target_state: 页面参数携带银行、类型和完整候选卡；验证码服务提交时调用 CardRepository，结果页消费 CardOpenResult 并统一清栈。
    delta: 新增单次开卡会话状态、RDB 写入、结果发布与生命周期清理。
