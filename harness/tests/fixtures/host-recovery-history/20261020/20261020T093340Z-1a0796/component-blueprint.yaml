  - view_id: scenarios
    viewpoint_contract: app-scenarios@1
    applicability: applicable
    evolution_impact: changed
    stakeholders:
      - wallet-user
      - qa-owner
    purpose: 描述从两个银行入口开始、经选择与验证到成功或失败完成的端到端用户旅程。
    current_state: 用户点击银行后收到暂不支持提示，旅程终止。
    target_state: 用户完成卡类型、具体卡片、验证码和结果页闭环，且所有中间页面在完成时被移除。
    delta: 新增完整主路径、写库失败分支、验证码校验/重发分支和结果页返回拦截。
    decisions_and_gaps:
      - decision:decision-result-stack-policy
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
    nodes:
      - node_id: scenario-open-card
        label: 银行卡开卡用户旅程
        owner: WalletMain
        current_state: 银行点击后 Toast 结束。
        target_state: 从添加银行卡或全部银行选择银行，完成选类型、选卡、验证码、写库与结果页完成。
        journey_steps:
          - step_id: step-bank
            stage: 入口
            user_action: 在添加银行卡页或全部银行页点击任一银行。
            system_behavior: 打开该银行的卡类型半模态并展示支持类型。
            preconditions:
              - BankRepository 已加载银行数据
          - step_id: step-type
            stage: 卡类型
            user_action: 单选储蓄卡或信用卡并点击同意并继续。
            system_behavior: 跳转对应银行和类型的具体卡片页。
            preconditions:
              - 已选择一种卡类型
          - step_id: step-card
            stage: 具体卡片
            user_action: 选择掩码卡号、同意协议并点击下一步。
            system_behavior: 打开验证码半模态并自动模拟发送短信。
            preconditions:
              - 已选择一张卡
              - 已勾选协议
          - step_id: step-code
            stage: 短信验证
            user_action: 输入任意六位数字并点击下一步。
            system_behavior: 用完整卡号构造 StoredCard，尝试写入 RDB 并跳转结果页。
            preconditions:
              - 验证码恰为六位数字
          - step_id: step-result
            stage: 结果
            user_action: 在成功或失败结果页点击完成。
            system_behavior: 清理本轮开卡页面；成功回钱包首页，失败回添加卡片页。
            preconditions:
              - CardOpenResult 已生成
        path_variants:
          - user_type: 添加银行卡页用户
            difference: 直接点击列表银行进入相同卡类型半模态。
          - user_type: 全部银行页用户
            difference: 从 A-Z 分组页点击银行进入同一流程，失败完成后回最初添加卡片页而非全部银行页。
        logical_refs:
          - view:logical/node:logical-bank-card-opening
          - contract:contract-card-persistence
        runtime_refs:
          - view:runtime/flow:flow-open-card
        development_owner_ref: view:development/node:dev-card-opening-ui
        deployment_refs:
          - view:deployment/node:deployment-existing
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        use_cases:
          schema_version: "2.0"
          feature: bc-openCard-2
          coordinator: BankCardOpeningService
          ui_bindings:
            - ui: AddBankCardPage|AllBanksPage
              role: journey_entry
              user_actions:
                - tap_bank
            - ui: SmsVerificationSheet
              role: verification
              user_actions:
                - input_code
                - resend
                - submit
          use_cases:
            - id: UC-OPEN-CARD
              name: 完成银行卡开卡
              description: 从银行入口完成卡类型选择、具体卡片选择、短信验证、RDB 写入与结果页收口。
              coordinator: BankCardOpeningService
              ui_bindings:
                - ui: AddBankCardPage|AllBanksPage
                  role: entry
                  subscribes: []
                  user_actions:
                    - trigger: 点击银行
                      calls: BankCardOpeningService.start
                - ui: CardTypeSheet
                  role: dialog
                  subscribes:
                    - phase=selecting_type
                  user_actions:
                    - trigger: 选择卡类型并继续
                      calls: BankCardOpeningService.selectCardType
                - ui: BankCardSelectionPage
                  role: progress
                  subscribes:
                    - phase=selecting_card
                  user_actions:
                    - trigger: 选择具体卡片并下一步
                      calls: BankCardOpeningService.selectCard
                - ui: SmsVerificationSheet
                  role: dialog
                  subscribes:
                    - phase=verifying
                  user_actions:
                    - trigger: 重新发送验证码
                      calls: BankCardOpeningService.resendCode
                    - trigger: 提交六位验证码
                      calls: BankCardOpeningService.submitVerification
                - ui: CardOpenResultPage
                  role: result
                  subscribes:
                    - phase=result
                  user_actions:
                    - trigger: 点击完成
                      calls: BankCardOpeningService.finish
              trigger: tap_bank
              calls:
                - BankRepository.getBankCandidates(bankCode, bankCardType)
                - CardRepository.saveBankCard(storedCard)
                - BankCardOpeningService.finish(result)
              state_model:
                phases:
                  - selecting_type
                  - selecting_card
                  - verifying
                  - saving
                  - result
              branches:
                - scenario: 写库成功
                  id: branch-save-success
                  linked_acceptance:
                    - AC-1
                    - AC-2
                    - AC-3
                    - AC-4
                    - AC-5
                  expected_phase_seq:
                    - selecting_type
                    - selecting_card
                    - verifying
                    - saving
                    - result
                  expected_port_calls:
                    - CardRepository.saveBankCard exactly once
                  expected: 显示成功结果，完成后清栈并回钱包首页。
                - scenario: 写库失败
                  id: branch-save-failure
                  linked_acceptance:
                    - AC-4
                    - AC-5
                    - BD-1
                  expected_phase_seq:
                    - selecting_type
                    - selecting_card
                    - verifying
                    - saving
                    - result
                  expected_port_calls:
                    - CardRepository.saveBankCard exactly once
                  expected: 显示失败结果，完成后清栈并回添加卡片页。

