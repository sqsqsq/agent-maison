                - name: unionPayQuickPassEnabled
                  type: boolean
                  required: true
                  description: 银联手机闪付开通状态。
                - name: transactionsJson
                  type: string
                  required: true
                  description: 交易记录 JSON，当前初始为空数组。
          files:
            - 02-Feature/WalletMain/src/main/ets/data/model/BankCandidate.ets
            - 02-Feature/WalletMain/src/main/ets/data/model/StoredCard.ets
