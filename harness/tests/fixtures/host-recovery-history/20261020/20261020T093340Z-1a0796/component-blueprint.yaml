      verification_refs:
        - AC-4
      semantics: 提交期间禁用按钮，Repository 以完整卡号避免重复插入。
    nfr:
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/nfr
      verification_refs:
        - NFR-1
      semantics: 本地写入和结果生成不阻塞 UI 线程。
    owner: WalletMain
    needed_by: bank-card-opening-complete
    provenance: *requirement_provenance

decisions_and_gaps:
  decisions:
    - decision_id: decision-single-cu
      kind: decomposition
      status: decided_with_authority
      owner: component-design
      conclusion: 入口、页面状态机、持久化和结果清栈作为一个 CU 交付。
      rationale: 任一部分单独上线都不能形成安全可验收的用户旅程；拆分会引入临时禁用入口或平行状态真源。
      provenance: *requirement_provenance
      verification_refs:
        - view:scenarios/node:scenario-open-card
    - decision_id: decision-result-stack-policy
      kind: navigation_policy
      status: decided_with_authority
      owner: WalletMain
      conclusion: 结果页拦截返回，完成按钮是唯一出口；成功清栈回首页，失败清栈回添加卡片页。
      rationale: 直接恢复原始需求的明确导航契约，避免用户返回已失效的开卡中间态。
      provenance: *requirement_provenance
      verification_refs:
        - AC-5
    - decision_id: decision-existing-bank-page-reuse
      kind: component_asset_selection
      target_ref: view:development/node:dev-existing-bank-pages
      asset_resolution: evolve
      component_ref: WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
      status: decided_with_authority
      owner: WalletMain
      rationale: 复用既有添加银行卡页并把点击处理升级为统一开卡入口；全部银行页调用同一行为，不复制流程。
      provenance:
        source_kind: catalog
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-20T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: component_index_and_live_callsite
      verification_refs:
        - doc/component-index.yaml
        - 02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets
    - decision_id: decision-new-opening-ui
      kind: component_asset_selection
      target_ref: view:development/node:dev-card-opening-ui
      asset_resolution: custom
      status: decided_with_authority
      owner: WalletMain
      rationale: 库存中没有承担卡类型选择、验证码倒计时和不可返回结果页业务语义的组件；新 UI 仍限制在 WalletMain，不向 CommUI 泛化。
      provenance:
        source_kind: catalog
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-20T00:00:00-04:00"
        evidence_strength: authoritative
        extraction_method: component_index_and_live_callsite
      verification_refs:
        - doc/component-index.yaml
        - doc/features/原始需求/1-2-银行卡/原始需求.md
  gaps: []

providers:
  - provider_id: current-facts-discovery
    definition: 读取需求、代码、配置、测试和架构资产，建立当前事实与冲突。
    consumer: component-design
    provider: static current facts reader
    requirement: required
    authority_rule: Code, schema, interface, config, and tests are current-state authority.
    source_rule: Every assertion carries source_ref and source revision when available.
    missing_behavior: 必需事实不可达时形成 blocker。
    replacement_behavior: 同源重新发现并使相关派生结果过期。
    exit_behavior: 丢弃临时检索，保留 canonical provenance。
    conflict_behavior: 保留双方来源并交权威 owner 裁决。
    available: true
    writes:
      - canonical_blueprint_input
  - provider_id: se-manual-contracts
    definition: 消费本次设计内的持久化操作、DTO、映射、错误、幂等和 NFR 契约。
    consumer: app-design-lens
    provider: component design owner
    requirement: required
    authority_rule: Authorized SE or contract owner is external-contract authority.
    source_rule: Every contract segment carries source_ref, verification ref, and provenance.
    missing_behavior: 契约段缺失时形成 blocker。
    replacement_behavior: 契约修订时重验映射与当前切片。
    exit_behavior: 保留 canonical contract，不保留临时草稿。
    conflict_behavior: 不做 last-write-wins，回到 contract owner。
    available: true
    writes:
      - canonical_blueprint_input
  - provider_id: app-design-lens
    definition: 用 App 4+1 和十个根问题检查设计完整性。
    consumer: component-design
    provider: static app lens
    requirement: required
    authority_rule: Lens is not fact authority and cannot override inputs.
    source_rule: Projection cites inputs, viewpoint contract, and lens rule version.
    missing_behavior: hmos-app 缺 lens 时 blocker。
    replacement_behavior: lens 规则变化时重验相关视图。
    exit_behavior: 仅保留回答和证据引用。
    conflict_behavior: 输入事实优先，lens 不覆盖。
    available: true
    writes:
      - canonical_blueprint_input
  - provider_id: independent-design-questioning
    definition: 在隔离上下文回答视图、关系、flow、根问题和术语覆盖。
    consumer: component-design admission
    provider: independent questioning agent
    requirement: required
    authority_rule: Questioning is not fact or decision authority.
    source_rule: Answers cite isolated blueprint, evidence package, and registered external inputs.
    missing_behavior: 未完成质询时 blocker。
    replacement_behavior: 设计变化时重新质询受影响范围。
    exit_behavior: 结果写入 review_summary.questioning，不形成平行 SSOT。
    conflict_behavior: 发现缺口回设计 owner 一轮修订。
    available: true
    writes:
      - canonical_blueprint_input
  - provider_id: conventions-knowledge
    definition: 读取可选横切工程惯例。
    consumer: current-facts-discovery
    provider: static conventions reader
    requirement: optional
    authority_rule: Project conventions are stable knowledge input, not current-code authority.
    source_rule: Applicable facts cite the configured conventions file and exact heading id.
    missing_behavior: 默认文件未启用时记不适用。
    replacement_behavior: 文件出现或更新时重新发现适用条目。
    exit_behavior: 仅保留被实际消费的 provenance。
    conflict_behavior: 当前代码事实优先并保留冲突。
    available: false
    missing_disposition: not_applicable
    writes:
      - canonical_blueprint_input
  - provider_id: component-assets
    definition: 从组件索引发现可复用 UI 资产并记录选型。
    consumer: app-design-lens and questioning
    provider: static component index reader
    requirement: optional
    authority_rule: Source is component fact authority; curation is human selection guidance.
    source_rule: Selection evidence cites the configured component index or catalog; component_ref identifies the asset.
    missing_behavior: 有 UI 而索引不可用时保留 unknown 或 degraded gap。
    replacement_behavior: 同源重扫并使相关选型结果过期。
    exit_behavior: 丢弃临时检索，保留 provenance。
    conflict_behavior: 源码优先且保留策展冲突。
    available: true
    writes:
      - canonical_blueprint_input

app_lens:
  module_boundaries:
    disposition: answered_with_evidence
    answer: WalletMain 拥有页面、领域服务和 RDB Repository；Phone 只装配 NavDestination；CommUI 与 CommFunc 不承载银行卡业务。
    evidence_refs:
      - doc/module-catalog.yaml#WalletMain
      - doc/architecture.md#模块内分层
  capability_seams:
    disposition: answered_with_evidence
    answer: BankCardOpeningService 是 presentation 到 CardRepository 的唯一用例接缝，NavPathContext 是既有导航接缝；验证码提示通过 AccountService.getUserProfile 读取完整 Mock phoneNumber，未登录状态也提供同一非秘密 Mock 手机号。
    evidence_refs:
      - contract:contract-card-persistence
      - 05-SystemBase/CommFunc/src/main/ets/shared/navigation/NavPathContext.ets
      - view:development/node:dev-account-phone-source
  feature_flags:
    disposition: not_applicable
    answer: 本地演示应用无远程开关，当前需求直接替换原不支持提示。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
  data_producers_consumers:
    disposition: answered_with_evidence
    answer: BankRepository 产生 Mock 候选卡，CardRepository/RDB 产生持久化结果，当前切片只有结果页消费 CardOpenResult；卡详情与卡包读取 RDB 是后续需求，不在本切片虚构刷新机制。
    evidence_refs:
      - view:runtime/flow:flow-open-card
  lifecycle_triggers:
    disposition: answered_with_evidence
    answer: 页面 attach 启动短信发送和倒计时，detach 清理计时器，用户提交触发唯一前台写入。
    evidence_refs:
      - view:runtime/flow:flow-open-card
  state_owners:
    disposition: answered_with_evidence
    answer: 页面组件拥有临时选择和验证码状态，BankCardOpeningService 拥有提交状态，CardRepository/RDB 拥有持久卡真理。
    evidence_refs:
      - view:runtime/flow:flow-open-card
      - contract:contract-card-persistence
  initialization:
    disposition: answered_with_evidence
    answer: Mock 银行与候选卡按页面进入加载；CardRepository 以 wallet_cards.db schema_version=1 初始化 wallet_cards 表，onCreate 幂等建表，onUpgrade 保留显式版本分支，建表失败映射失败结果。
    evidence_refs:
      - 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets
      - contract:contract-card-persistence
  publication_subscription:
    disposition: answered_with_evidence
    answer: 写入完成后以 NavPath 参数发布一次 CardOpenResult；结果页读取不可变快照，不引入全局事件总线。
    evidence_refs:
      - view:runtime/flow:flow-open-card
  ui_refresh:
    disposition: answered_with_evidence
    answer: 选择、验证码与倒计时由局部 @State 刷新，结果页由不可变 CardOpenResult 参数渲染；本期首页不展示新增银行卡，故清栈回首页无需额外跨页刷新。
    evidence_refs:
      - view:development/node:dev-card-opening-ui
  process_recovery:
    disposition: answered_with_evidence
    answer: 已成功写入以 RDB 为准；未提交开卡会话在进程重建后放弃，不恢复半完成流程。
    evidence_refs:
      - view:runtime/flow:flow-open-card
  runtime_flow_trigger_assessment:
    persistent_or_remote_ui:
      applies: true
      evidence_refs:
        - requirement-bank-card-opening
    multiple_consumers:
      applies: true
      evidence_refs:
        - 结果页与后续卡包读取卡数据
    background_system_external_scheduled_write:
      applies: false
      evidence_refs:
        - 仅用户前台提交
    cold_start_resume_mount_account_switch:
      applies: true
      evidence_refs:
        - RDB 数据跨冷启动保留
    user_mutation_refreshes_other_consumers:
      applies: true
      evidence_refs:
        - 添加成功后首页与卡包可读取新卡
    cache_sync_freshness_consistency_process_recreation:
      applies: true
      evidence_refs:
        - RDB 是进程重建后的持久真源

data_domains:
  - data_domain_id: wallet-bank-cards
    label: 钱包卡片数据
    usage: 存放本需求添加的银行卡完整业务数据，供结果页之后的首页、卡包和未来详情页读取。
    retention: 本地应用数据生命周期内保留，当前需求不实现删除。
    isolation: CardRepository 是唯一 RDB 访问入口，UI 不直接访问表。
    cleanup: 写入失败不保留部分记录；应用卸载由系统清理。
    security: 完整卡号仅在内存业务对象与 RDB 中处理，所有 UI 必须显示掩码。

quality_attributes:
  - qa_id: qa-card-number-privacy
    category: security
    requirement: 完整卡号不得出现在可见文本、日志或测试失败输出；只允许后台对象和 RDB 使用。
    landing: MaskUtil 或专用纯函数统一生成前四后四掩码，日志只记录 bankCode 与结果状态。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    verification_refs:
      - AC-2
      - AC-4
  - qa_id: qa-navigation-recovery
    category: reliability
    requirement: 结果页完成后不可返回任何本轮开卡中间页面。
    landing: 统一导航收口方法按成功或失败目标重建/裁剪栈，结果页 onBackPressed 始终消费返回。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    verification_refs:
      - AC-5

semantic_conflicts: []
generated_graphs:
  - graph_id: graph-open-card-sequence
    label: 开卡主路径实现时序
    kind: sequence
    format: mermaid
    source_ref: view:runtime/flow:flow-open-card
    relation_refs:
      - relation:relation-runtime-data
      - relation:relation-ui-runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant E as 银行入口页
        participant T as 卡类型半模态
        participant C as 具体卡片页
        participant S as 验证码半模态
        participant O as BankCardOpeningService
        participant R as CardRepository/RDB
        participant P as 结果页
        U->>E: 点击银行
        E->>T: 传入 BankInfo
        U->>T: 选择卡类型并继续
        T->>C: 传入 bankCode 与 BankCardType
        U->>C: 选择掩码卡片并下一步
        C->>S: 传入完整 BankCandidate
        S-->>U: 自动发送并开始 60 秒倒计时
        U->>S: 输入六位数字并提交
        S->>O: submit(candidate)
        O->>R: saveBankCard(StoredCard)
        R-->>O: success 或 failure
        O-->>P: CardOpenResult(完整卡号, 结果)
        U->>P: 点击完成
        P-->>E: 清理开卡栈并到目标页面
