          page_attach:
            status: covered
            evidence_refs:
              - 验证码半模态打开时启动发送与倒计时
          page_detach:
            status: covered
            evidence_refs:
              - 页面销毁清理验证码计时器
          account_switch:
            status: not_applicable
            evidence_refs:
              - 本需求没有账号切换入口
          process_recreation:
            status: covered
            evidence_refs:
              - 已写入卡以 RDB 为准；未提交会话不恢复
          background_write:
            status: not_applicable
