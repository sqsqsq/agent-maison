review_summary:
  authored_by: codex-design-author
  title: bc-openCard-2 银行卡完整开卡流程
  background: 既有添卡页面和全部银行页已经展示银行列表，但点击银行只提示暂不支持，尚无卡类型选择、具体银行卡选择、短信验证、持久化和结果页闭环。
  problem: 用户无法从任一银行入口完成银行卡添加；卡号安全展示、完整数据入库、验证码倒计时和结果页清栈也没有统一责任边界。
  goals:
    - goal_id: goal-open-card
      statement: 从两个既有银行入口完成一致的银行卡开卡旅程并持久化结果。
      success_measures:
        - 银行点击后显示对应银行支持的卡类型，而非不支持提示
        - 仅在选择卡类型、具体卡片并输入六位数字验证码后允许提交
        - 成功写入完整卡数据并由结果页唯一完成出口清理本轮导航栈
        - 失败结果不污染卡库且回到最初添加卡片页面
  positioning: 在 WalletMain 内扩展既有添卡能力；Phone 仅登记新 NavDestination，不复制业务状态或存储逻辑。
  in_scope:
    - AddBankCardPage 与 AllBanksPage 的银行点击入口
    - 卡类型半模态、具体卡片全屏页、验证码半模态与添加结果页
    - Mock 银行卡数据、完整卡号后台传递、掩码展示与 RDB 卡片表
    - 60 秒短信倒计时、六位数字校验、重发、写库成功/失败结果传递
    - 结果页禁止返回并在完成时清理本轮开卡页面栈
    - 原有页面到新页面以及新页面返回/完成的路由回归测试
  non_goals:
    - 真实短信、真实银行网络、生产支付清算或 NFC 激活
    - 银行卡详情页；成功完成后本轮先回钱包首页
    - 协议富文本点击与真实协议页面
    - 修改架构 DSL、增删模块或改写模块职责
  questioning:
    status: complete
    provider_id: independent-questioning-bc-openCard-2
    authored_by: independent-questioning-agent-bc-openCard-2
    isolated_context: true
    frontier_budget: 1
    repeated_frontier_count: 0
    writes_ssot: false
    items:
      - question_id: q-view-logical-r2
        question: 逻辑视图是否完整定义模型、卡号边界、字段来源与结果契约？
        frontier_fingerprint: bc-openCard-2:view-logical:r2
        owner: component-design
        scope_kind: view
        scope_ref: view:logical
        disposition: answered_with_evidence
        answer: StoredCard 全部字段均有直接或默认映射；CardOpenResult 统一为 fullCardNumber、success、errorMessage，UI 只显示掩码。
        evidence_refs: [contract:contract-card-persistence, view:logical/node:logical-bank-card-opening]
        verification_refs: [AC-2, AC-4]
        provenance: &questioning_provenance
          source_kind: document
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.review.md
          observed_at: "2026-10-20T00:00:00-04:00"
          evidence_strength: observed
          extraction_method: isolated_review
