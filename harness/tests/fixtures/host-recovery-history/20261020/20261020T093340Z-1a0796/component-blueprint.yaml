design_views:
  - view_id: logical
    viewpoint_contract: app-logical@1
    applicability: applicable
    evolution_impact: changed
    stakeholders:
      - wallet-user
      - WalletMain-owner
    purpose: 定义银行能力、候选卡、开卡结果与持久化卡片的业务边界。
    current_state: 银行数据只有展示信息，点击入口没有开卡用例，CardRepository 也没有银行卡持久化契约。
    target_state: BankInfo 声明支持的卡类型与 Mock 候选卡；AccountService 提供账号 Mock 手机号；BankCardOpeningService 串联选择、验证码与 CardRepository RDB 写入。
    delta: 新增银行卡开卡领域模型、账号手机号字段、Mock 查询、验证码状态规则与完整卡数据持久化契约。
    decisions_and_gaps:
      - decision:decision-single-cu
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets
    nodes:
      - node_id: logical-bank-card-opening
        label: 银行卡开卡领域能力
        owner: WalletMain
        current_state: 无卡类型、候选卡或开卡聚合状态。
        target_state: 以 BankInfo、BankCandidate、StoredCard、CardOpenResult 表达完整卡号后台处理与掩码展示分离。
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
        acceptance:
          criteria:
            - id: AC-1
              priority: P0
              description: 添加银行卡页与全部银行页点击任一银行均打开该银行的卡类型半模态，默认 Mock 银行同时支持储蓄卡和信用卡且仅允许单选。
              testable: true
              verification_steps:
                - 分别从两个既有页面点击银行并核对同一银行参数和可选类型
                - 切换卡类型并确认同一时刻只有一个选中项
              expected_result: 不再出现暂不支持提示；继续按钮仅在有选择时可用。
              ut_layer: both
              ut_focus: 银行参数、类型集合与单选状态
              device_focus: 两入口、半模态布局和交互
            - id: AC-2
              priority: P0
              description: 具体卡片页按银行与卡类型展示 1 到 2 张 Mock 卡，只显示前四后四，后台对象始终保留完整卡号。
              testable: true
              verification_steps:
                - 选择不同银行和卡类型进入具体卡片页
                - 比较可见掩码与提交对象的完整卡号
              expected_result: 页面无完整卡号泄露，后续写库收到完整卡号。
              ut_layer: both
              ut_focus: 过滤、掩码和完整值传递
              device_focus: 选卡页面布局与选择反馈
            - id: AC-3
              priority: P0
              description: 验证码半模态打开即触发一次假发送并开始 60 秒倒计时；只接受六位数字，归零后允许重新发送并重启倒计时。
              testable: true
              verification_steps:
                - 打开半模态核对默认发送和倒计时
                - 输入不足六位、非数字和六位数字
                - 让倒计时归零并点击重新发送
              expected_result: 倒计时期间不能重发，只有六位数字使下一步可点击。
              ut_layer: both
              ut_focus: 状态机、校验与计时清理
              device_focus: 键盘类型、按钮状态与倒计时文本
            - id: AC-4
              priority: P0
              description: 验证码提交后尝试把完整卡数据写入 RDB，字段至少覆盖卡号、实体卡类别、银行、银行卡类型、添加时间、华为支付状态、银联闪付状态与交易记录。
              testable: true
              verification_steps:
                - 模拟写入成功并读取记录
                - 模拟写入失败并确认失败结果仍携带完整卡号
              expected_result: 成功时记录可读取且字段完整；失败时不产生部分记录，结果页仍得到完整卡号和失败状态。
              ut_layer: unit
              ut_focus: RDB 映射、事务失败和结果传递
            - id: AC-5
              priority: P0
              description: 结果页全屏且禁止系统返回；只能点击完成退出。成功时清理本轮开卡栈并回钱包首页，失败时清理流程栈并回最初添加卡片页面。
              testable: true
              verification_steps:
                - 分别进入成功和失败结果页尝试系统返回
                - 点击完成后检查导航栈与落点
              expected_result: 结果页不能左滑返回；完成后任何开卡中间页面均不可再次返回。
              ut_layer: both
              ut_focus: 完成目的地与清栈命令
              device_focus: 系统返回拦截、成功和失败实际页面栈
          boundaries:
            - id: BD-1
              priority: P0
              description: 写库失败必须进入失败结果并保持数据库原子性。
              scenario: RDB 写入抛错或返回失败
              handling: 捕获错误并生成失败 CardOpenResult，不将成功状态或半条记录留在数据库。
              expected_behavior: 仍进入失败结果页，完成后回到添加卡片页。
              ut_layer: both
              ut_focus: 失败原子性与结果映射
              device_focus: 失败页与完成落点
            - id: BD-2
              priority: P1
              description: 验证码页面离开时必须清理计时器与临时状态。
              scenario: 页面销毁或关闭验证码半模态
              handling: 清理倒计时器并丢弃未提交验证码状态。
              expected_behavior: 不发生后台继续计时、重复回调或意外写库。
              ut_layer: unit
              ut_focus: lifecycle cleanup
          performance:
            - id: NFR-1
              metric: 本地交互响应
              threshold: "100"
              unit: ms
              description: 除模拟验证码倒计时外，选择与按钮状态反馈应在 100ms 内更新。
              ut_layer: device
              ut_focus: none
              device_focus: 点击到视觉反馈
        contracts:
          data_models:
            - name: BankCandidate
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCandidate.ets
              kind: interface
              fields:
                - name: fullCardNumber
                  type: string
                  required: true
                  description: 完整卡号，仅后台状态与 RDB 使用，UI 必须通过掩码派生展示。
                - name: bankCode
