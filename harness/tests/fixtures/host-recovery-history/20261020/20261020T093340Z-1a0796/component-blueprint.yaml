        disposition: answered_with_evidence
        answer: 七步 ordered_steps 明确单次写入、结果页拦截返回、成功 clear 回根首页、失败 clear 后仅 push AddBankCardPage。
        evidence_refs: [view:runtime/flow:flow-open-card]
        verification_refs: [AC-4, AC-5, BD-1]
        provenance: *questioning_provenance
      - question_id: q-view-development-r2
