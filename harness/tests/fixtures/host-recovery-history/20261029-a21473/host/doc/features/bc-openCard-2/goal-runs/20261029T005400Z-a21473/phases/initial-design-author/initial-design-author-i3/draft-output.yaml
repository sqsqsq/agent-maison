    contracts:
      state_management:
      - name: 开卡流程
        ordered_steps: &id020
        - AddBankCardPage 或 AllBanksPage 的 handleSelectBank(bank) 打开 BankTypeSheet，bank 含 id/name/supportedTypes；默认两种，单选。
        - 'BankTypeSheet.confirm(type) 在已选择时调用 NavPathContext.stack().pushPath({name: BankCardSelectionPage, param:
          {bankId, bankName, cardType}})，弹层关闭。'
        - 'Phone 的 navDestinationMap(name, param) 分发 WalletMain 导出的 buildBankCardSelectionPage(param)；选卡页调用 BankRepository.getMockCards(bankId,
          cardType): BankCard[]，显示前四后四，选择卡并确认协议。'
        - 'BankCardSelectionPage 打开 OtpSheet，传所选完整 BankCard；OtpSheet 调用 AccountService.getInstance().getMockPhone():
          Promise<string> 显示账号 mock 手机号，读取失败提示并允许重试，不提交。'
        - OtpSheet 首次打开模拟发送并记录单调时钟截止点 now+60s，tick 根据截止点计算剩余秒数；恢复时重算，未到截止禁重发，到期可重新发送并重设截止点；仅六位数字可提交。
        - 'OtpSheet.confirmOtp(code) 取得同步提交锁，冻结取消及返回，调用 CardRepository.saveCard(card): Promise<SaveResult> 并等待；插入成功返回
          success=true，初始化/唯一约束/写入失败返回 success=false，不依赖持久记录取得卡号。'
        - '选卡页持有的原始 card.fullCardNumber 与 SaveResult.success 构造 AddCardResultParams，通过 NavPathContext.stack().pushPath({name:
          AddCardResultPage, param}) 交给 Phone 分发及结果页；无论失败与否均传完整卡号。'
        - 结果页禁止系统返回及侧滑；完成成功将完整卡号经一次性 HomeLaunchBridge 交给 HomeTabPage，删除 AddCardEntryPage 起本次所有目的页及可能的 CardPackPage
          以回根首页；完成失败 popToIndex(本次 AddCardEntryPage 索引)，保留该页，移除 AddBankCardPage、AllBanksPage 和后续页面。
        - 非提交时取消弹层清验证码/计时器，返回选卡或银行入口；返回选卡页销毁该页选择；提交中等待结果，禁止离开和再次提交。销毁页面取消 tick 并使迟到回调失效；结果交接消费后清除临时卡号，首页消费后清除一次性载荷。
        - 进程被杀不恢复 OTP/临时选择或伪造结果；下次进入首页重新读取 RDB：提交前中断无记录，提交后中断可能已有记录，以查询为准；用户可重新发起，重复卡返回失败结果。
