        contracts:
          state_management:
            - name: 开卡流程
              ordered_steps:
                - AddBankCardPage 或 AllBanksPage 点击银行，读取 BankRepository
                  的银行及支持类型并打开类型半模态。
                - 类型半模态选择一种类型并同意后，将银行与类型传给具体卡片页；返回时保留上层。
                - 具体卡片页按银行和类型读取 1–2 张 mock 卡，显示前四后四，选择并同意协议后打开验证码半模态。
                - 验证码半模态读取 AccountService 的 mock 手机号，首次打开模拟发送，60 秒倒计时；仅 6
                  位数字启用下一步，归零可重发。
                - 提交锁防连点，携带完整卡对象调用 CardRepository.saveCard，等待 RDB
                  成功或失败；重复卡号按唯一约束返回失败。
                - 结果页接收完整卡号和结果，屏蔽返回与侧滑；完成时成功清理从添卡入口开始的流程并回钱包首页携带卡号，失败清理到最初添加卡片页面。
                - 中途返回或取消清理临时选择与计时器；进程中断不伪报成功，已提交数据以数据库为准。
