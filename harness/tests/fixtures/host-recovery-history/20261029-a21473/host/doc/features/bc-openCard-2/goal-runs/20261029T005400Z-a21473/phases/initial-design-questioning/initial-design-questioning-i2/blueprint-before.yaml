generated_graphs:
  - graph_id: open-card-sequence
    label: 开卡时序
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        participant User as 用户
        participant Page as 开卡页面
        participant Account as 账号服务
        participant Repo as 卡仓库
        participant DB as RDB
        User->>Page: 选择银行类型和卡片
        Page->>Account: 获取 mock 手机号
        Account-->>Page: 手机号
        User->>Page: 输入六位验证码
        Page->>Repo: 保存完整卡片
        Repo->>DB: 写入卡片
        DB-->>Repo: 成功或失败
