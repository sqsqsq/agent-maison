        UIAbilityContext 调用 getRdbStore；首次以事务创建 cards 和版本
        1，建表/打开失败返回保存失败；升级在事务内迁移并保留原数据，失败回滚且不降版或删库。
      retention: 卡片记录持续保留供详情读取；本需求不新增删卡。瞬态验证码与交接参数在取消、退出或消费后清除。
