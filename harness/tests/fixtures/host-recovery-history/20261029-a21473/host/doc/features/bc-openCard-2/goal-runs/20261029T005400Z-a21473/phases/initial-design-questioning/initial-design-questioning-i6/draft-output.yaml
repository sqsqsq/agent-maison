generated_graphs:
  - graph_id: selection-sequence
    label: 银行与选卡
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant E as 银行入口
        participant T as 类型半模态
        participant P as 选卡页
        U->>E: 点击银行
        E->>T: 传银行和支持类型
        U->>T: 单选并继续
        T->>P: pushPath 银行和类型
        P-->>U: 显示脱敏卡片
  - graph_id: save-sequence
    label: 验证与保存
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant P as 选卡页
        participant O as 验证码半模态
        participant A as AccountService
        participant R as CardRepository
        participant D as RDB
        U->>P: 选择卡并继续
        P->>O: 完整卡片
        O->>A: getMockPhone()
        A-->>O: 手机号
        U->>O: 输入六位数字并提交
        O->>R: saveCard(card)
        R->>D: 插入完整卡
        D-->>R: 确认或失败
        R-->>O: SaveResult
  - graph_id: result-sequence
    label: 结果与清栈
    format: mermaid
    source_view_id: runtime
    content: |-
      sequenceDiagram
        actor U as 用户
        participant P as 选卡页
        participant R as 结果页
        participant N as 根导航栈
        participant H as 钱包首页
        P->>R: 完整卡号与保存结果
        U->>R: 点击完成
        alt 成功
          R->>N: 清除至首页
          R->>H: bridge 发布并通知监听，首页消费完整卡号
          H->>H: 调用 listCards 并刷新或提示重试
        else 失败
          R->>N: 清除至添加卡片页
        end
