  initialization:
    disposition: answered_with_evidence
    answer: 以应用 UIAbilityContext 调用 getRdbStore；首次以事务创建 cards 和版本
      1，建表/打开失败返回保存失败；升级在事务内迁移并保留原数据，失败回滚且不降版或删库。 设计采用应用私有
      RDB，SecurityLevel.S1、encrypt=true；不记录全卡号或验证码日志。实际 SDK StoreConfig 类型已在本机
      SDK 声明 securityLevel 与 encrypt（API 9）；目标兼容 API
      21。设备实际加密开库尚未验证，施工时验证，失败不得静默降级，返回设计责任方。交易记录默认值使用 SQL 单引号字面量 '[]' 并显式写入。
    evidence_refs:
