  title: 银行卡开卡
  summary: 从两个银行入口选择卡类型和卡片，模拟验证码后持久化并按结果清栈。
  background: 现有银行入口提示暂不支持。
  scope: mock 银行卡、验证码、RDB、结果页及路由兼容；不实现真实短信、NFC 激活或银行卡详情。
  admission:
    status: blocker
    root_questions_complete: false
    blocker_refs:
      - blueprint_questioning_provider_missing
  reader_guide:
    source_digest: sha256:f43040619bf13c2bf7507c116262fb664ccc1749803823a0db839078432170d9
    sections:
      - section: flows
        title: 选择银行和卡片
        prose: 两个现有银行入口均打开类型选择；继续后选卡页按银行和类型加载 mock 卡。
        source_refs:
          - /design_views/2/runtime_data_flows/0/ordered_steps
        graph_ids:
          - selection-sequence
      - section: flows
        title: 验证和保存
        prose: 验证码页读取账号 mock 手机号并启动倒计时。输入六位数字后等待仓库确认，失败同样保留原始卡号。
        source_refs:
          - /design_views/2/runtime_data_flows/0/ordered_steps
        graph_ids:
          - save-sequence
      - section: flows
        title: 结果与完成
        prose: 结果页接收完整卡号和结果；成功清栈后通知首页消费一次性卡号并查询数据库，失败返回添加卡片页。首页重建也查询，读取失败提示并可重试。
        source_refs:
          - /design_views/2/runtime_data_flows/0/ordered_steps
        graph_ids:
          - result-sequence
