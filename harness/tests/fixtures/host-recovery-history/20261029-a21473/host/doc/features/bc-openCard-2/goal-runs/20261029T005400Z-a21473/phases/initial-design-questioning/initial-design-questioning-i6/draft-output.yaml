      database: wallet_cards.db
      version: 1
      security: 应用私有 RDB，SecurityLevel.S1、encrypt=true；宿主 SDK StoreConfig 声明
        securityLevel 和 encrypt（API 9 起），设备加密打开失败按保存失败处理，禁止静默降级；不记录完整卡号或验证码日志。
