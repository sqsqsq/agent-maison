      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  capability_seams:
    disposition: answered_with_evidence
    answer: "AccountService.getMockPhone(): Promise<string> 独立于
      getUserProfile；CardRepository.saveCard(BankCard):
      Promise<SaveResult>，失败不需要数据库 ID。"
    evidence_refs:
