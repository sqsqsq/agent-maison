app_lens:
  module_boundaries:
    disposition: answered_with_evidence
    answer: WalletMain 管理页面与卡数据，AccountManager 提供账号 mock 手机，Phone index 注册两个新
      builder；通过各模块 index.ets 出口。
    evidence_refs:
