      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  feature_flags:
    disposition: answered_with_evidence
    answer: 本次不新增开关；保留既有入口和其他路由。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
  data_producers_consumers:
    disposition: answered_with_evidence
    answer: 选卡页持有完整 BankCard；保存结束后以 AddCardResultParams 将原卡号和成功标志交结果页；成功完成以
      HomeLaunchBridge 一次性交首页，消费即清除。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  lifecycle_triggers:
    disposition: answered_with_evidence
    answer: 打开即模拟发送，单调时钟截止点 60 秒；恢复重算，销毁取消 tick 和迟到回调；提交期间禁止返回直至保存结果。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  state_owners:
    disposition: answered_with_evidence
    answer: OpenCardFlow/当前页面持有瞬态选择、OTP 和提交锁；结果页持有结果参数；首页一次性消费；数据库是已提交数据唯一真源。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  initialization:
    disposition: answered_with_evidence
    answer: 以应用 UIAbilityContext 调用 getRdbStore；首次以事务创建 cards 和版本
      1，建表/打开失败返回保存失败；升级在事务内迁移并保留原数据，失败回滚且不降版或删库。 设计采用应用私有
      RDB，SecurityLevel.S1、encrypt=true；不记录全卡号或验证码日志。实际 SDK
      的加密配置和设备支持须在施工前通过工具链核实，若不可用不得静默降级，返回设计责任方。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  publication_subscription:
    disposition: answered_with_evidence
    answer: Phone 根路由分发带参数的两个新页面；成功通过一次性 HomeLaunchBridge 传首页，失败仅回 AddCardEntryPage。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  ui_refresh:
    disposition: answered_with_evidence
    answer: 选择、协议、6 位输入、倒计时与提交锁驱动按钮；结果根据 success 切换图标、标题和提示。四页面分别对照原图 3–6，协议纯文本。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
  process_recovery:
