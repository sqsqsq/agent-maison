flow_id: bank_card_opening_failure
flow_name: 银行卡开卡保存失败
module: WalletMain
version: "1.0"
flow_type: usecase_driven
use_case: UC-1
branches: [BR-FAILURE]
linked_acceptance: [AC-4, AC-6]
linked_boundaries: [BD-3]
entry_point:
  module: WalletMain
  file: 02-Feature/WalletMain/src/main/ets/domain/service/BankCardOpeningService.ets
  function: saveCandidate
nodes:
  - id: start
    type: user_trigger
    description: 提交已完成门禁的开卡候选
    trigger: { event: saveCandidate, simulated_value: candidate, from_branch: BR-FAILURE }
    next: [saving]
  - id: saving
    type: state_transition
    description: 进入保存阶段
    transition: { from_phase: OTP_ACTIVE, to_phase: SAVING, field_updates: {} }
    next: [save]
  - id: save
    type: port_call_local
    description: 保存边界抛出异常
    source: { file: 02-Feature/WalletMain/src/main/ets/data/repository/BankCardRepository.ets, function: save, class: BankCardRepository }
    boundary: { name: BankCardRepository, type: BankCardRepository, method: save }
    stub_strategy: throw
    spy_preset: save_failure
    next: [result]
  - id: result
    type: state_transition
    description: 进入失败结果阶段
    transition: { from_phase: SAVING, to_phase: RESULT, field_updates: { success: false } }
    next: [assert]
  - id: assert
    type: assertion
    description: 失败结果仍保留后台完整卡号且无成功记录
    linked_branch: BR-FAILURE
    linked_acceptance: [AC-4, AC-6]
    assertions:
      - { type: state_check, target: result.success, expected: "false" }
      - { type: error_check, target: result.errorMessage, expected: RDB_SAVE_FAILED }
      - { type: port_call_log, target: repository.callLog, expected: "['save']" }
    next: []
