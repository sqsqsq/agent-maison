        target_field: CardOpeningResult.failureReason
        rule: 失败时写入本地原因，成功时保持空值。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/8
        provenance: *a1
        verification_refs:
