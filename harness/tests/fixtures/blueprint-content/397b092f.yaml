contracts:
  - contract_id: bank-card-opening
    label: 本地银行卡开卡提交契约
    owner: WalletMain domain
    needed_by: bank-card-opening-blueprint
    operation:
      operation_id: commitBankCardOpening
      direction: local
      version: "1"
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/operation
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md
    request_dto:
      dto_id: CardOpeningCommitRequest
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/request_dto
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md
      fields:
        - field_id: bankCode
          type: string
          semantics: BankRepository 中的稳定银行短码。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/request_dto/fields/0
          provenance: &a1
            source_kind: product_requirement
            source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            source_revision: bc-openCard-2
            observed_at: 2026-10-15
            evidence_strength: authoritative
            extraction_method: direct_local_source
        - field_id: bankName
          type: string
          semantics: 银行展示名称。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/request_dto/fields/1
          provenance: *a1
        - field_id: bankCardType
          type: debit|credit
          semantics: 本次选择的储蓄卡或信用卡。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/request_dto/fields/2
          provenance: *a1
        - field_id: fullCardNumber
          type: string
          semantics: 完整银行卡号；不得进入 UI、日志、Toast 或埋点。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/request_dto/fields/3
          provenance: *a1
        - field_id: flowId
          type: string
          semantics: 本次开卡会话标识，与完整卡号共同形成提交幂等键。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/request_dto/fields/4
          provenance: *a1
    response_dto:
      dto_id: CardOpeningResult
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/response_dto
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md
      fields:
        - field_id: success
          type: boolean
          semantics: RDB 写入或幂等命中成功为 true。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/response_dto/fields/0
          provenance: *a1
        - field_id: fullCardNumber
          type: string
          semantics: 无论成功或失败都携带本次完整卡号，只供结果交接和后续路由使用。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/response_dto/fields/1
          provenance: *a1
        - field_id: recordId
          type: string
          semantics: 成功时的数据库记录标识，失败时为空。
          nullable: true
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/response_dto/fields/2
          provenance: *a1
        - field_id: failureReason
          type: string
          semantics: 失败时供结果页映射用户文案的本地原因，成功时为空。
          nullable: true
          source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/response_dto/fields/3
          provenance: *a1
    mappings:
      - mapping_id: map-bank-code
        kind: direct
        source_fields:
          - bankCode
        target_field: BankCardRecord.bankCode
        rule: 原值写入。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/0
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-bank-name
        kind: direct
        source_fields:
          - bankName
        target_field: BankCardRecord.bankName
        rule: 原值写入。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/1
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-card-type
        kind: direct
        source_fields:
          - bankCardType
        target_field: BankCardRecord.bankCardType
        rule: debit 或 credit 原值写入。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/2
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-full-card-number
        kind: direct
        source_fields:
          - fullCardNumber
        target_field: BankCardRecord.fullCardNumber
        rule: 写入加密 RDB，同时派生 maskedCardNumber 供展示。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/3
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-flow-id
        kind: derivation
        source_fields:
          - flowId
        target_field: submitIdempotencyKey
        rule: 与 fullCardNumber 组合用于一次会话内防重复提交，不持久化。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/4
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-success
        kind: derivation
        source_fields:
