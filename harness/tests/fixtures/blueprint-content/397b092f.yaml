        target_field: CardOpeningResult.success
        rule: 根据 insertOrGetByCardNumber 的成功或异常结果生成。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/5
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-result-card-number
        kind: direct
        source_fields:
          - fullCardNumber
        target_field: CardOpeningResult.fullCardNumber
        rule: 无论成功或失败均原值交接，结果页不展示。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/6
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-record-id
        kind: direct
        source_fields:
