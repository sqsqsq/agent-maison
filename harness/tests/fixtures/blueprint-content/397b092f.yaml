        target_field: CardOpeningResult.recordId
        rule: 成功时写入，失败时保持空值。
        source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/7
        provenance: *a1
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
      - mapping_id: map-failure-reason
        kind: direct
        source_fields:
