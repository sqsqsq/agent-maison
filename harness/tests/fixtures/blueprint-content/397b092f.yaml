    errors:
      semantics:
        - code: local-rdb-open-failed
          behavior: 返回失败结果且不创建记录。
        - code: local-rdb-write-failed
          behavior: 返回失败结果且不伪造 recordId。
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/errors
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md
    idempotency:
      key: flowId+fullCardNumber
      scope: 当前提交会话；数据库以 full_card_number 唯一约束处理跨会话重复卡。
      repeated_result: 返回既有 recordId 和成功结果，不插入第二行。
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/idempotency
      verification_refs:
        - acceptance:BD-5
    nfr:
      privacy: 完整卡号不得进入 UI、日志、Toast、埋点或未加密存储。
      responsiveness: 正常本地写入两秒内进入结果页。
      accessibility: 所有单选、关闭和主按钮提供可读标签与可操作状态。
      source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/nfr
      verification_refs:
        - acceptance:BD-2
        - acceptance:NFR-1
    table_schema:
      database: wallet_cards.db
      version: 1
      security_level: S4
      encrypt: true
      tables:
        - name: bank_cards
          primary_key: record_id
          columns:
            - name: record_id
              type: TEXT
              description: UUID 字符串，单条银行卡记录主键。
              constraints:
                - PRIMARY KEY
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: full_card_number
              type: TEXT
              description: 完整银行卡号，仅存于加密数据库和领域对象。
              constraints:
                - NOT NULL
                - UNIQUE
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: masked_card_number
              type: TEXT
              description: 前四后四展示值，用于避免查询后再把完整卡号交给 UI。
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: category
              type: TEXT
              description: 卡片大类，本轮固定 bank_card，保留交通卡和门禁卡扩展语义。
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: bank_code
              type: TEXT
              description: 银行稳定短码。
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: bank_name
              type: TEXT
              description: 银行显示名称。
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: bank_card_type
              type: TEXT
              description: debit 或 credit。
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: added_at
              type: INTEGER
              description: 添加成功时的 Unix 毫秒时间戳。
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: huawei_pay_enabled
              type: INTEGER
              description: 0/1 布尔，本轮默认 0，不代表真实开通。
              default: 0
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: unionpay_quickpass_enabled
              type: INTEGER
              description: 0/1 布尔，本轮默认 0，不代表真实开通。
              default: 0
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
            - name: transaction_records_json
              type: TEXT
              description: 交易记录 JSON 数组，本轮默认 []，后续页面只读解析。
              default: "[]"
              constraints:
                - NOT NULL
              source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          constraints:
            - full_card_number 必须唯一，重复卡返回既有记录。
          upgrade: v1 首次建表；后续版本只允许向前迁移，不删除 full_card_number 唯一约束。
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    provenance: *a1
