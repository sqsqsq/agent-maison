# Read-only target-content extraction; source: .codex/reports/reader-oriented-6b3f8c21/final-closeout/final-workspace/doc/features/bc-openCard-2/blueprint/component-blueprint.yaml
# Source SHA256: 2f80825dfa3d6d93d7b6f95a8dae07fed342720d6bd0fb16ba1e56a05bcaece9
# All typed target content and original array indices retained; no content corrected.
blueprint_id: bc-openCard-2
design_views:
  - view_id: logical
    nodes:
      - node_id: bank-capability
      - node_id: card-ledger
      - node_id: open-session
  - view_id: runtime
    nodes:
      - node_id: opening-state
    runtime_data_flows:
      - flow_id: bank-opening
        contracts:
          state_management:
            - data: BankOpenState
              scope: page_session
              decorator: ordinary_class
              holder: BankOpenFlow
              module: WalletMain
              owner_ref: view:development/node:open-flow
              contract_refs:
                - contract:local-card-save
              ordered_steps:
                - "【01
                  银行目录/旧入口】AddBankCardPage.loadBanks或AllBanksPage.loadGroups →
                  await BankRepository.getBanks():
                  Promise<BankInfo[]>；返回20家mock银行及supportedCardTypes。两页继续使用原有排序\
                  /展开/分组/索引组件；异常仍为各自空态/资源化错误，不调用开卡save。此处是先加载列表，再由用户点银行，不画用户直接调\
                  用业务对象。"
                - 【02 创建本轮依赖】Phone
                  Index的navDestinationMap以WalletMain出口装配入口页，向本轮BankOpeningNavigation注入现有NavPathContext.stack()同源栈和Index.handleBankOpeningCompleted(cardNumber)回调。入口页用宿主Context创建BankCardRepository/CardRdbHelper依赖，将BankRepository、AccountService.getInstance()和既有clock函数注入一个普通BankOpenFlow；没有第二个导航栈、全局flow注册表或短信provider。
                - "【03
                  银行点击/账号快照】AddBankCardPage.handleBankTap(bank)或AllBanksPage.ha\
                  ndleBankTap(bank) → await flow.start(bank):
                  Promise<void>。Flow拒绝重复活动会话，生成一次sessionId，await
                  AccountService.getUserProfile():
                  Promise<UserProfile>，捕获accountId与phoneNumber/登录态，读取bank.suppo\
                  rtedCardTypes并默认第一项，进入ChoosingType。start返回void，UI通过已绑定onState\
                  Changed(state)取得快照，不把void误写为卡列表返回值。"
                - "【04 入口导航边界】银行入口页 → navigation.begin(flow):
                  boolean；助手调用同源NavPathStack.getAllPathName()记录起始AddBankCard及可确\
                  认的钱包祖先路径，并核对sessionId。true才展示BankCardTypeSheet；false保持原银行页错误态\
                  、flow.cancel()清草稿，不产生选卡路由或RDB写入。正常路径已有导航上下文由入口预置，单元用例可使用同一夹具，\
                  不新增业务分支。"
                - "【05 支持类型/文本同意】BankCardTypeSheet的单选事件 → flow.chooseType(type):
                  void，仅允许supportedCardTypes中一个值；两类或单类展示随银行数据，更换类型重置卡片及协议。用户点“同\
                  意并继续” → await flow.continueToCards(): Promise<void>；Flow await
                  BankRepository.getCards(bank.code,selectedType):
                  Promise<BankCardInfo[]>。返回完整16位合成卡，Flow保存cards并通知UI；空数组、读取错误或\
                  银行/类型不匹配显示错误并禁下一步，不调用showSelection或save。"
                - "【06
                  全屏选卡/同一会话交接】continueToCards返回且state.cards非空后，BankCardTypeShee\
                  t/入口页的具名继续处理 → navigation.showSelection(flow):
                  boolean；导航助手调用NavPathStack.pushPath({name:BankCardSelectionPa\
                  ge,param:{flow,navigation,sessionId}})。true后关闭类型sheet，BankCar\
                  dSelectionPage.onReady从内存param核对sessionId并接管同一个Flow的最终销毁责任；旧银\
                  行页隐藏只off本页状态回调，不dispose已转交Flow。push失败返回false，原类型sheet保留可重试，未转\
                  移owner、不再次读写卡库。"
                - "【07 卡片与协议】BankCardSelectionPage的卡行事件 → flow.chooseCard(card):
                  void，核对完整bankCode/bankCardType及目录成员；显示值经BankCardMaskUtil.mask\
                  CardNumber(card.cardNumber)保留前四后四，内部selectedCard仍为完整卡。协议check\
                  box → flow.setAgreement(accepted):
                  void；选卡/协议缺任一，下一步不可用。更换银行/类型不继承旧卡或旧协议。"
                - "【08 拉起OTP与首次假发送】BankCardSelectionPage下一步 → await
                  flow.openOtp(): Promise<void>。Flow先检查卡片及协议，await
                  AccountService.getUserProfile()核对捕获账号、登录态和手机号；未登录/账号已变/手机号不可用\
                  不进入WaitingOtp，按既有引导登录或取消语义处理。合法时仅执行一次内部模拟发送（无网络/真实短信），保存resen\
                  dDeadlineMs=clock()+60000、WaitingOtp和phoneNumber并通知状态；Page在vo\
                  id返回及状态就绪后展示BankOtpSheet。手机号展示用现有MaskUtil.maskPhone(state.pho\
                  neNumber)，不打印完整值。"
                - "【09 OTP输入/重发】BankOtpSheet输入事件 → flow.setOtp(value):
                  void，仅接受ASCII数字且最多6位；恰好6位才允许下一步。可见timer或页面warm resume →
                  flow.refreshCountdown():
                  void，按max(0,ceil((deadline-clock())/1000))重算，不累加漏掉的tick。重发按钮 →
                  flow.resendOtp():
                  void；剩余>0直接无副作用返回，归零后内部再假发送一次并重置60秒，仍无Repository/短信网络调用。"
                - "【10 关闭OTP/监听清理】BankOtpSheet关闭 → flow.cancelOtp():
                  void，清验证码/计时器回ChoosingCard，保留该页选卡及协议，重新openOtp重新核对账号并只假发送一次。类\
                  型sheet关闭、选卡真正返回退出 →
                  flow.cancel()/dispose()，清原始参数与账号监听；前进到结果只隐藏/解绑当前UI，不销毁仍有效Flow\
                  。账号监听沿AccountService.onLoginStateChanged/offLoginStateChanged\
                  同引用注册/释放，回调重取UserProfile后交flow.handleAccountChanged(accountId\
                  )。"
                - "【11 OTP提交前校验/await账号】BankOtpSheet下一步具名处理 → await
                  flow.confirmOtp():
                  Promise<BankOpenResult|null>。Flow先检查6位数字、匹配selectedCard、agree\
                  mentAccepted、sessionId和非Submitting；无效返回null且不调用AccountService\
                  或save。合法时await
                  AccountService.getUserProfile()复核accountId；变化时Cancelled/清码并返回\
                  null，不落库。相同账号才锁住Submitting，捕获该accountId/完整cardNumber/银行/两层卡类型\
                  /首次addedAt/支付flag=false/transactionsJson=[]构造WalletCardRecord\
                  ，await cardRepo.save(record)。"
                - "【12 Repository到真实设计helper】BankCardRepository.save(record) →
                  await CardRdbHelper.getStore(context):
                  Promise<relationalStore.RdbStore>。helper复用同一个在途开库Promise，调用aw\
                  ait
                  relationalStore.getRdbStore(context,{name:wallet_cards.db,sec\
                  urityLevel:S4,encrypt:true})，await
                  ensureSchema(store)。getStore/ensureSchema是本次已有CardRdbHelper文件\
                  内补明的方法签名，不新增层/文件。开库失败抛DB_OPEN_FAILED，建表/版本失败分别抛DB_SCHEMA_FAIL\
                  ED/DB_VERSION_UNSUPPORTED，原链返回给save/confirmOtp，不回退明文。"
                - "【13 库版本/创建确认】CardRdbHelper.ensureSchema(store):
                  Promise<void>读取store.version；v0按根table_schema在事务中CREATE TABLE
                  IF NOT EXISTS
                  cards及已声明主键/CHECK，所有建表操作成功后才置v1并确认；v1直接复用；>1拒绝降级或删库重建。事务失败按平台\
                  能力回滚并抛DB_SCHEMA_FAILED，helper不返回可用store。初建不等于银行卡已保存，只有下一步保存/查\
                  询确认才算添卡成功。"
                - 【14
                  唯一键写入/完整返回】获得RdbStore后，BankCardRepository.save把WalletCardRecord按根mapping转换为snake_case列值（boolean↔0/1、有效JSON数组），await
                  RdbStore.executeSql的参数绑定INSERT OR IGNORE语句，然后await
                  RdbStore.query按(account_id,card_number)查询确认；读取ResultSet并在finally关闭。新行或已有同行都映射成直接WalletCardRecord返回，重复卡保留首次addedAt和原支付状态；未确认/查询异常抛DB_CONFIRM_FAILED，写入异常抛DB_WRITE_FAILED，不使用replace/delete-upsert。数据库确认→Repository返回→Flow
                  await完成的顺序不能省略。
                - 【15 Flow返回成功/失败/已销毁】cardRepo.save
                  resolve真实记录后，仍有效Flow才构造result={sessionId,accountId,cardNumber完整,success:true,errorCode空}、清OTP/timer，发布commit-result并进入Success；save
                  reject则构造本轮原完整卡号、success:false/errorCode，发布同一结果通道并Failed。状态回调是页面快照，不是RDB真源。如果save
                  pending期间dispose，原捕获账号写入可完成，但Flow不更新已销毁UI且confirmOtp返回null；进程重建丢草稿、不自动补提交。
                - "【16 提交中账号切换】save pending时AccountService账号变化回调 →
                  flow.handleAccountChanged(newId):
                  void；Flow只记录消费端账号已变，仍await原record.accountId的save，不将记录改绑新账号。已有\
                  account_change_during_submit/dispose_during_submit夹具在controll\
                  ed_promise.before_resolve中注入事件，不把交错伪画成confirmOtp返回后的普通顺序调用。旧账\
                  号结果可完成；向新账号首页传空号。"
                - "【17 拉起结果/重试与返回拦截】confirmOtp
                  resolve非null后由BankOtpSheet的具名提交处理（UI消费方）→
                  navigation.showResult(result):
                  boolean；导航助手关闭OTP并调用NavPathStack.pushPath({name:BankOpenResul\
                  tPage,param:{result,navigation}})。结果页只显示success/error的脱敏图文，不显\
                  示/日志完整卡号；push失败false保留提交快照并可再次showResult，同一次成功/失败不可再次save。结果N\
                  avDestination.onBackPressed → navigation.rejectBack():
                  true，禁止左右侧滑/系统返回；只有完成按钮可调用finish。"
                - "【18
                  完成与当前账号】BankOpenResultPage完成具名处理先取得当前AccountService/UserProfi\
                  le账号（可复用仍有效账号监听快照），然后 →
                  navigation.finish(result,currentAccountId):
                  boolean。助手getAllPathName预检原路径快照、当前session/页面参数及可确认的钱包祖先；不匹配或上\
                  下文失败返回false、保留结果供完成重试，禁止clear全栈、禁止再save。双入口经过AllBanks的路径由同一捕获\
                  快照判断，不按路由字符串猜任意外来页的归属。"
                - 【19 成功完成链】预检通过且result.success=true，BankOpeningNavigation →
                  NavPathStack.removeByIndexes(已确认本轮钱包祖先和后缀索引)，然后调用构造时Phone注入的onHome(cardNumber或空串)。当前账号仍等于result.accountId才传完整cardNumber；账号变化传空串。onHome实际绑定Index.handleBankOpeningCompleted(cardNumber)，Index置首页Tab并以短期prop交HomeTabPage；助手内部随后flow.markCompleted()/dispose()一次并返回true。Root负责Tab/参数，不把所有navStack操作画给Flow。
                - 【20
                  失败完成链】预检通过且result.success=false，BankOpeningNavigation先removeByIndexes起始AddBankCard及以上旧本轮后缀，保留下方原CardPack/AddCardEntry，再pushPath一个新的AddBankCardPage；流程消费完成后内部markCompleted()/dispose()一次，返回true。不调用onHome/find或save，不留下旧选卡/OTP/结果；导航错误仍走既有BD-6恢复责任，不新造路由机制。
                - "【21
                  首页完整卡号消费/只读确认】Index.handleBankOpeningCompleted把短期完整号交HomeTabP\
                  age.consumeOpenedCard(cardNumber): Promise<void>并由页面等待消费。Home
                  await AccountService.getUserProfile()取得当前账号；有号时await
                  BankCardRepository.find(accountId,cardNumber):
                  Promise<WalletCardRecord|null>，无号/冷启动/onShown晚加入时await
                  hasCards(accountId):
                  Promise<boolean>。Repository复用helper.getStore、按账号约束query、final\
                  ly关闭ResultSet，返回记录/存在布尔；当前账号/页面仍有效才更新UI并清短期号，旧异步回应丢弃，查询失败显示首页\
                  错误态而不改已有开卡结果。"
                - 【22
                  首页恢复与显示优先】当前账号RDB有卡优先WITH_CARD；RDB空时复用HomeRepository.getCardDisplayMode()既有演示override，不把演示写成存储事实。cold
                  start、warm
                  resume/onShown和账号切换时只重查当前账号RDB，无全局成功缓存；v0清数据可重建空库，>1错误不破坏旧记录。原已存卡的跨会话重复仍由(accountId,cardNumber)唯一键去重，后续详情/交易/NFC不在本期调用链。
              lifecycle_triggers:
                - cold_start
                - warm_resume
                - page_attach
                - page_detach
                - account_switch
                - process_recreation
                - background_write
              failure_recovery:
                recovery_id: restart
                handling: 本地读空/失败禁继续；DB错误展示失败；取消清OTP不落库；导航失败留结果可重试；进程重建只查库不恢复验证码；账号变化隔离捕获账号；提交已确认而showResult
                  push失败留原页提交快照和具名重试入口，禁再次save；finish失败保留结果；生命周期UI回调与RDB提交事实分开。
                retry: 用户重新选择或完成重试；同卡跨会话幂等，DB未知版本不删库
              mutations:
                - mutation_id: commit-card
                  kind: user
                  owner: view:development/node:card-data
                  persistence_ref: wallet_cards.db/cards
                  publication_ref: publication:commit-result
                  recovery_ref: recovery:restart
              publications:
                - publication_id: commit-result
                  payload: BankOpenResult
                    {sessionId,accountId,cardNumber完整,success,errorCode}；仅当前存活会话及同账号consumer可接收
                  timing: save完成或失败后一次；不广播银行卡记录
              subscriptions:
                - subscription_id: page-state
                  consumer_ref: consumer:result-page
                  attach: 旧银行入口创建flow并读快照，选卡push成功后同一flow转交选卡页；每个可见UI绑定一次同引用回调
                  detach: 仅隐藏解绑显示回调；真正取消/finish成功/销毁时才dispose，父页隐藏不销毁已转交flow
                  cleanup: 移除同一回调/账号监听、清timer；sessionId失效后忽略异步UI写入；showResult后选卡页仅隐藏保持flow，结果finish成功后由助手统一清理；结果压栈失败保留原owner。
                  replay_or_snapshot: 新挂载读取当前BankOpenState；结果参数为提交快照，不重新写入
                  ordering: 先提交确认，再结果；先预检清栈再完成，不让旧会话覆盖新页
                  publication_ref: publication:commit-result
              consumers:
                - consumer_id: result-page
                  initial_load_ref: initial-load:load
                  update_ref: publication:commit-result
                  ref: view:development/node:result-ui
                - consumer_id: home
                  initial_load_ref: initial-load:load
                  update_ref: publication:commit-result
                  ref: view:development/node:home-ui
                  handling: Index.handleBankOpeningCompleted→HomeTabPage.consumeOpenedCard(profile/find或hasCards)，仅当前账号接受完整卡号；失败保留页面错误态；首次/onShown再次按账号查询
        use_cases:
          schema_version: "2.0"
          use_cases:
            - id: bank_opening
              description: 银行类型/具体卡/OTP/RDB/结果完成的单一会话，所有入口调用可测试命名方法
              coordinator: BankOpenFlow
              coordinator_file: 02-Feature/WalletMain/src/main/ets/domain/flow/BankOpenFlow.ets
              ui_bindings:
                - ui: AddBankCardPage
                  role: entry
                  subscribes: []
                  user_actions:
                    - trigger: 点击银行
                      calls: flow.start
                - ui: AllBanksPage
                  role: entry
                  subscribes: []
                  user_actions:
                    - trigger: 点击银行
                      calls: flow.start
                - ui: BankCardTypeSheet
                  role: dialog
                  subscribes:
                    - flow.state.phase=ChoosingType
                  user_actions:
                    - trigger: 单选卡类型
                      calls: flow.chooseType
                    - trigger: 同意并继续
                      calls: flow.continueToCards
                    - trigger: 关闭
                      calls: flow.cancel
                    - trigger: continueToCards成功后全屏跳转
                      calls: navigation.showSelection
                - ui: BankCardSelectionPage
                  role: entry
                  subscribes:
                    - flow.state.phase=ChoosingCard
                  user_actions:
                    - trigger: 选择卡片
                      calls: flow.chooseCard
                    - trigger: 勾选协议
                      calls: flow.setAgreement
                    - trigger: 下一步
                      calls: flow.openOtp
                - ui: BankOtpSheet
                  role: dialog
                  subscribes:
                    - flow.state.phase=WaitingOtp
                  user_actions:
                    - trigger: 输入数字
                      calls: flow.setOtp
                    - trigger: 倒计时归零重发
                      calls: flow.resendOtp
                    - trigger: 下一步
                      calls: flow.confirmOtp
                    - trigger: 关闭
                      calls: flow.cancelOtp
                    - trigger: 确认结果后跳结果/失败重试
                      calls: navigation.showResult
                    - trigger: 恢复/可见tick
                      calls: flow.refreshCountdown
                    - trigger: 账号变化通知
                      calls: flow.handleAccountChanged
                    - trigger: 销毁
                      calls: flow.dispose
                - ui: BankOpenResultPage
                  role: result
                  subscribes:
                    - result.success
                  user_actions:
                    - trigger: 点击完成
                      calls: navigation.finish
                    - trigger: 系统返回/侧滑
                      calls: navigation.rejectBack
                - ui: HomeTabPage
                  role: passive
                  subscribes: []
                  user_actions:
                    - trigger: 接收完整卡号并首次/onShown重查
                      calls: home.consumeOpenedCard
              data_boundaries:
                - name: bankRepo
                  type: BankRepository
                  kind: storage
                  methods:
                    - name: getCards
                      params:
                        - string
                        - BankCardType
                      returns: Promise<BankCardInfo[]>
                      async: true
                - name: accountService
                  type: AccountService
                  kind: system
                  methods:
                    - name: getUserProfile
                      params: []
                      returns: Promise<UserProfile>
                      async: true
                - name: cardRepo
                  type: BankCardRepository
                  kind: storage
                  methods:
                    - name: save
                      params:
                        - WalletCardRecord
                      returns: Promise<WalletCardRecord>
                      async: true
                    - name: find
                      params:
                        - string
                        - string
                      returns: Promise<WalletCardRecord | null>
                      async: true
                    - name: hasCards
                      params:
                        - string
                      returns: Promise<boolean>
                      async: true
                - name: navStack
                  type: NavPathStack
                  kind: system
                  methods:
                    - name: getAllPathName
                      params: []
                      returns: string[]
                      async: false
                    - name: removeByIndexes
                      params:
                        - number[]
                      returns: number
                      async: false
                    - name: pushPath
                      params:
                        - NavPathInfo
                      returns: void
                      async: false
              state_model:
                phases:
                  - Idle
                  - ChoosingType
                  - ChoosingCard
                  - WaitingOtp
                  - Submitting
                  - Success
                  - Failed
                  - Cancelled
                  - Completed
                fields:
                  - name: otp
                    type: string
                  - name: errorCode
                    type: string
                  - name: selectedCard
                    type: BankCardInfo | null
              branches:
                - id: success
                  scenario: 双入口完整添卡成功；同卡重复成功保留旧数据；每种支持类型、两入口、双击及协议缺失由同分支的参数化夹具覆盖，不让无效选择进入WaitingOtp。
                  user_sequence:
                    - start
                    - chooseType
                    - continueToCards
                    - showSelection
                    - chooseCard
                    - setAgreement
                    - openOtp
                    - setOtp
                    - confirmOtp
                  expected_phase_seq:
                    - Idle
                    - ChoosingType
                    - ChoosingCard
                    - WaitingOtp
                    - Submitting
                    - Success
                  expected_port_calls:
                    - accountService.getUserProfile
                    - bankRepo.getCards
                    - navStack.pushPath
                    - accountService.getUserProfile
                    - accountService.getUserProfile
                    - cardRepo.save
                  cloud_stubs: {}
                  local_stubs:
                    cardRepo.save: ok
                  expected_state:
                    otp: ""
                    errorCode: ""
