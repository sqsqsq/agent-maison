  - view_id: development
    nodes:
      - node_id: card-data
        contracts:
          version: "1.0"
          modules:
            - name: WalletMain
              layer: 02-Feature
              format: HAR
              change_type: modify
              package_path: 02-Feature/WalletMain
              export_file: 02-Feature/WalletMain/src/main/ets/index.ets
            - name: AccountManager
              layer: 04-BusinessBase
              format: HAR
              change_type: modify
              package_path: 04-BusinessBase/AccountManager
            - name: Phone
              layer: 01-Product
              format: HAP
              change_type: modify
              package_path: 01-Product/Phone
          module_dependencies:
            WalletMain:
              - AccountManager
              - CommUI
              - CommFunc
            AccountManager:
              - CommFunc
            Phone:
              - WalletMain
              - AccountManager
              - CommUI
              - CommFunc
          data_models:
            - name: BankInfo
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankInfo.ets
              kind: interface
              fields:
                - name: supportedCardTypes
                  type: BankCardType[]
                  required: true
                  description: 支持DEBIT/CREDIT有序非重复集合；空则无法继续
            - name: BankCardType
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCardInfo.ets
              kind: enum
              fields: []
              values:
                - name: DEBIT
                  value: DEBIT
                - name: CREDIT
                  value: CREDIT
            - name: BankCardInfo
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCardInfo.ets
              kind: interface
              fields:
                - name: cardNumber
                  type: string
                  required: true
                  description: 合成16位ASCII数字，未脱敏；展示单独处理
                - name: bankCode
                  type: string
                  required: true
                  description: 对应BankInfo.code
                - name: bankName
                  type: string
                  required: true
                  description: 对应BankInfo.name
                - name: bankCardType
                  type: BankCardType
                  required: true
                  description: DEBIT或CREDIT
                - name: walletKind
                  type: WalletCardKind
                  required: true
                  description: 固定BANK，区分未来TRANSIT/ACCESS
            - name: WalletCardRecord
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/WalletCardRecord.ets
              kind: interface
              fields:
                - name: accountId
                  type: string
                  required: true
                  description: 账号mock稳定ID，不取脱敏邮箱
                - name: cardNumber
                  type: string
                  required: true
                  description: 复合主键部分，完整卡号
                - name: walletKind
                  type: WalletCardKind
                  required: true
                  description: BANK/TRANSIT/ACCESS，本轮仅写BANK
                - name: bankCode
                  type: string
                  required: true
                  description: 银行短码
                - name: bankName
                  type: string
                  required: true
                  description: 保存时银行名快照
                - name: bankCardType
                  type: BankCardType
                  required: true
                  description: 银行子类型
                - name: addedAt
                  type: number
                  required: true
                  description: 首次添加UTC epoch milliseconds，重复添加保留
                - name: huaweiPayEnabled
                  type: boolean
                  required: true
                  description: 本轮false，非真实激活
                - name: unionPayFlashEnabled
                  type: boolean
                  required: true
                  description: 本轮false
                - name: transactionsJson
                  type: string
                  required: true
                  description: 有效JSON数组，首次[]，本轮无交易产生
            - name: UserProfile
              module: AccountManager
              file: 04-BusinessBase/AccountManager/src/main/ets/data/model/UserProfile.ets
              kind: class
              fields:
                - name: accountId
                  type: string
                  required: true
                  description: 登录时mock-account-001，未登录为空
                - name: phoneNumber
                  type: string
                  required: true
                  description: 登录时合成11位手机号，未登录为空；仅OTP提示脱敏后显示
            - name: BankOpenState
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankOpenState.ets
              kind: interface
              fields:
                - name: phase
                  type: BankOpenPhase
                  required: true
                  description: Idle/ChoosingType/ChoosingCard/WaitingOtp/Submitting/Success/Failed/Cancelled/Completed
                - name: sessionId
                  type: string
                  required: true
                  description: 一次开卡流程的内存标识，取消/完成失效
                - name: selectedCard
                  type: BankCardInfo | null
                  required: true
                  description: 完整卡片只在当前会话持有
                - name: otp
                  type: string
                  required: true
                  description: 0-6位ASCII数字，取消/提交后清空
                - name: resendDeadlineMs
                  type: number
                  required: true
                  description: clock当前毫秒+60000
                - name: errorCode
                  type: string
                  required: true
                  description: 类型化内部错误码，日志不带卡号/手机号
                - name: accountId
                  type: string
                  required: true
                  description: 开始时捕获账号，提交时再次核对
                - name: bank
                  type: BankInfo | null
                  required: true
                  description: 本会话银行快照
                - name: selectedType
                  type: BankCardType | null
                  required: true
                  description: 只选支持类型
                - name: cards
                  type: BankCardInfo[]
                  required: true
                  description: 当前银行+类型目录
                - name: agreementAccepted
                  type: boolean
                  required: true
                  description: 更换银行/类型时false
                - name: resendRemainingSeconds
                  type: number
                  required: true
                  description: 按deadline计算max(0,ceil(delta/1000))，不按tick累计
                - name: result
                  type: BankOpenResult | null
                  required: true
                  description: 提交确认后唯一快照，完成清空
                - name: phoneNumber
                  type: string
                  required: true
                  default: "''"
                  description: 由已有AccountService
                    UserProfile快照提供，仅本轮内存OTP提示；UI通过MaskUtil脱敏，取消/dispose清空，不落库/日志
