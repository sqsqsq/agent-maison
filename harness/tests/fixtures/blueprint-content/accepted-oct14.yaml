    table_schema:
      database: wallet_cards.db
      version: 1
      security_level: S4
      encrypt: true
      tables:
        - name: cards
          primary_key:
            - account_id
            - card_number
          columns:
            - name: account_id
              type: TEXT NOT NULL
              description: 稳定mock账号ID
              from: accountId
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/0
            - name: card_number
              type: TEXT NOT NULL
              description: 完整16位卡号
              from: cardNumber
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/1
            - name: wallet_kind
              type: TEXT NOT NULL DEFAULT 'BANK'
              description: BANK/TRANSIT/ACCESS
              from: walletKind
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/2
              default: BANK
            - name: bank_code
              type: TEXT NOT NULL
              description: 银行标识
              from: bankCode
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/3
            - name: bank_name
              type: TEXT NOT NULL
              description: 银行名快照
              from: bankName
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/4
            - name: bank_card_type
              type: TEXT NOT NULL
              description: DEBIT/CREDIT
              from: bankCardType
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/5
            - name: added_at
              type: INTEGER NOT NULL
              description: UTC epoch ms首次添加时间
              from: addedAt
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/6
              encoding: UTC epoch milliseconds，重复卡保留首次值
            - name: huawei_pay_enabled
              type: INTEGER NOT NULL DEFAULT 0
              description: 0/1
              from: huaweiPayEnabled
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/7
              default: 0
              encoding: boolean ↔ INTEGER 0/1
            - name: unionpay_flash_enabled
              type: INTEGER NOT NULL DEFAULT 0
              description: 0/1
              from: unionPayFlashEnabled
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/8
              default: 0
              encoding: boolean ↔ INTEGER 0/1
            - name: transactions_json
              type: TEXT NOT NULL DEFAULT '[]'
              description: 有效JSON数组
              from: transactionsJson
              source_ref: doc/features/bc-openCard-2/blueprint/component-blueprint.yaml#/contracts/0/mappings/9
              default: "[]"
              encoding: 有效JSON数组字符串，写前验证，读取保留
          constraints:
            - PRIMARY KEY(account_id,card_number)
            - CHECK(wallet_kind IN ('BANK','TRANSIT','ACCESS'))
            - CHECK(bank_card_type IN ('DEBIT','CREDIT'))
            - CHECK(huawei_pay_enabled IN (0,1))
            - CHECK(unionpay_flash_enabled IN (0,1))
