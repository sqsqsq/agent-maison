  - id: establish-seam-aliased-proofs
    mutator: establish-seam-aliased-proofs
    expected_issue: blueprint_evolution_closure_proofs_aliased
  - id: establish-seam-proof-outside-tests
    mutator: establish-seam-proof-outside-tests
