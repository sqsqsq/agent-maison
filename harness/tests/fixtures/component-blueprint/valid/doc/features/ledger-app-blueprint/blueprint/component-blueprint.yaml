providers:
  - provider_id: current-facts-discovery
    definition: Current repository facts with provenance, conflicts, and unknowns.
    consumer: [blueprint-builder, app-design-lens, independent-design-questioning]
    provider: static current-facts discovery
    requirement: required
    authority_rule: Code, schema, interface, config, and tests are current-state authority.
    source_rule: Every assertion carries source_ref and source revision when available.
    missing_behavior: Block with owner and unlock condition.
    replacement_behavior: Preserve protocol and stale affected P1 results.
    exit_behavior: Drop temporary caches; retain canonical provenance.
    conflict_behavior: Fail closed and retain all sources; never last-write-wins.
    available: true
    writes: [canonical_blueprint_input]
  - provider_id: se-manual-contracts
    definition: Authorized operation, DTO, mapping, error, idempotency, and NFR input.
    consumer: [contract-checker, blueprint-builder]
    provider: static SE/manual adapter
    requirement: required
    authority_rule: Authorized SE or contract owner is external-contract authority.
    source_rule: Every contract segment carries source_ref, verification ref, and provenance.
    missing_behavior: Keep unknown as open_decision or blocker; never fabricate fields.
    replacement_behavior: Preserve protocol and stale dependent P1 results.
    exit_behavior: Retain formal gaps and provenance.
    conflict_behavior: Fail closed with field and version conflicts.
    available: true
    writes: [canonical_blueprint_input]
  - provider_id: app-design-lens
    definition: App view projection and mandatory root questions.
    consumer: [blueprint-builder, admission, review]
    provider: static App design lens
    requirement: required
    authority_rule: Lens is not fact authority and cannot override inputs.
    source_rule: Projection cites inputs, viewpoint contract, and lens rule version.
    missing_behavior: Block review; never emit an empty PASS blueprint.
    replacement_behavior: Preserve projection protocol and recompute P1 results.
    exit_behavior: Invalidate projections only; retain canonical facts.
    conflict_behavior: Fail closed and preserve conflicting sources.
    available: true
    writes: [canonical_blueprint_projection]
  - provider_id: independent-design-questioning
    definition: Isolated question, evidence, disposition, and frontier protocol.
    consumer: [admission, review]
    provider: static isolated questioning provider
    requirement: required
    authority_rule: Questioning is not fact or decision authority.
    source_rule: Answers cite isolated blueprint, evidence package, and registered external inputs.
    missing_behavior: Block review and do not self-attest.
    replacement_behavior: Preserve result protocol and rerun questioning.
    exit_behavior: Drop temporary context and keep canonical outcomes.
    conflict_behavior: Preserve conflict as frontier or blocker.
    available: true
    writes: [questioning_process_evidence]
  - provider_id: conventions-knowledge
    definition: Applicable project conventions as stable knowledge inputs.
    consumer: [blueprint-builder, app-design-lens, independent-design-questioning]
