      - AC-5
      - AC-6
      - AC-7
  - predicate_id: bank-card-state-owner
    role: owner
    description: BankCardOpeningSession 是单次流程唯一状态 owner，RDB 是已添加卡片唯一持久化真源。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - AC-1
      - AC-5
      - view:runtime/flow:bank-card-opening-flow
