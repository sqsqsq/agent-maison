  - invariant_id: existing-bank-list-layout
    description: 既有银行列表、展开态、A-Z 分组与字母索引行为不退化。
    evidence_refs:
      - 02-Feature/WalletMain/src/ohosTest/ets/test/bank_open_card_ut.test.ets
  - invariant_id: full-card-number-private
    description: 完整卡号不写日志且 UI 只显示前四后四。
    evidence_refs:
      - QA-PRIVACY
      - AC-2
      - AC-5
  - invariant_id: single-navigation-stack
    description: 沿既有 NavPathContext 与 Phone 根 Navigation 规则，不另建平行路由。
    evidence_refs:
      - 01-Product/Phone/src/main/ets/pages/index.ets
target_predicates:
  - predicate_id: bank-card-flow-behavior
    role: behavior
    description: 双入口到结果完成的 AC-1～AC-7 与 BD-1～BD-6 全部成立。
    provide_ids:
