decisions_and_gaps:
  decisions:
    - decision_id: decision-local-rdb
      kind: design_choice
      label: 银行卡持久化采用 WalletMain 端侧 RDB
      conclusion: BankCardRepository 创建 WalletMainBankCardStore v1 与 bank_cards 表，card_id 为主键；不另建模块或第二份存储真源。
      rationale: 原始需求明确要求从本需求开始建立卡片数据库；数据只供钱包 feature 后续详情页读取，放在 WalletMain 可保持职责与依赖方向一致。
      alternatives:
        - option: AppStorage 保存完整卡片列表
          rejected_reason: 不适合作为结构化持久化数据库，也不满足表字段与后续查询扩展需求。
          defect: 缺少表级约束与稳定升级边界。
      status: decided_with_authority
      owner: wallet-main-team
      provenance: *requirement_provenance
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
    - decision_id: decision-single-flow-owner
      kind: design_choice
      label: 一次开卡由单一流程对象持有状态
      conclusion: BankCardOpeningSession 单例持有银行、卡类型、完整卡号、验证码与保存结果；页面通过订阅不可变快照渲染，所有退出路径统一 unsubscribe 和 reset。
      rationale: 双入口、两个半模态和两个全屏页面共享同一状态与清理责任，单一 owner 可避免平行页面状态和重复写库。
      alternatives:
        - option: 每个页面用路由参数逐级传递全部状态
          rejected_reason: 完整卡号和验证码会扩散到多个页面参数，清理与重复提交更难集中控制。
          defect: 敏感数据暴露面和状态分叉更大。
      status: answered_with_evidence
      owner: wallet-main-team
      provenance: *requirement_provenance
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
    - decision_id: selection-existing-bank-entry
      kind: component_asset_selection
      target_ref: view:development/node:wallet-bank-entry-pages
      asset_resolution: evolve
      component_ref: WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
      rationale: 既有 AddBankCardPage 与 AllBanksPage 已是权威银行列表入口，只替换点击行为并接入统一半模态，不复制银行列表页面。
      status: answered_with_evidence
      owner: wallet-main-team
      provenance:
        source_kind: catalog
        source_ref: doc/component-index.yaml#WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
        observed_at: 2026-10-15T09:46:04-04:00
        evidence_strength: authoritative
        extraction_method: component_index_lookup
      verification_refs:
        - doc/component-index.yaml
    - decision_id: selection-new-bank-flow-ui
      kind: component_asset_selection
      target_ref: view:development/node:wallet-bank-card-flow-ui
      asset_resolution: custom
      rationale: 组件索引中没有等价的卡类型选择、银行卡选择、验证码与不可返回结果页组合；新 UI 仍复用项目资源、NavPathContext 与既有页面视觉语言。
      status: answered_with_evidence
      owner: wallet-main-team
      provenance:
        source_kind: catalog
        source_ref: doc/component-index.yaml
        observed_at: 2026-10-15T09:46:04-04:00
        evidence_strength: authoritative
        extraction_method: component_index_full_scan
      verification_refs:
        - doc/component-index.yaml
