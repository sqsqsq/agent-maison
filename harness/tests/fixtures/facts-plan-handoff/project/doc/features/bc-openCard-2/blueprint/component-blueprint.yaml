design_views:
  - view_id: logical
    viewpoint_contract: app-logical@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [product, development, test]
    purpose: 定义银行卡开卡能力、核心数据、验收和隐私边界。
    current_state: 银行列表只能展示 BankInfo，点击银行提示暂不支持；没有银行卡记录、验证码流程或结果状态。
    target_state: 银行信息带支持卡类型与 mock 卡片，用户经单选、验证码和写库得到明确成功或失败结果；完整卡号只在业务与存储链路使用。
    delta: 新增开卡领域模型、存储契约、流程验收和完整卡号隐私边界。
    decisions_and_gaps:
      - decision:decision-local-rdb
      - decision:decision-single-flow-owner
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
    nodes:
      - node_id: bank-card-opening-capability
        owner: wallet-main-team
        current_state: 银行点击行为终止于暂不支持提示。
        target_state: 银行点击进入完整开卡流程并产出持久化结果。
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md#页面说明
        acceptance:
          criteria:
            - id: AC-1
              priority: P0
              description: 添加银行卡页和全部银行页点击任一银行均打开同一张卡类型选择半模态。
              testable: true
              verification_steps: [分别从两个入口点击银行]
              expected_result: 半模态展示银行信息与该银行支持的卡类型，且一次只能选择一种。
              ut_layer: both
              ut_focus: 两入口传递同一 BankInfo，卡类型单选状态互斥。
              device_focus: 半模态布局、关闭与继续动作符合参考图。
            - id: AC-2
              priority: P0
              description: 选择卡类型后进入该银行的具体卡片页，卡号界面仅显示前四后四。
              testable: true
              verification_steps: [选择储蓄卡或信用卡并继续, 选择一张具体卡片]
              expected_result: 页面标题为银行名称，展示 1 至 2 张相应类型卡片并保持完整卡号在业务对象中。
              ut_layer: both
              ut_focus: 卡类型过滤、单选与卡号掩码。
              device_focus: 页面层级、协议和下一步状态符合参考图。
            - id: AC-3
              priority: P0
              description: 验证码半模态首次出现即模拟发送短信，60 秒内不可重复发送，归零后可重发。
              testable: true
              verification_steps: [从具体卡片页点击下一步, 观察倒计时, 归零后点击重新发送]
              expected_result: 手机号来自账号 mock 数据并脱敏，倒计时重置为 60 秒。
              ut_layer: both
              ut_focus: 倒计时状态机与重发门槛。
              device_focus: 半模态、数字键盘、按钮禁用与倒计时文案。
            - id: AC-4
              priority: P0
              description: 只有恰好六位数字验证码才能提交；任意六位数字均视为通过。
              testable: true
              verification_steps: [输入少于六位, 尝试输入非数字, 输入任意六位数字]
              expected_result: 输入控件只接收最多六位数字，非数字不进入状态；恰好六位数字时下一步启用。
              ut_layer: both
              ut_focus: 输入归一化与 canSubmit 派生。
              device_focus: 输入长度、键盘类型和按钮视觉状态。
            - id: AC-5
              priority: P0
              description: 提交验证码后以完整卡号写入 RDB，并无论成功或失败都进入结果页。
              testable: true
              verification_steps: [分别模拟写入成功和失败, 重新创建 Repository 并按完整卡号读取成功记录]
              expected_result: 结果携带完整卡号与真实写入结果；成功记录字段完整且可跨 Repository 实例读回，失败不产生成功记录。
              ut_layer: both
              ut_focus: Repository 成功/失败返回、表字段、主键冲突与隐私日志。
              device_focus: 成功与失败结果页文案和图标。
            - id: AC-6
              priority: P0
              description: 结果页无返回入口并拦截系统返回；只有完成按钮可以退出。
              testable: true
              verification_steps: [在结果页执行系统返回和左滑, 点击完成]
              expected_result: 返回和左滑均被拦截；完成后清除本轮开卡栈。
              ut_layer: device
              device_focus: 返回拦截、页面栈清理与最终落点。
            - id: AC-7
              priority: P0
              description: 成功完成回钱包首页，失败完成回开卡流程开始前的 AddCardEntryPage，且两者都不能回退到开卡中间页。
              testable: true
              verification_steps: [分别完成成功与失败流程后连续执行返回]
              expected_result: 页面栈只保留规定落点及其之前页面。
              ut_layer: both
              ut_focus: 结果到导航命令的确定性映射。
              device_focus: 真实 Navigation 栈行为和旧路由回归。
          boundaries:
            - id: BD-1
              priority: P0
              ut_layer: both
              ut_focus: 关闭动作不调用 saveCard，Session 保留或清理状态符合页面位置。
              device_focus: 关闭半模态后下方页面、选择状态和页面栈正确。
              description: 关闭半模态不应产生持久化副作用。
              scenario: 用户关闭卡类型或验证码半模态。
              handling: 关闭当前半模态并保留下方页面与已完成选择。
              expected_behavior: 不写数据库，可重新选择或退出。
              condition: 用户关闭卡类型或验证码半模态。
              expected_result: 关闭当前半模态，保留其下方页面与已完成选择，不写数据库。
            - id: BD-2
              priority: P0
              ut_layer: both
              ut_focus: RDB 异常映射为失败结果且不产成功记录。
              device_focus: 失败结果页与完成后 AddCardEntryPage 落点。
              description: RDB 初始化或写入失败必须进入确定的失败结果。
              scenario: RDB 初始化或写入抛出异常。
              handling: 转换为失败结果并禁止完整卡号日志。
              expected_behavior: 进入失败结果页，完成后回 AddCardEntryPage，且不产生成功记录。
              condition: RDB 初始化或写入失败。
              expected_result: 进入失败结果页；完整卡号仅用于结果流转，不记录到日志。
            - id: BD-3
              priority: P0
              ut_layer: unit
              ut_focus: equality_fields、addedAt 沿用和同记录/冲突记录分支。
              description: 重复提交必须幂等调和，不能覆盖不同记录。
              scenario: 相同完整卡号重复添加或写入提交后结果尚未展示时进程中断。
              handling: 读取既有记录并按 equality_fields 比较，addedAt 沿用既有值。
              expected_behavior: 同记录返回幂等成功，不同记录返回冲突失败且不覆盖。
              condition: 相同完整卡号重复添加，或写入已提交但结果页尚未显示时进程中断。
              expected_result: Repository 读取既有记录；关键字段一致时返回幂等成功，不一致时失败且不覆盖已有记录。
            - id: BD-4
              priority: P0
              ut_layer: both
              ut_focus: 新 Repository 实例可读回已提交记录，未完成 Session 不恢复。
              device_focus: 进程重启后既有卡片记录仍可读取，未完成流程从入口重开。
              description: 进程重建不能把未完成草稿或未确认结果冒充成功。
              scenario: 页面重建或进程重启发生在结果提交前。
              handling: 丢弃未完成内存流程，已提交记录仍通过 getCard 读取。
              expected_behavior: 未完成流程需重新发起，已确认记录可读回。
              condition: 页面重建或进程重启发生在结果提交前。
              expected_result: 不恢复未完成开卡草稿；已确认成功写入的记录仍可从 RDB 读取。
            - id: BD-5
              priority: P0
              ut_layer: both
              ut_focus: 账号资料失败不进入可提交态且不调用 saveCard。
              device_focus: 账号资料失败提示与半模态关闭行为。
              description: 账号手机号读取失败时不得允许验证码提交。
              scenario: AccountService.getUserProfile 读取手机号失败。
              handling: 关闭验证码半模态并提示账号资料暂不可用。
              expected_behavior: 不进入可提交态，不触发 RDB 写入。
              condition: AccountService.getUserProfile 读取手机号失败。
              expected_result: 验证码半模态不进入可提交态，关闭半模态并提示账号资料暂不可用，不触发 RDB 写入。
            - id: BD-6
              priority: P0
              ut_layer: both
              ut_focus: 清栈失败不 reset，重试成功后才清理 Session。
              device_focus: 结果页保留、返回拦截和第二次完成重试。
              description: 页面栈清理失败时必须保留可重试结果状态。
              scenario: 完成按钮执行页面栈清理失败。
              handling: 保留结果页与结果快照并提示重试，不执行 reset。
              expected_behavior: 用户可再次点击完成；系统返回仍被拦截，已持久化结果不变。
              condition: 完成按钮执行页面栈清理失败。
              expected_result: 保留结果页并提示重试；不允许系统返回绕开清理，已持久化结果保持不变。

  - view_id: runtime
    viewpoint_contract: app-runtime@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [development, test, user]
    purpose: 定义页面、流程协调器、账号资料和 RDB 之间的调用、状态与恢复。
    current_state: AddBankCardPage 与 AllBanksPage 直接终止点击动作，没有跨页流程状态、写入发布或进程恢复。
    target_state: BankCardOpeningSession 单例持有本次选择与验证码状态，BankCardRepository 作为持久化权威，结果页只消费一次性结果并执行栈收口。
    delta: 引入单一流程状态 owner、RDB mutation、完成事件与生命周期处理。
    decisions_and_gaps:
      - decision:decision-single-flow-owner
      - decision:decision-local-rdb
    verification_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
    nodes:
      - node_id: bank-card-opening-runtime
        owner: wallet-main-team
        current_state: 无开卡状态机。
        target_state: 单一 BankCardOpeningSession 协调选择、验证码、保存与结果，并由所有退出路径统一 reset。
        design_basis_refs:
          - view:logical/node:bank-card-opening-capability
        provenance: *requirement_provenance
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
    runtime_data_flows:
      - flow_id: bank-card-opening-flow
        provenance: *requirement_provenance
        data_domain_refs: [bank-card-record]
        external_contract_refs: [contract:saveBankCard]
        source_of_truth:
          authority: view:development/node:wallet-bank-card-storage
          persistence: WalletMainBankCardStore.bank_cards
          projections_and_caches:
            - view:development/node:wallet-bank-card-flow-ui
          reconciliation: RDB insert 成功或查询到关键字段一致的既有记录才产生成功结果；失败结果不把内存选择提升为已添加卡片。
        triggers:
          - kind: user_bank_selection
            timing: 从添加银行卡页或全部银行页点击银行
            idempotency: 同一页面动作窗口只创建一个流程上下文。
          - kind: user_otp_submission
            timing: 验证码为六位数字后点击下一步
            idempotency: 流程进入 Saving 后忽略重复点击。
        initial_load:
          initial_load_id: load-bank-card-opening
          strategy: 入口页调用 BankCardOpeningSession.getInstance().start(bank, context) 初始化单例会话；从 AccountService 读取 mock 手机号；不恢复中途草稿。
          owner: BankCardOpeningSession
          data_scope: 当前一次开卡流程
          freshness: 每次新流程重新读取银行 mock 数据与账号 mock 手机号。
        state_owner:
          ref: view:runtime/node:bank-card-opening-runtime
          states: [SelectingType, SelectingCard, WaitingOtp, Saving, Success, Failed]
        mutations:
          - mutation_id: persist-selected-bank-card
            kind: foreground
            persistence_ref: WalletMainBankCardStore.bank_cards
            publication_ref: publication:bank-card-save-finished
            recovery_ref: recovery:bank-card-opening-recovery
        publications:
          - publication_id: bank-card-save-finished
            payload: fullCardNumber 与 success；只在内存中交给结果页，不写日志。
        subscriptions:
          - subscription_id: result-page-observer
            consumer_ref: consumer:bank-card-result-page
            attach: 进入结果页时绑定当前结果快照。
            detach: 点击完成并清栈时解绑。
            cleanup: 清除流程内完整卡号与验证码。
            replay_or_snapshot: 只读取当前保存动作产生的一次快照。
            ordering: RDB 写入返回后先发布结果，再替换到结果页。
        consumers:
          - consumer_id: bank-card-result-page
            initial_load_ref: initial-load:load-bank-card-opening
            update_ref: publication:bank-card-save-finished
        failure_recovery:
          recovery_id: bank-card-opening-recovery
          handling: 写入异常转换为失败结果；重复卡号先 getCard 调和；半模态取消返回下方页面；结果页返回动作一律拦截。
          retry: 本轮不在结果页自动重试；失败完成后回 AddCardEntryPage 重新发起。
        decisions_and_gaps:
          - decision:decision-local-rdb
        evidence_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
        verification_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md#路由规格
        logical_contract_refs: [contract:saveBankCard]
        development_owner_ref: view:development/node:wallet-bank-card-flow-ui
        lifecycle_coverage:
          cold_start: { status: covered, evidence_refs: [BD-4] }
          warm_resume: { status: covered, evidence_refs: [BD-4] }
          page_attach: { status: covered, evidence_refs: [AC-1, AC-3] }
          page_detach: { status: covered, evidence_refs: [BD-1, AC-6] }
          account_switch: { status: not_applicable, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
          process_recreation: { status: covered, evidence_refs: [BD-4] }
          background_write: { status: not_applicable, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
        contracts:
          state_management:
            - name: BankCardOpeningSessionState
              state_owner: BankCardOpeningSession
              lifecycle: 新开卡流程创建，结果完成或用户退出时销毁。
              data: 银行、卡类型、完整卡号、验证码、倒计时与保存结果
              scope: 单次银行卡开卡流程
              decorator: singleton-observable-session
              holder: BankCardOpeningSession
              module: WalletMain
              owner_ref: view:runtime/node:bank-card-opening-runtime
              contract_refs: [contract:saveBankCard]
              lifecycle_triggers: [start, page_attach, page_detach, finish, reset, process_recreation]
              failure_recovery:
                recovery_ref: recovery:bank-card-opening-recovery
                description: 存储与导航失败按 BD-2～BD-6 保留或清理确定状态。
              mutations:
                - mutation_id: persist-selected-bank-card
                  kind: foreground
                  publication_ref: publication:bank-card-save-finished
                  recovery_ref: recovery:bank-card-opening-recovery
              publications:
                - publication_id: bank-card-save-finished
              subscriptions:
                - subscription_id: result-page-observer
                  consumer_ref: consumer:bank-card-result-page
                  publication_ref: publication:bank-card-save-finished
                  replay_or_snapshot: 只读取当前保存动作产生的一次结果快照。
                  cleanup: 清栈成功后 unsubscribe/reset；清栈失败保留快照。
              consumers:
                - consumer_id: bank-card-result-page
                  initial_load_ref: initial-load:load-bank-card-opening
                  update_ref: publication:bank-card-save-finished
              ordered_steps:
                - AddBankCardPage 或 AllBanksPage 从 UIAbility Context 调用 BankCardOpeningSession.getInstance().start(bank, context)；start 构造 BankCardRepository.getInstance(context)、重置上次会话并发出 SelectingType 快照，活动会话中的重复 start 被拒绝。
                - 各页面与半模态只通过 BankCardOpeningSession.getInstance() 取得同一会话，subscribe(callback) 接收不可变快照，aboutToDisappear 时 unsubscribe；用户单选 BankCardType 后调用 selectType(type)。
                - 继续按钮调用 NavPathContext.stack().pushPath 进入 BankCardSelectionPage(bankCode, type)，页面从 BankRepository 取得 1 至 2 张完整卡记录并只渲染掩码号。
                - 用户选择卡片并同意协议后打开 OtpVerificationSheet；Flow 调 AccountService.getUserProfile() 读取 mock 手机号并立即调用 resendOtp() 开始 60 秒倒计时。
                - 输入框每次变化调用 normalizeOtp(input)，只保留最多六位数字；canSubmit 仅在长度为六时成立。
                - 用户提交后页面等待 BankCardRepository.saveCard(selectedCard)；Repository 用 start 注入的 Context 懒加载单一 RDB Promise，以 CREATE TABLE IF NOT EXISTS 初始化 v1 表并插入完整字段。
                - insert 主键冲突时 Repository 调 getCard(cardId)；关键字段一致返回幂等成功，否则返回冲突失败。进程重启后 getCard 也可读回已确认记录。
                - Session 收到成功或失败结果后清理验证码，携 fullCardNumber 与 success 替换到 BankCardResultPage；不在日志输出完整卡号。
                - 结果页拦截返回与左滑；点击完成时 Session.finish() 先生成不含卡号的 BankCardNavigationOutcome，再由 NavPathContext.stack() 精确删除 BankCardResultPage、BankCardSelectionPage、AllBanksPage 与 AddBankCardPage；栈操作成功后才 unsubscribe/reset 并清除完整卡号，失败则保留当前结果快照供再次点击完成。成功回首页根目标，失败回 AddCardEntryPage。
        use_cases:
          schema_version: "2.1"
          feature: bc-openCard-2
          use_cases:
            - id: bank_card_opening
              description: 银行选择到结果页完成的完整银行卡开卡流程。
              coordinator: BankCardOpeningSession
              coordinator_file: 02-Feature/WalletMain/src/main/ets/domain/flow/BankCardOpeningSession.ets
              ui_bindings:
                - ui: AddBankCardPage/AllBanksPage
                  role: entry
                  subscribes: []
                  user_actions:
                    - trigger: 点击银行
                      calls: flow.start
                - ui: SelectBankCardTypeSheet
                  role: progress
                  subscribes: [flow.state.phase=SelectingType]
                  user_actions:
                    - trigger: 选择卡类型并继续
                      calls: flow.selectType
                - ui: BankCardSelectionPage
                  role: progress
                  subscribes: [flow.state.phase=SelectingCard]
                  user_actions:
                    - trigger: 选择卡片并点击下一步
                      calls: flow.selectCard
                - ui: OtpVerificationSheet
                  role: dialog
                  subscribes: [flow.state.phase=WaitingOtp]
                  user_actions:
                    - trigger: 输入六位验证码并点击下一步
                      calls: flow.submitOtp
                - ui: BankCardResultPage
                  role: result
                  subscribes: [flow.state.phase=Success, flow.state.phase=Failed]
                  user_actions:
                    - trigger: 点击完成
                      calls: flow.finish
              data_boundaries:
                - name: cards
                  type: BankCardRepository
                  kind: storage
                  methods:
                    - { name: saveCard, params: [BankCardRecord], returns: BankCardSaveResult, async: true }
                - name: account
                  type: AccountService
                  kind: system
                  methods:
                    - { name: getUserProfile, params: [], returns: UserProfile, async: true }
              state_model:
                phases: [SelectingType, SelectingCard, WaitingOtp, Saving, Success, Failed]
                fields:
                  - { name: selectedBankCode, type: string }
                  - { name: selectedType, type: BankCardType|null }
                  - { name: selectedFullCardNumber, type: string|null }
                  - { name: otp, type: string }
                  - { name: saveSuccess, type: boolean|null }
              branches:
                - id: happy_path
                  scenario: 六位验证码后 RDB 写入成功。
                  setup: { cards.saveCard: ok, account.getUserProfile: ok }
                  triggers:
                    - { call: flow.start, with: { bankCode: cmb } }
                    - { call: flow.selectType, with: { type: DEBIT } }
                    - { call: flow.selectCard, with: { cardId: "4392123412342269" } }
                    - { call: flow.submitOtp, with: { code: "123456" } }
                    - { call: flow.finish, with: {} }
                  expected_phase_sequence: [SelectingType, SelectingCard, WaitingOtp, Saving, Success]
                  expected_port_calls: [account.getUserProfile, cards.saveCard]
                  expected_state: { saveSuccess: true }
                  linked_acceptance: [AC-1, AC-2, AC-3, AC-4, AC-5, AC-6, AC-7]
                - id: storage_failure
                  scenario: 六位验证码后 RDB 写入失败。
                  setup: { cards.saveCard: throw, account.getUserProfile: ok }
                  triggers:
                    - { call: flow.submitOtp, with: { code: "654321" } }
                    - { call: flow.finish, with: {} }
                  expected_phase_sequence: [WaitingOtp, Saving, Failed]
                  expected_port_calls: [cards.saveCard]
                  expected_state: { saveSuccess: false }
                  linked_acceptance: [AC-5, AC-6, AC-7, BD-2]
                - id: duplicate_after_commit
                  scenario: 上次 insert 已提交但结果尚未展示，重新提交同一张卡。
                  setup: { cards.saveCard: duplicate_same_record, cards.getCard: existing_same_record }
                  triggers:
                    - { call: flow.submitOtp, with: { code: "112233" } }
                  expected_phase_sequence: [WaitingOtp, Saving, Success]
                  expected_port_calls: [cards.saveCard, cards.getCard]
                  expected_state: { saveSuccess: true }
                  linked_acceptance: [AC-5, BD-3, BD-4]

