review_summary:
  title: 银行卡开卡与本地卡片入库
  background: 现有添加银行卡与全部银行页面已经能展示银行列表，但点击银行只提示暂不支持，尚无选卡、短信验证、持久化和结果收口流程。
  problem: 用户无法从既有银行入口完成银行卡添加；卡片也没有可供后续详情页消费的本地持久化记录。
  summary: 在既有两个银行入口上接入统一开卡流程，完成卡类型选择、具体卡片选择、六位验证码校验、RDB 写入与不可侧滑返回的结果页；完成按钮一次性清理本轮开卡页面栈，并按成功或失败返回规定目标。
  positioning: 该能力属于 WalletMain 的添卡业务；AccountManager 只提供 mock 手机号，Phone 只登记新增 NavDestination，RDB 与流程状态均由 WalletMain 持有。
  goals:
    - goal_id: goal-complete-bank-card-opening
      statement: 用户可从两个既有银行列表入口完成一次可验证、可落库、可正确收口的银行卡添加。
      success_measures:
        - 任一银行点击后进入与参考图一致的卡类型半模态，且只能选择一个卡类型。
        - 六位数字验证码是下一步按钮唯一输入门槛，倒计时归零后可重新发送。
        - 写库成功或失败都进入结果页并携带完整卡号与结果，完成后不再回到流程中间页。
        - 成功记录可在进程重启后从 RDB 读回，界面和日志不泄露完整卡号。
  in_scope:
    - 添加银行卡页与全部银行页复用同一开卡入口行为。
    - 卡类型半模态、具体卡片页、验证码半模态与添加结果页。
    - mock 银行卡数据、账号 mock 手机号、RDB 建库建表与卡片记录写入。
    - 新旧页面之间的导航回归、流程清栈与成功/失败出口。
  non_goals:
    - 不实现真实短信、真实银行接口、真实华为支付或银联手机闪付开通。
    - 不实现银行卡详情页；成功完成后暂回钱包首页。
    - 不实现参考图中的 NFC 激活区。
  must_review: []
  reader_guide:
    source_digest: sha256:adbe84851393311bfc1d4c36755d554bfb3c1402d9fb33f871c420fb91e3c240
    sections:
      - section: background
        title: 为什么要改
        prose: |
          现有两个银行列表入口已经稳定，但点击银行只会显示“暂不支持”。本次把这个终点替换成一条完整的本地模拟开卡链路，同时保留既有列表、分组和路由规则。
        source_refs:
          - /design_views/0
      - section: journey
        title: 第一步：选择卡类型
        prose: |
          用户从添加银行卡页或全部银行页点击任一银行后，先看到卡类型半模态。银行名称与图标来自当前 BankInfo；储蓄卡和信用卡只能单选，协议本次只展示文本。
        source_refs:
          - /design_views/2/nodes/1/evidence_refs/0
      - section: journey
        title: 第二步：选择具体银行卡
        prose: |
          继续后进入以银行名称为标题的全屏页。每种卡类型提供一至两张 mock 卡，界面只显示前四后四，完整卡号仍保留在流程对象中供最终写库。
        source_refs:
          - /design_views/2/nodes/1/evidence_refs/1
      - section: journey
        title: 第三步：短信验证
        prose: |
          选卡后打开验证码半模态，并立即开始一次 60 秒 mock 发送。手机号由 AccountService 的 mock 资料提供；只有六位数字输入会让下一步可用，倒计时结束后才能重新发送。
        source_refs:
          - /design_views/2/nodes/1/evidence_refs/2
      - section: journey
        title: 第四步：结果与完成
        prose: |
          RDB 返回后，无论成功或失败都进入无返回入口的结果页。完成按钮清理从 AddBankCardPage 到结果页的全部页面；成功回钱包首页，失败回最开始的 AddCardEntryPage。
        source_refs:
          - /design_views/2/nodes/1/evidence_refs/3
      - section: solution
        title: 责任边界
        prose: |
          WalletMain 实现页面、流程和银行卡 RDB；AccountManager 只补充 mock 手机号；Phone 延续现有 navDestinationMap 登记新页面，不复制业务状态或存储实现。
        source_refs:
          - /design_views/2
      - section: flows
        title: 完整调用与返回
        prose: |
          两个入口都把 BankInfo 交给 BankCardOpeningSession 单例会话。会话等待用户完成类型、卡片和验证码选择，再等待 BankCardRepository 的 RDB 返回；insert 成功或重复提交调和为同一记录时产生成功结果。结果页完成时由同一根导航栈执行精确清理，随后到达成功或失败的规定落点。
        source_refs:
          - /design_views/1/runtime_data_flows/0/contracts/state_management/0/ordered_steps
        graph_ids:
          - sequence:entry-and-type
          - sequence:card-and-otp
          - sequence:persist-and-finish
      - section: data
        title: 数据与存储
        prose: |
          WalletMainBankCardStore v1 的 bank_cards 表以完整卡号为主键，保存卡片大类、银行、银行卡类型、添加时间、两项支付状态和交易记录 JSON。完整卡号不写日志，界面始终使用掩码值；本需求没有把应用沙箱安全级别解释为额外加密。
        source_refs:
          - /contracts/0/table_schema
          - /data_domains/0
      - section: decisions
        title: 关键选择
        prose: |
          方案坚持一个流程状态 owner 和一个 RDB 真源，不用页面参数链或 AppStorage 维护平行状态。既有银行入口原位演进，新四段 UI 在 WalletMain 内实现并复用现有资源、导航和公共组件。
        source_refs:
          - /decisions_and_gaps/decisions
      - section: recovery
        title: 失败与恢复速查
        prose: |
          | 情况 | 用户看到什么 | 数据是否保存 | 如何继续 |
          | --- | --- | --- | --- |
          | BD-1 关闭半模态 | 回到下方页面 | 否 | 重新选择或退出 |
          | BD-2 RDB 初始化/写入失败 | 失败结果页 | 否 | 点击完成回 AddCardEntryPage |
          | BD-3 重复卡号或提交后中断 | 同一记录显示成功，冲突记录显示失败 | 既有记录保留且不覆盖 | 点击完成到规定落点 |
          | BD-4 进程重建 | 未完成流程不恢复 | 已确认成功记录保留 | 重新发起未完成流程 |
        source_refs:
          - /design_views/0/nodes/0/acceptance/boundaries
      - section: quality
        title: 隐私、视觉与兼容
        prose: |
          隐私重点是完整卡号最小暴露；视觉重点是四张参考图、按钮禁用态和结果页返回拦截；兼容重点是既有卡包及银行路由不退化。三类风险分别由 UT、真机截图/交互和路由回归覆盖。
        source_refs:
          - /quality_attributes
      - section: delivery
        title: 施工范围
        prose: |
          施工集中在 WalletMain，另有 AccountManager 的手机号字段和 Phone 的路由登记两处窄改。主要文件职责如下：

          - `BankInfo.ets` / `BankCardCandidate.ets` / `BankCardRecord.ets`：支持卡类型、mock 卡片与持久化模型。
          - `BankRepository.ets`：按银行和卡类型返回一至两张 mock 卡。
          - `BankCardRepository.ets`：Context 绑定、RDB 建表、保存、读回与重复提交调和。
          - `BankCardOpeningSession.ets`：跨页面单例状态、订阅、倒计时、保存与敏感数据清理。
          - 两个既有银行页：把点击银行接到统一 Session；两个新页面与两个半模态：承担类型、卡片、验证码和结果交互。
          - `WalletMain/index.ets` 与 `Phone/pages/index.ets`：只导出和登记新增 builder。
          - WalletMain 资源：文案、颜色、尺寸与结果引导图；ohosTest 文件：状态、存储、隐私和导航回归。
          - AccountManager 的 `UserProfile.ets` / `AccountService.ets`：提供 mock 手机号，不承载开卡状态。

          蓝图不新增模块、不改变分层 DSL，也不引入真实银行、短信或支付服务。单个 CU 先以新增模型/Repository/Session 可编译为安全基础，再接 UI 与宿主路由；任何中间提交都保持旧入口可启动，最终由同一 CU 完成全链验收。
        source_refs:
          - /design_views/2/nodes
      - section: acceptance
        title: 怎么验收
        prose: |
          AC-1 至 AC-7 覆盖双入口、两次单选、验证码倒计时与输入门槛、RDB 成败、结果页拦截和最终栈落点。业务状态与存储错误在 UT 验证，真实 UI、返回手势、导航栈和参考图差异在设备阶段验证。
        source_refs:
          - /design_views/0/nodes/0/acceptance
      - section: questions
        title: 当前待补问题
        prose: |
          当前没有阻挡本切片施工的业务未决项。短信、银行与支付均为明确的本地 mock；真实服务接入和账号级卡片隔离留给后续独立需求。
        source_refs:
          - /decisions_and_gaps/gaps
