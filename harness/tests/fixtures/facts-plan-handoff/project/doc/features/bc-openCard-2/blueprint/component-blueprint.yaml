app_lens:
  module_boundaries:
    disposition: answered_with_evidence
    answer: WalletMain 拥有添卡页面、流程与 RDB；AccountManager 只拥有账号 mock 手机号；Phone 只注册根路由。
    evidence_refs: [doc/module-catalog.yaml, doc/architecture.md]
  capability_seams:
    disposition: answered_with_evidence
    answer: WalletMain 通过 AccountManager index.ets 消费 AccountService，通过 CommFunc 的 NavPathContext 使用宿主已 attach 的同一导航栈；BankCardOpeningSession.getInstance 是跨页面状态接缝，start(bank, context) 是 RDB Context 注入接缝，finish() 返回精确导航结果而 Phone 只登记 builder。
    evidence_refs: [02-Feature/WalletMain/oh-package.json5, 04-BusinessBase/AccountManager/src/main/ets/index.ets]
  feature_flags:
    disposition: not_applicable
    reason: 本演示工程未定义此能力的 feature flag；需求要求所有 mock 银行立即生效。
  data_producers_consumers:
    disposition: answered_with_evidence
    answer: BankRepository 以 BankInfo.supportedTypes 和 getCards(bankCode,type) 产生银行与每类型一至两张 mock 卡，AccountService 产生手机号，BankCardRepository.saveCard/getCard 产生并读回持久化结果，结果页与未来卡详情消费卡片记录。
    evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
  lifecycle_triggers:
    disposition: answered_with_evidence
    answer: 银行点击启动流程，验证码提交触发写入，结果完成触发流程数据清理和页面栈收口。
    evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
  state_owners:
    disposition: answered_with_evidence
    answer: BankCardOpeningSession 是一次流程状态 owner；它通过静态 getInstance、subscribe/unsubscribe 和 reset 跨页面共享且不暴露第二份状态。BankCardRepository/RDB 是已添加卡片状态 owner。
    evidence_refs: [view:runtime/flow:bank-card-opening-flow]
  initialization:
    disposition: answered_with_evidence
    answer: 每次点击银行通过 Session.start(bank, context) 初始化内存流程并注入应用 Context；Repository 缓存单一初始化 Promise，执行 CREATE TABLE IF NOT EXISTS 建立 v1 表，未来版本在版本号分支中迁移。
    evidence_refs: [contract:saveBankCard]
  publication_subscription:
    disposition: answered_with_evidence
    answer: Session 通过 subscribe 发布不可变快照，页面 aboutToDisappear 时 unsubscribe；保存完成只向当前结果页发布一次结果快照。完成清栈成功后才 unsubscribe/reset 并清理完整卡号与验证码；清栈失败保留结果快照供重试，卡片长期真源在 RDB。
    evidence_refs: [view:runtime/flow:bank-card-opening-flow]
  ui_refresh:
    disposition: answered_with_evidence
    answer: 页面订阅 Session 快照；倒计时由 Session 内部定时器每秒派生，写入返回后单次切换到结果页，不建立全局 UI 事件总线。
    evidence_refs: [view:runtime/flow:bank-card-opening-flow]
  process_recovery:
    disposition: answered_with_evidence
    answer: 进程重建不恢复未完成草稿；已提交记录可由 getCard 读回。重复提交先读取既有记录，关键字段一致调和为幂等成功，从而闭合写入后、结果发布前的崩溃窗口。
    evidence_refs: [BD-4, contract:saveBankCard]
  runtime_flow_trigger_assessment:
    persistent_or_remote_ui: { applies: true, evidence_refs: [contract:saveBankCard] }
    multiple_consumers: { applies: true, evidence_refs: [view:runtime/flow:bank-card-opening-flow] }
    background_system_external_scheduled_write: { applies: false, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
    cold_start_resume_mount_account_switch: { applies: true, evidence_refs: [BD-4] }
    user_mutation_refreshes_other_consumers: { applies: true, evidence_refs: [AC-5] }
    cache_sync_freshness_consistency_process_recreation: { applies: true, evidence_refs: [BD-4] }

quality_attributes:
  - qa_id: QA-PRIVACY
    category: security_privacy
    requirement: 完整卡号只在业务对象与 RDB 中使用，UI 仅显示前四后四，日志禁止输出完整卡号。
    landing: BankCardMask、BankCardOpeningSession、BankCardRepository 与 Logger 调用审查。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格
    verification_refs: [AC-2, AC-5]
  - qa_id: QA-UX
    category: ux_accessibility
    requirement: 四段界面参考归档图片，按钮具有禁用态，返回拦截只限结果页，文本和控件使用资源键及可缩放单位。
    landing: WalletMain presentation 与资源文件。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md#页面说明
    verification_refs: [AC-1, AC-3, AC-4, AC-6]
  - qa_id: QA-COMPAT
    category: compatibility
    requirement: 既有卡包、添加卡片、添加银行卡与全部银行路由仍可互相跳转，原银行展示和分组不退化。
    landing: Phone navDestinationMap、WalletMain builders 与回归测试。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md#路由规格
    verification_refs: [AC-1, AC-7]

data_domains:
  - data_domain_id: bank-card-record
    usage: 保存已添加银行卡并供后续详情页读取。
    retention: 用户未删除前持久保留；本需求不实现删除流程。
    isolation: 当前应用沙箱内单账号 mock 数据；账号切换隔离在后续真实账号接入时扩展。
    cleanup: 写入失败不留成功记录；流程完成清除内存中的验证码与完整卡号副本。
    security: 应用沙箱 RDB，未声明额外加密；通过掩码显示与禁止完整卡号日志降低暴露面。

generated_graphs:
  - graph_id: sequence:entry-and-type
    label: 银行入口与卡类型选择
    format: mermaid
    source_view_id: runtime
    node_refs:
      - view:runtime/flow:bank-card-opening-flow
      - view:development/node:wallet-bank-entry-pages
      - view:development/node:wallet-bank-card-flow-ui
    relation_refs: []
    content: |
      sequenceDiagram
          actor User as 用户
          participant Entry as 银行列表页
          participant Session as 开卡会话
          participant Sheet as 卡类型半模态
          User->>Entry: 点击银行
          Entry->>Session: 启动流程（start(bank, context)）
          Session-->>Entry: 返回 SelectingType 快照
          Entry->>Sheet: 打开卡类型半模态
          User->>Sheet: 单选卡类型并继续
          Sheet->>Session: 记录卡类型（selectType(type)）
          Session-->>Sheet: 返回 SelectingCard 快照
  - graph_id: sequence:card-and-otp
    label: 具体卡片与验证码
    format: mermaid
    source_view_id: runtime
    node_refs:
      - view:runtime/flow:bank-card-opening-flow
      - view:development/node:wallet-bank-card-flow-ui
      - view:development/node:account-mock-phone
    relation_refs: []
    content: |
      sequenceDiagram
          actor User as 用户
          participant CardPage as 具体卡片页
          participant BankRepo as 银行 Mock 仓库
          participant Session as 开卡会话
          participant Account as 账号服务
          participant Otp as 验证码半模态
          CardPage->>BankRepo: 查询卡片（getCards(bankCode, type)）
          BankRepo-->>CardPage: 返回一至两张完整卡记录
          User->>CardPage: 选择卡片并点击下一步
          CardPage->>Session: 记录卡片（selectCard(card)）
          Session->>Account: 读取账号资料（getUserProfile()）
          Account-->>Session: 返回 mock 手机号
          Session-->>Otp: 发布 WaitingOtp 快照并开始 60 秒倒计时
          User->>Otp: 输入六位数字验证码
          Otp->>Session: 提交验证码（submitOtp(code)）
  - graph_id: sequence:persist-and-finish
    label: RDB 保存、结果与页面栈收口
    format: mermaid
    source_view_id: runtime
    node_refs:
      - view:runtime/flow:bank-card-opening-flow
      - view:development/node:wallet-bank-card-storage
      - view:development/node:wallet-bank-card-flow-ui
      - view:development/node:phone-bank-card-routes
    relation_refs: []
    content: |
      sequenceDiagram
          actor User as 用户
          participant Result as 结果页
          participant Session as 开卡会话
          participant Repo as 银行卡仓库
          participant DB as WalletMainBankCardStore
          participant Nav as 根导航栈
          Session->>Repo: 保存卡片（saveCard(record)）
          Repo->>DB: 插入完整卡片记录
          alt 插入成功
              DB-->>Repo: 返回成功
          else 主键重复
              Repo->>DB: 读取既有卡片（getCard(cardId)）
              DB-->>Repo: 返回既有记录
          end
          Repo-->>Session: 返回真实或幂等保存结果
          Session-->>Result: 发布结果快照并替换到结果页
          User->>Result: 点击完成
          Result->>Session: 生成导航命令（finish）
          Session-->>Result: 返回不含卡号的 BankCardNavigationOutcome
          Result->>Nav: 删除本轮页面并到达结果对应落点
          alt 清栈成功
              Nav-->>Result: 返回完成
              Result->>Session: 清理会话（reset）
              Result-->>User: 成功回首页或失败回 AddCardEntryPage
          else 清栈失败
              Nav-->>Result: 返回失败
              Result-->>User: 保留结果页和结果快照，提示重试
          end

