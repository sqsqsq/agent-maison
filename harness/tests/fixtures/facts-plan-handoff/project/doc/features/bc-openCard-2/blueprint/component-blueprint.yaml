        scope_kind: app_lens
        scope_ref: app_lens:lifecycle_triggers
        question: 生命周期触发和失败重试是否闭合？
        answer: 银行点击启动、OTP 提交写入、finish 生成 outcome、清栈成功后 reset；清栈失败保持 Session 快照供重试。
        disposition: answered_with_evidence
        evidence_refs: [component-blueprint.yaml#/design_views/1/runtime_data_flows/0/contracts/state_management/0/ordered_steps/8]
        verification_refs: [BD-1, BD-5, BD-6]
        frontier_fingerprint: sha256:1c31fa1ffab22be91cc98c86260f339a0eccb85c6a00bbf02c463a0cfddb00d8
        owner: wallet-main-team
        provenance: *questioning_provenance
      - question_id: q-lens-state-owners
        scope_kind: app_lens
        scope_ref: app_lens:state_owners
        question: 内存和持久化状态由谁拥有？
        answer: BankCardOpeningSession 是单次流程 owner；BankCardRepository/RDB 是持久化 owner，页面只消费不可变快照。
        disposition: answered_with_evidence
        evidence_refs: [component-blueprint.yaml#/app_lens/state_owners]
        verification_refs: [flow:bank-card-opening-flow]
        frontier_fingerprint: sha256:2fc1aaca09bc16fc9dfbe90cc4035916b058ff050218775c194fb527eef740e7
