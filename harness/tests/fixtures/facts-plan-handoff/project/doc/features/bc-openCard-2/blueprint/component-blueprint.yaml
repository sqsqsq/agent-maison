      durability: 下一次进程启动可从 RDB 读取已添加卡片。
      source_ref: doc/features/bc-openCard-2/blueprint/bank-card-contract-authority.yaml#/nfr
      verification_refs: [AC-2, AC-5, BD-4]
    table_schema:
      database: WalletMainBankCardStore
      version: 1
      security_level: 应用沙箱内普通 RDB；完整卡号禁止日志与界面直出。
      encrypt: false
      upgrade: v1 首次使用 CREATE TABLE IF NOT EXISTS；后续版本按旧版本号顺序执行显式迁移，禁止删除重建覆盖用户卡片。
      security: 应用沙箱内普通 RDB；本需求不声明额外加密，完整卡号禁止日志与界面直出。
      upgrade_strategy: v1 首次使用 CREATE TABLE IF NOT EXISTS；后续版本必须按旧版本号顺序执行显式迁移，禁止删除重建覆盖用户卡片。
      tables:
        - name: bank_cards
          primary_key: card_id
          unique: [card_id]
          columns:
            - { name: card_id, type: TEXT, nullable: false }
            - { name: category, type: TEXT, nullable: false }
            - { name: bank_name, type: TEXT, nullable: false }
            - { name: bank_card_type, type: TEXT, nullable: false }
            - { name: added_at, type: INTEGER, nullable: false }
            - { name: huawei_pay_enabled, type: INTEGER, nullable: false, default: 0 }
            - { name: unionpay_quickpass_enabled, type: INTEGER, nullable: false, default: 0 }
            - { name: transactions_json, type: TEXT, nullable: false, default: "[]" }

