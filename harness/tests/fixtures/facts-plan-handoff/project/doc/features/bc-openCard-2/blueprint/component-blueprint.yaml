      - question_id: q-lens-initialization
        scope_kind: app_lens
        scope_ref: app_lens:initialization
        question: Session 与 RDB 如何初始化？
        answer: start(bank, context) 初始化 Session 并注入 Context；Repository 复用初始化 Promise，以 CREATE TABLE IF NOT EXISTS 建立 v1 表并声明迁移策略。
        disposition: answered_with_evidence
        evidence_refs: [component-blueprint.yaml#/contracts/0/table_schema]
        verification_refs: [AC-5, BD-2]
        frontier_fingerprint: sha256:956b276fbc83b3d5b4e65a18227ddea3fefc43f17f24e46a3fcd48529d144db8
        owner: wallet-main-team
        provenance: *questioning_provenance
      - question_id: q-lens-publication-subscription
        scope_kind: app_lens
        scope_ref: app_lens:publication_subscription
        question: 发布、订阅、解绑和清理是否一致？
        answer: Session 发布不可变快照，页面离开时 unsubscribe；完成先保留快照执行清栈，成功后 reset，失败保留快照重试。
        disposition: answered_with_evidence
        evidence_refs: [component-blueprint.yaml#/design_views/1/runtime_data_flows/0/subscriptions, component-blueprint.yaml#/generated_graphs/2]
        verification_refs: [AC-5, AC-6, BD-6]
        frontier_fingerprint: sha256:97ce0256bf15e30edaf240b31e9f9816943ea9d501c378f6f81e2d5d07c580f8
        owner: wallet-main-team
        provenance: *questioning_provenance
      - question_id: q-lens-ui-refresh
        scope_kind: app_lens
        scope_ref: app_lens:ui_refresh
        question: 页面如何刷新？
        answer: Session 快照驱动页面，内部定时器更新倒计时，保存返回后单次切换结果页。
        disposition: answered_with_evidence
        evidence_refs: [component-blueprint.yaml#/app_lens/ui_refresh]
