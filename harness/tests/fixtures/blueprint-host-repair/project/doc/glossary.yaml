  - term: "导航栈上下文"
    canonical_module: "CommFunc"
    owner_layer: "05-SystemBase"
    aliases: []
    sample_usage: "当 PRD/评审说「全局导航栈」「NavPathContext」「子页无法 @Link 时要取同一个 NavPathStack」时，多指本模块 `NavPathContext.attach`/`stack` 的技术语义；不是底 Tab 壳或「跳转到哪一页」的产品路由文案。"
    confidence_hint: "精确命中 `CommFunc.typical_business_terms`；`NOT_responsible_for` 未字面否定「导航栈上下文」（Step 1.5 已扫）。"
    easily_confused_with:
      - term: "公共 UI 组件"
        module: "CommUI"
        disambiguation: |
          **hilog、`MaskUtil`、`NavPathContext`（无 `@Component`）** → **CommFunc**（本模块）。
          **`ActionListItem`、`SectionCard`、`CommColors`、`showToast`** → **CommUI**。
          **依赖方向**：`CommUI` → `CommFunc` ✅；反向 ❌。
      - term: "账号管理"
        module: "AccountManager"
        disambiguation: |
          **纯工具与日志**、与「何时登录、存哪个 AppStorage 键」无关 → **CommFunc**。
          **`AccountService`、`UserProfile`、`LoginState`、监听回调** → **AccountManager**。本模块可被其依赖，**不**写账号单例。
      - term: "钱包主功能"
        module: "WalletMain"
        disambiguation: |
          **导航栈上下文 / 脱敏工具 / Logger**、与卡包 Tab 产品语义无关 → **CommFunc**。
          **首页/我的/卡包/添卡、`HomeRepository`、`pushPath` 业务语义** → **WalletMain**。`NavPathContext` **可被宿主 attach 后**供其 `pushPath` 使用，**页面名与编排**仍归 feature。
      - term: "应用入口"
        module: "Phone"
        disambiguation: |
          **`Logger` / `MaskUtil` / `NavPathContext` 通用实现** → **CommFunc**（本模块）。
          **`PhoneAbility`、`loadContent`、根 `Navigation`/`Tabs`、在根页调用 `NavPathContext.attach`** → **Phone**；宿主 **消费**本模块 API 完成挂载，**不等价**本模块承担 HAP 壳职责。

  - term: "公共 UI 组件"
    canonical_module: "CommUI"
    owner_layer: "05-SystemBase"
    aliases: []
    sample_usage: "当 PRD 说「用公共卡片区块、统一列表项」时，多指可 import 的 ArkUI 组件，而非在 Feature 里手写一套等效 UI 实现。"
    confidence_hint: "精确命中 `CommUI.typical_business_terms`；与 NOT 不冲突（已扫）。"
    easily_confused_with:
      - term: "系统功能封装"
        module: "CommFunc"
        disambiguation: |
          若 PRD/设计强调 **ArkUI 组件/布局/颜色 token/Toast 在界面上的使用** → 选 **CommUI**（本模块）。
          若强调 **hilog 日志、手机号/账号脱敏、与界面无关的纯工具类** → 选 **CommFunc**。
          依赖关系：本模块的 `oh-package` 可依赖 `CommFunc`；**CommFunc 不应依赖本模块**；若发现反向 import，优先修正分层。
      - term: "账号管理"
        module: "AccountManager"
        disambiguation: |
          可复用 **ArkUI 组件/主题/Toast** 等无账号领域语义 → **CommUI**（本模块）。
          **登录态、展示账号、`UserProfile`、登出、订阅登录状态** → **AccountManager**。业务页可组合两侧导出，**禁止**在 `CommUI` 的 `@Component` 内实现 `AccountService` 或修改 AppStorage 账号键。
      - term: "钱包主功能"
        module: "WalletMain"
