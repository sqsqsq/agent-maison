# SSOT: 业务术语 ↔ 权威模块 (Glossary)
# 由 Skill 0 · Phase B 逐条合并
schema_version: "1.0"
terms:
  - term: "系统功能封装"
    canonical_module: "CommFunc"
    owner_layer: "05-SystemBase"
    aliases: []
    sample_usage: "在 PRD 中描述“系统能力沉淀到公共封装层”时，多指可复用工具与脱敏，而非业务页面。"
    confidence_hint: "精确命中 `CommFunc.typical_business_terms`；与 NOT_responsible_for 无字面冲突（Step 1.5 已扫）。"
    easily_confused_with:
      - term: "公共 UI 组件"
        module: "CommUI"
        disambiguation: |
          若 PRD/设计描述的是**无界面的**日志、脱敏、纯工具类 API → 选 **CommFunc**（本模块）。
          若描述的是**可复用 UI 组件/布局/动效/资源**、或与用户可见界面强相关 → 选 **CommUI**。
          子层硬规则：CommUI 可依赖 CommFunc；**CommFunc 不依赖 CommUI**；若 import 方向违反，应先怀疑分层边界而非合并两模块职责。
      - term: "账号管理"
        module: "AccountManager"
        disambiguation: |
          若只涉及 `Logger` / `MaskUtil` 等**与登录会话、Profile 无关**的纯工具能力 → 选 **CommFunc**（本模块）。
          若涉及**登录/登出、`UserProfile` / `LoginState` / `AppStorage` 中账号键、`AccountService` 单例** → 选 **AccountManager**。`AccountManager` 可依赖本模块；**禁止**在 `CommFunc` 内持账号业务状态。
      - term: "钱包主功能"
        module: "WalletMain"
        disambiguation: |
          **脱敏/日志/与 Tab·卡包无关的纯技术工具** → **CommFunc**（本模块）。
          **钱包首页/我的/卡包/添卡、服务宫格、卡引导与 feature 内仓库** → **WalletMain**；`WalletMain` 可依赖本模块，**禁止**在 `CommFunc` 中实现主功能业务页或卡种流程。

