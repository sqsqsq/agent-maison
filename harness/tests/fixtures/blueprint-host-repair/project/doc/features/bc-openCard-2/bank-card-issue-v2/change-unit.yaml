preserved_invariants:
  - invariant_id: existing-bank-card-routes
    description: 保留卡包与银行卡现有入口、返回导航和银行目录；仅把银行点击从暂不支持升级为开卡流程。
    evidence_refs:
      - doc/features/bc-openCard-1/acceptance.yaml
      - 01-Product/Phone/src/main/ets/pages/index.ets
      - 02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets
      - 02-Feature/WalletMain/src/main/ets/presentation/pages/AllBanksPage.ets
  - invariant_id: mock-only-external-behavior
    description: 银行、卡片和短信均为本地 mock，不接真实外部服务。
    evidence_refs:
      - doc/features/原始需求/1-2-银行卡/原始需求.md
target_predicates:
  - predicate_id: bank-entry-parity
    role: behavior
    description: 两个银行入口显示同一受支持卡种选择。
    provide_ids:
      - bank-card-opening-flow
    verification_refs:
      - acceptance:AC-1
      - acceptance:AC-2
  - predicate_id: mock-card-selection
    role: behavior
    description: 按银行和卡种展示两条 mock 卡并隐藏卡号中段。
    provide_ids:
      - bank-card-opening-flow
    verification_refs:
      - acceptance:AC-3
      - acceptance:AC-4
  - predicate_id: otp-validation
    role: behavior
    description: 模拟发码、手机号脱敏、倒计时重发与六位数字验证按生命周期工作。
    provide_ids:
      - bank-card-opening-flow
    verification_refs:
      - acceptance:AC-5
      - acceptance:AC-6
      - acceptance:AC-7
  - predicate_id: persistent-card-record
    role: contract
    description: RDB 持久化全字段，唯一卡号并完成交易记录 JSON 往返。
    provide_ids:
      - local-bank-card-record
    verification_refs:
      - acceptance:AC-8
      - acceptance:AC-9
  - predicate_id: result-and-route-cleanup
    role: recovery
    description: 结果状态来自写入结果；成功回钱包根页，失败回 AddCardEntryPage。
    provide_ids:
      - bank-card-opening-flow
    verification_refs:
      - acceptance:AC-10
      - acceptance:AC-11
      - acceptance:AC-12
  - predicate_id: bank-card-flow-owner
    role: owner
    description: Phone 仅注册目的地，AccountManager 唯一提供 mock 手机档案，WalletMain 唯一负责银行卡存储和流程。
    provide_ids:
      - bank-card-opening-flow
      - local-bank-card-record
    verification_refs:
      - acceptance:AC-7
      - acceptance:AC-10
      - acceptance:AC-12
  - predicate_id: bank-card-flow-consumers
    role: consumer
    description: 结果页只消费 repository 的真实写入结果；后续记录读取通过 card number query，不依赖旁路缓存。
    provide_ids:
      - bank-card-opening-flow
      - local-bank-card-record
    verification_refs:
      - acceptance:AC-8
      - acceptance:AC-9
      - acceptance:AC-11
