    needed_by: bank-card-issue-v3
providers:
  - provider_id: current-facts-discovery
    definition: Discover current code, schema, API, config and tests.
    consumer: Blueprint design.
    provider: Primary author.
    requirement: required
    available: true
    authority_rule: Code, schema, interface, config, and tests are current-state authority.
    source_rule: Every assertion carries source_ref and source revision when available.
    missing_behavior: Preserve unknown current facts as blockers.
    replacement_behavior: Re-read current source and retain conflicts.
    exit_behavior: Produce sourced facts and traceability.
    conflict_behavior: Keep both source refs and route the conflict to its owner.
  - provider_id: conventions-knowledge
    definition: Consume configured project conventions.
    consumer: Facts and design review.
    provider: Configured conventions file.
    requirement: optional
    available: false
    missing_disposition: not_applicable
    authority_rule: Project conventions are stable knowledge input, not current-code authority.
    source_rule: Applicable facts cite the configured conventions file and exact heading id.
    missing_behavior: No doc/conventions.md or configured override; not applicable.
    replacement_behavior: Read the configured file if enabled.
    exit_behavior: Do not invent convention facts.
    conflict_behavior: Current code remains current-state authority.
  - provider_id: se-manual-contracts
    definition: Consume platform operations, DTO, mapping, error, idempotency and NFR.
    consumer: Local RDB boundary.
    provider: Official ArkData materialized contract.
    requirement: required
    available: true
    authority_rule: Authorized SE or contract owner is external-contract authority.
    source_rule: Every contract segment carries source_ref, verification ref, and
      provenance.
    missing_behavior: Unknown platform semantics block unsupported use.
    replacement_behavior: Reconcile when the SDK reference changes.
    exit_behavior: Close local RDB contract; bank and SMS APIs are out of scope.
    conflict_behavior: Keep system API and product behavior sources distinct.
  - provider_id: app-design-lens
    definition: Answer the ten App boundary and lifecycle questions.
    consumer: 4+1 design.
    provider: Primary author.
    requirement: required
    available: true
    authority_rule: Lens is not fact authority and cannot override inputs.
    source_rule: Projection cites inputs, viewpoint contract, and lens rule version.
    missing_behavior: Unanswered current owner or lifecycle question is a blocker.
    replacement_behavior: Rebuild from current source evidence.
    exit_behavior: Record evidence-backed answers and trigger assessment.
    conflict_behavior: Route to the authoritative product, code, catalog, or platform source.
  - provider_id: independent-design-questioning
    definition: Challenge each applicable view, relation, flow and App question
      independently.
    consumer: Review summary.
    provider: Isolated design questioner.
    requirement: required
    available: true
    authority_rule: Questioning is not fact or decision authority.
    source_rule: Answers cite isolated blueprint, evidence package, and registered
      external inputs.
    missing_behavior: No admission until every required scope is covered.
    replacement_behavior: Repeat only changed or unresolved scopes.
    exit_behavior: Return scoped findings to primary author.
    conflict_behavior: Preserve conflict and route to fact or decision owner.
  - provider_id: component-assets
    definition: Read component index/catalog when enabled.
    consumer: Reuse decisions.
    provider: doc/component-index.yaml and doc/component-catalog.yaml.
    requirement: optional
    available: false
    missing_disposition: not_applicable
    authority_rule: Source is component fact authority; curation is human selection guidance.
    source_rule: Selection evidence cites the configured component index or catalog;
      component_ref identifies the asset.
    missing_behavior: No component inventory is enabled; inspect source directly.
    replacement_behavior: Revisit reuse when curated assets exist.
    exit_behavior: Do not bootstrap component catalog in this feature.
    conflict_behavior: Existing source is implementation fact.
design_views:
  - view_id: logical
    viewpoint_contract: app-logical@1
    applicability: applicable
    evolution_impact: changed
    stakeholders:
      - WalletMain
      - AccountManager
    purpose: 定义银行卡记录字段、卡种和读写结果语义。
    current_state: 银行目录是 mock；没有银行卡记录模型或本地 RDB。
    target_state: BankCardRecord 同时保留卡片大类与储蓄/信用卡种，记录全卡号、银行、添加时间、支付状态与交易记录。
    delta: 增加 BankCardRecord、BankCardOption 与只保存 mock 发卡结果的本地 RDB contract。
    decisions_and_gaps:
      - decision:card-number-storage-and-display
    verification_refs:
      - acceptance:AC-4
      - acceptance:AC-8
    nodes:
      - node_id: bank-card-record
        owner: WalletMain
        current_state: CardRepository 不持久银行卡。
        target_state: BankCardRecord.category=bank; bankCardType=savings|credit; cardNo
          完整存储但 UI 脱敏；addedAt 为 epoch millis；huaweiPayEnabled 与
          unionPayFlashEnabled 初始 false；transactionRecords 初始 []。
        provenance: &a4
          source_kind: product_requirement
          source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
          source_revision: 2026-06-10
          observed_at: 2026-10-10
          evidence_strength: authoritative
          extraction_method: direct_local_requirement
        verification_refs:
          - contract:wallet-local-rdb-card-storage
          - acceptance:AC-8
  - view_id: runtime
    viewpoint_contract: app-runtime@1
    applicability: applicable
    evolution_impact: changed
    stakeholders:
      - WalletMain
      - AccountManager
      - Phone
    purpose: 描述触发、首次读取、状态 owner、持久写入、消费者刷新、失败恢复和生命周期。
    current_state: 银行 tap 无后续流程；没有 OTP state、RDB mutation 或结果 consumer。
    target_state: 一次前台开卡 flow 写入一条 RDB 记录，结果页消费实际 resolve/reject。
    delta: 新增 mock verification、foreground insert 和按卡号 query；无跨页面 observer。
    decisions_and_gaps:
      - decision:result-route-by-write-result
    verification_refs:
      - acceptance:AC-5
      - acceptance:AC-9
    nodes:
      - node_id: bank-card-runtime-owner
        owner: WalletMain
        current_state: 无开卡 flow state。
        target_state: Sheet/page 持短期选择与 OTP 状态；RDB 持久记录是银行卡唯一真源。
        provenance: *a4
        verification_refs:
          - acceptance:AC-5
          - acceptance:AC-8
        design_basis_refs:
          - view:logical/node:bank-card-record
          - contract:wallet-local-rdb-card-storage
    runtime_data_flows:
      - flow_id: bank-card-open-flow
        data_domain_refs:
          - wallet-bank-card-records
        external_contract_refs:
          - contract:wallet-local-rdb-card-storage
        source_of_truth:
          authority: view:deployment/node:local-card-rdb
          persistence: contract:wallet-local-rdb-card-storage
          projections_and_caches:
            - view:runtime/node:bank-card-runtime-owner
          reconciliation: RDB 是持久真源；按 card_no 查询，不建立第二份持久缓存。
        triggers:
          - kind: user_action
            timing: 用户提交合法六位验证码
            idempotency: 一次有效提交最多触发一次 insert；card_no 唯一约束拒绝重复。
        initial_load:
          initial_load_id: bank-card-lookup
          strategy: BankCardRepository.getCardByNumber 在显式详情读取请求时按 card_no 查询。
          owner: BankCardRepository
          data_scope: 单条本地银行卡记录
          freshness: 每次调用直接读取 RDB，不使用内存持久缓存。
        state_owner:
          ref: view:development/node:walletmain-bank-card-flow-v4
          states:
            - RDB row 是持久真源
            - 结果页只持本次 write result 与 cardNo 路由参数
        mutations:
          - mutation_id: add-card-record
            kind: foreground
            persistence_ref: contract:wallet-local-rdb-card-storage
            publication_ref: publication:card-record-committed
            recovery_ref: recovery:rdb-write-result
        publications:
          - publication_id: card-record-committed
            kind: local_commit
            payload: insert 成功后记录可由 query API 读取，write result 交给结果页
        subscriptions: []
        consumers:
          - consumer_id: bank-card-reader
            initial_load_ref: initial-load:bank-card-lookup
            update_ref: publication:card-record-committed
            consumption: 按完整卡号读取已提交 BankCardRecord；本轮没有详情 UI。
        failure_recovery:
          recovery_id: rdb-write-result
          handling: 打开数据库、建表、insert 或唯一卡号冲突均进入失败态；不伪装成功，也不重复插入。
          retry: 失败结果完成后回 AddCardEntryPage，用户重新发起。
        decisions_and_gaps:
          - decision:result-route-by-write-result
        evidence_refs:
          - doc/features/原始需求/1-2-银行卡/原始需求.md
          - doc/features/bc-openCard-2/blueprint/contract-sources/arkdata-bank-card-storage.yaml
        verification_refs:
          - acceptance:AC-8
          - acceptance:AC-9
        logical_contract_refs:
          - contract:wallet-local-rdb-card-storage
        development_owner_ref: view:development/node:walletmain-bank-card-flow-v4
        provenance: *a4
        lifecycle_coverage:
          cold_start:
            status: covered
            evidence_refs:
              - contract:wallet-local-rdb-card-storage
          warm_resume:
            status: covered
            evidence_refs:
              - contract:wallet-local-rdb-card-storage
          page_attach:
            status: covered
            evidence_refs:
              - doc/features/原始需求/1-2-银行卡/原始需求.md
          page_detach:
            status: covered
            evidence_refs:
              - doc/features/原始需求/1-2-银行卡/原始需求.md
          account_switch:
            status: not_applicable
            evidence_refs:
              - 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
          process_recreation:
            status: covered
            evidence_refs:
              - contract:wallet-local-rdb-card-storage
          background_write:
            status: not_applicable
            evidence_refs:
              - doc/features/原始需求/1-2-银行卡/原始需求.md
        contracts:
          state_management:
            - data: BankCardRecord
              scope: single local issue; RDB is the persistent source of truth
              decorator: RDB
              holder: BankCardRepository
              module: WalletMain
              owner_ref: view:development/node:walletmain-bank-card-flow-v4
              contract_refs:
                - contract:wallet-local-rdb-card-storage
              ordered_steps:
                - validate six digit mock OTP
                - call BankCardRepository.saveBankCard once
                - show result from write result
                - clear route on success or return to AddCardEntryPage on failure
              lifecycle_triggers:
                - page_attach
                - page_detach
                - process_recreation
              failure_recovery:
                recovery_id: rdb-write-result
                description: RDB open/create/insert or unique card_no conflict enters failure;
                  do not retry insert; completion returns to AddCardEntryPage.
              mutations:
                - mutation_id: add-card-record
                  kind: foreground
                  publication_ref: publication:card-record-committed
                  recovery_ref: recovery:rdb-write-result
              publications:
                - publication_id: card-record-committed
              subscriptions: []
              consumers:
                - consumer_id: bank-card-reader
                  initial_load_ref: initial-load:bank-card-lookup
                  update_ref: publication:card-record-committed
        use_cases:
          schema_version: "2.1"
          use_cases:
            - id: bank_card_opening
              description: 从添加银行卡或全部银行入口完成本地 mock 开卡。
              coordinator: BankVerificationCodeSheet.handleSubmit
              coordinator_file: 02-Feature/WalletMain/src/main/ets/presentation/components/BankVerificationCodeSheet.ets
              ui_bindings:
                - ui: AddBankCardPage
                  role: entry
                  subscribes: []
                  user_actions:
                    - trigger: 点击一家银行
                      calls: AddBankCardPage.handleBankTap
                - ui: AllBanksPage
                  role: entry
                  subscribes: []
                  user_actions:
                    - trigger: 点击一家银行
                      calls: AllBanksPage.handleBankTap
                - ui: BankCardTypeSheet
                  role: dialog
                  subscribes: []
                  user_actions:
                    - trigger: 同意协议并继续
                      calls: BankCardTypeSheet.confirmSelection
                - ui: BankCardSelectionPage
                  role: progress
                  subscribes:
                    - selectedCardNo
                  user_actions:
                    - trigger: 选择卡片并进入短信验证
                      calls: BankCardSelectionPage.handleNext
                - ui: BankVerificationCodeSheet
                  role: dialog
                  subscribes:
                    - otpAndCountdown
                  user_actions:
                    - trigger: 重新发送 mock 验证码
                      calls: BankVerificationCodeSheet.resendCode
                    - trigger: 提交六位验证码
                      calls: BankVerificationCodeSheet.handleSubmit
                - ui: BankCardResultPage
                  role: result
                  subscribes:
                    - writeResult
                  user_actions:
                    - trigger: 完成结果页
                      calls: BankCardResultPage.handleComplete
              data_boundaries:
                - name: banks
                  type: BankRepository
                  kind: storage
                  methods:
                    - name: getBankCardOptions
                      params:
                        - BankInfo
                        - BankCardKind
                      returns: Promise<BankCardOption[]>
                      async: true
                - name: account
                  type: AccountService
                  kind: storage
                  methods:
                    - name: getUserProfile
                      params: []
                      returns: Promise<UserProfile>
                      async: true
                - name: cards
                  type: BankCardRepository
                  kind: storage
                  methods:
                    - name: saveBankCard
                      params:
                        - Context
                        - BankCardRecord
                      returns: Promise<BankCardWriteResult>
                      async: true
                    - name: getCardByNumber
                      params:
                        - Context
                        - string
                      returns: Promise<BankCardRecord | null>
                      async: true
              state_model:
                phases:
                  - Idle
                  - SelectingType
                  - SelectingCard
                  - WaitingCode
                  - Saving
                  - Success
                  - Failure
                  - Done
                fields:
                  - name: selectedCardType
                    type: BankCardKind | null
                  - name: selectedCardNo
                    type: string | null
                  - name: otpAndCountdown
                    type: string and number
                  - name: writeResult
                    type: BankCardWriteResult | null
              branches:
                - id: happy_path
                  scenario: 入口、选卡、验证码和 RDB insert 成功
                  user_sequence:
                    - handleBankTap
                    - confirmSelection
                    - handleNext
                    - handleSubmit
                    - handleComplete
                  expected_phase_seq:
                    - Idle
                    - SelectingType
                    - SelectingCard
                    - WaitingCode
                    - Saving
                    - Success
                    - Done
                  expected_boundary_calls:
                    - banks.getBankCardOptions
                    - account.getUserProfile
                    - cards.saveBankCard
                  linked_acceptance:
                    - AC-1
                    - AC-2
                    - AC-3
                    - AC-4
                    - AC-5
                    - AC-6
                    - AC-7
                    - AC-8
                    - AC-9
                    - AC-10
                    - AC-11
                    - AC-12
                - id: invalid_code
                  scenario: 短码或非数字验证码不写入
                  user_sequence:
                    - handleSubmit
                  expected_phase_seq:
                    - Idle
                    - WaitingCode
                  not_called:
                    - cards.saveBankCard
                  linked_acceptance:
                    - AC-6
                    - AC-8
                - id: resend_after_countdown
                  scenario: 60 秒后重新发送 mock 验证码
                  user_sequence:
                    - resendCode
                  expected_phase_seq:
                    - Idle
                    - WaitingCode
                  linked_acceptance:
                    - AC-6
                - id: rdb_insert_failure
                  scenario: RDB 写失败显示失败结果且返回入口
                  user_sequence:
                    - handleSubmit
                    - handleComplete
                  expected_phase_seq:
                    - Idle
                    - WaitingCode
                    - Saving
                    - Failure
                    - Done
                  expected_boundary_calls:
                    - cards.saveBankCard
                  linked_acceptance:
                    - AC-9
                    - AC-11
                - id: duplicate_card_number
                  scenario: 重复 card_no 被唯一约束拒绝且旧行不变
                  user_sequence:
                    - handleSubmit
                    - handleComplete
                  expected_phase_seq:
                    - Idle
                    - WaitingCode
                    - Saving
                    - Failure
                    - Done
                  expected_boundary_calls:
                    - cards.saveBankCard
                  linked_acceptance:
                    - AC-8
                    - AC-9
                    - AC-11
                - id: verification_closed
                  scenario: 关闭验证码半模态取消 timer 且不写卡
                  user_sequence:
                    - handleBankTap
                  expected_phase_seq:
                    - Idle
                    - WaitingCode
                    - Idle
                  not_called:
                    - cards.saveBankCard
                  linked_acceptance:
                    - AC-5
                    - AC-6
