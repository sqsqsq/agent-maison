    - decision_id: card-number-storage-and-display
      kind: data_privacy
      rationale: RDB 存完整 mock 卡号，界面只展示前四后四；日志不输出完整卡号、手机号或验证码。
      status: decided_with_authority
      owner: WalletMain
      provenance: *a2
      verification_refs:
        - acceptance:AC-4
        - acceptance:AC-8
        - doc/extensions/knowledge/constraints/security-privacy.md#SEC-01
    - decision_id: mock-card-option-cardinality
      kind: mock_data
      rationale: 每家银行每类两张确定性 mock 记录，落在原文允许的一至两张范围内，以实现具体卡片选择。
      status: decided_with_authority
      owner: WalletMain
      provenance: *a2
      verification_refs:
        - acceptance:AC-3
        - acceptance:AC-4
  gaps:
