decisions_and_gaps:
  decisions:
    - decision_id: success-route-home
      kind: product_flow
      rationale: 需求说明银行卡详情页完成后才跳详情；当前不存在详情 route，因此成功完成返回钱包首页。
      alternatives:
        - option: 成功立即跳银行卡详情页
          rejected_reason: 本工程当前无银行卡详情页且原文将此行为放到详情页开发之后。
          defect: 调用未注册 route。
      status: decided_with_authority
      owner: WalletMain
      provenance: *a2
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md
        - 01-Product/Phone/src/main/ets/pages/index.ets
    - decision_id: result-route-by-write-result
      kind: navigation_and_recovery
      rationale: 结果页收到完整 cardNo 和 write result；成功清开卡路由回钱包根页，失败 popToName AddCardEntryPage。
      status: answered_with_evidence
      owner: WalletMain
      provenance:
        source_kind: code
        source_ref: 01-Product/Phone/src/main/ets/pages/index.ets
        observed_at: 2026-10-10
        evidence_strength: observed
        extraction_method: route_stack_inspection
      verification_refs:
        - doc/features/原始需求/1-2-银行卡/原始需求.md
