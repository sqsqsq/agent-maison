  - view_id: deployment
    viewpoint_contract: app-deployment@1
    applicability: applicable
    evolution_impact: changed
    stakeholders:
      - Phone
      - WalletMain
      - AccountManager
      - HarmonyOS ArkData
    purpose: 记录手机 HAP/HAR、mock 账号数据与 app-local RDB 的运行拓扑。
    current_state: Phone HAP 装载 WalletMain HAR；没有银行卡 RDB。
    target_state: 现有 Phone 进程通过 WalletMain 打开 app-private RDB；不增权限或网络接口。
    delta: 一个本地表和两个 WalletMain destinations。
    decisions_and_gaps:
      - decision:success-route-home
      - gap:future-bank-card-detail
    verification_refs:
      - build-profile.json5
      - contract:wallet-local-rdb-card-storage
    rollout:
      - order: 1
        unit: AccountManager profile field
        depends_on: []
        note: 增加 mock phoneNumber，不改变既有 displayAccount。
      - order: 2
        unit: WalletMain RDB and pages
        depends_on:
          - AccountManager profile field
        note: 惰性创建表，不做破坏性迁移。
      - order: 3
        unit: Phone route registrations
        depends_on:
          - WalletMain pages
        note: 复用现有根 Navigation。
    nodes:
      - node_id: phone-app
        owner: Phone
        responsibilities:
          - Root Navigation
          - destination builder registration
        inputs:
          - WalletMain page builders
        outputs:
          - registered app routes
        not_responsible_for:
          - bank card repository
          - RDB record owner
        failure_impact: 没有注册的 destination 无法 push。
        current_state: 根 Navigation 注册现有四个卡包/银行卡 destination。
        target_state: 根 Navigation 增加两条新 builder 映射。
        provenance:
          source_kind: code
          source_ref: 01-Product/Phone/src/main/ets/pages/index.ets
          observed_at: 2026-10-10
          evidence_strength: observed
          extraction_method: route_host_read
        verification_refs:
          - acceptance:AC-10
      - node_id: local-card-rdb
        owner: WalletMain
        responsibilities:
          - Persist synthetic bank card record
          - Read record by full card number
        inputs:
          - BankCardRecord
        outputs:
          - insert result
          - BankCardRecord query
        not_responsible_for:
          - real bank issuing
          - real SMS delivery
          - payment provisioning
        failure_impact: The result page must show failure if RDB cannot persist.
        current_state: No WalletMain bank-card RDB exists.
        target_state: App-local table holds all required card fields and unique full cardNo.
        provenance:
          source_kind: external_contract
          source_ref: doc/features/bc-openCard-2/blueprint/contract-sources/arkdata-bank-card-storage.yaml
          observed_at: 2026-10-10
          evidence_strength: authoritative
          extraction_method: platform_contract
        verification_refs:
          - acceptance:AC-8
          - acceptance:AC-9
      - node_id: arkdata-relational-store
        owner: HarmonyOS ArkData
        responsibilities:
          - Expose local RelationalStore API
        inputs:
          - StoreConfig
          - ValuesBucket
        outputs:
          - insert/query result
        not_responsible_for:
          - bank approval
          - SMS verification
        failure_impact: WalletMain maps platform failure to failed card result.
        current_state: Target SDK provides ArkData RelationalStore.
        target_state: No platform modification; WalletMain consumes existing API.
        provenance:
          source_kind: external_contract
          source_ref: doc/features/bc-openCard-2/blueprint/contract-sources/arkdata-bank-card-storage.yaml
          observed_at: 2026-10-10
          evidence_strength: authoritative
          extraction_method: platform_contract
        verification_refs:
          - contract:wallet-local-rdb-card-storage
  - view_id: scenarios
    viewpoint_contract: app-scenarios@1
    applicability: applicable
    evolution_impact: changed
    stakeholders:
      - wallet user
      - WalletMain
    purpose: 追踪两个银行入口进入同一开卡旅程的用户动作与系统结果。
    current_state: 选择银行后显示暂不支持，流程结束。
    target_state: 选择卡种、具体 mock 卡、验证六位数字并按 RDB 写入结果结束。
    delta: 从 bank tap 延展为一条完整本地开卡流程。
    decisions_and_gaps:
      - decision:success-route-home
      - decision:result-route-by-write-result
    verification_refs:
      - acceptance:AC-1
      - acceptance:AC-12
    nodes:
      - node_id: bank-card-opening
        owner: WalletMain
        current_state: 两个银行入口都不能继续开卡。
        target_state: 二入口同效；完成时按 RDB 结果清栈回钱包首页或 AddCardEntryPage。
        provenance: *a4
        verification_refs:
          - acceptance:AC-1
          - acceptance:AC-11
        logical_refs:
          - view:logical/node:bank-card-record
          - contract:wallet-local-rdb-card-storage
        runtime_refs:
          - view:runtime/flow:bank-card-open-flow
        development_owner_ref: view:development/node:walletmain-bank-card-flow-v4
        deployment_refs:
          - view:deployment/node:phone-app
          - view:deployment/node:local-card-rdb
        journey_steps:
          - step_id: select_bank
            stage: 选择银行
            user_action: 在添加银行卡或全部银行页点击一家银行
            system_behavior: 展示支持卡种半模态
            preconditions:
              - 银行列表已显示
          - step_id: select_card
            stage: 选择卡片
            user_action: 选择卡种、卡片并同意协议
            system_behavior: 显示该行 mock 卡并只展示前四后四
            preconditions:
              - 所选卡种由 BankInfo 支持
          - step_id: verify_otp
            stage: 短信验证
            user_action: 输入任意六位数字
            system_behavior: 打开时模拟发送并启动 60 秒重发倒计时
            preconditions:
              - AccountManager profile 提供手机号
          - step_id: persist_result
            stage: 写入和完成
            user_action: 点击结果页完成
            system_behavior: 根据 insert 结果显示状态并清理开卡 routes
            preconditions:
              - RDB insert resolve 或 reject
        path_variants:
          - user_type: 从添加银行卡进入
            difference: 直接点 bank row 后打开同一 type Sheet。
          - user_type: 从全部银行进入
            difference: 分组 bank row 使用同一 type Sheet。
          - user_type: 银行仅支持一种卡种
            difference: 只显示 supportedCardTypes 中唯一项。
          - user_type: RDB 写失败或卡号重复
            difference: 显示失败结果，完成后回 AddCardEntryPage。
