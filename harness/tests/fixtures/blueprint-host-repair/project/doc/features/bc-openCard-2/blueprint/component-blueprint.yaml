review_summary:
  background: bc-openCard-1 已交付添加银行卡页、全部银行页和 20 家银行 mock 数据；点击银行仍只显示暂不支持。
  problem: 添加银行卡缺少卡种、具体卡号选择、验证码、本地卡数据持久化和结果页。
  goals:
    - goal_id: complete-bank-card-opening
      statement: 从任一银行入口走通 mock 开卡、RDB 写入和结果处理。
      success_measures:
        - 两处入口进入同一流程
        - 成功时全字段入库且界面只露前四后四位
        - RDB 成败均展示匹配结果
        - 结果完成后清除开卡路由
        - 四个开卡页面符合权威截图并通过真机逐屏核验
        - logo、图标和插画从权威截图裁剪，且不显示排除的 NFC 区域
  positioning: WalletMain 内的一条完整垂直切片；不调用真实银行、短信或支付服务。
  in_scope:
    - WalletMain：银行 mock、开卡页面、卡模型和 RDB 仓库
    - AccountManager：向 mock UserProfile 暴露手机号
    - Phone：沿现有 NavDestination 注册新页面
  non_goals:
    - 真实银行开户、真实短信、支付开通
    - 银行卡详情页
    - 本轮首页卡片视觉改版或卡包读模型改造
  authored_by: primary-agent
  admission:
    status: pass
    root_questions_complete: true
    blocker_refs: []
    current_slice:
      slice_id: bank-card-issue-v4
      contracts_ready: true
      design_refs_ready: true
