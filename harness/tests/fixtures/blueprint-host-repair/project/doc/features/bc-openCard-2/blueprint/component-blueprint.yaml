                - key: bank_card_otp_resend
                  value: 重新发送
                  description: 重新发码按钮
                - key: bank_card_result_success
                  value: 添加成功
                  description: 成功结果标题
                - key: bank_card_result_success_hint
                  value: 可用于实体店二维码支付和网上商城支付
                  description: 成功说明
                - key: bank_card_result_failure
                  value: 添加失败
                  description: 失败结果标题
                - key: bank_card_result_failure_hint
                  value: 本次未能完成银行卡添加，请返回后重试
                  description: 失败说明
                - key: bank_card_complete
                  value: 完成
                  description: 结果页唯一出口
              media:
                - key: cmb_bank_logo
                  media: 02-Feature/WalletMain/src/main/resources/base/media/cmb_bank_logo.png
                  description: 招商银行标识从参考截图 3 裁剪
                - key: nav_back_chevron
                  media: 02-Feature/WalletMain/src/main/resources/base/media/nav_back_chevron.png
                  description: 返回控件从参考截图 3 裁剪
                - key: search_magnifier
                  media: 02-Feature/WalletMain/src/main/resources/base/media/search_magnifier.png
                  description: 搜索图标从参考截图 3 裁剪
                - key: bank_row_chevron
                  media: 02-Feature/WalletMain/src/main/resources/base/media/bank_row_chevron.png
                  description: 银行行尾箭头从参考截图 3 裁剪
                - key: sheet_close
                  media: 02-Feature/WalletMain/src/main/resources/base/media/sheet_close.png
                  description: 半模态关闭控件从参考截图 3 裁剪
                - key: card_type_selected_blue
                  media: 02-Feature/WalletMain/src/main/resources/base/media/card_type_selected_blue.png
                  description: 卡种选中图标从参考截图 3 裁剪
                - key: card_type_unselected
                  media: 02-Feature/WalletMain/src/main/resources/base/media/card_type_unselected.png
                  description: 卡种未选中图标从参考截图 3 裁剪
                - key: card_selected_red
                  media: 02-Feature/WalletMain/src/main/resources/base/media/card_selected_red.png
                  description: 银行卡选中图标从参考截图 4 裁剪
                - key: agreement_checked_red
                  media: 02-Feature/WalletMain/src/main/resources/base/media/agreement_checked_red.png
                  description: 协议勾选图标从参考截图 4 裁剪
                - key: bank_result_success_icon
                  media: 02-Feature/WalletMain/src/main/resources/base/media/bank_result_success_icon.png
                  description: 开卡成功图标从参考截图 6 裁剪
                - key: bank_result_payment_illustration
                  media: 02-Feature/WalletMain/src/main/resources/base/media/bank_result_payment_illustration.png
                  description: 支付插画从参考截图 6 裁剪
          state_management:
            - data: supportedCardTypes
              scope: bank mock
              decorator: plain model
              holder: BankRepository
              module: WalletMain
            - data: selectedCardType
              scope: type Sheet
              decorator: "@State"
              holder: BankCardTypeSheet
              module: WalletMain
            - data: selectedCardNo
              scope: selection page
              decorator: "@State"
              holder: BankCardSelectionPage
              module: WalletMain
            - data: otpAndCountdown
              scope: verification Sheet lifetime
              decorator: "@State"
              holder: BankVerificationCodeSheet
              module: WalletMain
              lifecycle_triggers:
                - "open: start 60 second timer"
                - "close: clear timer"
          change_unit:
            predicate_mappings:
              - predicate_id: bank-entry-parity
                implementation_refs:
                  - planned:02-Feature/WalletMain/src/main/ets/presentation/components/BankCardTypeSheet.ets#BankCardTypeSheet
                  - planned:02-Feature/WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#AddBankCardPage.handleBankTap
                  - planned:02-Feature/WalletMain/src/main/ets/presentation/pages/AllBanksPage.ets#AllBanksPage.handleBankTap
