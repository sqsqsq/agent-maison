    - decision_id: shared-bank-entry-sheet
      kind: component_boundary
      rationale: 两个银行列表入口共享同一卡类型半模态，避免交互分叉。
      status: answered_with_evidence
      owner: WalletMain
      provenance: *a2
      verification_refs:
