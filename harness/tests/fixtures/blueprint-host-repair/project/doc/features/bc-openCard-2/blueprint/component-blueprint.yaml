              ut_focus: profile phone 与 MaskUtil 输出对应。
            - id: AC-8
              prd_function: F8
              priority: P0
              description: 验证码提交成功后把完整银行卡记录写入本地 RDB。
              testable: true
              verification_steps:
                - 输入六位验证码并提交
                - 按完整卡号重新查询
              expected_result: 记录包含全号、bank 类别、银行、储蓄/信用卡种、添加时间、两种支付状态和交易记录。
              ut_layer: both
              ut_focus: 核对模型和 ValuesBucket 全字段映射。
              device_focus: 在真机完成一次 mock 发卡并按卡号复查。
            - id: AC-9
              prd_function: F9
              priority: P0
              description: RDB 写入成功与失败均打开结果页并携带 cardNo 与真实结果。
              testable: true
              verification_steps:
                - 模拟 insert resolve
                - 模拟 insert reject/卡号重复
              expected_result: 结果页状态与真实写入结果一致；不打印全号、验证码或异常明文。
              ut_layer: both
              ut_focus: 覆盖 success、RDB reject、unique card_no conflict。
              device_focus: 真机分别检查成功写入与重复卡号失败时的状态、卡号掩码和结果提示。
            - id: AC-10
              prd_function: F10
              priority: P0
              description: 结果页无 title/back 按钮且系统 back 被消费。
              testable: true
              verification_steps:
                - 显示结果页
                - 尝试系统返回/边缘侧滑
              expected_result: 返回操作不离开结果页；只有完成按钮退出。
              ut_layer: device
              device_focus: 真机验证边缘手势和系统返回均未 pop。
            - id: AC-11
              prd_function: F11
              priority: P0
              description: 结果页完成后成功回钱包根首页，失败回 AddCardEntryPage。
              testable: true
              verification_steps:
                - 成功结果完成
                - 失败结果完成
              expected_result: 成功清理整条开卡 Navigation 栈；失败 popToName AddCardEntryPage；均不可返回开卡过程。
              ut_layer: device
              device_focus: 断言成功/失败最终页面和 stack route list。
            - id: AC-12
              prd_function: F12
              priority: P0
              description: 原有卡包、添加卡片、添加银行卡和全部银行路由继续可往返。
              testable: true
              verification_steps:
                - 从 CardPackPage 进入添加卡片
                - 继续到银行页/全部银行页并返回
              expected_result: 旧入口与返回展开态保持正常，新页面按同一 NavPathStack 注册。
              ut_layer: device
              device_focus: 覆盖 CardPackPage 到新开卡流程再返回的回归路径。
            - id: AC-13
              prd_function: F13
              priority: P0
              description: 卡种半模态页面按截图 3 的像素目标布局，招商银行标识和图标从原图裁切。
              testable: true
              verification_steps:
                - 从添加银行卡页点击招商银行，捕获卡种半模态。
                - 核对原图文案、元素结构、相对布局、选中状态和裁切资源。
              expected_result: card_type_sheet 与 ref_card_type_sheet 的布局一致；截图中有来源的
                logo/图标由原图确定性裁切并通过 asset_crop_validation。
              ut_layer: device
              device_focus: 真机截图逐屏对照 ref_card_type_sheet，并核验 logo、图标来源及裁切 hash。
              linked_flow: bank_card_opening_from_add_bank
              linked_branch: happy_path
              checkpoint:
                pre_screen: add_bank_card_collapsed
                action:
                  target_element_id: visible_bank_row_3
                post_screen: card_type_sheet
                required_element_ids:
                  - card_type_sheet_3
                  - sheet_title_3
                  - type_bank_name_3
                  - type_continue_3
              requirement_ref:
                source_path: doc/features/bc-openCard-2/requirement-context.md
                snippet: 页面布局和交互须按需求截图实现；logo、图标、插画等图片资源须从这些原始截图中裁剪获取，不用近似生成资源代替。
                snippet_sha256: b30a20b730edee893663172b563004ccd3797bc2396c69b0f6169ff44e3851e3
            - id: AC-14
              prd_function: F14
              priority: P0
              description: 银行卡选择页面按截图 4 的像素目标布局，银行标识和勾选图标从原图裁切。
              testable: true
              verification_steps:
                - 在卡种半模态点击同意并继续，捕获银行卡选择页面。
                - 核对银行名称、脱敏卡号、协议、选中状态、按钮布局和裁切资源。
              expected_result: bank_card_selection 与 ref_card_selection 的布局一致；截图中有来源的
                logo/图标由原图确定性裁切并通过 asset_crop_validation。
              ut_layer: device
              device_focus: 真机截图逐屏对照 ref_card_selection，并核验 logo、图标来源及裁切 hash。
              linked_flow: bank_card_opening
              linked_branch: happy_path
              checkpoint:
                pre_screen: card_type_sheet
                action:
                  target_element_id: type_continue_3
                post_screen: bank_card_selection
                required_element_ids:
                  - bank_selection_title_4
                  - mock_card_container_4
                  - card_selection_next_4
              requirement_ref:
                source_path: doc/features/bc-openCard-2/requirement-context.md
                snippet: 页面布局和交互须按需求截图实现；logo、图标、插画等图片资源须从这些原始截图中裁剪获取，不用近似生成资源代替。
                snippet_sha256: b30a20b730edee893663172b563004ccd3797bc2396c69b0f6169ff44e3851e3
            - id: AC-15
              prd_function: F15
              priority: P0
              description: 短信验证码半模态按截图 5 的像素目标布局呈现，手机号脱敏且倒计时和数字键盘可用。
              testable: true
              verification_steps:
                - 在银行卡选择页面点击下一步，捕获验证码半模态和系统数字键盘。
                - 核对原图文案、脱敏手机号、输入区、倒计时、禁用按钮和相对布局。
              expected_result: verification_sheet 与 ref_verification_sheet
                的布局和交互状态一致；验证码仅显示脱敏手机号，crop 资源通过 asset_crop_validation。
              ut_layer: device
              device_focus: 真机截图逐屏对照 ref_verification_sheet，并验证数字输入、倒计时和重发状态。
              linked_flow: bank_card_opening
              linked_branch: happy_path
              checkpoint:
                pre_screen: bank_card_selection
                action:
                  target_element_id: card_selection_next_4
                post_screen: verification_sheet
                required_element_ids:
                  - verification_sheet_5
                  - verification_sheet_title_5
                  - masked_phone_5
                  - code_field_5
                  - countdown_label_5
                  - verification_next_5
              requirement_ref:
                source_path: doc/features/bc-openCard-2/requirement-context.md
                snippet: 页面布局和交互须按需求截图实现；logo、图标、插画等图片资源须从这些原始截图中裁剪获取，不用近似生成资源代替。
                snippet_sha256: b30a20b730edee893663172b563004ccd3797bc2396c69b0f6169ff44e3851e3
            - id: AC-16
              prd_function: F16
              priority: P0
              description: 开卡结果页按截图 6 的像素目标布局显示结果图标和支付插画；本次不展示 NFC 激活区域。
              testable: true
              verification_steps:
                - 提交验证码后捕获 RDB 成功结果页。
                - 核对结果文案、成功图标、支付插画、完成按钮和 NFC 排除元素。
              expected_result: bank_card_result 与 ref_result_page 中开卡成功区域布局一致；NFC
                激活说明和操作均不存在；截图插画及图标由原图确定性裁切并通过 asset_crop_validation。
              ut_layer: device
              device_focus: 真机截图逐屏对照 ref_result_page、核验裁切 hash，并确认 NFC 区域未渲染。
              linked_flow: bank_card_opening
              linked_branch: happy_path
              checkpoint:
                pre_screen: verification_sheet
                action:
                  target_element_id: verification_next_5
                post_screen: bank_card_result
                required_element_ids:
                  - result_success_icon_6
                  - result_success_title_6
                  - result_payment_illustration_6
                  - result_complete_button_6
                forbidden_element_ids:
                  - nfc_description_6
                  - nfc_action_6
              requirement_ref:
                source_path: doc/features/bc-openCard-2/requirement-context.md
                snippet: 页面布局和交互须按需求截图实现；logo、图标、插画等图片资源须从这些原始截图中裁剪获取，不用近似生成资源代替。
                snippet_sha256: b30a20b730edee893663172b563004ccd3797bc2396c69b0f6169ff44e3851e3
          flows:
            bank_card_opening:
              description: 从全部银行页进入后，沿共享卡种、选卡、验证码和结果页完成银行卡添加流程。
              screens:
                - all_banks
                - card_type_sheet
                - bank_card_selection
                - verification_sheet
                - bank_card_result
            bank_card_opening_from_add_bank:
              description: 添加银行卡页直接点银行进入共享卡种半模态；后续继续走 bank_card_opening 的共同流程。
              screens:
                - add_bank_card_collapsed
                - card_type_sheet
            legacy_route_regression:
              description: 卡包旧入口进入现有添加卡片和银行路径。
              screens:
                - card_pack
                - add_card_entry
                - add_bank_card_collapsed
                - all_banks
        contracts:
          schema_version: "1.0"
          feature: bank-card-issue-v4
          modules:
            - name: WalletMain
              layer: 02-Feature
              format: HAR
              change_type: modify
              package_path: 02-Feature/WalletMain
              export_file: 02-Feature/WalletMain/src/main/ets/index.ets
            - name: AccountManager
              layer: 04-BusinessBase
              format: HAR
              change_type: modify
              package_path: 04-BusinessBase/AccountManager
              export_file: 04-BusinessBase/AccountManager/src/main/ets/index.ets
            - name: Phone
              layer: 01-Product
              format: HAP
              change_type: modify
              package_path: 01-Product/Phone
          module_dependencies:
            WalletMain:
              - AccountManager
              - CommUI
              - CommFunc
            AccountManager:
              - CommFunc
            Phone:
              - WalletMain
              - AccountManager
              - CommFunc
          data_models:
            - name: BankInfo
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankInfo.ets
              kind: interface
              fields:
                - name: supportedCardTypes
                  type: BankCardKind[]
                  required: true
            - name: BankCardRecord
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCard.ets
              kind: interface
              fields:
                - name: cardNo
                  type: string
                  required: true
                - name: cardCategory
                  type: string
                  required: true
                - name: bankCode
                  type: string
                  required: true
                - name: bankName
                  type: string
                  required: true
                - name: bankCardType
                  type: BankCardKind
                  required: true
                - name: addedAt
                  type: number
                  required: true
                - name: huaweiPayEnabled
                  type: boolean
                  required: true
                - name: unionPayFlashEnabled
                  type: boolean
                  required: true
                - name: transactionRecords
                  type: string[]
                  required: true
            - name: UserProfile
              module: AccountManager
              file: 04-BusinessBase/AccountManager/src/main/ets/data/model/UserProfile.ets
              kind: class
              fields:
                - name: phoneNumber
                  type: string
                  required: true
            - name: BankCardKind
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCard.ets
              kind: union
              fields:
                - name: savings
                  type: "'savings'"
                  required: true
                - name: credit
                  type: "'credit'"
                  required: true
            - name: BankCardOption
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCard.ets
              kind: interface
              fields:
                - name: cardNo
                  type: string
                  required: true
                - name: bankCardType
                  type: BankCardKind
                  required: true
            - name: BankCardWriteResult
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/data/model/BankCard.ets
              kind: interface
              fields:
                - name: success
                  type: boolean
                  required: true
                - name: rowId
                  type: number | null
                  required: true
          interfaces:
            - module: WalletMain
              layer: data
              file: 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets
              class: BankRepository
              methods:
                - name: getBankCardOptions
                  params:
                    - name: bank
                      type: BankInfo
                    - name: cardType
                      type: BankCardKind
                  return: Promise<BankCardOption[]>
                  async: true
                  description: 返回该银行/卡种对应的两条 mock 卡片，含完整卡号。
            - module: WalletMain
              layer: data
              file: 02-Feature/WalletMain/src/main/ets/data/repository/BankCardRepository.ets
              class: BankCardRepository
              methods:
                - name: saveBankCard
                  params:
                    - name: context
                      type: Context
                    - name: record
                      type: BankCardRecord
                  return: Promise<BankCardWriteResult>
                  async: true
                  description: 惰性创建表并写全记录，失败以 result 表达。
                - name: getCardByNumber
                  params:
                    - name: context
                      type: Context
                    - name: cardNo
                      type: string
                  return: Promise<BankCardRecord | null>
                  async: true
                  description: 按完整卡号查询，供后续详情读取。
            - module: WalletMain
              layer: domain
              file: 02-Feature/WalletMain/src/main/ets/domain/service/BankCardService.ets
              class: BankCardService
              methods:
                - name: maskCardNumber
                  params:
                    - name: cardNo
                      type: string
                  return: string
                  async: false
                  description: 显示首四后四卡号。
                - name: sanitizeVerificationCode
                  params:
                    - name: code
                      type: string
                  return: string
                  async: false
                  description: 保留六位以内数字。
                - name: isValidVerificationCode
                  params:
                    - name: code
                      type: string
                  return: boolean
                  async: false
                  description: 任意六位数字视为 mock OTP 有效。
            - module: AccountManager
              layer: domain
              file: 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
              class: AccountService
              methods:
                - name: getUserProfile
                  params: []
                  return: Promise<UserProfile>
                  async: true
                  description: 返回 mock UserProfile，供验证码页按 MaskUtil 脱敏展示手机号。
          components:
            - name: BankCardTypeSheet
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/presentation/components/BankCardTypeSheet.ets
              kind: component
              decorator: "@Component"
              description: 两个银行页共用类型/协议半模态。
            - name: BankVerificationCodeSheet
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/presentation/components/BankVerificationCodeSheet.ets
              kind: component
              decorator: "@Component"
              description: 脱敏手机号、六位数字和 60 秒重发半模态。
            - name: BankCardSelectionPage
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardSelectionPage.ets
              kind: page
              decorator: "@Component"
              nav_destination: BankCardSelectionPage
              description: 银行内部全屏选卡页。
            - name: BankCardResultPage
              module: WalletMain
              file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardResultPage.ets
              kind: page
              decorator: "@Component"
              nav_destination: BankCardResultPage
              description: 全屏成功/失败结果；完成按钮唯一出口。
          navigation:
            config_files:
              - 02-Feature/WalletMain/src/main/resources/base/profile/route_map.json
              - 01-Product/Phone/src/main/ets/pages/index.ets
          resource_keys:
            WalletMain:
              color:
                - key: bank_card_sheet_bg
                  value: "#F2F3F5"
                  description: 流程半模态页面底色
                - key: bank_card_action
                  value: "#155EEF"
                  description: 卡种和验证码主操作
                - key: bank_card_select_action
                  value: "#D71920"
                  description: 具体卡选择主操作
              string:
                - key: bank_card_type_title
                  value: 选择卡类型
                  description: 类型半模态标题
                - key: bank_card_savings
                  value: 储蓄卡
                  description: 储蓄卡选项
                - key: bank_card_credit
                  value: 信用卡
                  description: 信用卡选项
                - key: bank_card_type_continue
                  value: 同意并继续
