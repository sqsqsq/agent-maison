schema_version: "1.0"
state_management:
  - id: opening-state-machine
    owner: BankOpeningSession
    owner_ref: view:runtime/node:opening-session
    contract_refs:
      - contract:bank-card-persistence
    states:
      - TYPE_SELECTING
      - CARD_SELECTING
      - OTP_VERIFYING
      - SAVING
      - RESULT
    mutations:
      - mutation_id: persist-card
        publication_ref: publication:save-outcome
        recovery_ref: recovery:save-card
        operation: BankCardRepository.save
    publications:
      - publication_id: save-outcome
        payload: BankCardSaveOutcome
    subscriptions: []
    consumers:
      - consumer_id: result-page
        initial_load_ref: initial-load:session
        update_ref: publication:save-outcome
        component: BankCardResultPage
    ordered_steps:
      - AddBankCardPage 或 AllBanksPage 调用 BankOpeningCoordinator.start(bank, stack)，记录
        stack.getAllPathName().lastIndexOf('AddBankCardPage') 为 originAddBankCardIndex，得到新的 OpeningSession 并展示
        CardTypeSheet。
      - CardTypeSheet 调用 session.selectType(type)，校验银行支持后调用 BankOpeningNavigator.openCardSelection(session)，由
        navigator 使用 NavPathContext.stack().pushPath 进入 BankCardSelectionPage。
      - BankCardSelectionPage 调用 BankRepository.getCards(bank.code, type)，只渲染 maskedNumber；用户选择后调用
        session.selectCard(card)，点击下一步调用 BankOpeningCoordinator.openOtp(session) 展示 OtpVerificationSheet。
      - OtpVerificationSheet attach 时调用 AccountService.getUserProfile() 取得 mock 手机号，只渲染
        MaskUtil.maskPhone(phoneNumber)；OtpCountdown.start(60) 写入
        otpDeadlineMs=Date.now()+60000，页面每秒从绝对截止时间派生剩余秒数，detach 清理 timer。
      - 用户提交时 session.tryBeginSaving(code) 原子校验六位数字并从 OTP_VERIFYING 进入 SAVING；SAVING 期间禁用提交、重发和关闭。成功取得锁后
        coordinator 仅调用一次 BankCardRepository.save(session.selectedCard.toRecord()) 并等待 RDB transaction 返回。
      - repository 返回 BankCardSaveOutcome 后 coordinator 关闭 modal 并调用 BankOpeningNavigator.openResult(outcome,
        originAddBankCardIndex) push BankCardResultPage；结果页拦截返回。
      - 完成按钮调用 BankOpeningNavigator.finish(outcome, originAddBankCardIndex)：成功执行 stack.clear(false)
        回根首页；失败重新读取 names，构造 originAddBankCardIndex+1..names.length-1 的索引数组并调用 removeByIndexes，保留初始
        AddBankCardPage；最后清空 session 中的完整卡号与 OTP。
    design_ref:
      artifact: component-blueprint@1
      component_id: wallet-bank-card-opening
      blueprint_id: bc-openCard-2
      revision: 1
      source_fingerprint: sha256:de3708c28bdc3fde2cfd27fa7109b58eac488c8acd638a0a9df8e73eeb0d0693
      artifact_sha256: sha256:c1a68d6dc8e37a7608b0d402da9ec7c50359de74a3e7403786986dc1f0a90808
      target:
        kind: flow
        view_id: runtime
        id: bank-card-opening-flow
    mechanism: "@Observed / @ObjectLink共享同一session"
    ui_subscription: presentation注入onResult回调，等待保存后关闭OTP并openResult；导航和弹层只在设备验证。成功由Phone根handler接收完整卡号并选首页，再clear(false)，不改首页读模型。
    lifecycle: 每次入口新建；OTP detach清timer，恢复按绝对deadline重算；SAVING不允许取消；完成清敏感数据；进程重建不恢复session。
    recovery: 事务成功commit才成功；异常统一failure，已开始事务rollback；ResultSet及时close；commit后崩溃保留RDB记录，不重放UI。
