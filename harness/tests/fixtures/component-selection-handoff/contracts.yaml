    layer: 04-BusinessBase
    format: HAR
    change_type: modify
    package_path: 04-BusinessBase/AccountManager
  - name: Phone
    layer: 01-Product
    format: HAP
    change_type: modify
    package_path: 01-Product/Phone
components:
  - name: CardTypeSheet
    file: 02-Feature/WalletMain/src/main/ets/presentation/components/CardTypeSheet.ets
    kind: component
    asset_selection:
      resolution: custom
      rationale: 现有组件库存无业务半模态，保留 WalletMain 领域语义。
    props:
      - name: session
        type: BankOpeningSession
        decorator: "@ObjectLink"
    events: []
    children: []
  - name: OtpVerificationSheet
    file: 02-Feature/WalletMain/src/main/ets/presentation/components/OtpVerificationSheet.ets
    kind: component
    asset_selection:
      resolution: custom
      rationale: 验证码计时与输入规则是本 feature 专用。
    props:
      - name: session
        type: BankOpeningSession
        decorator: "@ObjectLink"
    events: []
    children: []
  - name: BankCardSelectionPage
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardSelectionPage.ets
    kind: builder
    asset_selection:
      resolution: custom
      rationale: 现有页面只覆盖银行列表，具体卡片页为新业务页面。
    props:
      - name: session
        type: BankOpeningSession
        decorator: "@ObjectLink"
    events: []
    children: []
  - name: BankCardResultPage
    file: 02-Feature/WalletMain/src/main/ets/presentation/pages/BankCardResultPage.ets
    kind: builder
    asset_selection:
      resolution: custom
      rationale: 结果页承担不可返回与清栈语义。
    props: []
    events: []
    children: []
  - name: BankOpeningSession
    file: 02-Feature/WalletMain/src/main/ets/domain/model/BankOpeningSession.ets
    kind: domain_state
    responsibility: 单一持有银行、类型、完整卡、OTP deadline、SAVING 状态、结果与起始栈边界；完成后清除敏感字段。
    props: []
    events: []
    children: []
  - name: BankOpeningNavigator
    file: 02-Feature/WalletMain/src/main/ets/presentation/navigation/BankOpeningNavigator.ets
    kind: navigation_helper
    responsibility: 使用既有 NavPathStack API 执行新页面入栈、结果页拦截与成功/失败精确清栈。
    props: []
    events: []
    children: []
  - name: Index
    module: Phone
    file: 01-Product/Phone/src/main/ets/pages/Index.ets
    kind: page
    asset_selection:
      resolution: evolve
      component_ref: WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
      rationale: 延续现有 Phone navDestinationMap 加 WalletMain builder 的模式，只扩展两个路由，不另造导航系统。
interfaces:
  - class: BankOpeningCoordinator
    file: 02-Feature/WalletMain/src/main/ets/domain/service/BankOpeningCoordinator.ets
    methods:
      - name: start
        params:
          - name: bank
            type: BankInfo
          - name: stack
            type: NavPathStack
        return: BankOpeningSession
        async: false
        description: start
      - name: openOtp
        params:
          - name: session
            type: BankOpeningSession
        return: void
        async: false
        description: openOtp
      - name: submitOtp
        params:
          - name: code
            type: string
        return: Promise<BankCardSaveOutcome>
        async: true
        description: submitOtp
      - name: getInstance
        params: []
        return: BankOpeningCoordinator
        async: false
        description: 单个当前session协调器
      - name: configure
        params:
          - name: repository
            type: BankCardRepository
          - name: onResult
            type: "(outcome: BankCardSaveOutcome, originAddBankCardIndex: number) => void"
        return: void
        async: false
        description: 页面注入结果回调；domain不import presentation
    layer: domain
  - class: BankOpeningSession
    file: 02-Feature/WalletMain/src/main/ets/domain/model/BankOpeningSession.ets
    methods:
      - name: selectType
        params:
          - name: type
            type: BankCardType
        return: void
        async: false
        description: selectType
      - name: selectCard
        params:
          - name: card
            type: MockBankCard
        return: void
        async: false
        description: selectCard
      - name: setAgreementAccepted
        params:
          - name: accepted
            type: boolean
        return: void
        async: false
        description: setAgreementAccepted
      - name: setOtp
        params:
          - name: code
            type: string
        return: void
        async: false
        description: setOtp
      - name: tryBeginSaving
        params:
          - name: code
            type: string
        return: boolean
        async: false
        description: tryBeginSaving
      - name: cancelOtp
        params: []
        return: void
        async: false
        description: cancelOtp
      - name: clearSensitiveData
        params: []
        return: void
        async: false
        description: clearSensitiveData
    layer: domain
  - class: BankOpeningNavigator
    file: 02-Feature/WalletMain/src/main/ets/presentation/navigation/BankOpeningNavigator.ets
    methods:
      - name: openCardSelection
        params:
          - name: session
            type: BankOpeningSession
        return: void
        async: false
        description: openCardSelection
      - name: openResult
        params:
          - name: outcome
            type: BankCardSaveOutcome
          - name: originAddBankCardIndex
            type: number
        return: void
        async: false
        description: openResult
      - name: finish
        params:
          - name: outcome
            type: BankCardSaveOutcome
          - name: originAddBankCardIndex
            type: number
        return: void
        async: false
        description: finish
      - name: setHomeCompletionHandler
        params:
          - name: handler
            type: "((fullCardNumber: string) => void) | undefined"
        return: void
        async: false
        description: Phone根attach注册，detach移除；成功clear前回调，卡号不写AppStorage
    layer: presentation
  - class: BankCardRepository
    file: 02-Feature/WalletMain/src/main/ets/data/repository/BankCardRepository.ets
    methods:
      - name: save
        params:
          - name: record
            type: BankCardRecord
        return: Promise<BankCardSaveOutcome>
        async: true
        description: save
      - name: findByCardNumber
        params:
          - name: fullCardNumber
            type: string
        return: Promise<BankCardRecord | null>
        async: true
        description: findByCardNumber
    layer: data
  - class: BankRepository
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/repository/BankRepository.ets
    layer: data
    methods:
      - name: getBanks
        params: []
        return: Promise<BankInfo[]>
        async: true
        description: 沿用旧银行列表与排序
      - name: getCards
        params:
          - name: bankCode
            type: string
          - name: type
            type: BankCardType
        return: Promise<MockBankCard[]>
        async: true
        description: 每银行/类型1–2张稳定mock
  - class: MockBankCard
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/MockBankCard.ets
    layer: data
    methods:
      - name: toRecord
        params: []
        return: BankCardRecord
        async: false
        description: local_mock_wallet/BANK_CARD/当前毫秒/支付状态false/交易[]
  - class: OtpCountdown
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/domain/service/OtpCountdown.ets
    layer: domain
    methods:
      - name: start
        params:
          - name: seconds
            type: number
        return: void
        async: false
        description: 写入session deadline并启动刷新；墙钟可注入
      - name: restart
        params: []
        return: void
        async: false
        description: 零秒且非SAVING才再次60秒
      - name: remainingSeconds
        params: []
        return: number
        async: false
        description: max(0,ceil((deadline-now)/1000))
      - name: dispose
        params: []
        return: void
        async: false
        description: 幂等清timer
  - class: AccountService
    module: AccountManager
    file: 04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets
    layer: domain
    methods:
      - name: getUserProfile
        params: []
        return: UserProfile
        async: false
        description: 登录与未登录均含mock phoneNumber；旧账号展示不变
navigation:
  routes:
    - BankCardSelectionPage
    - BankCardResultPage
  config_files:
    - 01-Product/Phone/src/main/ets/pages/Index.ets
    - 02-Feature/WalletMain/src/main/resources/base/profile/route_map.json
data_models:
  - name: BankCardRecord
    file: 02-Feature/WalletMain/src/main/ets/data/model/BankCardRecord.ets
    kind: entity
    fields:
      - name: id
        type: number
        required: false
        description: RDB 自动生成主键；新记录入参不要求，查询结果回填。
      - name: accountScope
        type: string
        required: true
        description: 设备本地钱包作用域；当前 mock 应用固定为 local_mock_wallet，与登录展示态解耦。
      - name: fullCardNumber
        type: string
        required: true
        description: 完整卡号；UI 禁止直接展示。
      - name: walletCardCategory
        type: WalletCardCategory
        required: true
        description: 钱包卡片大类，本轮 BANK_CARD。
      - name: bankName
        type: string
        required: true
        description: 银行名称。
      - name: bankCardType
        type: BankCardType
        required: true
        description: DEBIT 或 CREDIT。
      - name: addedAt
        type: number
        required: true
        description: Unix 毫秒时间戳。
      - name: huaweiPayEnabled
        type: boolean
        required: true
        description: 华为支付开通状态。
      - name: unionPayQuickPassEnabled
        type: boolean
        required: true
        description: 银联手机闪付开通状态。
      - name: transactionsJson
        type: string
        required: true
        description: 交易记录 JSON。
  - name: BankCardSaveOutcome
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/BankCardRecord.ets
    kind: interface
    fields:
      - name: success
        type: boolean
        required: true
        description: ""
      - name: fullCardNumber
        type: string
        required: true
        description: 成功失败均保留；只在内存交接，不显示/记录
  - name: BankCardType
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/shared/constant/BankConstants.ets
    kind: enum
    fields:
      - name: DEBIT
        type: string
        required: true
        description: ""
      - name: CREDIT
        type: string
        required: true
        description: ""
  - name: WalletCardCategory
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/shared/constant/BankConstants.ets
    kind: enum
    fields:
      - name: BANK_CARD
        type: string
        required: true
        description: ""
  - name: MockBankCard
    module: WalletMain
    file: 02-Feature/WalletMain/src/main/ets/data/model/MockBankCard.ets
    kind: class
    fields:
      - name: bankCode
        type: string
        required: true
        description: ""
      - name: bankName
        type: string
        required: true
        description: ""
      - name: fullCardNumber
        type: string
        required: true
        description: ""
      - name: bankCardType
        type: BankCardType
        required: true
        description: ""
      - name: maskedNumber
        type: string
        required: true
        description: 前四后四派生展示
  - name: UserProfile
    module: AccountManager
    file: 04-BusinessBase/AccountManager/src/main/ets/data/model/UserProfile.ets
    kind: class
    fields:
      - name: isLoggedIn
        type: boolean
        required: true
        description: ""
      - name: displayAccount
        type: string
        required: true
        description: ""
      - name: avatar
        type: Resource | null
        required: true
        description: ""
      - name: phoneNumber
        type: string
        required: true
        description: 构造参数可选，默认空串；账号服务给mock号码
