  - invariant_id: existing-navigation-regression-free
    description: 既有 CardPackPage、AddCardEntryPage、AddBankCardPage 与 AllBanksPage
      的前进/返回语义不受损。
    evidence_refs:
      - AC-7
  - invariant_id: sensitive-data-not-displayed
    description: 完整卡号、完整手机号与 OTP 不进入 UI、日志或系统备份。
    evidence_refs:
      - AC-3
      - AC-8
      - NFR-2
target_predicates:
  - predicate_id: behavior-opening-journey
    role: behavior
    description: 两个银行入口可完成选择、OTP、保存和结果旅程，成功与失败目标正确。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - AC-1
      - AC-2
      - AC-4
      - AC-6
  - predicate_id: owner-single-session-and-rdb
    role: owner
    description: OpeningSession 单一拥有未完成流程，BankCardRepository 单一拥有加密 RDB 写入。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - decision:single-opening-session
      - decision:rdb-private-storage
      - AC-5
  - predicate_id: consumer-result-page
    role: consumer
    description: 结果页消费唯一保存 outcome，完成按钮消费起始栈边界并清理流程。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - AC-6
  - predicate_id: contract-persistence
    role: contract
    description: RDB schema、事务、幂等、加密与敏感字段映射按 bank-card-persistence 契约落地。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - contract:bank-card-persistence
      - AC-5
      - NFR-2
  - predicate_id: provider-mock-bank-and-account
    role: provider
    description: BankRepository 提供按银行/类型的 mock 卡，AccountService 提供 mock 手机号。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - AC-2
      - AC-8
  - predicate_id: recovery-rollback-and-restart
    role: recovery
    description: 保存失败 rollback 并进入失败结果；commit 后进程终止保留记录但不恢复 UI session。
    provide_ids:
      - bank-card-opening-complete
    verification_refs:
      - BD-1
      - BD-2
      - BD-3
