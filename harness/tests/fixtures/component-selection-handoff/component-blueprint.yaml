          ref: view:runtime/node:opening-session
          states: [TYPE_SELECTING, CARD_SELECTING, OTP_VERIFYING, SAVING, RESULT]
        mutations:
          - mutation_id: persist-card
            kind: foreground
            persistence_ref: wallet-bank-card-rdb
            publication_ref: publication:save-outcome
            recovery_ref: recovery:save-card
        publications:
          - publication_id: save-outcome
            payload: BankCardSaveOutcome(success, fullCardNumber)
        subscriptions: []
        consumers:
          - consumer_id: result-page
            initial_load_ref: initial-load:session
            update_ref: publication:save-outcome
        failure_recovery:
          recovery_id: save-card
          handling: RDB 初始化或事务写入异常先 rollback，再转换为 success=false，关闭 OTP modal 后进入失败结果页；commit 后进程终止则以 RDB 为权威保留记录，不恢复 UI session。
          retry: 结果页不自动重试；失败完成后回添加银行卡页重新发起。重复提交由 SAVING 状态拦截，跨会话重复卡由 account_scope+full_card_number 唯一键执行事务内 update-or-insert。
        decisions_and_gaps: [decision:rdb-private-storage, decision:result-page-stack-ownership, decision:device-local-account-scope, decision:otp-wall-clock-and-saving-lock]
        evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
        verification_refs: [AC-4, AC-5, AC-6, BD-1]
        logical_contract_refs: [contract:bank-card-persistence]
        development_owner_ref: view:development/node:wallet-opening-ui
        lifecycle_coverage:
          cold_start: { status: covered, evidence_refs: [AC-5], behavior: RDB 首次初始化建表，未完成 session 不恢复。 }
          warm_resume: { status: covered, evidence_refs: [AC-4, BD-2], behavior: OTP 使用 otpDeadlineMs 绝对墙钟；恢复前台后按 max(0, ceil((deadline-now)/1000)) 重算，不补发后台 tick。modal 关闭即释放 timer。 }
          page_attach: { status: covered, evidence_refs: [AC-1], behavior: 页面 attach 后才展示 modal 并启动 OTP 计时。 }
          page_detach: { status: covered, evidence_refs: [BD-2], behavior: OTP modal 销毁时清理 timer。 }
          account_switch: { status: not_applicable, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md], behavior: 本轮无账号切换入口。 }
          process_recreation: { status: covered, evidence_refs: [AC-5, BD-3], behavior: 已 commit 记录从 RDB 恢复，未完成 session 与验证码不恢复；重启从根首页开始。 }
          background_write: { status: not_applicable, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md], behavior: 仅用户前台提交时写入。 }
        contracts:
          schema_version: "1.0"
          state_management:
            - id: opening-state-machine
              owner: BankOpeningSession
              owner_ref: view:runtime/node:opening-session
              contract_refs: [contract:bank-card-persistence]
              states: [TYPE_SELECTING, CARD_SELECTING, OTP_VERIFYING, SAVING, RESULT]
              mutations:
                - { mutation_id: persist-card, publication_ref: "publication:save-outcome", recovery_ref: "recovery:save-card", operation: BankCardRepository.save }
              publications:
                - { publication_id: save-outcome, payload: BankCardSaveOutcome }
              subscriptions: []
              consumers:
                - { consumer_id: result-page, initial_load_ref: "initial-load:session", update_ref: "publication:save-outcome", component: BankCardResultPage }
              ordered_steps:
                - AddBankCardPage 或 AllBanksPage 调用 BankOpeningCoordinator.start(bank, stack)，记录 stack.getAllPathName().lastIndexOf('AddBankCardPage') 为 originAddBankCardIndex，得到新的 OpeningSession 并展示 CardTypeSheet。
                - CardTypeSheet 调用 session.selectType(type)，校验银行支持后调用 BankOpeningNavigator.openCardSelection(session)，由 navigator 使用 NavPathContext.stack().pushPath 进入 BankCardSelectionPage。
                - BankCardSelectionPage 调用 BankRepository.getCards(bank.code, type)，只渲染 maskedNumber；用户选择后调用 session.selectCard(card)，点击下一步调用 BankOpeningCoordinator.openOtp(session) 展示 OtpVerificationSheet。
                - OtpVerificationSheet attach 时调用 AccountService.getUserProfile() 取得 mock 手机号，只渲染 MaskUtil.maskPhone(phoneNumber)；OtpCountdown.start(60) 写入 otpDeadlineMs=Date.now()+60000，页面每秒从绝对截止时间派生剩余秒数，detach 清理 timer。
                - 用户提交时 session.tryBeginSaving(code) 原子校验六位数字并从 OTP_VERIFYING 进入 SAVING；SAVING 期间禁用提交、重发和关闭。成功取得锁后 coordinator 仅调用一次 BankCardRepository.save(session.selectedCard.toRecord()) 并等待 RDB transaction 返回。
                - repository 返回 BankCardSaveOutcome 后 coordinator 关闭 modal 并调用 BankOpeningNavigator.openResult(outcome, originAddBankCardIndex) push BankCardResultPage；结果页拦截返回。
                - 完成按钮调用 BankOpeningNavigator.finish(outcome, originAddBankCardIndex)：成功执行 stack.clear(false) 回根首页；失败重新读取 names，构造 originAddBankCardIndex+1..names.length-1 的索引数组并调用 removeByIndexes，保留初始 AddBankCardPage；最后清空 session 中的完整卡号与 OTP。
          files:
            - 02-Feature/WalletMain/src/main/ets/domain/service/BankOpeningCoordinator.ets
            - 02-Feature/WalletMain/src/main/ets/data/repository/BankCardRepository.ets
        use_cases:
          schema_version: "1.0"
          use_cases:
            - id: UC-OPEN-BANK-CARD
              name: 模拟银行卡开卡
              coordinator: BankOpeningCoordinator
              ui_bindings:
                - ui: CardTypeSheet
                  role: dialog
                  user_actions:
                    - { trigger: selectType, calls: BankOpeningSession.selectType }
                    - { trigger: continue, calls: BankOpeningNavigator.openCardSelection }
                - ui: BankCardSelectionPage
                  role: progress
                  user_actions:
                    - { trigger: selectCard, calls: BankOpeningSession.selectCard }
                    - { trigger: agree, calls: BankOpeningSession.setAgreementAccepted }
                    - { trigger: next, calls: BankOpeningCoordinator.openOtp }
                - ui: OtpVerificationSheet
                  role: dialog
                  user_actions:
                    - { trigger: inputOtp, calls: BankOpeningSession.setOtp }
                    - { trigger: resend, calls: OtpCountdown.restart }
                    - { trigger: submit, calls: BankOpeningCoordinator.submitOtp }
                - ui: BankCardResultPage
                  role: result
                  user_actions:
                    - { trigger: finish, calls: BankOpeningNavigator.finish }
              state_model:
                phases: [TYPE_SELECTING, CARD_SELECTING, OTP_VERIFYING, SAVING, RESULT]
              data_boundaries:
                - name: wallet_cards.db
                  type: relationalStore.RdbStore
                  kind: storage
                  methods: [BankCardRepository.save, BankCardRepository.findByCardNumber]
                - name: NavPathStack
                  type: system navigation stack
                  kind: system
                  methods: [getAllPathName, removeByIndexes, clear]
              branches:
                - id: success
                  scenario: 保存成功
                  linked_acceptance: [AC-1, AC-2, AC-3, AC-4, AC-5, AC-6]
                  expected_phase_seq: [TYPE_SELECTING, CARD_SELECTING, OTP_VERIFYING, SAVING, RESULT]
                  expected_port_calls: [BankRepository.getCards, AccountService.getUserProfile, BankCardRepository.save, BankOpeningNavigator.openResult, BankOpeningNavigator.finish]
                  action_sequence: [start, selectType, selectCard, openOtp, inputSixDigits, submitOnce, awaitCommit, showSuccess, finish]
                  expected_states: [OTP_VERIFYING, SAVING, RESULT]
                  not_called: [second BankCardRepository.save while SAVING]
                  expected_result: 回钱包首页且 RDB 存在卡片记录。
                - id: persistence-failure
                  scenario: RDB 保存失败
                  linked_acceptance: [BD-1, AC-6]
                  expected_phase_seq: [TYPE_SELECTING, CARD_SELECTING, OTP_VERIFYING, SAVING, RESULT]
                  expected_port_calls: [BankCardRepository.save, BankOpeningNavigator.openResult, BankOpeningNavigator.finish]
                  action_sequence: [start, selectType, selectCard, openOtp, inputSixDigits, submitOnce, rollback, showFailure, finish]
                  expected_states: [OTP_VERIFYING, SAVING, RESULT]
                  not_called: [BankCardRepository.publishPersistedCard]
                  expected_result: 失败结果页完成后回最初添加银行卡页且无脏记录。
                - id: otp-cancel
                  scenario: 用户关闭验证码半模态
                  linked_acceptance: [BD-2]
                  expected_phase_seq: [TYPE_SELECTING, CARD_SELECTING, OTP_VERIFYING]
                  expected_port_calls: [OtpCountdown.dispose, BankOpeningSession.cancelOtp]
                  action_sequence: [openOtp, closeOtp]
                  expected_states: [CARD_SELECTING]
                  not_called: [BankCardRepository.save, BankOpeningNavigator.openResult]
                  expected_result: 不保存，释放 timer 并回具体卡片页。
        provenance: *req

