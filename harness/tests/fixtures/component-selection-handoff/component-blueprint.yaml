decisions_and_gaps:
  decisions:
    - decision_id: single-opening-session
      kind: state_ownership
      conclusion: 使用单个 BankOpeningSession 贯穿四个 UI 节点，页面不复制完整卡对象。
      rationale: 统一状态所有权可以避免半模态关闭、页面跳转和保存结果之间产生平行真源。
      status: answered_with_evidence
      owner: WalletMain
      provenance: *req
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
      alternatives:
        - option: 每页独立传散字段
          rejected_reason: 完整卡号、协议态和保存结果会在多个页面重复维护。
          defect: 容易出现清栈或失败分支丢字段。
    - decision_id: masked-display-full-storage
      kind: privacy
      conclusion: 完整卡号仅保存在领域记录、结果交接对象和应用私有 RDB；UI 与日志统一使用前四后四掩码。
      rationale: 同时满足显示脱敏与后台按完整卡号处理的明确要求。
      status: decided_with_authority
      owner: WalletMain
      provenance: *req
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-4]
    - decision_id: rdb-private-storage
      kind: persistence
      conclusion: 在 WalletMain 内用 HarmonyOS relationalStore 建立 encrypt=true 的 wallet_cards.db，以 account_scope+full_card_number 唯一，版本 1 首次建表；事务内查询后 update 或 insert，异常 rollback。
      rationale: 数据归银行卡 feature 所有，避免把卡片域扩散到账号或宿主壳；加密 store 与关闭备份降低完整卡号泄露面。
      status: answered_with_evidence
      owner: WalletMain
      provenance: *req
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
      alternatives:
        - option: AppStorage 保存卡片
          rejected_reason: 不适合结构化记录、唯一约束与后续详情查询。
          defect: 进程恢复和数据演进缺少可靠 schema。
    - decision_id: device-local-account-scope
      kind: account_isolation
      conclusion: 银行卡属于设备本地钱包作用域 local_mock_wallet，与 AccountManager 的登录展示态解耦；logout 不删除卡片，当前无账号切换入口。
      rationale: 当前工程只有模拟登录且需求未定义多账号钱包。显式固定作用域避免错误地用脱敏手机号作数据库账号键，并为未来真实账号迁移保留字段。
      status: answered_with_evidence
      owner: WalletMain
      provenance: *req
      verification_refs: [04-BusinessBase/AccountManager/src/main/ets/domain/service/AccountService.ets, doc/features/原始需求/1-2-银行卡/原始需求.md]
      alternatives:
        - option: 以手机号作为 account_scope
          rejected_reason: 当前手机号是 mock，且登录/未登录都需要完成本地演示。
          defect: logout 或 mock 值变化会制造孤儿记录。
    - decision_id: otp-wall-clock-and-saving-lock
      kind: lifecycle
      conclusion: OtpCountdown 保存绝对 otpDeadlineMs；前后台切换后按墙钟重算。提交成功进入 SAVING 后一次性锁住关闭、重发和再次提交，直到 repository 返回。
      rationale: setInterval tick 不是时间真源，绝对 deadline 可避免后台暂停造成倒计时延长；SAVING 锁防止重复卡写入和重复结果页。
      status: answered_with_evidence
      owner: WalletMain
      provenance: *req
      verification_refs: [AC-4, AC-9, NFR-1]
    - decision_id: result-page-stack-ownership
      kind: navigation
      conclusion: WalletMain 的 BankOpeningNavigator 记录流程出生时的栈边界，结果页完成按钮按结果清理；结果页拦截系统返回。
      rationale: 根 Navigation 仍由 Phone 所有，但流程内页面集合和退出语义由 WalletMain 最清楚。
      status: answered_with_evidence
      owner: WalletMain
      provenance: *req
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-6]
    - decision_id: wallet-ui-custom
      kind: component_asset_selection
      target_ref: view:development/node:wallet-opening-ui
      asset_resolution: custom
      rationale: component-index 只有旧银行列表页面和通用 SectionCard/ActionListItem，不含开卡半模态、OTP 或结果清栈组件。
      status: answered_with_evidence
      owner: WalletMain
      provenance:
        source_kind: code
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-16"
        evidence_strength: observed
        extraction_method: inventory_and_live_callsite_search
      verification_refs: [doc/component-index.yaml]
    - decision_id: phone-route-custom
      kind: component_asset_selection
      target_ref: view:development/node:phone-route-host
      asset_resolution: evolve
      component_ref: WalletMain/src/main/ets/presentation/pages/AddBankCardPage.ets#buildAddBankCardPage
      rationale: 延续现有 Phone navDestinationMap 加 WalletMain builder 的模式，只扩展两个路由，不另造导航系统。
      status: answered_with_evidence
      owner: Phone
      provenance:
        source_kind: code
        source_ref: doc/component-index.yaml
        observed_at: "2026-10-16"
        evidence_strength: observed
        extraction_method: inventory_and_live_callsite_search
      verification_refs: [doc/component-index.yaml, 01-Product/Phone/src/main/ets/pages/Index.ets]
  gaps: []

contracts:
  - contract_id: bank-card-persistence
    operation:
      operation_id: saveBankCard
      direction: WalletMain-domain-to-RDB
      version: "1"
      source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/operation
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
    request_dto:
      dto_id: SaveBankCardRequest
      source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/request_dto
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
      fields:
        - field_id: record
          type: BankCardRecord
          semantics: 包含完整卡号、钱包卡大类、银行、银行卡类型、添加时间、支付状态与交易记录的持久化对象。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/request_dto/fields/0
          provenance: *req
    response_dto:
      dto_id: SaveBankCardResult
      source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/response_dto
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
      fields:
        - field_id: success
          type: boolean
          semantics: RDB 写入是否成功。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/response_dto/fields/0
          provenance: *req
        - field_id: fullCardNumber
          type: string
          semantics: 无论成功或失败都向结果页交接本次完整卡号，但结果页不得展示明文。
          nullable: false
          source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/response_dto/fields/1
          provenance: *req
    mappings:
      - mapping_id: map-record
        kind: direct
        source_fields: [record]
        target_field: BankCardRepository.save.record
        rule: 将领域记录交给 RDB repository；完整卡号只进入应用私有数据库，UI 使用派生掩码。
        source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/mappings/0
        verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
        provenance: *req
      - mapping_id: map-success
        kind: direct
        source_fields: [success]
        target_field: BankCardSaveOutcome.success
        rule: 原样交给结果页决定成功或失败状态。
        source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/mappings/1
        verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
        provenance: *req
      - mapping_id: map-full-card-number
        kind: direct
        source_fields: [fullCardNumber]
        target_field: BankCardSaveOutcome.fullCardNumber
        rule: 原样交接但不显示，用于成功完成后的目标页参数。
        source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/mappings/2
        verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
        provenance: *req
    errors:
      behavior: RDB 初始化或写入失败时返回 success=false，不把失败记录视为已持久化，并继续进入失败结果页。
      source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/errors
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
    idempotency:
      key: accountScope+fullCardNumber
      scope: wallet_bank_card_table
      behavior: 以设备本地钱包作用域与完整卡号的联合唯一索引避免重复卡；事务内先查后 update-or-insert，重复添加更新同一记录而不新增副本。
      source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/idempotency
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-5]
    nfr:
      privacy: 日志和界面不得输出完整卡号；数据库为 encrypt=true 的应用私有 RDB，Phone 关闭系统备份恢复。
      source_ref: doc/features/bc-openCard-2/blueprint/contracts/internal-contracts.yaml#/contracts/0/nfr
      verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md#需求规格-4]
    owner: WalletMain
    needed_by: bc-openCard-2
    table_schema:
      database: wallet_cards.db
      version: 1
      security_level: S4
      encrypted: true
      account_scope: local_mock_wallet
      initialization: "BankCardRepository 首次 open 时以 StoreConfig { name: wallet_cards.db, securityLevel: S4, encrypt: true } 获取 RdbStore，并按 user_version=0 创建版本 1 表。"
      transaction: save() 调用 beginTransaction；按 account_scope 与 full_card_number 查询，存在则 update 可变字段，不存在则 insert；成功 commit，任一异常 rollback 并返回 success=false。
      upgrade: user_version=1 为当前唯一版本；未来版本必须在同一 transaction 内执行增量 migration，成功后再提升 user_version，不删除已有记录。
      tables:
        - name: bank_cards
          primary_key: id
          unique_constraints: [account_scope+full_card_number]
          columns:
            - { name: id, type: INTEGER, nullable: false, primary_key: true, auto_increment: true }
            - { name: account_scope, type: TEXT, nullable: false, default: local_mock_wallet }
            - { name: full_card_number, type: TEXT, nullable: false }
            - { name: wallet_card_category, type: TEXT, nullable: false, default: BANK_CARD }
            - { name: bank_name, type: TEXT, nullable: false }
            - { name: bank_card_type, type: TEXT, nullable: false }
            - { name: added_at, type: INTEGER, nullable: false }
            - { name: huawei_pay_enabled, type: INTEGER, nullable: false, default: 0 }
            - { name: unionpay_quick_pass_enabled, type: INTEGER, nullable: false, default: 0 }
            - { name: transactions_json, type: TEXT, nullable: false, default: "[]" }
          create_sql: CREATE TABLE IF NOT EXISTS bank_cards (id INTEGER PRIMARY KEY AUTOINCREMENT, account_scope TEXT NOT NULL DEFAULT 'local_mock_wallet', full_card_number TEXT NOT NULL, wallet_card_category TEXT NOT NULL DEFAULT 'BANK_CARD', bank_name TEXT NOT NULL, bank_card_type TEXT NOT NULL, added_at INTEGER NOT NULL, huawei_pay_enabled INTEGER NOT NULL DEFAULT 0, unionpay_quick_pass_enabled INTEGER NOT NULL DEFAULT 0, transactions_json TEXT NOT NULL DEFAULT '[]', UNIQUE(account_scope, full_card_number))
          cleanup: 应用清除数据或卸载时由系统删除；AccountService.logout 不删除设备本地钱包数据。
    provenance: *req

quality_attributes:
  - qa_id: QA-privacy
    category: security_privacy
    requirement: 完整卡号和手机号不得出现在界面、日志或系统备份；数据库使用加密 store。
    landing: MaskUtil、BankCardRepository StoreConfig.encrypt、Phone backup_config 与 NFR-2。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    verification_refs: [AC-3, AC-8, NFR-2]
  - qa_id: QA-ux
    category: usability_accessibility
    requirement: 按参考图保持大触控目标、明确选中态、禁用态和结果状态；系统字体缩放下文本可读。
    landing: 四个目标 UI 与资源化尺寸/颜色/文案。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    verification_refs: [AC-1, AC-2, AC-4, AC-6]
  - qa_id: QA-idempotency
    category: reliability
    requirement: 保存中禁止重入，重复卡在同一设备本地钱包作用域内只保留一条记录。
    landing: BankOpeningSession.SAVING 与 BankCardRepository 事务 update-or-insert。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    verification_refs: [AC-5, AC-9, BD-3]
  - qa_id: QA-observability
    category: observability
    requirement: 错误日志只记录阶段、银行 code 和错误类别，不记录完整卡号、OTP 或完整手机号。
    landing: CommFunc.Logger 调用约束。
    source_ref: doc/features/原始需求/1-2-银行卡/原始需求.md
    verification_refs: [NFR-2]

data_domains:
  - data_domain_id: opening-session
    usage: 单次前台开卡选择、OTP deadline、保存状态和结果交接。
    retention: 仅当前进程内存；完成、取消或进程终止即清理。
    isolation: 每次银行点击创建新 session；SAVING 后拒绝重入。
    cleanup: 完成后 clearSensitiveData，modal detach 释放 timer。
    security: 完整卡号与 OTP 不写日志；UI 只用掩码字段。
  - data_domain_id: persisted-bank-card
    usage: 设备本地钱包内的银行卡记录，供后续卡详情需求读取。
    retention: 直到应用清除数据或卸载；当前不提供单卡删除。
    isolation: 固定 account_scope=local_mock_wallet，与登录展示态解耦。
    cleanup: Phone 禁止系统备份恢复；卸载/清数据由系统删除加密 RDB。
    security: relationalStore encrypt=true，S4；界面和日志不得输出完整卡号。

providers:
  - provider_id: current-facts-discovery
    definition: 读取需求、代码、配置、测试和架构资产形成当前事实。
    consumer: component-design
    provider: static current-facts reader
    requirement: required
    authority_rule: Code, schema, interface, config, and tests are current-state authority.
    source_rule: Every assertion carries source_ref and source revision when available.
    missing_behavior: 缺当前事实时保持 unknown 并阻断当前切片。
    replacement_behavior: 同源重扫并使相关派生结论过期。
    exit_behavior: 丢弃临时发现，保留 canonical provenance。
    conflict_behavior: 保留全部来源并交 owner 裁决。
    available: true
    writes: [canonical_blueprint_input]
  - provider_id: se-manual-contracts
    definition: 消费需求内明确的数据与操作约束并转写内部持久化契约。
    consumer: app-design-lens
    provider: static contract reader
    requirement: required
    authority_rule: Authorized SE or contract owner is external-contract authority.
    source_rule: Every contract segment carries source_ref, verification ref, and provenance.
    missing_behavior: 无外部银行协议时不编造真实 wire contract，只保留本地 mock/RDB 内部契约。
    replacement_behavior: 新权威协议到达后逐段调和并升 blueprint revision。
    exit_behavior: 丢弃临时转写，保留 canonical contract provenance。
    conflict_behavior: 保留差异并阻断冲突字段。
    available: true
    writes: [canonical_blueprint_input]
  - provider_id: app-design-lens
    definition: 将事实投影为 App 4+1、十个根问题与运行闭环。
    consumer: component-design
    provider: static hmos-app lens
    requirement: required
    authority_rule: Lens is not fact authority and cannot override inputs.
    source_rule: Projection cites inputs, viewpoint contract, and lens rule version.
    missing_behavior: 缺 lens 时不支持该 component 类型。
    replacement_behavior: lens 版本变化时重算 P1 派生结论。
    exit_behavior: 丢弃临时推导，保留来源与决定。
    conflict_behavior: 事实源优先，lens 不覆盖冲突。
    available: true
    writes: [canonical_blueprint_input]
  - provider_id: independent-design-questioning
    definition: 隔离上下文审查 4+1、契约、来源和完整调用链。
    consumer: blueprint admission
    provider: independent questioning agent
    requirement: required
    authority_rule: Questioning is not fact or decision authority.
    source_rule: Answers cite isolated blueprint, evidence package, and registered external inputs.
    missing_behavior: 未完成质询时 blueprint 不准入。
    replacement_behavior: 事实变化后重新覆盖受影响 scope。
    exit_behavior: 保留质询记录但不写平行 SSOT。
    conflict_behavior: 问题交设计 owner 定向修订，质询不自改事实。
    available: true
    writes: [canonical_blueprint_input]
  - provider_id: conventions-knowledge
    definition: 可选工程惯例知识输入。
    consumer: current-facts-discovery
    provider: static conventions reader
    requirement: optional
    authority_rule: Project conventions are stable knowledge input, not current-code authority.
    source_rule: Applicable facts cite the configured conventions file and exact heading id.
    missing_behavior: 默认路径无文件且未启用时记 not_applicable。
    replacement_behavior: 文件启用后重新发现适用条目。
    exit_behavior: 不产生惯例事实。
    conflict_behavior: 当前代码事实优先并披露差异。
    available: false
    missing_disposition: not_applicable
    writes: [canonical_blueprint_input]
  - provider_id: component-assets
    definition: 共享 UI 组件索引与选型输入。
    consumer: app-design-lens
    provider: static component index reader
    requirement: optional
    authority_rule: Source is component fact authority; curation is human selection guidance.
    source_rule: Selection evidence cites the configured component index or catalog; component_ref identifies the asset.
    missing_behavior: UI 任务缺索引时保持 unknown/degraded。
    replacement_behavior: 同源重扫并使相关 P1 结果过期。
    exit_behavior: 丢弃临时检索，保留 provenance。
    conflict_behavior: 源码优先并保留策展冲突。
    available: true
    writes: [canonical_blueprint_input]

app_lens:
  module_boundaries: { disposition: answered_with_evidence, answer: WalletMain 主责页面、领域与 RDB；AccountManager 只提供手机号；Phone 只装配路由。, evidence_refs: [doc/module-catalog.yaml, doc/architecture.md] }
  capability_seams: { disposition: answered_with_evidence, answer: UI 经 BankOpeningCoordinator 调 BankCardRepository；BankOpeningSession 在 domain/model 单一持有状态；BankOpeningNavigator 在 presentation/navigation 用 getAllPathName、removeByIndexes 与 clear 精确清栈；验证码手机号经 AccountService 读取。, evidence_refs: [contract:bank-card-persistence, view:development/node:wallet-opening-ui, 01-Product/Phone/src/main/ets/pages/Index.ets] }
  feature_flags: { disposition: not_applicable, answer: 本地模拟应用无远程开关；旧页面行为由同一版本整体升级。, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
  data_producers_consumers: { disposition: answered_with_evidence, answer: BankRepository 生产 mock 银行卡，OpeningSession 消费选择，BankCardRepository 写加密 RDB，结果页消费一次性保存结果；首页仍保持既有 mock 读模型，本轮不宣称读取新增卡。, evidence_refs: [view:runtime/flow:bank-card-opening-flow, /review_summary/non_goals] }
  lifecycle_triggers: { disposition: answered_with_evidence, answer: 用户点击银行建立 session，OTP 以绝对 deadline 计时；提交先原子进入 SAVING 并拦截重入，完成按钮终止 session。, evidence_refs: [view:scenarios/node:bank-opening-journey, decision:otp-wall-clock-and-saving-lock] }
  state_owners: { disposition: answered_with_evidence, answer: 未完成流程由 OpeningSession 所有，已保存卡片由 local_mock_wallet 作用域的 wallet_cards.db 所有，导航栈由 Phone 根 Navigation 所有；logout 不删除设备本地钱包数据。, evidence_refs: [view:runtime/node:opening-session, view:development/node:wallet-card-data, view:development/node:phone-route-host, decision:device-local-account-scope] }
  initialization: { disposition: answered_with_evidence, answer: 每次银行点击初始化 session；首次 repository 使用时以 encrypt=true/S4 初始化 schema v1，事务内 create/query/update-or-insert，异常 rollback。, evidence_refs: [view:runtime/flow:bank-card-opening-flow, contract:bank-card-persistence] }
  publication_subscription: { disposition: answered_with_evidence, answer: save outcome 是一次前台 publication，由结果页消费；无后台订阅。, evidence_refs: [view:runtime/flow:bank-card-opening-flow] }
  ui_refresh: { disposition: answered_with_evidence, answer: 卡类型、卡片选择、OTP 墙钟倒计时、SAVING 禁用与保存结果由当前 session 的 ArkUI 可观察字段驱动；成功完成回首页但不改变首页 mock 读模型。, evidence_refs: [view:runtime/node:opening-session, AC-4, AC-9] }
  process_recovery: { disposition: answered_with_evidence, answer: 未完成流程不跨进程恢复；事务 commit 是数据完成边界，commit 后被杀则记录保留且重启到根首页；Phone 禁止系统备份恢复，失败 rollback 不留脏记录。, evidence_refs: [AC-5, BD-1, BD-3, 01-Product/Phone/src/main/resources/base/profile/backup_config.json] }
  runtime_flow_trigger_assessment:
    persistent_or_remote_ui: { applies: true, evidence_refs: [AC-5] }
    multiple_consumers: { applies: false, evidence_refs: [view:runtime/flow:bank-card-opening-flow] }
    background_system_external_scheduled_write: { applies: false, evidence_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md] }
    cold_start_resume_mount_account_switch: { applies: true, evidence_refs: [AC-5, BD-2] }
    user_mutation_refreshes_other_consumers: { applies: true, evidence_refs: [AC-6] }
    cache_sync_freshness_consistency_process_recreation: { applies: true, evidence_refs: [AC-5] }

generated_graphs:
  - graph_id: sequence:start-and-select-type
    format: mermaid
    source_view_id: runtime
    content: |
      sequenceDiagram
      actor User as 用户
      participant Entry as 银行列表页
      participant Coordinator as 开卡协调器
      participant Sheet as 卡类型半模态
      User->>Entry: 点击银行
      Entry->>Coordinator: start(BankInfo, NavPathStack)
      Coordinator-->>Sheet: 新会话与支持卡类型
    node_refs: [view:runtime/node:opening-session, view:development/node:wallet-opening-ui]
    relation_refs: []
  - graph_id: sequence:select-type-and-card
    format: mermaid
    source_view_id: runtime
    content: |
      sequenceDiagram
      actor User as 用户
      participant Sheet as 卡类型半模态
      participant Session as 开卡会话
      participant Repo as BankRepository
      participant Navigator as 开卡导航
      participant CardPage as 具体卡片页
      User->>Sheet: 选择卡类型并继续
      Sheet->>Session: selectType(type)
      Sheet->>Navigator: openCardSelection(session)
      Navigator-->>CardPage: pushPath 到具体卡片页
      CardPage->>Repo: getCards(bankCode, type)
      Repo-->>CardPage: 1 至 2 张含完整卡号的 mock 卡
    node_refs: [view:runtime/node:opening-session, view:development/node:wallet-opening-ui]
    relation_refs: []
  - graph_id: sequence:otp-and-save
    format: mermaid
    source_view_id: runtime
    content: |
      sequenceDiagram
      actor User as 用户
      participant CardPage as 具体卡片页
      participant Otp as 验证码半模态
      participant Account as AccountService
      participant Session as 开卡会话
      participant Coordinator as 开卡协调器
      participant Repo as BankCardRepository
      participant Result as 结果页
      User->>CardPage: 选择卡片并点击下一步
      CardPage->>Coordinator: openOtp(session)
      Coordinator-->>Otp: 打开验证码半模态
      Otp->>Account: getUserProfile()
      Account-->>Otp: mock 完整手机号
      Otp->>Otp: 显示掩码并设置 otpDeadlineMs
      User->>Otp: 输入六位数字并提交
      Otp->>Session: tryBeginSaving(code)
      alt 成功进入 SAVING
        Session-->>Otp: true
        Otp->>Coordinator: submitOtp(code)
        Coordinator->>Repo: save(BankCardRecord)
        alt 写入成功
          Repo-->>Coordinator: success=true
          Coordinator-->>Result: 显示成功并携带完整卡号
        else 写入失败
          Repo-->>Coordinator: success=false
          Coordinator-->>Result: 显示失败并携带完整卡号
        end
      else 已在 SAVING 或验证码非法
        Session-->>Otp: false 且不调用 save
      end
    node_refs: [view:runtime/node:opening-session, view:runtime/node:result-navigation, view:development/node:wallet-card-data]
    relation_refs: []
  - graph_id: sequence:finish-and-clear-stack
    format: mermaid
    source_view_id: runtime
    content: |
      sequenceDiagram
      actor User as 用户
      participant Result as 结果页
      participant Navigator as BankOpeningNavigator
      participant Stack as NavPathStack
      User->>Result: 点击完成
      Result->>Navigator: finish(outcome, originBoundary)
      alt 成功
        Navigator->>Stack: clear(false) 回钱包首页
      else 失败
        Navigator->>Stack: removeByIndexes(origin+1..last)
      end
    node_refs: [view:runtime/node:result-navigation, view:development/node:wallet-opening-ui, view:development/node:phone-route-host]
    relation_refs: []

