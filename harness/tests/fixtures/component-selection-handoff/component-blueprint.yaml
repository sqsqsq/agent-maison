design_views:
  - view_id: scenarios
    viewpoint_contract: app-scenarios@1
    applicability: applicable
    evolution_impact: changed
    stakeholders: [钱包用户, 产品验收, 测试]
    purpose: 描述用户从选择银行到完成或失败退出的端到端旅程，并绑定参考图和验收。
    current_state: 点击银行后仅提示暂不支持，旅程中止。
    target_state: 两个银行入口均进入同一开卡旅程，完成卡类型、具体卡、验证码、保存、结果和清栈。
    delta: 新增完整模拟银行卡开卡旅程与失败分支。
    decisions_and_gaps: [decision:single-opening-session, decision:masked-display-full-storage]
    verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
    nodes:
      - node_id: bank-opening-journey
        label: 银行卡开卡用户旅程
        owner: WalletMain
        current_state: 银行行点击后显示不支持提示。
        target_state: 用户完成选类型、选卡、六位验证码和结果确认；只有完成按钮可退出结果页。
        journey_steps:
          - step_id: J1
            stage: 选择卡类型
            user_action: 在添加银行卡页或全部银行页点击任一银行。
            system_behavior: 展示银行信息、支持卡类型、提示、协议文本和同意并继续按钮的半模态。
            preconditions: [银行数据加载成功]
            ui_reference: doc/features/原始需求/1-2-银行卡/3-点击任意银行拉起添卡选卡半模态.jpg
          - step_id: J2
            stage: 选择具体卡片
            user_action: 选择一种卡类型并继续，然后选择该银行的一张 mock 卡并同意协议。
            system_behavior: 全屏页面只显示掩码卡号；领域对象继续持有完整卡号。
            preconditions: [已选择银行与支持的卡类型]
            ui_reference: doc/features/原始需求/1-2-银行卡/4-点击信用卡或储蓄卡后拉起选卡页面.jpg
          - step_id: J3
            stage: 短信验证
            user_action: 点击下一步并输入任意六位数字验证码。
            system_behavior: 半模态打开即模拟发送短信，60 秒倒计时内禁用重发；六位数字后才可继续。
            preconditions: [已选择具体卡片并同意协议]
            ui_reference: doc/features/原始需求/1-2-银行卡/5-选中某张卡片后拉起短信验证.jpg
          - step_id: J4
            stage: 保存与结果
            user_action: 点击验证码半模态的下一步，再在结果页点击完成。
            system_behavior: 保存成功或失败都进入对应结果页；结果页屏蔽返回。成功完成清理开卡栈并回钱包首页，失败完成清理过程页并回最初添加银行卡页。
            preconditions: [验证码为六位数字]
            ui_reference: doc/features/原始需求/1-2-银行卡/6-短信验证完成后结果页.jpg
        path_variants:
          - user_type: 成功保存
            difference: 结果页显示成功，完成后回钱包首页并携带完整卡号作为后续详情页预留参数。
          - user_type: 保存失败
            difference: 结果页显示失败，完成后回最初添加银行卡页，不产生数据库记录。
        logical_refs: [view:logical/node:bank-card-opening-capability]
        runtime_refs: [view:runtime/flow:bank-card-opening-flow]
        development_owner_ref: view:development/node:wallet-opening-ui
        deployment_refs: [view:deployment/node:phone-app-package]
        provenance: *req
        verification_refs: [doc/features/原始需求/1-2-银行卡/原始需求.md]
        acceptance:
          schema_version: "1.0"
          criteria:
            - id: AC-1
              priority: P0
              description: 两个既有银行列表入口点击任一银行都打开该银行的卡类型半模态。
              testable: true
              verification_steps: [从添加银行卡页点击银行, 从全部银行页点击银行, 比较两个入口的 modal 内容与会话参数]
              expected_result: 都显示所选银行及其支持的卡类型，不再提示暂不支持。
              ut_layer: both
              ut_focus: 两入口复用同一开卡 session 初始化。
              device_focus: 两入口均可见半模态且背景页面保持。
            - id: AC-2
              priority: P0
              description: 卡类型按银行支持列表展示且只能单选，继续后只显示所选银行和类型的 1 至 2 张 mock 卡。
              testable: true
              verification_steps: [对双类型银行切换储蓄卡与信用卡, 对单类型银行确认只显示一个选项, 继续进入具体卡片页并核对过滤结果]
              expected_result: 只存在一个选中项，卡片集合与选择条件一致。
              ut_layer: both
              ut_focus: 过滤、单选和继续按钮状态。
              device_focus: 半模态与全屏卡片页布局、选中反馈和按钮状态。
            - id: AC-3
              priority: P0
              description: 具体卡片页只显示卡号前四后四，业务与存储链保留完整卡号。
              testable: true
              verification_steps: [用固定 mock 卡渲染具体卡片页, 断言 UI 只含前四后四, 提交后断言 repository 收到完整卡号]
              expected_result: UI 不出现完整卡号，repository 接收完整卡号。
              ut_layer: unit
              ut_focus: 脱敏函数与完整领域字段不丢失。
              device_focus: ""
            - id: AC-4
              priority: P0
              description: 验证码半模态打开即模拟发送，60 秒倒计时期间不可重发，归零后可重新发送；仅六位数字允许下一步。
              testable: true
              verification_steps: [打开 modal 并确认自动发送, 用可控时钟推进 60 秒, 倒计时结束后点击重发, 分别输入五位、六位和非数字内容]
              expected_result: 倒计时和按钮可用性与规则一致。
              ut_layer: both
              ut_focus: OTP 过滤、六位校验、倒计时状态机和销毁清理。
              device_focus: 自动弹出数字键盘、倒计时文案和禁用按钮视觉。
            - id: AC-5
              priority: P0
              description: 合法验证码提交后把完整卡片记录写入应用私有 RDB，字段覆盖需求指定的卡号、类别、银行、银行卡类型、时间、两种支付状态与交易记录。
              testable: true
              verification_steps: [提交一张 mock 卡, 等待 repository 返回成功, 按完整卡号重新查询并逐字段核对]
              expected_result: 写入成功返回 success=true，字段值完整且唯一。
              ut_layer: both
              ut_focus: schema、映射、幂等唯一键和失败返回。
              device_focus: 真机 RDB 初始化、写入与重启后读取。
            - id: AC-6
              priority: P0
              description: 结果页无返回入口并拦截系统返回；只有完成按钮退出，成功回钱包首页，失败回最初添加银行卡页，并移除本轮所有开卡过程页面。
              testable: true
              verification_steps: [在结果页触发系统返回并确认无效, 构造成功结果点击完成并检查首页栈, 构造失败结果点击完成并检查添加银行卡页栈]
              expected_result: 返回动作无效；完成后目标页正确且过程页不可再返回。
              ut_layer: both
              ut_focus: 目标路由和 removeByIndexes 清栈计划。
              device_focus: 左滑/系统返回屏蔽、完成后连续返回不出现过程页。
            - id: AC-7
              priority: P1
              description: 原有 CardPackPage、AddCardEntryPage、AddBankCardPage 和 AllBanksPage 路由仍可正常前进与返回。
              testable: true
              verification_steps: [从首页进入卡包和添卡入口, 进入添加银行卡与全部银行后逐级返回, 再从两个银行入口分别进入新开卡流程]
              expected_result: 无旧路由损坏或重复入栈。
              ut_layer: device
              ut_focus: ""
              device_focus: 真实 Navigation 路由回归。
            - id: AC-8
              priority: P1
              description: 验证码半模态从 AccountService 取得 mock 完整手机号后只显示前三后四掩码，日志不输出完整手机号。
              testable: true
              verification_steps: [为 UserProfile 注入固定手机号, 打开验证码半模态, 核对显示值和日志参数]
              expected_result: 页面显示 185****3841 形态，完整手机号仅保留在账号领域对象中。
              ut_layer: both
              ut_focus: MaskUtil.maskPhone 与账号 DTO 交接。
              device_focus: 参考图对应的手机号掩码文案。
            - id: AC-9
              priority: P0
              description: 验证码提交后立即进入 SAVING 并禁用提交、重发和关闭动作，单次 session 最多发起一个未完成保存调用。
              testable: true
              verification_steps: [输入六位验证码, 连续点击下一步, 在 repository promise 未完成时尝试重发与关闭]
              expected_result: BankCardRepository.save 只调用一次，所有会造成重入的控件保持禁用直到结果返回。
              ut_layer: both
              ut_focus: SAVING 状态防重入和一次性提交。
              device_focus: 保存期间按钮禁用与无重复导航。
          boundaries:
            - id: BD-1
              priority: P0
              description: RDB 初始化或保存失败仍进入失败结果页，失败记录不写入数据库。
              scenario: repository 抛出异常或返回失败。
              handling: 捕获错误并构造 success=false 与完整卡号的结果对象。
              expected_behavior: 用户看到失败状态，点击完成回最初添加银行卡页。
              ut_layer: both
              ut_focus: 异常映射与无脏记录。
              device_focus: 失败结果页与返回目标。
            - id: BD-2
              priority: P1
              description: 用户关闭卡类型或验证码半模态时不保存卡片，返回当前承载页且释放计时器。
              scenario: 点击关闭或系统取消半模态。
              handling: 丢弃 session 中未提交的 OTP 与选择态，清理定时器。
              expected_behavior: 无 RDB 写入，可重新发起流程。
              ut_layer: both
              ut_focus: session reset 与 timer cleanup。
              device_focus: modal 关闭后背景页仍可操作。
            - id: BD-3
              priority: P1
              description: 保存事务提交后但结果页显示前进程终止时，以 RDB commit 为权威保留记录，未完成 UI session 不恢复。
              scenario: repository 已 commit，应用在 push 结果页之前被系统终止。
              handling: 重启后从根首页开始；后续查询可读到已提交卡片，不重放验证码或重复写入。
              expected_behavior: 数据最多保存一次，页面流程不伪造恢复中的结果状态。
              ut_layer: both
              ut_focus: commit 后幂等重查和 session 不持久化。
              device_focus: 强制终止并重启后无过程页残留，数据库记录仍存在。
          performance:
            - id: NFR-1
              metric: OTP resend duration
              threshold: "60"
              unit: seconds
              description: 每次模拟发送后显示 60 秒倒计时，倒计时结束才允许重新发送。
              ut_layer: unit
              ut_focus: 使用 fake clock 精确验证 60 次 tick。
              device_focus: ""
            - id: NFR-2
              metric: sensitive data exposure
              threshold: "0"
              unit: full PAN or full phone occurrences in UI/log/backup
              description: 完整卡号和完整手机号不得出现在 UI、日志或系统备份；银行卡 RDB 使用加密 store 且 Phone 禁止应用备份恢复。
              ut_layer: both
              ut_focus: 脱敏输出、日志参数与 StoreConfig.encrypt。
              device_focus: 检查界面、系统日志和 backup_config。

