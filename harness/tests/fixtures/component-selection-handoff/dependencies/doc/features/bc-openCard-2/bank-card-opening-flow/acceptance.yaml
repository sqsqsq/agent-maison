boundaries:
  - id: BD-1
    priority: P0
    description: RDB 初始化或保存失败仍进入失败结果页，失败记录不写入数据库。
    scenario: repository 抛出异常或返回失败。
    handling: 捕获错误并构造 success=false 与完整卡号的结果对象。
    expected_behavior: 用户看到失败状态，点击完成回最初添加银行卡页。
    ut_layer: both
    ut_focus: 异常映射与无脏记录。
    device_focus: 失败结果页与返回目标。
    prd_exception: E1
    requirement_ref:
      source_path: doc/features/原始需求/1-2-银行卡/原始需求.md
      snippet: 5.输入验证码半模态页面，拉起后默认触发一次假的短信发送，之后右侧按钮变为倒计时，用户必须输入6位验证码才能点击下一步。当前6位验证码可随意输入。倒计时归零后，右侧按钮从倒计时变成重新发送。点击后再次变为倒计时。用户输入完成验证码后，后台将完整卡数据写入RDB（本需求开始要创建卡片数据库和对应卡片数据表，将添加的卡片存入数据库中，数据库中字段至少包含卡号、卡类型[比如银行卡、交通卡、门禁卡等]、银行名称、卡类型、添加时间、开通华为支付状态、开通银联手机闪付状态、交易记录等内容），无论写入成功还是失败，将本次添加的卡片卡号（全卡号）和开卡结果带着跳转到添加结果页。
      snippet_sha256: b976a73cb55ecb1d144385597f63267b407b1b77ca5897c05a70d29e1e96fc94
