  - id: BD-3
    priority: P1
    description: 保存事务提交后但结果页显示前进程终止时，以 RDB commit 为权威保留记录，未完成 UI session 不恢复。
    scenario: repository 已 commit，应用在 push 结果页之前被系统终止。
    handling: 重启后从根首页开始；后续查询可读到已提交卡片，不重放验证码或重复写入。
