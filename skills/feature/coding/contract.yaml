schema_version: "1.0"
skill: coding
skill_doc: SKILL.md
phases:
  coding:
    tracks: [full, lite]
    inputs:
      - { id: codebase, sources: [{ kind: derive, provider_id: derive.codebase }] }
      - { id: plan, sources: [{ kind: artifact, artifact: plan@1 }] }
      - { id: contracts, sources: [{ kind: artifact, artifact: contracts@1 }] }
      - { id: acceptance, sources: [{ kind: artifact, artifact: acceptance@1 }] }
      - { id: change, sources: [{ kind: artifact, artifact: change@1 }] }
      - { id: spec, sources: [{ kind: artifact, artifact: spec@1 }] }
      - { id: use_cases, sources: [{ kind: artifact, artifact: use-cases@1 }] }
      - { id: ui_spec, sources: [{ kind: artifact, artifact: ui-spec@1 }] }
      - { id: visual_parity, sources: [{ kind: artifact, artifact: visual-parity@1 }] }
    capabilities:
      - { id: capability_coding_full_context, axis: functional, inputs: [codebase, plan, contracts, acceptance], tracks: [full], on_missing: fail }
      - { id: capability_coding_lite_context, axis: functional, inputs: [codebase, change], tracks: [lite], on_missing: fail }
      - { id: capability_coding_spec_context, axis: functional, inputs: [spec, use_cases], tracks: [full], on_missing: prune }
      - { id: capability_coding_visual_context, axis: visual, inputs: [ui_spec, visual_parity], tracks: [full], applicability_provider_id: applicability.ui, on_missing: prune }
    produces:
      - { kind: source, id: implementation }
    verifies: { check: check-coding.ts }