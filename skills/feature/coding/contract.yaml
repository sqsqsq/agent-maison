schema_version: "1.1"
skill: coding
skill_doc: SKILL.md
phases:
  coding:
    inputs:
      - { id: requirement, sources: [{ kind: derive, provider_id: derive.requirement }] }
      - { id: codebase, sources: [{ kind: derive, provider_id: derive.codebase }] }
      - { id: plan, sources: [{ kind: artifact, artifact: plan@1 }] }
      - { id: contracts, sources: [{ kind: artifact, artifact: contracts@1 }, { kind: derive, provider_id: derive.blueprint-contracts }] }
      - { id: acceptance, sources: [{ kind: artifact, artifact: acceptance@1 }, { kind: derive, provider_id: derive.blueprint-acceptance }] }
      - { id: change, sources: [{ kind: artifact, artifact: change@1 }] }
      - { id: spec, sources: [{ kind: artifact, artifact: spec@1 }] }
      - { id: use_cases, sources: [{ kind: artifact, artifact: use-cases@1 }] }
      - { id: ui_spec, sources: [{ kind: artifact, artifact: ui-spec@1 }] }
      - { id: visual_parity, sources: [{ kind: artifact, artifact: visual-parity@1 }] }
    capabilities:
      - { id: capability_coding_context, axis: functional, inputs: [requirement, codebase, contracts, acceptance], input_role: base, on_missing: fail }
      - { id: capability_coding_plan_context, axis: functional, inputs: [plan], input_role: enhancement, on_missing: prune }
      - { id: capability_coding_spec_context, axis: functional, inputs: [spec, use_cases], input_role: enhancement, on_missing: prune }
      - { id: capability_coding_visual_context, axis: visual, inputs: [ui_spec, visual_parity], input_role: enhancement, applicability_provider_id: applicability.ui, on_missing: prune }
    produces:
      - { kind: source, id: implementation }
    verifies: { check: check-coding.ts }
