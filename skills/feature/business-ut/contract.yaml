schema_version: "1.0"
skill: business-ut
skill_doc: SKILL.md
phases:
  ut:
    tracks: [full]
    inputs:
      - { id: code, sources: [{ kind: derive, provider_id: derive.codebase }] }
      - { id: acceptance, sources: [{ kind: artifact, artifact: acceptance@1 }] }
      - { id: use_cases, sources: [{ kind: artifact, artifact: use-cases@1 }] }
      - { id: plan, sources: [{ kind: artifact, artifact: plan@1 }] }
      - { id: contracts, sources: [{ kind: artifact, artifact: contracts@1 }] }
      - { id: test_targets, sources: [{ kind: derive, provider_id: derive.test-targets }] }
    capabilities:
      - { id: capability_ut_core_context, axis: functional, inputs: [code, acceptance], tracks: [full], on_missing: fail }
      - { id: capability_ut_design_context, axis: functional, inputs: [plan, contracts, test_targets], tracks: [full], on_missing: prune }
      - { id: capability_ut_use_case_context, axis: evidence, inputs: [use_cases], tracks: [full], on_missing: prune }
    produces:
      - { kind: source, id: ut_source_and_dag }
      - { artifact: testability-audit@1 }
      - { artifact: mock-plan@1 }
      - { artifact: coverage-evidence@1 }
    verifies: { check: check-ut.ts }
    control_dependencies: [coding]