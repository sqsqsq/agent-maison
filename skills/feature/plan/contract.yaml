schema_version: "1.0"
skill: plan
skill_doc: SKILL.md
phases:
  plan:
    tracks: [full]
    inputs:
      - { id: spec, sources: [{ kind: artifact, artifact: spec@1 }] }
      - { id: acceptance, sources: [{ kind: artifact, artifact: acceptance@1 }] }
      - { id: codebase, sources: [{ kind: derive, provider_id: derive.codebase }] }
      - { id: ui_spec, sources: [{ kind: artifact, artifact: ui-spec@1 }] }
    capabilities:
      - { id: capability_plan_context, axis: functional, inputs: [spec, acceptance, codebase], tracks: [full], on_missing: fail }
      - { id: capability_plan_visual_context, axis: visual, inputs: [ui_spec], tracks: [full], applicability_provider_id: applicability.ui, on_missing: prune }
    produces:
      - { artifact: plan@1 }
      - { artifact: contracts@1 }
      - { artifact: use-cases@1 }
      - { artifact: visual-parity@1 }
    verifies: { check: check-plan.ts }