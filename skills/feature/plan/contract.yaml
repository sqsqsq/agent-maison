schema_version: "1.0"
skill: plan
skill_doc: SKILL.md
phases:
  plan:
    tracks: [full]
    inputs:
      required:
        - { id: spec, artifact: spec@1 }
        - { id: acceptance, artifact: acceptance@1 }
        - { id: codebase, kind: source }
      optional:
        - id: ui_spec
          artifact: ui-spec@1
          absent_effect: "Non-UI work does not need a visual handoff."
    produces:
      - { artifact: plan@1 }
      - { artifact: contracts@1 }
      - { artifact: use-cases@1 }
      - { artifact: visual-parity@1 }
    verifies:
      check: check-plan.ts
      depth_field: summary.depth
    tiers:
      full:
        when: otherwise
        satisfies: [full]
