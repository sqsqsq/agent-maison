schema_version: "1.0"
skill: change-lite
skill_doc: SKILL.md
phases:
  change:
    tracks: [lite]
    inputs:
      - { id: requirement, sources: [{ kind: derive, provider_id: derive.requirement }] }
      - { id: codebase, sources: [{ kind: derive, provider_id: derive.codebase }] }
    capabilities:
      - { id: capability_change_context, axis: functional, inputs: [requirement, codebase], tracks: [lite], on_missing: fail }
    produces:
      - { artifact: change@1 }
    verifies: { check: check-change.ts }
  exit:
    tracks: [lite]
    inputs:
      - { id: change, sources: [{ kind: artifact, artifact: change@1 }] }
      - { id: implementation, sources: [{ kind: derive, provider_id: derive.codebase }] }
    capabilities:
      - { id: capability_exit_context, axis: functional, inputs: [change, implementation], tracks: [lite], on_missing: fail }
    produces: []
    verifies: { check: check-exit.ts }
    control_dependencies: [coding]