schema_version: "1.1"
skill: code-review
skill_doc: SKILL.md
phases:
  review:
    inputs:
      - { id: code, sources: [{ kind: derive, provider_id: derive.codebase }] }
      - { id: spec, sources: [{ kind: artifact, artifact: spec@1 }] }
      - { id: plan, sources: [{ kind: artifact, artifact: plan@1 }] }
      - { id: contracts, sources: [{ kind: artifact, artifact: contracts@1 }, { kind: derive, provider_id: derive.blueprint-contracts }] }
      - { id: acceptance, sources: [{ kind: artifact, artifact: acceptance@1 }, { kind: derive, provider_id: derive.blueprint-acceptance }] }
      - { id: ui_spec, sources: [{ kind: artifact, artifact: ui-spec@1 }] }
      - { id: use_cases, sources: [{ kind: artifact, artifact: use-cases@1 }] }
    capabilities:
      - { id: capability_review_code_context, axis: functional, inputs: [code], input_role: base, on_missing: fail }
      - { id: capability_review_design_context, axis: functional, inputs: [contracts], input_role: enhancement, on_missing: prune }
      - { id: capability_review_narrative_context, axis: functional, inputs: [spec, plan], input_role: enhancement, on_missing: prune }
      - { id: capability_review_acceptance_context, axis: evidence, inputs: [acceptance], input_role: enhancement, on_missing: prune }
      - { id: capability_review_use_cases, axis: functional, inputs: [use_cases], input_role: enhancement, on_missing: prune }
      - { id: capability_review_visual_context, axis: visual, inputs: [ui_spec], input_role: enhancement, applicability_provider_id: applicability.ui, on_missing: prune }
    produces:
      - { artifact: review-report@1 }
    verifies: { check: check-review.ts }
